<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111d">

<title>PIXEL ADVENTURE</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080c;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:min(100vw,520px);
  height:100dvh;
  overflow:hidden;
  background:#101820;
  color:#fff;
  touch-action:manipulation;
}

#camera{
  position:absolute;
  inset:0;
  overflow:hidden;
  will-change:transform;
}

#world{
  position:absolute;
  inset:0;
  overflow:hidden;
}


/* =====================================================
   하늘
===================================================== */

#bg{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center center;

  z-index:1;

  transform-origin:center center;

  will-change:transform;
}


/* =====================================================
   뒤 풀밭
===================================================== */

#backLayer{

  position:absolute;

  left:-5%;

  width:110%;

  /*
    이미지의 위쪽 빈 공간을 고려해서
    화면 중간부터 풀밭이 나오도록 배치
  */

  height:62%;

  bottom:13%;

  object-fit:fill;

  z-index:2;

  pointer-events:none;

  transform-origin:center bottom;

  will-change:transform;
}


/* =====================================================
   안개
===================================================== */

#farHaze{

  position:absolute;

  inset:0;

  z-index:3;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0) 42%,
      rgba(255,255,255,.02) 55%,
      rgba(70,110,60,.05) 75%,
      rgba(20,35,15,.12) 100%
    );
}


/* =====================================================
   몬스터
===================================================== */

#monsterWrap{

  position:absolute;

  left:50%;

  /*
    기존보다 몬스터 자체를 크게
  */

  top:18%;

  width:78%;

  aspect-ratio:1 / 1;

  transform:
    translateX(-50%)
    scale(.34);

  transform-origin:50% 80%;

  opacity:.25;

  z-index:5;

  will-change:
    transform,
    opacity;
}


#monster{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  image-rendering:pixelated;

  filter:
    drop-shadow(
      0 14px 10px
      rgba(0,0,0,.48)
    );

  will-change:
    transform,
    filter;
}


/* =====================================================
   몬스터 피격
===================================================== */

#monster.hit{

  animation:
    monsterHit
    .82s
    steps(8,end);
}


@keyframes monsterHit{

  0%{
    transform:translate(0,0) rotate(0);
    filter:brightness(1);
  }

  10%{
    transform:
      translate(-18px,6px)
      rotate(-4deg)
      scale(1.02);

    filter:
      brightness(3.2)
      saturate(2.2);
  }

  22%{
    transform:
      translate(19px,-8px)
      rotate(4deg)
      scale(1.04);

    filter:
      brightness(3.4)
      saturate(2.3);
  }

  34%{
    transform:
      translate(-17px,8px)
      rotate(-4deg);

    filter:
      brightness(3)
      saturate(2.1);
  }

  46%{
    transform:
      translate(15px,-7px)
      rotate(4deg);

    filter:
      brightness(2.7)
      saturate(1.9);
  }

  58%{
    transform:
      translate(-12px,6px)
      rotate(-3deg);

    filter:
      brightness(2.3);
  }

  72%{
    transform:
      translate(9px,-4px)
      rotate(2deg);

    filter:
      brightness(1.7);
  }

  86%{
    transform:
      translate(-5px,2px);

    filter:
      brightness(1.3);
  }

  100%{
    transform:
      translate(0,0)
      rotate(0);

    filter:
      brightness(1);
  }

}


/* =====================================================
   몬스터 사망
===================================================== */

#monster.dead{

  animation:
    monsterDead
    1.15s
    ease-out
    forwards;
}


@keyframes monsterDead{

  0%{
    opacity:1;

    transform:
      translate(0,0)
      scale(1);

    filter:brightness(1);
  }

  12%{
    transform:
      translate(-19px,7px)
      rotate(-5deg);

    filter:
      brightness(3.2)
      saturate(2);
  }

  24%{
    transform:
      translate(20px,-8px)
      rotate(5deg);

    filter:
      brightness(2.8);
  }

  38%{
    transform:
      translate(-17px,7px)
      rotate(-4deg);

    filter:
      brightness(2.3);
  }

  52%{
    transform:
      translate(13px,-6px)
      rotate(4deg);

    filter:
      brightness(1.9);
  }

  68%{
    transform:
      translate(-9px,4px)
      rotate(-2deg);

    opacity:.72;
  }

  82%{
    transform:
      translate(6px,-3px)
      rotate(1deg)
      scale(.96);

    opacity:.36;
  }

  100%{
    transform:
      translate(0,0)
      scale(.88);

    opacity:0;

    filter:brightness(1);
  }

}


/* =====================================================
   앞 풀밭
===================================================== */

#frontLayer{

  position:absolute;

  left:-8%;

  width:116%;

  height:57%;

  bottom:-3%;

  object-fit:fill;

  z-index:8;

  pointer-events:none;

  transform-origin:center bottom;

  will-change:transform;
}


/* =====================================================
   칼
===================================================== */

#sword{

  position:absolute;

  z-index:25;

  /*
    기존 70%에서 크게 확대
  */

  right:-19%;

  bottom:-13%;

  width:125%;

  height:112%;

  object-fit:contain;

  object-position:right bottom;

  transform-origin:82% 91%;

  filter:
    drop-shadow(
      0 7px 9px
      rgba(0,0,0,.7)
    );

  will-change:transform;

  pointer-events:none;
}


/* =====================================================
   칼 idle
===================================================== */

#sword.idle{

  animation:
    swordIdle
    1.8s
    ease-in-out
    infinite;
}


@keyframes swordIdle{

  0%,100%{

    transform:
      translateY(0)
      rotate(-18deg)
      scale(1);
  }

  50%{

    transform:
      translateY(-10px)
      rotate(-16deg)
      scale(1);
  }

}


/* =====================================================
   칼 걷기
===================================================== */

#sword.walking{

  animation:
    swordWalk
    .64s
    ease-in-out
    infinite
    alternate;
}


@keyframes swordWalk{

  from{

    transform:
      rotate(-20deg)
      translateY(6px)
      scale(1);
  }

  to{

    transform:
      rotate(16deg)
      translateY(-6px)
      scale(1);
  }

}


/* =====================================================
   칼 공격
===================================================== */

#sword.attack{

  animation:
    swordSlash
    .34s
    cubic-bezier(.12,.9,.2,1)
    forwards;
}


@keyframes swordSlash{

  0%{

    transform:
      rotate(-18deg)
      translate(0,0)
      scale(1);
  }

  14%{

    transform:
      rotate(-43deg)
      translate(-15px,8px)
      scale(1.03);
  }

  47%{

    transform:
      rotate(57deg)
      translate(-42px,-34px)
      scale(1.16);
  }

  68%{

    transform:
      rotate(34deg)
      translate(-17px,-15px)
      scale(1.08);
  }

  100%{

    transform:
      rotate(-18deg)
      translate(0,0)
      scale(1);
  }

}


/* =====================================================
   베기 효과
===================================================== */

#slash{

  position:absolute;

  z-index:24;

  right:0;

  bottom:19%;

  width:80%;

  height:65%;

  opacity:0;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse at 70% 55%,
      rgba(255,255,255,.95) 0 2%,
      rgba(255,225,110,.85) 3% 5%,
      transparent 7%
    ),

    conic-gradient(
      from 205deg at 70% 55%,
      transparent 0 19%,
      rgba(255,245,190,.95) 20% 23%,
      rgba(255,180,40,.8) 24% 28%,
      transparent 29% 100%
    );

  filter:blur(.3px);

  transform:rotate(-18deg);

  mix-blend-mode:screen;
}


#slash.on{

  animation:
    slashFx
    .34s
    ease-out
    forwards;
}


@keyframes slashFx{

  0%{

    opacity:0;

    transform:
      rotate(-25deg)
      scale(.55);
  }

  30%{
    opacity:1;
  }

  100%{

    opacity:0;

    transform:
      rotate(20deg)
      scale(1.18);
  }

}


/* =====================================================
   HUD
===================================================== */

#hud{

  position:absolute;

  z-index:50;

  left:5%;
  right:5%;

  top:12px;

  display:flex;

  gap:8px;

  justify-content:space-between;

  text-shadow:
    0 2px 3px #000;
}


.unit{
  width:48%;
}


.lab{

  font-size:12px;

  font-weight:900;

  margin-bottom:3px;
}


.bar{

  height:14px;

  border:
    2px solid #fff;

  border-radius:5px;

  background:#220b0b;

  overflow:hidden;

  box-shadow:
    0 2px 6px #000;
}


.fill{

  height:100%;

  transition:
    width .18s;
}


#pf{

  background:
    linear-gradient(
      #ff6868,
      #c41414
    );

  width:100%;
}


#ef{

  background:
    linear-gradient(
      #bd76ff,
      #6320a5
    );

  width:100%;
}


#pb.blink,
#eb.blink{

  animation:
    hpBlink
    .32s
    steps(2,end);
}


@keyframes hpBlink{

  50%{
    filter:brightness(2.8);
  }

}


/* =====================================================
   NFC
===================================================== */

#nfc{

  position:absolute;

  z-index:55;

  top:48px;

  left:50%;

  transform:
    translateX(-50%);

  padding:
    7px 12px;

  border-radius:12px;

  background:
    rgba(0,0,0,.6);

  border:
    1px solid
    rgba(255,255,255,.35);

  font-size:12px;

  font-weight:700;

  white-space:nowrap;

  box-shadow:
    0 3px 10px
    rgba(0,0,0,.35);
}


#dot{

  display:inline-block;

  width:8px;
  height:8px;

  border-radius:50%;

  background:#ffd84d;

  margin-right:5px;
}


/* =====================================================
   TOAST
===================================================== */

#toast{

  position:absolute;

  z-index:70;

  left:50%;

  bottom:88px;

  transform:
    translateX(-50%)
    translateY(16px);

  opacity:0;

  padding:
    8px 13px;

  border-radius:10px;

  background:
    rgba(0,0,0,.78);

  border:
    1px solid
    rgba(255,255,255,.3);

  font-size:12px;

  white-space:nowrap;

  transition:.18s;
}


#toast.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =====================================================
   DAMAGE
===================================================== */

#dmg{

  position:absolute;

  z-index:65;

  left:65%;

  top:42%;

  font-size:38px;

  font-weight:1000;

  color:#fff;

  text-shadow:
    0 0 4px #900,
    3px 3px 0 #d00;

  opacity:0;

  pointer-events:none;
}


#dmg.show{

  animation:
    dmgPop
    .65s
    ease-out;
}


@keyframes dmgPop{

  0%{

    opacity:0;

    transform:
      scale(.5)
      translateY(15px);
  }

  20%{

    opacity:1;

    transform:
      scale(1.35)
      translateY(0);
  }

  100%{

    opacity:0;

    transform:
      scale(1)
      translateY(-50px);
  }

}


/* =====================================================
   RED FLASH
===================================================== */

#red{

  position:absolute;

  inset:0;

  z-index:60;

  background:
    rgba(255,0,0,.58);

  opacity:0;

  pointer-events:none;
}


#red.on{

  animation:
    redHit
    .62s
    ease-out;
}


@keyframes redHit{

  0%{
    opacity:.98;
  }

  18%{
    opacity:.85;
  }

  38%{
    opacity:.62;
  }

  58%{
    opacity:.34;
  }

  100%{
    opacity:0;
  }

}


/* =====================================================
   BATTLE START
===================================================== */

#battle{

  position:absolute;

  z-index:70;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.7)
    skewX(-8deg);

  opacity:0;

  padding:
    10px 22px;

  background:
    linear-gradient(
      90deg,
      #9b0909,
      #ff4b13,
      #9b0909
    );

  border:
    3px solid
    #ffdf52;

  color:#fff;

  font-size:27px;

  font-weight:1000;

  white-space:nowrap;

  text-shadow:
    0 3px 4px
    #4b0000;

  box-shadow:
    0 0 20px
    rgba(255,80,0,.65);
}


#battle.show{

  animation:
    battleIn
    .8s
    ease-out;
}


@keyframes battleIn{

  0%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(1.8)
      skewX(-8deg);
  }

  30%{
    opacity:1;
  }

  100%{

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(1)
      skewX(-8deg);
  }

}


/* =====================================================
   CLEAR
===================================================== */

#clear{

  position:absolute;

  inset:0;

  z-index:90;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    rgba(0,0,0,.2);

  opacity:0;

  pointer-events:none;
}


#clear.show{

  opacity:1;

  transition:.3s;
}


.cb{

  padding:
    18px 25px;

  text-align:center;

  background:
    linear-gradient(
      #ffdf65,
      #a85a08
    );

  border:
    4px solid
    #fff1a4;

  border-radius:14px;

  box-shadow:
    0 0 35px
    rgba(255,200,50,.8),

    inset 0 0 20px
    rgba(255,255,255,.25);

  text-shadow:
    0 4px 4px
    #6b2b00;
}


.ct{

  font-size:34px;

  font-weight:1000;
}


.cs{

  font-size:15px;

  margin-top:7px;

  font-weight:800;
}


/* =====================================================
   START
===================================================== */

#start{

  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    linear-gradient(
      rgba(0,0,0,.2),
      rgba(0,0,0,.58)
    );

  text-align:center;
}


#start.hidden{
  display:none;
}


.startBox{

  width:86%;

  max-width:380px;

  padding:
    20px 16px;

  border-radius:18px;

  background:
    rgba(5,12,20,.65);

  border:
    1px solid
    rgba(255,255,255,.3);

  backdrop-filter:
    blur(5px);
}


.startBox h1{

  margin:
    0 0 10px;

  font-size:31px;

  letter-spacing:2px;

  color:#ffe17a;

  text-shadow:
    0 3px 4px
    #6b3500;
}


.startBox p{

  font-size:13px;

  line-height:1.6;

  color:#eee;
}


#go{

  border:0;

  border-radius:11px;

  padding:
    14px 28px;

  font-size:18px;

  font-weight:1000;

  color:#fff;

  background:
    linear-gradient(
      #f7a62b,
      #b94d08
    );

  box-shadow:
    0 4px 0
    #6d2904;

  cursor:pointer;
}


#go:active{

  transform:
    translateY(3px);

  box-shadow:
    0 1px 0
    #6d2904;
}


/* =====================================================
   CAMERA SHAKE
===================================================== */

#camera.shake{

  animation:
    cameraShake
    .82s
    steps(8,end);
}


@keyframes cameraShake{

  0%{
    transform:translate(0);
  }

  12%{
    transform:
      translate(-12px,7px);
  }

  24%{
    transform:
      translate(13px,-7px);
  }

  36%{
    transform:
      translate(-11px,6px);
  }

  48%{
    transform:
      translate(10px,-6px);
  }

  60%{
    transform:
      translate(-8px,4px);
  }

  72%{
    transform:
      translate(7px,-3px);
  }

  84%{
    transform:
      translate(-4px,2px);
  }

  100%{
    transform:
      translate(0);
  }

}

</style>
</head>


<body>

<div id="game">

  <div id="camera">

    <div id="world">


      <!-- =================================================
           하늘
      ================================================== -->

      <img
        id="bg"
        src="https://static.wixstatic.com/media/172435_d6012f4ec1594a17858298879561b509~mv2.png"
        alt=""
      >


      <!-- =================================================
           뒤 풀밭
      ================================================== -->

      <img
        id="backLayer"
        src="https://static.wixstatic.com/media/172435_54aea94be0ae4c5eb4a1f5fa3f56e7ea~mv2.png"
        alt=""
      >


      <div id="farHaze"></div>


      <!-- =================================================
           MONSTER
      ================================================== -->

      <div id="monsterWrap">

        <img
          id="monster"
          src="https://static.wixstatic.com/media/172435_02b890fad23e48b29d15ad67934eda6d~mv2.png"
          alt=""
        >

      </div>


      <!-- =================================================
           앞 풀밭
      ================================================== -->

      <img
        id="frontLayer"
        src="https://static.wixstatic.com/media/172435_b05f44aab7384d4ead52127131d3fe8c~mv2.png"
        alt=""
      >


    </div>


    <!-- 칼 베기 효과 -->

    <div id="slash"></div>


    <!-- =================================================
         칼
    ================================================== -->

    <img
      id="sword"
      src="https://static.wixstatic.com/media/172435_1c16a5d4f8ca44d8a558923200659bb7~mv2.png"
      alt=""
    >


  </div>


  <!-- ===================================================
       HUD
  ==================================================== -->

  <div id="hud">

    <div class="unit">

      <div class="lab">
        HP <span id="pt">100 / 100</span>
      </div>

      <div class="bar" id="pb">

        <div
          class="fill"
          id="pf">
        </div>

      </div>

    </div>


    <div class="unit">

      <div class="lab">
        MONSTER HP
        <span id="et">80 / 80</span>
      </div>

      <div class="bar" id="eb">

        <div
          class="fill"
          id="ef">
        </div>

      </div>

    </div>

  </div>


  <!-- NFC -->

  <div id="nfc">

    <span id="dot"></span>

    <span id="nt">
      NFC 준비 중
    </span>

  </div>


  <div id="toast"></div>


  <div id="dmg">
    -16
  </div>


  <div id="red"></div>


  <div id="battle">
    BATTLE START!
  </div>


  <!-- CLEAR -->

  <div id="clear">

    <div class="cb">

      <div class="ct">
        MISSION CLEAR!
      </div>

      <div class="cs">
        몬스터가 쓰러졌습니다!
      </div>

    </div>

  </div>


  <!-- START -->

  <div id="start">

    <div class="startBox">

      <h1>
        PIXEL ADVENTURE
      </h1>

      <p>
        게임 시작과 동시에 앞으로 전진합니다.<br>
        NFC는 걷는 동안에도 사용할 수 있습니다.<br>
        몬스터 앞에 도착하면 NFC 공격이 실제 데미지가 됩니다.
      </p>

      <button id="go">
        GAME START
      </button>

    </div>

  </div>

</div>


<script>

const $ =
  id => document.getElementById(id);


let started = false;
let battle = false;
let won = false;

let nfcOn = false;
let lastTag = 0;

let walkStart = 0;
let raf = 0;
let enemyTimer = null;

let pHP = 100;
let eHP = 80;


/* =====================================================
   TOAST
===================================================== */

function toast(text){

  $('toast').textContent =
    text;

  $('toast')
    .classList
    .add('show');

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () =>
        $('toast')
        .classList
        .remove('show'),

      1200
    );
}


/* =====================================================
   HP
===================================================== */

function hp(){

  $('pf').style.width =
    pHP + '%';

  $('ef').style.width =
    (eHP / 80 * 100) + '%';

  $('pt').textContent =
    pHP + ' / 100';

  $('et').textContent =
    eHP + ' / 80';

}


function blink(el){

  el.classList
    .remove('blink');

  void el.offsetWidth;

  el.classList
    .add('blink');

}


/* =====================================================
   CAMERA SHAKE
===================================================== */

function shake(){

  $('camera')
    .classList
    .remove('shake');

  void $('camera').offsetWidth;

  $('camera')
    .classList
    .add('shake');

}


/* =====================================================
   진동
   딱 한 번
===================================================== */

function strongEnemyVibe(){

  if(
    navigator.vibrate
  ){

    navigator.vibrate(90);

  }

}


/* =====================================================
   PLAYER HIT
===================================================== */

function playerHit(){

  if(
    won ||
    pHP <= 0
  ){

    return;

  }


  pHP =
    Math.max(
      0,
      pHP - 5
    );


  hp();


  blink(
    $('pb')
  );


  shake();


  $('red')
    .classList
    .remove('on');

  void $('red').offsetWidth;

  $('red')
    .classList
    .add('on');


  if(
    pHP <= 0
  ){

    clearInterval(
      enemyTimer
    );

    toast(
      'YOU DIED'
    );

  }

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function monsterDamage(){

  if(
    !battle ||
    won ||
    pHP <= 0
  ){

    return;

  }


  eHP =
    Math.max(
      0,
      eHP - 16
    );


  hp();


  blink(
    $('eb')
  );


  /* 진동 딱 한 번 */

  strongEnemyVibe();


  /* 강한 카메라 흔들림 */

  shake();


  /* 빨간 플래시 */

  $('red')
    .classList
    .remove('on');

  void $('red').offsetWidth;

  $('red')
    .classList
    .add('on');


  /* 몬스터 강한 피격 */

  $('monster')
    .classList
    .remove(
      'hit',
      'dead'
    );

  void $('monster').offsetWidth;

  $('monster')
    .classList
    .add('hit');


  /* 데미지 숫자 */

  $('dmg')
    .classList
    .remove('show');

  void $('dmg').offsetWidth;

  $('dmg')
    .classList
    .add('show');


  if(
    eHP <= 0
  ){

    win();

  }

}


/* =====================================================
   NFC 공격
===================================================== */

function attack(){

  if(
    won ||
    pHP <= 0
  ){

    return;

  }


  /* idle / walking 정지 */

  $('sword')
    .classList
    .remove(
      'attack',
      'idle',
      'walking'
    );


  $('slash')
    .classList
    .remove('on');


  void $('sword').offsetWidth;
  void $('slash').offsetWidth;


  /* 공격 */

  $('sword')
    .classList
    .add('attack');


  $('slash')
    .classList
    .add('on');


  if(
    battle
  ){

    toast(
      'NFC 인식! 검 공격!'
    );


    monsterDamage();

  }
  else{

    toast(
      'NFC 인식! 검을 휘둘렀습니다!'
    );

  }


  /* 공격 후 다시 idle */

  setTimeout(
    () => {

      if(
        !won &&
        started
      ){

        $('sword')
          .classList
          .remove(
            'attack',
            'walking'
          );

        $('sword')
          .classList
          .add('idle');

      }

    },
    360
  );

}


/* =====================================================
   WIN
===================================================== */

function win(){

  won = true;


  clearInterval(
    enemyTimer
  );


  $('monster')
    .classList
    .remove('hit');


  $('monster')
    .classList
    .add('dead');


  $('sword')
    .classList
    .remove(
      'idle',
      'walking',
      'attack'
    );


  setTimeout(
    () => {

      $('clear')
        .classList
        .add('show');

    },
    900
  );

}


/* =====================================================
   BATTLE START
===================================================== */

function battleStart(){

  if(
    battle ||
    won
  ){

    return;

  }


  battle = true;


  $('battle')
    .classList
    .remove('show');

  void $('battle').offsetWidth;

  $('battle')
    .classList
    .add('show');


  toast(
    '몬스터 앞에 도착했습니다!'
  );


  enemyTimer =
    setInterval(
      playerHit,
      1700
    );

}


/* =====================================================
   WALK
===================================================== */

function walk(now){

  if(
    !started ||
    won
  ){

    return;

  }


  if(
    !walkStart
  ){

    walkStart =
      now;

  }


  const t =
    Math.min(
      (now - walkStart) / 8000,
      1
    );


  /* =================================================
     하늘
  ================================================= */

  const bgScale =
    1.02 + t * .28;


  const bgX =
    -t * 1.5;


  const bgY =
    -t * 2;


  $('bg').style.transform =
    'translate(' +
    bgX +
    '%,' +
    bgY +
    '%) scale(' +
    bgScale +
    ')';


  /* =================================================
     뒤 풀밭
  ================================================= */

  $('backLayer').style.transform =
    'translate(' +
    (-t * 4) +
    '%,' +
    (-t * 2) +
    '%) scale(' +
    (1 + t * .16) +
    ')';


  /* =================================================
     앞 풀밭
  ================================================= */

  $('frontLayer').style.transform =
    'translate(' +
    (-t * 7) +
    '%,' +
    (t * 2) +
    '%) scale(' +
    (1 + t * .14) +
    ')';


  /* =================================================
     몬스터
     훨씬 크게 접근
  ================================================= */

  const monsterScale =
    .34 + t * 1.55;


  const monsterY =
    2 + t * 29;


  $('monsterWrap').style.transform =

    'translate(-50%,' +
    monsterY +
    '%) scale(' +
    monsterScale +
    ')';


  $('monsterWrap').style.opacity =

    Math.min(
      1,
      .3 + t * 1.1
    );


  /* =================================================
     전투
  ================================================= */

  if(
    t >= 1
  ){

    battleStart();

    return;

  }


  raf =
    requestAnimationFrame(
      walk
    );

}


/* =====================================================
   NFC
===================================================== */

async function startNFC(){

  if(
    !window.isSecureContext ||
    location.protocol !== 'https:'
  ){

    $('nt').textContent =
      'HTTPS 필요';

    toast(
      'HTTPS 주소에서 실행해주세요.'
    );

    return false;

  }


  if(
    !('NDEFReader' in window)
  ){

    $('nt').textContent =
      'NFC 미지원';

    toast(
      'Android Chrome에서 Web NFC를 사용할 수 있습니다.'
    );

    return false;

  }


  if(
    nfcOn
  ){

    return true;

  }


  try{

    const reader =
      new NDEFReader();


    await reader.scan();


    nfcOn = true;


    $('nt').textContent =
      'NFC 대기 중';


    $('dot').style.background =
      '#49ef6a';


    reader.onreadingerror =
      () => {

        toast(
          'NFC 읽기 오류'
        );

      };


    reader.onreading =
      () => {

        const now =
          Date.now();


        if(
          now - lastTag < 650
        ){

          return;

        }


        lastTag =
          now;


        attack();

      };


    return true;

  }
  catch(e){

    $('nt').textContent =
      'NFC 권한 확인';


    toast(
      'Chrome에서 NFC 권한을 허용해주세요.'
    );


    return false;

  }

}


/* =====================================================
   CHROME
===================================================== */

function openChrome(){

  const u =
    location.href.replace(
      /^https?:\/\//,
      ''
    );


  location.href =
    'intent://' +
    u +
    '#Intent;scheme=https;package=com.android.chrome;end';

}


/* =====================================================
   START
===================================================== */

$('go').onclick =
  async () => {


    const ua =
      navigator.userAgent;


    if(
      /Android/i.test(ua) &&
      !/Chrome|CriOS/i.test(ua)
    ){

      openChrome();

      return;

    }


    if(
      !window.isSecureContext ||
      location.protocol !== 'https:'
    ){

      toast(
        'HTTPS 주소에서 실행해주세요.'
      );

      return;

    }


    await startNFC();


    started = true;


    $('start')
      .classList
      .add('hidden');


    pHP = 100;
    eHP = 80;


    hp();


    $('sword')
      .classList
      .add('walking');


    walkStart = 0;


    cancelAnimationFrame(
      raf
    );


    raf =
      requestAnimationFrame(
        walk
      );

  };

</script>
