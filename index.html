<script>
function loadScript(urls){return new Promise((resolve,reject)=>{let i=0;const next=()=>{if(i>=urls.length){reject(new Error('네트워크에서 스크립트를 불러오지 못했어요'));return}const s=document.createElement('script');s.src=urls[i++];s.onload=resolve;s.onerror=next;document.head.appendChild(s)};next()})}
let phoneYaw=0,phoneYawActive=false;
const qs=new URLSearchParams(location.search),isCtrl=qs.get('ctrl')==='1';
let room=null;(async()=>{try{room=window.claude?await window.claude.use('room'):null}catch(e){}
 if(room){room.presence({role:isCtrl?'controller':'driver'});
  if(!isCtrl){room.onPeers(ps=>{const has=Object.values(ps||{}).some(p=>p&&p.role==='controller');$('phoneBtn').classList.toggle('on',has);phoneYawActive=has});
   room.on('look',d=>{if(typeof d?.yaw==='number')phoneYaw=Math.max(-90,Math.min(90,d.yaw))})}}
})();
const $=id=>document.getElementById(id);
if(isCtrl){
 $('ctrlUI').style.display='flex';
 let base=null;
 $('ctrlGo').onclick=async()=>{
  try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){await DeviceOrientationEvent.requestPermission()}}catch(e){}
  $('ctrlStatus').textContent='연결됨 · 기기를 좌우로 기울여보세요';
  window.addEventListener('deviceorientation',e=>{
   const g=e.gamma||0;if(base===null)base=g;let d=(g-base)*2.2;d=Math.max(-90,Math.min(90,d));
   $('ctrlDot').querySelector('i').style.transform=`translate(${-50+d/90*40}%,-50%)`;
   if(room)try{room.emit('look',{yaw:d})}catch(e2){}
  });
 };
} else {
(async()=>{
try{
if(typeof THREE==='undefined')await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js','https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js']);
try{if(typeof QRCode==='undefined')await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'])}catch(eq){console.error(eq)}
/* ================= main driving page ================= */
const T=THREE,N=4200,DS=2.2,CH=250;
const hs=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return(hs(xi,yi)*(1-u)+hs(xi+1,yi)*u)*(1-v)+(hs(xi,yi+1)*(1-u)+hs(xi+1,yi+1)*u)*v};
const fbm=(x,y)=>vn(x,y)*.55+vn(x*2.1,y*2.1)*.3+vn(x*4.3,y*4.3)*.15;
const kap=s=>.0022*Math.sin(s/510)+.0016*Math.sin(s/230+1.3)+.0008*Math.sin(s/97),hgt=s=>9+5*Math.sin(s/700)+3*Math.sin(s/290+2),SEA=-4;
const rnd=(a,b)=>a+Math.random()*(b-a);
const P=[];{let x=0,z=0,th=0;for(let i=0;i<=N;i++){P.push({x,z,th,y:hgt(i*DS),c:Math.cos(th),s:Math.sin(th)});th+=kap(i*DS)*DS;x+=Math.cos(th)*DS;z+=Math.sin(th)*DS}}
const canvas=$('world'),R=new T.WebGLRenderer({canvas,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.75));
const scene=new T.Scene();scene.fog=new T.Fog(0xcbe9ee,220,2500);
const cam=new T.PerspectiveCamera(70,1,.05,4200);
const SUN=new T.Vector3(.45,.6,-.65).normalize();
scene.add(new T.HemisphereLight(0xdff0ff,0x8fae72,1.6));
const dl=new T.DirectionalLight(0xfff2da,2.2);dl.position.copy(SUN);scene.add(dl);
function mk(w,h,f,rep=true){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');f(g,w,h);const t=new T.CanvasTexture(c);t.magFilter=T.NearestFilter;if(rep)t.wrapS=t.wrapT=T.RepeatWrapping;return t}
const dot=(g,w,h,n,px,cols)=>{for(let i=0;i<n;i++){g.fillStyle=cols[Math.random()*cols.length|0];g.fillRect((Math.random()*w/px|0)*px,(Math.random()*h/px|0)*px,px,px)}};
const asph=mk(64,64,(g,w,h)=>{g.fillStyle='#6b6f74';g.fillRect(0,0,w,h);dot(g,w,h,300,3,['#63666b','#75797e','#5a5d61']);
 g.fillStyle='#f4f1e6';g.fillRect(w*0.057-3,0,6,h);g.fillRect(w*0.943-3,0,6,h);g.fillStyle='#e8b83a';g.fillRect(w*.5-4,0,8,h)});
const gtex=mk(64,64,(g,w,h)=>{g.fillStyle='#8fbf6e';g.fillRect(0,0,w,h);dot(g,w,h,900,2,['#7fae61','#9ecb7c','#6fa056','#b6da8e'])});
const mtex=mk(16,16,(g,w,h)=>{g.fillStyle='#dfe6ea';g.fillRect(0,0,w,h);dot(g,w,h,30,2,['#c7d0d6','#eef3f5'])});
function strip(cols,fn,mat,vs){for(let a=0;a<N;a+=CH){const b=Math.min(a+CH,N),C=cols.length,pos=[],col=[],uv=[],id=[];
 for(let i=a;i<=b;i++)for(let j=0;j<C;j++){const p=P[i],d=cols[j],f=fn(i,d,j);pos.push(p.x-p.s*d,p.y+f[0],p.z+p.c*d);col.push(f[1],f[2],f[3]);uv.push(f[4]!==undefined?f[4]:d/vs,i*DS/vs)}
 for(let r=0;r<b-a;r++)for(let j=0;j<C-1;j++){const q=r*C+j;id.push(q,q+1,q+C,q+1,q+C+1,q+C)}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setIndex(id);g.computeVertexNormals();scene.add(new T.Mesh(g,mat))}}
/* sea on the RIGHT (d>0), mountain on the LEFT (d<0, a=-d) */
const mtnDy=(i,a)=>{if(a<=4.4)return-.03;const bnd=a<6?-.03-(a-4.4)*.15:-.27-(a-6)*(.7+.6*fbm(i*.06,a*.12));return Math.max(bnd,-16-P[i].y)};
const seaDy=(i,d)=>{if(d<=6)return-.03;const b=d-6;return b*(.12+.25*fbm(i*.03+9,d*.03))+7*fbm(i*.02,d*.035)*Math.min(1,b/40)};
strip([-4.4,0,4.4],(i,d,j)=>[j==1?.05:0,1,1,1,(d+4.4)/8.8],new T.MeshLambertMaterial({map:asph,vertexColors:true}),8);
const gm=new T.MeshLambertMaterial({map:gtex,vertexColors:true});
strip([-80,-45,-28,-20,-15,-11,-8,-6,-4.4],(i,d)=>{const a=-d,dy=mtnDy(i,a),n=fbm(i*.15,a*.3);return[dy,.5+n*.2,.62+n*.15,.4+n*.1]},gm,7);
strip([4.4,6,8,11,15,22,32,48,70,100,140,200],(i,d)=>{const n=fbm(i*.1,d*.1),k=Math.min(1,(d-4)/120);return[seaDy(i,d),.7-.42*k+n*.15,.86-.4*k+n*.12,.58-.32*k+n*.08]},gm,7);
const rp=[-4.66,-4.56,-4.56,-4.66,-4.66],rh=[.95,.95,.55,.55,.95];
strip(rp,(i,d,j)=>[rh[j],1,1,1,j/4],new T.MeshLambertMaterial({map:mtex,vertexColors:true,side:T.DoubleSide}),3);
function inst(geo,mat,n,f,col){const m=new T.InstancedMesh(geo,mat,n),o=new T.Object3D(),c=new T.Color();for(let k=0;k<n;k++){f(o,k);o.updateMatrix();m.setMatrixAt(k,o.matrix);if(col){col(c,k);m.setColorAt(k,c)}}scene.add(m);return m}
const at=(o,i,d,dy,off=0)=>{const p=P[i];o.position.set(p.x-p.s*d,p.y+dy+off,p.z+p.c*d)};
inst(new T.BoxGeometry(.1,.95,.1),new T.MeshLambertMaterial({color:0xc3ccd1}),N/2,(o,k)=>{at(o,k*2,-4.5,0,.47);o.rotation.set(0,-P[k*2].th,0)});
const tuft=new T.ConeGeometry(.05,.7,3);tuft.translate(0,.35,0);
inst(tuft,new T.MeshLambertMaterial({color:0xffffff}),9000,(o)=>{const i=rnd(0,N)|0,r=Math.random()<.5,d=r?rnd(4.6,9):-rnd(4.6,5.8);at(o,i,d,r?seaDy(i,d):mtnDy(i,-d));o.rotation.set(rnd(-.3,.3),rnd(0,6),rnd(-.3,.3));o.scale.setScalar(rnd(.7,1.9))},(c)=>c.setRGB(rnd(.3,.5),rnd(.55,.78),rnd(.2,.35)));
const pal=[[.86,.66,.9],[1,.8,.86],[1,1,.94],[1,.86,.4]];
inst(new T.IcosahedronGeometry(.1,0),new T.MeshLambertMaterial({color:0xffffff}),500,(o)=>{const i=rnd(0,N)|0,d=-rnd(4.8,9);at(o,i,d,mtnDy(i,-d),.5);o.scale.setScalar(rnd(.7,1.4))},(c)=>c.setRGB(...pal[Math.random()*4|0]));
/* ---- dense pine forest: billboard-cross sprites (dot/pixel painted texture) ---- */
const treeTex=mk(48,80,(g,w,h)=>{
 g.clearRect(0,0,w,h);
 g.fillStyle='#5a3c28';g.fillRect(w/2-3,h-22,6,22);
 const rows=[[h-30,20,'#2f6b3c'],[h-46,17,'#377a44'],[h-60,14,'#3f8a4c'],[h-72,10,'#49994f']];
 rows.forEach(([y,rw,col])=>{g.fillStyle=col;for(let x=-rw;x<=rw;x+=4){const yy=y-Math.abs(x)*.35+rnd(-2,2);g.fillRect(w/2+x,yy,4,10)}});
 dot(g,w,h,140,2,['#2a5f37','#458852','#5aa062']);
},false);
const crossGeo=(()=>{const w=3.4,h=6.2,a=new T.PlaneGeometry(w,h),b=new T.PlaneGeometry(w,h);a.translate(0,h/2,0);b.translate(0,h/2,0);b.rotateY(Math.PI/2);
 const ga=a.attributes,gb=b.attributes,pos=[...ga.position.array,...gb.position.array],uv=[...ga.uv.array,...gb.uv.array],idx=[...a.index.array,...b.index.array.map(v=>v+ga.position.count)];
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g})();
const treeMat=new T.MeshLambertMaterial({map:treeTex,alphaTest:.4,side:T.DoubleSide});
const TREEN=5200;
inst(crossGeo,treeMat,TREEN,(o)=>{const i=rnd(0,N)|0,d=-rnd(6.5,165);at(o,i,d,mtnDy(i,-d));o.rotation.y=rnd(0,6.28);const s=rnd(.8,2.3)*(1+Math.min(1,(-d)/60));o.scale.setScalar(s)});
/* signs */
function signTex(draw){return mk(64,64,(g,w,h)=>{g.clearRect(0,0,w,h);draw(g,w,h)},false)}
const signGreen=signTex(g=>{g.fillStyle='#2f8f52';g.fillRect(2,2,60,60);g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(2,2,60,60);g.fillStyle='#fff';g.font='bold 13px monospace';g.textAlign='center';g.fillText('해안도로',32,26);g.beginPath();g.moveTo(32,36);g.lineTo(46,50);g.lineTo(18,50);g.fill()});
const signDir=signTex(g=>{g.fillStyle='#1c6fb0';g.fillRect(2,14,60,36);g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(2,14,60,36);g.fillStyle='#fff';g.beginPath();g.moveTo(46,20);g.lineTo(58,32);g.lineTo(46,44);g.fill();g.fillRect(6,28,40,8)});
const signSpeed=signTex(g=>{g.fillStyle='#fff';g.beginPath();g.arc(32,32,28,0,7);g.fill();g.strokeStyle='#d3242c';g.lineWidth=6;g.beginPath();g.arc(32,32,25,0,7);g.stroke();g.fillStyle='#111';g.font='bold 24px monospace';g.textAlign='center';g.fillText('50',32,41)});
const signSet=[signGreen,signDir,signSpeed];
for(let k=1;k<40;k++){const which=k%3,i=Math.min(N-4,k*105+which*35);if(i>=N-4)break;const d=-6.6,gp=new T.Group();at(gp,i,d,mtnDy(i,-d));gp.rotation.y=Math.atan2(-P[i].c,-P[i].s);
 const pole=new T.Mesh(new T.CylinderGeometry(.04,.04,2.3,6),new T.MeshLambertMaterial({color:0xaaaaaa}));pole.position.y=1.15;
 const pl=new T.Mesh(new T.PlaneGeometry(1.05,1.05),new T.MeshBasicMaterial({map:signSet[which],transparent:true,alphaTest:.05,side:T.DoubleSide}));pl.position.y=2.55;gp.add(pole,pl);scene.add(gp)}
/* sea / sky / islands / clouds */
const sea=new T.Mesh(new T.PlaneGeometry(6000,6000).rotateX(-Math.PI/2),new T.ShaderMaterial({uniforms:{t:{value:0},sun:{value:SUN}},vertexShader:'varying vec3 wp;void main(){vec4 w=modelMatrix*vec4(position,1.);wp=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
 fragmentShader:`uniform float t;uniform vec3 sun;varying vec3 wp;
 float w(vec2 p){return sin(p.x*.9+t*1.1)*sin(p.y*1.1-t)+sin(p.x*2.3-p.y*1.7+t*1.5)*.5;}
 void main(){vec2 p=wp.xz*.35;float h0=w(p);float d=length(wp-cameraPosition);
 vec3 c=mix(vec3(.25,.78,.78),vec3(.08,.42,.72),clamp(d/500.,0.,1.));
 float sp=pow(clamp(h0*.5+.5,0.,1.),3.);c+=vec3(1.,.95,.85)*sp*.35;
 c=mix(c,vec3(.8,.93,1.),smoothstep(300.,2400.,d));gl_FragColor=vec4(c,1.);}`}));

const sky=new T.Mesh(new T.SphereGeometry(3000,24,14),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,uniforms:{sun:{value:SUN}},vertexShader:'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform vec3 sun;varying vec3 d;void main(){float h=max(d.y,0.);vec3 c=mix(vec3(.85,.95,.92),vec3(.55,.82,.92),smoothstep(0.,.3,h));c=mix(c,vec3(.25,.6,.88),smoothstep(.25,.9,h));float s=max(dot(d,sun),0.);c+=vec3(1.,.92,.75)*(pow(s,500.)*2.+pow(s,8.)*.18);gl_FragColor=vec4(c,1.);}`}));sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);
const far=new T.Group();scene.add(far);const mm=new T.MeshBasicMaterial({color:0x8fc0da,fog:false});
for(let k=0;k<14;k++){const g=new T.IcosahedronGeometry(1,2),a=k/14*6.283,m=new T.Mesh(g,mm);m.position.set(Math.cos(a)*rnd(2200,2600),-40,Math.sin(a)*rnd(2200,2600));m.scale.set(rnd(300,600),rnd(120,240),rnd(250,450));far.add(m)}
const cc=mk(64,64,(g)=>{for(let k=0;k<10;k++){const x=rnd(14,50),y=rnd(20,44),r=rnd(9,17),gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,250,240,.9)');gr.addColorStop(1,'rgba(255,250,240,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)}},false);
const clouds=new T.Group();scene.add(clouds);
for(let k=0;k<26;k++){const a=rnd(0,6.283),r=rnd(500,2300),cx=Math.cos(a)*r,cz=Math.sin(a)*r,cy=rnd(220,480);for(let q=0;q<5;q++){const s=new T.Sprite(new T.SpriteMaterial({map:cc,fog:false,depthWrite:false,transparent:true,opacity:.92}));s.position.set(cx+rnd(-160,160),cy+rnd(-20,40),cz+rnd(-160,160));s.scale.setScalar(rnd(260,520));clouds.add(s)}}
/* ---- seagulls: proper drawn silhouette, wing-flap frames, close & visible over the sea ---- */
function gullTex(spread){return mk(64,32,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle='#2b2f33';g.lineWidth=3;g.lineCap='round';g.strokeStyle='#2b2f33';

const gullUp=gullTex(20),gullDn=gullTex(6);
const gulls=[];for(let k=0;k<16;k++){const mat=new T.SpriteMaterial({map:gullUp,transparent:true,alphaTest:.3});const s=new T.Sprite(mat);s.scale.set(3.2,1.6,1);scene.add(s);
 gulls.push({s,mat,ph:rnd(0,6),spd:rnd(1.4,2.4),r:rnd(14,42),h:rnd(5,15),cy:rnd(0,6.28),side:Math.random()<.5?1:-1})}
/* ================= cockpit: 2D pixel-art overlay (no 3D car model) ================= */
const frameC=document.createElement('canvas');frameC.width=1600;frameC.height=900;{const g=frameC.getContext('2d');
 g.fillStyle='#182632';const d=(g2,x,y,w,h)=>{for(let i=0;i<w;i+=4)for(let j=0;j<h;j+=4)if(Math.random()<.4){g2.fillStyle=Math.random()<.5?'#213443':'#0f1c26';g2.fillRect(x+i,y+j,4,4)}};
 g.fillRect(0,640,1600,260);d(g,0,640,1600,260);
 g.fillStyle='#0f1820';g.beginPath();g.moveTo(0,0);g.lineTo(230,0);g.lineTo(30,300);g.lineTo(0,300);g.closePath();g.fill();
 g.beginPath();g.moveTo(1600,0);g.lineTo(1370,0);g.lineTo(1570,300);g.lineTo(1600,300);g.closePath();g.fill();
 g.fillStyle='#0f1820';g.fillRect(690,20,220,70);g.fillStyle='#3a4d5a';g.fillRect(700,30,200,50);g.fillStyle='#1c2b34';g.fillRect(700,30,200,6);
 g.fillStyle='#0f1820';g.fillRect(0,860,1600,40);
}
$('cockpitFrame').src=frameC.toDataURL();
const wheelC=document.createElement('canvas');wheelC.width=360;wheelC.height=360;{const g=wheelC.getContext('2d'),cx=180,cy=180,R0=120;
 g.clearRect(0,0,360,360);
 g.strokeStyle='#1c1c1f';g.lineWidth=26;g.beginPath();g.arc(cx,cy,R0,0,7);g.stroke();
 g.strokeStyle='#33343a';g.lineWidth=6;g.beginPath();g.arc(cx,cy,R0,0,7);g.stroke();
 for(let a=0;a<3;a++){const ang=a*2.094-Math.PI/2;g.strokeStyle='#1c1c1f';g.lineWidth=16;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(ang)*R0,cy+Math.sin(ang)*R0);g.stroke()}
 g.fillStyle='#26262a';g.beginPath();g.arc(cx,cy,30,0,7);g.fill();
 const skin='#c98a5e',skinD='#a86f49';
 function drawHand(ang){g.save();g.translate(cx+Math.cos(ang)*R0,cy+Math.sin(ang)*R0);g.rotate(ang+Math.PI/2);
  g.fillStyle=skin;g.beginPath();g.ellipse(0,0,30,40,0,0,7);g.fill();
  for(let f=-1.5;f<=1.5;f++){g.fillStyle=skinD;g.fillRect(f*11-4,-46,10,26)}
  g.fillStyle=skin;g.fillRect(-14,20,28,70);
  g.restore()}
 drawHand(Math.PI*.78);drawHand(-Math.PI*.22);
}
$('wheelImg').src=wheelC.toDataURL();
const gLctx=$('gL').getContext('2d'),gRctx=$('gR').getContext('2d');
function fitCanvas(c){const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2}
function drawGauge(ctx,c,val,max,label,col){const w=c.width,h=c.height,cx=w/2,cy=h/2,R0=w*.44;ctx.clearRect(0,0,w,h);
 ctx.fillStyle='#132029';ctx.beginPath();ctx.arc(cx,cy,R0,0,7);ctx.fill();
 ctx.strokeStyle='#3a5464';ctx.lineWidth=w*.06;ctx.beginPath();ctx.arc(cx,cy,R0*.8,Math.PI*.75,Math.PI*2.25);ctx.stroke();
 ctx.strokeStyle=col;ctx.lineWidth=w*.06;const a0=Math.PI*.75,a1=a0+Math.max(0,Math.min(1,val/max))*Math.PI*1.5;ctx.beginPath();ctx.arc(cx,cy,R0*.8,a0,a1);ctx.stroke();
 ctx.strokeStyle='#ffe6b0';ctx.lineWidth=w*.03;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a1)*R0*.7,cy+Math.sin(a1)*R0*.7);ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='bold '+(h*.14|0)+'px monospace';ctx.textAlign='center';ctx.fillText(label,cx,cy+R0*.62);ctx.font='bold '+(h*.22|0)+'px monospace';ctx.fillText(Math.round(val),cx,cy)}
/* ---- lane-follow car pivot (invisible, just drives the camera) ---- */
const car=new T.Group();scene.add(car);
const head=new T.Group();car.add(head);head.add(cam);cam.position.set(0.05,1.22,-.1);
/* ---- look control ---- */
let yaw=0,dragging=false,lastX=0,keyL=0,keyR=0;
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')keyL=1;if(e.key=='ArrowRight')keyR=1});
addEventListener('keyup',e=>{if(e.key=='ArrowLeft')keyL=0;if(e.key=='ArrowRight')keyR=0});
const lookEl=$('look');
lookEl.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX});
addEventListener('pointermove',e=>{if(dragging){yaw+=(e.clientX-lastX)*-.15;lastX=e.clientX}});
addEventListener('pointerup',()=>dragging=false);
/* ---- start / qr ui ---- */
let running=false,qrMade=false;
function makeQR(){if(qrMade)return;try{const url=new URL(location.href);url.searchParams.set('ctrl','1');$('qrBox').innerHTML='';new QRCode($('qrBox'),{text:url.toString(),width:170,height:170});qrMade=true}catch(e){$('qrBox').textContent='QR 생성 실패 - 새로고침 후 다시 시도해주세요';console.error(e)}}
$('phoneBtn').onclick=()=>{$('qrWrap').style.display='flex';makeQR()};
$('qrGo').onclick=()=>{$('qrWrap').style.display='flex';makeQR()};
$('qrClose').onclick=()=>{$('qrWrap').style.display='none'};
$('go').onclick=()=>{$('ov').style.display='none';running=true};
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2600)}
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.fov=w/h<1?92:70;cam.updateProjectionMatrix();fitCanvas($('gL'));fitCanvas($('gR'))}addEventListener('resize',resize);resize();
/* ---- sim loop (autodrive, fixed lane) ---- */
let s=20,v=48/3.6,tgt=48/3.6,tm=0,last=performance.now(),gaugeAcc=0;
const LANE=2.3;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running){tm+=dt;
  if(Math.random()<dt*.5)tgt=(46+fbm(tm*.07,3.1)*34)/3.6;
  v+=(tgt-v)*Math.min(1,dt*.6);
  s+=v*dt;if(s>(N-20)*DS){s=10;toast('코스를 한 바퀴 돌았어요 🌊')}
  const f=s/DS,i=Math.min(N-2,f|0),u=f-i,A=P[i],B=P[i+1],th=A.th+(B.th-A.th)*u,px=A.x+(B.x-A.x)*u,pz=A.z+(B.z-A.z)*u,py=A.y+(B.y-A.y)*u;
  const dd=LANE+Math.sin(tm*.35)*.12;
  car.position.set(px-Math.sin(th)*dd,py+.02,pz+Math.cos(th)*dd);
  car.rotation.set(0,Math.atan2(-Math.cos(th),-Math.sin(th)),0);
  /* kap(s)>0 => car curves RIGHT from the driver's view, so wheel rotates CW (positive deg); same sign, no negation */
  const wheelDeg=Math.max(-30,Math.min(30,kap(s)*7800));
  $('wheelImg').style.transform=`translate(-50%,-50%) rotate(${wheelDeg}deg)`;
  yaw+=(keyR-keyL)*dt*70;
  let uYaw=phoneYawActive?phoneYaw:yaw;uYaw=Math.max(-90,Math.min(90,uYaw));yaw=uYaw;
  head.rotation.y=uYaw*Math.PI/180;
  const cp=car.position;sky.position.copy(cp);far.position.set(cp.x,0,cp.z);clouds.position.set(cp.x+tm*1.4,0,cp.z);sea.position.set(cp.x,SEA,cp.z);sea.material.uniforms.t.value=tm;
  gulls.forEach(gl=>{gl.cy+=dt*.1*gl.spd;const a=gl.cy,gx=cp.x+gl.side*22+Math.cos(a)*gl.r,gz=cp.z+18+Math.sin(a)*gl.r;gl.s.position.set(gx,SEA+gl.h+Math.sin(tm*.6+gl.ph)*.6,gz);
   gl.mat.map=Math.sin(tm*7*gl.spd+gl.ph)>0?gullUp:gullDn;gl.mat.needsUpdate=true});
  gaugeAcc+=dt;if(gaugeAcc>.08){gaugeAcc=0;const kmh=v*3.6,rpm=1000+((kmh*38)%5200);drawGauge(gLctx,$('gL'),kmh,140,'km/h','#7fd6ff');drawGauge(gRctx,$('gR'),rpm/100,70,'rpm x100','#ff9a5a')}
 }
 R.render(scene,cam)}
requestAnimationFrame(frame);
}catch(e){console.error(e);document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;z-index:99;background:#204;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:14px">로드 중 오류가 발생했어요:<br>'+(e&&e.message||e)+'</div>')}
})();
}
</script>
