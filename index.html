    top:0;
    left:0;

    height:100%;

/* =====================================================
   SWORD
===================================================== */

#sword{
    position:absolute;

    z-index:40;

    right:var(--sword-right);
    bottom:var(--sword-bottom);

    width:auto;
    height:var(--sword-size);

    max-width:none;

    pointer-events:none;

    transform-origin:84% 91%;

    will-change:transform;

    filter:
        drop-shadow(
            0 10px 10px
            rgba(0,0,0,.32)
        );
}


/* =====================================================
   걷는 중 칼

   빠르고 크게 좌우
===================================================== */

#sword.walking{
    animation:
        swordWalk
        .30s
        ease-in-out
        infinite
        alternate;
}

@keyframes swordWalk{

    from{
        transform:
            translate(-34px,8px)
            rotate(-17deg);
    }

    to{
        transform:
            translate(35px,-11px)
            rotate(17deg);
    }

}


/* =====================================================
   전투 중 칼

   작게 위아래
===================================================== */

#sword.battle-idle{
    animation:
        swordBattleIdle
        .82s
        ease-in-out
        infinite
        alternate;
}

@keyframes swordBattleIdle{

    from{
        transform:
            translateY(3px)
            rotate(-4deg);
    }

    to{
        transform:
            translateY(-8px)
            rotate(-2deg);
    }

}


/* =====================================================
   HUD
===================================================== */

    position:absolute;

    z-index:60;

<!-- =====================================================
   ★★★★★★★★★★★★★★★★★★★★★

   이 부분은 THREE.JS와 완전히 독립.

   시작버튼과 Chrome 이동은
   무조건 작동하도록 함.

   ★★★★★★★★★★★★★★★★★★★★★
===================================================== -->

<script>

function isAndroid(){

    return /Android/i.test(
        navigator.userAgent || ''
    );

}


function isKakaoBrowser(){

    return /KAKAOTALK|KakaoTalk/i.test(
        navigator.userAgent || ''
    );

}


function isRealChrome(){

    const ua =
        navigator.userAgent || '';


    if(
        isKakaoBrowser()
    ){
        return false;
    }


    if(
        /SamsungBrowser|EdgA|OPR/i.test(
            ua
        )
    ){
        return false;
    }


    return /Chrome/i.test(
        ua
    );

}


/* =====================================================
   ★ 기존 잘 작동했던 Chrome 방식
===================================================== */

function openChrome(){

    const url =
        location.href;


    const clean =
        url.replace(
            /^https?:\/\//i,
            ''
        );


    location.href =

        'intent://' +

        clean +

        '#Intent;' +

        'scheme=https;' +

        'package=com.android.chrome;' +

        'end';

}


/* =====================================================
   ★★★★★★★★★★★★★★★★★★★★★

   START BUTTON

   module 밖에서 먼저 실행됨.

   ★★★★★★★★★★★★★★★★★★★★★
===================================================== */

function handleGameStart(){


    /*
       Android + Chrome 아님
       → 무조건 Chrome부터
    */

    if(
        isAndroid() &&
        !isRealChrome()
    ){


        document
        .getElementById(
            'chromeGuide'
        )
        .classList
        .add('show');


        return;

    }


    /*
       버튼이 눌렸다는 반응을
       무조건 먼저 보여준다.
    */

    document
    .getElementById(
        'loading'
    )
    .classList
    .add('show');


    /*
       Three.js module이 아직
       준비 안 됐을 경우
    */

    if(
        typeof window.startRealGame !==
        'function'
    ){


        document
        .getElementById(
            'loading'
        )
        .textContent =
        '3D 엔진 준비 중...';


        /*
           잠깐 기다렸다가 재시도
        */

        let tries =
            0;


        const timer =
            setInterval(
                ()=>{


                    tries++;


                    if(
                        typeof window.startRealGame ===
                        'function'
                    ){


                        clearInterval(
                            timer
                        );


                        window.startRealGame();

                        return;

                    }


                    if(
                        tries > 30
                    ){


                        clearInterval(
                            timer
                        );


                        document
                        .getElementById(
                            'loading'
                        )
                        .classList
                        .remove('show');


                        alert(
                            '3D 엔진을 불러오지 못했습니다. 페이지를 새로고침해주세요.'
                        );

                    }

                },

                100
            );


        return;

    }


    /*
       게임 시작
    */

    window.startRealGame();

}


/* =====================================================
   카톡이면 처음부터 Chrome 안내
===================================================== */

window.addEventListener(
    'DOMContentLoaded',

    ()=>{


        if(
            isAndroid() &&
            !isRealChrome()
        ){


            document
            .getElementById(
                'chromeGuide'
            )
            .classList
            .add('show');

        }

    }
);

</script>

<script type="module">

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js";


const $ =
    id =>
    document.getElementById(id);


/* =====================================================
   CONFIG
===================================================== */

const CONFIG = {

    PLAYER_HP:100,

    MONSTER_HP:100,

    PLAYER_DAMAGE:20,

    MONSTER_DAMAGE:5,


    WALK_SPEED:6.6,


    SWORD_SPEED:460,


    MONSTER_ATTACK_INTERVAL:1800,


    BATTLE_DISTANCE:7,


    MONSTER_POSITIONS:[
        -34,
        -78,
        -126
    ],


    QR_VALUE:
        'CHEST_001',


    MAX_PIXEL_RATIO:1.25,


    FOOTSTEP_INTERVAL:.30

};


const SKY_IMAGE =

'https://static.wixstatic.com/media/172435_d6012f4ec1594a17858298879561b509~mv2.png';


/* =====================================================
   STATE
===================================================== */

let started=false;

let initialized=false;

let gameOver=false;

let battle=false;

let monsterDead=false;


let playerHP=100;

let enemyHP=100;

let monsterIndex=0;


let lastTime=
    performance.now();


let monsterAttackTimer=null;

let monsterAttackProgress=-1;

let monsterAttackHit=false;

let monsterHitTimer=0;

let deathProgress=-1;

let cameraShake=0;


let swordAttacking=false;

let swordType=0;

let swordAnimation=null;


let footTimer=0;

let walkPhase=0;


let scene;

let camera;

let renderer;

let monster;

let monsterMaterial;

let monsterShadow;

let monsterHomeZ;


/* =====================================================
   AUDIO
===================================================== */

let audioCtx=null;


function initAudio(){


    if(audioCtx){

        audioCtx.resume();

        return;

    }


    const AC =

        window.AudioContext ||

        window.webkitAudioContext;


    if(AC){

        audioCtx =
            new AC();

    }

}


function noiseBuffer(
    duration
){


    if(!audioCtx){
        return null;
    }


    const size =

        Math.floor(

            audioCtx.sampleRate *
            duration

        );


    const buffer =

        audioCtx.createBuffer(

            1,
            size,
            audioCtx.sampleRate

        );


    const data =
        buffer.getChannelData(
            0
        );


    for(
        let i=0;
        i<size;
        i++
    ){

        data[i] =
            Math.random()*2-1;

    }


    return buffer;

}


/* =====================================================
   SWORD SOUND
===================================================== */

function swordSound(){


    if(!audioCtx){
        return;
    }


    const now=
        audioCtx.currentTime;


    const src=
        audioCtx.createBufferSource();


    src.buffer=
        noiseBuffer(.25);


    const filter=
        audioCtx.createBiquadFilter();


    filter.type=
        'bandpass';


    filter.frequency.setValueAtTime(
        600,
        now
    );


    filter.frequency.exponentialRampToValueAtTime(
        3300,
        now+.16
    );


    const gain=
        audioCtx.createGain();


    gain.gain.setValueAtTime(
        .46,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.24
    );


    src.connect(filter);

    filter.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    src.start();

}


/* =====================================================
   FOOTSTEP SOUND
===================================================== */

function footSound(){


    if(!audioCtx){
        return;
    }


    const now=
        audioCtx.currentTime;


    const src=
        audioCtx.createBufferSource();


    src.buffer=
        noiseBuffer(.10);


    const filter=
        audioCtx.createBiquadFilter();


    filter.type='lowpass';

    filter.frequency.value=380;


    const gain=
        audioCtx.createGain();


    gain.gain.setValueAtTime(
        .28,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.10
    );


    src.connect(filter);

    filter.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    src.start();

}


/* =====================================================
   HIT SOUND
===================================================== */

function hitSound(){


    if(!audioCtx){
        return;
    }


    const now=
        audioCtx.currentTime;


    const osc=
        audioCtx.createOscillator();


    const gain=
        audioCtx.createGain();


    osc.type='square';


    osc.frequency.setValueAtTime(
        150,
        now
    );


    osc.frequency.exponentialRampToValueAtTime(
        55,
        now+.14
    );


    gain.gain.setValueAtTime(
        .34,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.16
    );


    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    osc.start();

    osc.stop(
        now+.17
    );

}


/* =====================================================
   PLAYER HIT SOUND
===================================================== */

function playerHitSound(){


    if(!audioCtx){
        return;
    }


    const src=
        audioCtx.createBufferSource();


    src.buffer=
        noiseBuffer(.18);


    const gain=
        audioCtx.createGain();


    gain.gain.value=.28;


    src.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    src.start();

}


/* =====================================================
   BGM
===================================================== */

let bgmStarted=false;


function startBGM(){


    if(
        !audioCtx ||
        bgmStarted
    ){
        return;
    }


    bgmStarted=true;


    const master=
        audioCtx.createGain();


    master.gain.value=.04;


    master.connect(
        audioCtx.destination
    );


    const osc1=
        audioCtx.createOscillator();


    const osc2=
        audioCtx.createOscillator();


    osc1.type='sine';

    osc2.type='triangle';


    osc1.frequency.value=110;

    osc2.frequency.value=164.8;


    const g1=
        audioCtx.createGain();


    const g2=
        audioCtx.createGain();


    g1.gain.value=.5;

    g2.gain.value=.18;


    osc1.connect(g1);

    osc2.connect(g2);


    g1.connect(master);

    g2.connect(master);


    osc1.start();

    osc2.start();

}


/* =====================================================
   TEXTURE
===================================================== */

function pixelTexture(
    colors
){


    const canvas=
        document.createElement(
            'canvas'
        );


    canvas.width=128;
    canvas.height=128;


    const ctx=
        canvas.getContext(
            '2d'
        );


    for(
        let y=0;
        y<128;
        y+=8
    ){

        for(
            let x=0;
            x<128;
            x+=8
        ){


            ctx.fillStyle=

                colors[
                    Math.floor(
                        Math.random()*
                        colors.length
                    )
                ];


            ctx.fillRect(
                x,y,8,8
            );

        }

    }


    const t=
        new THREE.CanvasTexture(
            canvas
        );


    t.magFilter=
        THREE.NearestFilter;


    t.minFilter=
        THREE.NearestFilter;


    t.wrapS=
        THREE.RepeatWrapping;


    t.wrapT=
        THREE.RepeatWrapping;


    t.colorSpace=
        THREE.SRGBColorSpace;


    return t;

}

   FOREST
===================================================== */

function createForest(){


    const trunkGeo=

        new THREE.CylinderGeometry(
            .25,.38,3,5
        );


    const leafGeo=

        new THREE.ConeGeometry(
            1.6,4.5,6
        );


    const trunkMat=

        new THREE.MeshLambertMaterial({
            color:0x49331f
        });


    const leafMat=

        new THREE.MeshLambertMaterial({
            color:0x315d2f
        });


    for(
        let z=5;
        z>-180;
        z-=5
    ){


        for(
            const side
            of [-1,1]
        ){


            const tree=
                new THREE.Group();


            const trunk=

                new THREE.Mesh(
                    trunkGeo,
                    trunkMat
                );


            trunk.position.y=1.5;


            tree.add(trunk);


            const leaf=

                new THREE.Mesh(
                    leafGeo,
                    leafMat
                );


            leaf.position.y=4;


            tree.add(leaf);


            tree.position.set(

                side*
                (
                    5+
                    Math.random()*7
                ),

                0,

                z+
                Math.random()*2

            );


            tree.scale.setScalar(

                .7+
                Math.random()*.6

            );


            scene.add(tree);

        }

    }

}

let nfcStarted=false;

let lastNFC=0;


async function startNFC(){


    if(
        !('NDEFReader' in window)
    ){


        $('#statusText')
        .textContent=
        'NFC 미지원';


        return;

    }


    try{


        const reader=
            new NDEFReader();


        await reader.scan();


        nfcStarted=true;


        $('#statusDot')
        .style
        .background='#50ef51';


        $('#statusText')
        .textContent=
        'NFC 대기 중';


        reader.onreading=
            ()=>{


                if(
                    inputMode!=='nfc'
                ){
                    return;
                }


                const now=
                    Date.now();


                if(
                    now-lastNFC<1
                ){
                    return;
                }


                lastNFC=now;


                attack();

            };

    }

    catch(e){


        console.error(
            e
        );


        $('#statusText')
        .textContent=
        'NFC 권한 확인';

    }

}


/* =====================================================
   QR
===================================================== */

let inputMode='nfc';

let qrStream=null;

let qrRunning=false;

let qrLocked=false;

let qrRAF=0;

let detector=null;


/* =====================================================
   START QR
===================================================== */

async function startQR(){


    if(qrRunning){
        return;
    }


    try{


        qrStream=

            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:'environment'
                    }

                }

            });


        $('#qrVideo')
        .srcObject=
        qrStream;


        await $('#qrVideo').play();


        qrRunning=true;


        if(
            'BarcodeDetector'
            in window
        ){


            detector=

                new BarcodeDetector({

                    formats:[
                        'qr_code'
                    ]

                });

        }


        if(!detector){

            await loadJsQR();

        }


        $('#statusDot')
        .style
        .background='#55eaff';


        $('#statusText')
        .textContent=
        'QR 대기 중';


        scanQR();

    }

    catch(e){


        console.error(
            e
        );


        $('#statusText')
        .textContent=
        '카메라 권한 필요';

    }

}


/* =====================================================
   JSQR
===================================================== */

function loadJsQR(){


    return new Promise(
        resolve=>{


            if(window.jsQR){

                resolve();

                return;
            }


            const script=

                document
                .createElement(
                    'script'
                );


            script.src=

'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';


            script.onload=
                resolve;


            script.onerror=
                resolve;


            document.head
            .appendChild(
                script
            );

        }
    );

}


/* =====================================================
   QR LOOP
===================================================== */

async function scanQR(){


    if(
        !qrRunning ||
        inputMode!=='qr'
    ){
        return;
    }


    const video=
        $('#qrVideo');


    let detected=false;


    if(
        detector &&
        video.readyState>=2
    ){


        try{


            const codes=

                await detector.detect(
                    video
                );


            for(
                const item
                of codes
            ){


                if(
                    String(
                        item.rawValue
                    )
                    .trim()
                    .toUpperCase() ===
                    CONFIG.QR_VALUE
                ){


                    detected=true;


                    if(!qrLocked){


                        qrLocked=true;


                        attack();

                    }


                    break;

                }

            }

        }

        catch(e){}

    }


    else if(
        window.jsQR &&
        video.readyState>=2
    ){


        const canvas=
            $('#qrCanvas');


        canvas.width=360;
        canvas.height=240;


        const ctx=

            canvas
            .getContext(
                '2d',
                {
                    willReadFrequently:true
                }
            );


        ctx.drawImage(

            video,

            0,0,

            canvas.width,
            canvas.height

        );


        const data=

            ctx.getImageData(

                0,0,

                canvas.width,
                canvas.height

            );


        const result=

            window.jsQR(

                data.data,

                data.width,

                data.height

            );


        if(
            result &&
            String(
                result.data
            )
            .trim()
            .toUpperCase() ===
            CONFIG.QR_VALUE
        ){


            detected=true;


            if(!qrLocked){


                qrLocked=true;


                attack();

            }

        }

    }


    /*
       QR이 화면에서 없어지면
       다시 읽을 수 있음
    */

    if(!detected){

        qrLocked=false;

    }


    qrRAF=

        requestAnimationFrame(
            scanQR
        );

}


/* =====================================================
   STOP QR
===================================================== */

function stopQR(){


    qrRunning=false;


    cancelAnimationFrame(
        qrRAF
    );


    if(qrStream){


        qrStream
        .getTracks()
        .forEach(
            t=>t.stop()
        );

    }


    qrStream=null;


    $('#qrVideo')
    .srcObject=null;


    qrLocked=false;

}

/* =====================================================
   GAME LOOP
===================================================== */

function loop(now){


    requestAnimationFrame(
        loop
    );


    const dt=

        Math.min(

            (
                now-lastTime
            )/
            1000,

            .05

        );


    lastTime=now;


    if(
        started &&
        !gameOver
    ){


        let walking=false;


        /*
           WALK
        */

        if(!battle){


            if(
                monster &&
                !monsterDead
            ){


                const distance=

                    camera.position.z-
                    monster.position.z;


                if(
                    distance>
                    CONFIG.BATTLE_DISTANCE
                ){


                    camera.position.z -=

                        CONFIG.WALK_SPEED*
                        dt;


                    walking=true;

                }

                else{


                    startBattle();

                }

            }

            else{


                camera.position.z -=

                    CONFIG.WALK_SPEED*
                    dt;


                walking=true;

            }

        }


        /*
           발소리
        */

        if(walking){


            footTimer+=dt;


            if(
                footTimer>=
                CONFIG.FOOTSTEP_INTERVAL
            ){


                footTimer=0;


                footSound();

            }

        }

        else{

            footTimer=0;

        }


        /*
           WALK BOB
        */

        walkPhase +=

            dt*
            (
                walking
                ?
                15.5
                :
                4
            );


        camera.position.y=

            2.15+

            Math.sin(
                walkPhase
            )*
            (
                walking
                ?
                .045
                :
                .015
            );


        /*
           MONSTER BILLBOARD
        */

        if(
            monster &&
            !monsterDead
        ){


            monster.rotation.y=

                Math.atan2(

                    camera.position.x-
                    monster.position.x,

                    camera.position.z-
                    monster.position.z

                );

        }


        /*
           BREATH
        */

        if(
            monster &&
            !monsterDead &&
            monsterAttackProgress<0
        ){


            const breathe=

                1+

                Math.sin(
                    now*.003
                )*
                .025;


            monster.scale.set(

                1,

                breathe,

                1

            );

        }


        /*
           HIT SHAKE
        */

        if(
            monster &&
            monsterHitTimer>0
        ){


            monsterHitTimer-=dt;


            monster.position.x=

                Math.sin(
                    now*.11
                )*
                .18;


            if(
                monsterHitTimer<=0
            ){


                monster.position.x=0;


                monsterMaterial
                .color
                .set(
                    0xffffff
                );

            }

        }


        /*
           MONSTER ATTACK
        */

        if(
            monster &&
            monsterAttackProgress>=0
        ){


            monsterAttackProgress +=
                dt*2.3;


            const t=
                monsterAttackProgress;


            if(t<.2){


                monster.position.z=

                    THREE.MathUtils.lerp(

                        monsterHomeZ,

                        monsterHomeZ-.7,

                        t/.2

                    );

            }


            else if(t<.52){


                const p=
                    (t-.2)/.32;


                monster.position.z=

                    THREE.MathUtils.lerp(

                        monsterHomeZ-.7,

                        monsterHomeZ+3.8,

                        p

                    );

            }


            else if(t<.62){


                if(
                    !monsterAttackHit
                ){


                    monsterAttackHit=true;


                    damagePlayer();

                }

            }


            else if(t<1){


                const p=
                    (t-.62)/.38;


                monster.position.z=

                    THREE.MathUtils.lerp(

                        monsterHomeZ+3.8,

                        monsterHomeZ,

                        p

                    );

            }


            else{


                monster.position.z=
                    monsterHomeZ;


                monsterAttackProgress=-1;


                monsterAttackHit=false;

            }

        }


        /*
           DEATH
        */

        if(
            monster &&
            monsterDead
        ){


            deathProgress +=
                dt*1.4;


            monster.rotation.z=

                Math.min(
                    deathProgress,
                    1
                )*
                1.25;


            monster.position.y=

                THREE.MathUtils.lerp(

                    2.5,

                    .95,

                    Math.min(
                        deathProgress,
                        1
                    )

                );


            monsterMaterial.opacity=

                Math.max(

                    0,

                    1-
                    deathProgress*.8

                );


            camera.position.z -=

                CONFIG.WALK_SPEED*
                dt;


            if(
                deathProgress>1.3
            ){


                nextMonster();

            }

        }


        /*
           SHAKE
        */

        if(cameraShake>0){


            cameraShake-=dt;


            camera.rotation.z=

                (
                    Math.random()-.5
                )*
                .032;


            camera.rotation.x=

                (
                    Math.random()-.5
                )*
                .024;

        }

        else{


            camera.rotation.z*=.7;

            camera.rotation.x*=.7;

        }

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE
===================================================== */

function resize(){


    if(
        !camera ||
        !renderer
    ){
        return;
    }


    const area=
        $('#playArea');


    const w=
        area.clientWidth;


    const h=
        area.clientHeight;


    camera.aspect=
        w/h;


    camera.updateProjectionMatrix();


    renderer.setSize(
        w,h
    );

}


window.addEventListener(
    'resize',
    resize
);


/* =====================================================
   READY
===================================================== */

$('#statusText')
.textContent=
'게임 준비 완료';

</script>

</body>
</html>
