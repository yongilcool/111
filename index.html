===================================================== */

       칼 크기

       칼 오른쪽 위치

       더 음수 = 오른쪽으로 이동

    --sword-right:-18vh;

       칼 아래 위치
    */

/* =====================================================
   BASIC
===================================================== */

*{

    -webkit-tap-highlight-color:transparent;

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111d;
    font-family:Arial,sans-serif;

    inset:0;

#game{

/* =====================================================
   ★ 실제 네 칼+손 PNG

   Three.js 안에 넣지 않고
   화면 앞 HUD처럼 배치.

   그래서 원본 이미지 모습 그대로 나온다.
===================================================== */

#sword{
    position:absolute;

    z-index:40;

    right:
        var(--sword-right);

    bottom:
        var(--sword-bottom);

    width:auto;

    height:
        var(--sword-size);

    max-width:none;

    pointer-events:none;

    user-select:none;

    transform-origin:
        84% 91%;

    will-change:
        transform;

    image-rendering:auto;

    filter:
        drop-shadow(
            0 10px 10px
            rgba(0,0,0,.32)
        );
}


/* =====================================================
   WALK SWAY
===================================================== */

#sword.walking{

    animation:
        swordWalk
        .74s
        ease-in-out
        infinite
        alternate;
}


@keyframes swordWalk{

    from{

        transform:
            translateY(0)
            rotate(-3deg);

    }

    to{

        transform:
            translateY(-7px)
            rotate(2deg);

    }

}


/* =====================================================
   HUD
===================================================== */

    position:absolute;

    z-index:60;

    top:14px;
    left:5%;

.fill{

<script>

function isAndroid(){

    return(
        /Android/i.test(
            navigator.userAgent || ''
        )
    );

}


function isKakaoBrowser(){

    const ua =
        navigator.userAgent || '';

    return(
        /KAKAOTALK/i.test(ua) ||
        /KakaoTalk/i.test(ua)
    );

}


function isRealChrome(){

    const ua =
        navigator.userAgent || '';


    if(
        isKakaoBrowser()
    ){
        return false;
    }


    if(
        /SamsungBrowser/i.test(ua)
    ){
        return false;
    }


    if(
        /EdgA/i.test(ua)
    ){
        return false;
    }


    if(
        /OPR/i.test(ua)
    ){
        return false;
    }


    return(
        /Chrome/i.test(ua)
    );

}


/* =====================================================
   CHROME OPEN
===================================================== */

function openChrome(){

    const current =
        window.location.href;


    const clean =
        current.replace(
            /^https?:\/\//i,
            ''
        );


    window.location.href =

        'intent://' +

        clean +

        '#Intent;' +

        'scheme=https;' +

        'package=com.android.chrome;' +

        'S.browser_fallback_url=' +

        encodeURIComponent(
            current
        ) +

        ';end';

}


window.addEventListener(
    'DOMContentLoaded',
    ()=>{

        if(
            isAndroid() &&
            !isRealChrome()
        ){

            document
                .getElementById(
                    'chromeGuide'
                )
                .classList
                .add('show');

        }

    }
);


document
    .getElementById(
        'chromeButton'
    )
    .addEventListener(
        'click',
        openChrome
    );

</script>

<script type="module">

/* =====================================================
   PIXEL GROUND TEXTURE

   실제 이미지 파일을 쓰지 않고
   가벼운 Canvas Texture 사용.
===================================================== */

function makeGroundTexture(){

    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        128;

    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            '2d'
        );


    ctx.imageSmoothingEnabled =
        false;


    const colors = [

        '#527637',

        '#668744',

        '#46692f',

        '#75944c',

        '#3c602a'

    ];


    for(
        let y = 0;
        y < 128;
        y += 8
    ){

        for(
            let x = 0;
            x < 128;
            x += 8
        ){

            ctx.fillStyle =

                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];


            ctx.fillRect(
                x,
                y,
                8,
                8
            );

        }

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.magFilter =
        THREE.NearestFilter;


    texture.minFilter =
        THREE.NearestFilter;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        12,
        35
    );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


/* =====================================================
   ROAD TEXTURE
===================================================== */

    const canvas =

/* =====================================================
   INIT WORLD
===================================================== */

function init3D(){


    scene =
        new THREE.Scene();


    /*
       맑은 픽셀 RPG 하늘색
    */

    scene.background =
        new THREE.Color(
            0x77b5dd
        );


    scene.fog =
        new THREE.Fog(

            0x8eb8ca,

            22,

            85

        );


    /* =================================================
       CAMERA
    ================================================= */

    camera =
        new THREE.PerspectiveCamera(

            67,

            innerWidth /
            innerHeight,

            .1,

            220

        );


    camera.position.set(

        0,

        2.15,

        8

    );


    /* =================================================
       RENDERER
    ================================================= */

    renderer =
        new THREE.WebGLRenderer({

            antialias:false,

            powerPreference:
                'high-performance'

        });


    renderer.setPixelRatio(

        Math.min(

            devicePixelRatio,

            CONFIG.MAX_PIXEL_RATIO

        )

    );


    renderer.setSize(

        innerWidth,

        innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    document
        .getElementById(
            'game'
        )
        .prepend(
            renderer.domElement
        );


    /* =================================================
       LIGHT
    ================================================= */

    scene.add(

        new THREE.HemisphereLight(

            0xe6f6ff,

            0x27391f,

            2.1

        )

    );


    const sun =
        new THREE.DirectionalLight(

            0xffdda0,

            2.2

        );


    sun.position.set(

        -8,

        12,

        5

    );


    scene.add(
        sun
    );


    /* =================================================
       GROUND
    ================================================= */

    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                90,

                240

            ),

            new THREE.MeshLambertMaterial({

                map:
                    makeGroundTexture()

            })

        );


    ground.rotation.x =

    ground.position.set(

        0,

    scene.add(

            })

        );

function createForest(){

            .23,

            .35,

            2.8,

            5

            color:

        });


    for(
        let z = 5;
        z > -180;
        z -= 4.8
    ){


        for(
            const side
            of [-1,1]
        ){


            const tree =
                new THREE.Group();

                    trunkGeo,

                    trunkMat

            trunk.position.y =

            tree.add(

            const leaves1 =
                new THREE.Mesh(

                    leavesGeo,

                    leavesMat

                );


            leaves1.position.y =
                3.9;


            tree.add(
                leaves1
            );


            const leaves2 =
                leaves1.clone();


            leaves2.scale.setScalar(
                .70
            );


            leaves2.position.y =
                5.15;


            tree.add(
                leaves2
            );


            tree.position.set(

                side *
                (
                    5 +
                    Math.random() *
                    7
                ),

                0,

                z +
                Math.random() *
                2

            );


            const scale =

                .65 +

                Math.random() *
                .65;


            tree.scale.setScalar(
                scale
            );


            scene.add(
                tree
            );

        }

    }

}

   ROCKS
===================================================== */

function createRocks(){


    const geo =
        new THREE.DodecahedronGeometry(

            .45,

            0

        );


    const mat =
        new THREE.MeshLambertMaterial({

            color:
                0x62675d

        });


    for(
        let i = 0;
        i < 70;
        i++
    ){


        const rock =
            new THREE.Mesh(

                geo,

                mat

            );


        let x =

            4 +

            Math.random() *
            10;


        if(
            Math.random() <
            .5
        ){

            x *= -1;

        }


        rock.position.set(

            x,

            .25,

            5 -
            Math.random() *
            180

        );


        const scale =

            .35 +

            Math.random() *
            .85;


        rock.scale.set(

            scale,

            scale *
            .6,

            scale

        );


        scene.add(
            rock
        );

    }

}


/* =====================================================
   ★★★★★★★★★★★★★★★★★★★★★

   MONSTER = 2D PNG PLANE

   실제 3D 위치에 PNG를 세워놓음.

   그래서 이미지 모양은 그대로인데
   실제 PerspectiveCamera 원근법을 받음.

   ★★★★★★★★★★★★★★★★★★★★★
===================================================== */

function spawnMonster(
    index
){


    /*
       이전 몬스터 제거
    */

    if(
        monster
    ){

        scene.remove(
            monster
        );

    }


    if(
        monsterShadow
    ){

        scene.remove(
            monsterShadow
        );

    }


    currentMonsterIndex =
        index;


    currentMonsterHP =
        CONFIG.MONSTER_HP;


    monsterDead =
        false;


    battle =
        false;


    deathProgress =
        -1;


    /*
       아직 실제 이미지 URL이 없을 경우

       임시 픽셀 몬스터 Canvas를 사용.
    */

    const imageURL =
        MONSTER_IMAGES[
            index
        ];


    let texture;


    if(
        imageURL &&
        !imageURL.startsWith(
            'MONSTER_'
        )
    ){


        texture =

            new THREE.TextureLoader()
            .load(
                imageURL
            );


        texture.colorSpace =
            THREE.SRGBColorSpace;


        texture.magFilter =
            THREE.NearestFilter;


        texture.minFilter =
            THREE.LinearFilter;

    }

    else{


        /*
           임시 몬스터.

           네 PNG 넣으면 자동으로 없어짐.
        */

        texture =
            createTemporaryMonster(
                index
            );

    }


    monsterMaterial =
        new THREE.MeshBasicMaterial({

            map:
                texture,

            transparent:true,

            alphaTest:.05,

            side:
                THREE.DoubleSide

        });


    /*
       Plane 자체는 3D 공간에 존재.
    */

    monster =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                5,

                5

            ),

            monsterMaterial

        );


    /*
       발이 땅에 닿도록
       Plane 중심을 2.5 높이에 배치.
    */

    monster.position.set(

        0,

        2.5,

        CONFIG.MONSTER_POSITIONS[
            index
        ]

    );


    monsterHomeZ =

        CONFIG.MONSTER_POSITIONS[
            index
        ];


    scene.add(
        monster
    );


    /*
       그림자
    */

    monsterShadow =
        new THREE.Mesh(

            new THREE.CircleGeometry(

                1.5,

                18

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x000000,

                transparent:true,

                opacity:.27,

                depthWrite:false

            })

        );


    monsterShadow.rotation.x =
        -Math.PI /
        2;


    monsterShadow.position.set(

        0,

        .025,

        monsterHomeZ

    );


    scene.add(
        monsterShadow
    );


    updateHP();


    updateCounter();

}


/* =====================================================
   TEMP MONSTER

   PNG가 들어오기 전 테스트용.
===================================================== */

function createTemporaryMonster(
    index
){


    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        128;

    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            '2d'
        );


    ctx.imageSmoothingEnabled =
        false;


    /*
       투명 배경
    */

    ctx.clearRect(
        0,
        0,
        128,
        128
    );


    const colors = [

        '#516c3e',

        '#285b74',

        '#8a3428'

    ];


    ctx.fillStyle =
        colors[index];


    /*
       몸
    */

    ctx.fillRect(
        35,
        40,
        58,
        55
    );


    ctx.fillRect(
        26,
        53,
        14,
        35
    );


    ctx.fillRect(
        88,
        53,
        14,
        35
    );


    ctx.fillRect(
        41,
        88,
        16,
        25
    );


    ctx.fillRect(
        71,
        88,
        16,
        25
    );


    /*
       머리
    */

    ctx.fillRect(
        40,
        20,
        48,
        38
    );


    /*
       눈
    */

    ctx.fillStyle =
        '#e7ff89';


    ctx.fillRect(
        49,
        32,
        8,
        8
    );


    ctx.fillRect(
        72,
        32,
        8,
        8
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.magFilter =
        THREE.NearestFilter;


    texture.minFilter =
        THREE.NearestFilter;


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}

/* =====================================================
   ★ SWORD ATTACK

   실제 PNG 자체를 움직인다.

   1번:
   옆베기

   2번:
   위→아래 베기
===================================================== */

function attack(){


    if(
        !started ||
        swordAttacking
    ){

        return;

    }


    swordAttacking =
        true;


    sword.classList.remove(
        'walking'
    );


    if(
        swordAnimation
    ){

        swordAnimation.cancel();

    }


    const horizontal =

        swordAttackType ===
        0;


    swordAttackType =

        swordAttackType === 0
        ? 1
        : 0;


    let frames;


    if(
        horizontal
    ){


        /*
           빠른 좌우 베기
        */

        frames = [

            {

                transform:
                    'translate(0,0) rotate(-7deg)'

            },

            {

                offset:.25,

                transform:
                    'translate(-35px,-10px) rotate(-32deg)'

            },

            {

                offset:.55,

                transform:
                    'translate(-115px,-85px) rotate(52deg) scale(1.06)'

            },

            {

                transform:
                    'translate(0,0) rotate(-3deg)'

            }

        ];

    }

    else{


        /*
           위 → 아래 베기
        */

        frames = [

            {

                transform:
                    'translate(0,0) rotate(-3deg)'

            },

            {

                offset:.28,

                transform:
                    'translate(-50px,-120px) rotate(-55deg)'

            },

            {

                offset:.58,

                transform:
                    'translate(-95px,40px) rotate(20deg) scale(1.07)'

            },

            {

                transform:
                    'translate(0,0) rotate(-3deg)'

            }

        ];

    }


    swordAnimation =

        sword.animate(

            frames,

            {

                duration:
                    CONFIG.SWORD_SPEED,

                easing:
                    'cubic-bezier(.15,.85,.2,1)'

            }

        );


    /*
       칼 휘두르는 중간에
       실제 공격 판정.
    */

    setTimeout(

        ()=>{

            damageMonster();

        },

        CONFIG.SWORD_SPEED *
        .45

    );


    swordAnimation.onfinish =

        ()=>{


            swordAttacking =
                false;


            sword.classList.add(
                'walking'
            );

        };

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function damageMonster(){


    if(
        !battle ||
        monsterDead
    ){

        return;

    }


    currentMonsterHP =

        Math.max(

            0,

            currentMonsterHP -
            CONFIG.PLAYER_DAMAGE

        );


    updateHP();


    /*
       ★ 몬스터가 실제로 맞을 때만
       진동
    */

    if(
        navigator.vibrate
    ){

        navigator.vibrate(

            [
                120,
                25,
                110
            ]

        );

    }


    /*
       빨간 플래시
    */

    monsterMaterial.color.set(
        0xff4040
    );


    monsterHitTimer =
        .22;


    cameraShake =
        .22;


    showDamage();


    if(
        currentMonsterHP <=
        0
    ){

        killMonster();

    }

}

/* =====================================================
   MONSTER KILLED
===================================================== */

function killMonster(){


    monsterDead =
        true;


    battle =
        false;


    deathProgress =
        0;


    clearInterval(
        monsterAttackTimer
    );


    monsterAttackProgress =
        -1;


    /*
       다음 몬스터는 여기서
       바로 만들지 않는다.

       현재 몬스터 사망 애니메이션이
       끝난 후 생성.
    */

}


/* =====================================================
   NEXT MONSTER
===================================================== */

function nextMonster(){


    const next =

        currentMonsterIndex +
        1;


    /*
       세 번째까지 완료했다면

       게임 종료시키지 않고
       그냥 계속 앞으로 간다.
    */

    if(
        next >=
        CONFIG.MONSTER_POSITIONS.length
    ){


        if(
            monster
        ){

            scene.remove(
                monster
            );


            monster =
                null;

        }


        if(
            monsterShadow
        ){

            scene.remove(
                monsterShadow
            );


            monsterShadow =
                null;

        }


        currentMonsterIndex =
            2;


        $('monsterCount').textContent =
            '☠ 3 / 3';


        $('enemyText').textContent =
            '0 / 100';


        $('enemyHP').style.width =
            '0%';


        return;

    }


    /*
       ★ 여기서 처음으로
       다음 몬스터를 생성.

       따라서 첫 몬스터가 살아있을 때는
       2번 몬스터가 아예 scene에 없음.
    */

    spawnMonster(
        next
    );

}

   MONSTER ATTACK

function triggerMonsterAttack(){


    if(
        !battle ||
        monsterDead ||
        !monster
    ){

        return;

    }


    if(
        monsterAttackProgress >=
        0
    ){

        return;

    }


    monsterAttackProgress =
        0;


    monsterAttackHit =
        false;

}

   START BATTLE

   글자 없음.
   화면 멈춤 없음.

    if(
        battle ||
        monsterDead
    ){

    }


    battle =

    monsterAttackTimer =

        setInterval(

            triggerMonsterAttack,

/* =====================================================
   NFC
===================================================== */

async function startNFC(){


    /*
       ★ Android에서는
       반드시 Chrome.
    */

    if(
        isAndroid() &&
        !isRealChrome()
    ){

        $('nfcText').textContent =
            'Chrome 필요';


        return false;

    }


    if(
        !window.isSecureContext
    ){

        $('nfcText').textContent =
            'HTTPS 필요';


        return false;

    }


    if(
        !(
            'NDEFReader'
            in window
        )
    ){

        $('nfcText').textContent =
            'NFC 미지원';


        return false;

    }


    if(
        nfcStarted
    ){

        return true;

    }


    try{


        const reader =
            new NDEFReader();


        await reader.scan();


        nfcStarted =
            true;


        $('nfcText').textContent =
            'NFC 대기 중';


        $('nfcDot').style.background =
            '#50ef51';


        reader.onreading =
            ()=>{


                const now =
                    Date.now();


                if(
                    now -
                    lastTag <
                    CONFIG.NFC_COOLDOWN
                ){

                    return;

                }


                lastTag =
                    now;


                /*
                   ★ NFC 1회
                   =
                   칼 1회
                */

                attack();

            };


        reader.onreadingerror =
            ()=>{


                $('nfcText').textContent =
                    'NFC 읽기 오류';

            };


        return true;

    }

    catch(error){


        console.error(
            error
        );


        $('nfcText').textContent =
            'NFC 권한 확인';


        return false;

    }

}

/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){


    requestAnimationFrame(
        gameLoop
    );


    const dt =

        Math.min(

            (
                now -
                lastTime
            ) /
            1000,

            .05

        );


    lastTime =
        now;


    if(
        started
    ){


        /* =================================================
           WALK

           전투 아닐 때는
           항상 앞으로.
        ================================================= */

        if(
            !battle
        ){


            if(
                monster &&
                !monsterDead
            ){


                const distance =

                    camera.position.z -

                    monster.position.z;


                if(
                    distance >
                    CONFIG.BATTLE_DISTANCE
                ){


                    camera.position.z -=

                        CONFIG.WALK_SPEED *
                        dt;

                }

                else{


                    startBattle();

                }

            }

            else{


                /*
                   적이 없거나 죽었으면
                   계속 앞으로.
                */

                camera.position.z -=

                    CONFIG.WALK_SPEED *
                    dt;

            }

        }


        /* =================================================
           CAMERA WALK BOB
        ================================================= */

        walkPhase +=

            dt *
            8;


        camera.position.y =

            2.15 +

            Math.sin(
                walkPhase
            ) *
            .026;


        /* =================================================
           BILLBOARD

           PNG 몬스터가 항상 카메라를 봄.

           y축만 맞추므로
           땅에 서있는 방향 유지.
        ================================================= */

        if(
            monster &&
            !monsterDead
        ){


            monster.rotation.y =

                Math.atan2(

                    camera.position.x -
                    monster.position.x,

                    camera.position.z -
                    monster.position.z

                );

        }


        /* =================================================
           MONSTER BREATH
        ================================================= */

        if(
            monster &&
            !monsterDead &&
            monsterAttackProgress <
            0
        ){


            const breathe =

                1 +

                Math.sin(
                    now *
                    .003
                ) *
                .025;


            monster.scale.set(

                1 -
                (
                    breathe -
                    1
                ) *
                .35,

                breathe,

                1

            );

        }


        /* =================================================
           MONSTER HIT SHAKE
        ================================================= */

        if(
            monster &&
            monsterHitTimer >
            0
        ){


            monsterHitTimer -=
                dt;


            monster.position.x =

                Math.sin(
                    now *
                    .11
                ) *
                .18;


            if(
                monsterHitTimer <=
                0
            ){


                monster.position.x =
                    0;


                monsterMaterial.color.set(
                    0xffffff
                );

            }

        }


        /* =================================================
           MONSTER ATTACK

           살짝 뒤로
              ↓
           플레이어 쪽으로 돌진
              ↓
           공격
              ↓
           원래 자리
        ================================================= */

        if(
            monster &&
            monsterAttackProgress >=
            0
        ){


            monsterAttackProgress +=

                dt *
                2.3;


            const t =
                monsterAttackProgress;


            if(
                t <
                .20
            ){


                const p =

                    t /
                    .20;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ,

                        monsterHomeZ -
                        .7,

                        p

                    );

            }


            else if(
                t <
                .52
            ){


                const p =

                    (
                        t -
                        .20
                    ) /
                    .32;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ -
                        .7,

                        monsterHomeZ +
                        3.8,

                        p

                    );


                /*
                   실제로 플레이어 쪽으로
                   다가오므로 자연스럽게 커짐.
                */

            }


            else if(
                t <
                .62
            ){


                if(
                    !monsterAttackHit
                ){


                    monsterAttackHit =
                        true;


                    damagePlayer();

                }

            }


            else if(
                t <
                1
            ){


                const p =

                    (
                        t -
                        .62
                    ) /
                    .38;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ +
                        3.8,

                        monsterHomeZ,

                        p

                    );

            }


            else{


                monster.position.z =
                    monsterHomeZ;


                monsterAttackProgress =
                    -1;


                monsterAttackHit =
                    false;

            }

        }


        /* =================================================
           MONSTER DEATH
        ================================================= */

        if(
            monster &&
            monsterDead
        ){


            if(
                deathProgress <
                0
            ){

                deathProgress =
                    0;

            }


            deathProgress +=

                dt *
                1.4;


            /*
               땅으로 쓰러지는 느낌
            */

            monster.rotation.z =

                Math.min(

                    deathProgress,

                    1

                ) *

                1.25;


            monster.position.y =

                THREE.MathUtils.lerp(

                    2.5,

                    .95,

                    Math.min(
                        deathProgress,
                        1
                    )

                );


            monsterMaterial.opacity =

                Math.max(

                    0,

                    1 -
                    deathProgress *
                    .8

                );


            if(
                monsterShadow
            ){

                monsterShadow
                    .material
                    .opacity =

                    Math.max(

                        0,

                        .27 -
                        deathProgress *
                        .25

                    );

            }


            /*
               사망 애니메이션 도중에도
               카메라는 계속 앞으로 이동.
            */

            camera.position.z -=

                CONFIG.WALK_SPEED *
                dt;


            /*
               완전히 사라진 뒤
               다음 몬스터 생성.
            */

            if(
                deathProgress >
                1.3
            ){


                nextMonster();

            }

        }


        /* =================================================
           CAMERA SHAKE
        ================================================= */

        if(
            cameraShake >
            0
        ){


            cameraShake -=
                dt;


            camera.rotation.z =

                (
                    Math.random() -
                    .5
                ) *
                .032;


            camera.rotation.x =

                (
                    Math.random() -
                    .5
                ) *
                .024;

        }

        else{


            camera.rotation.z *=
                .70;


            camera.rotation.x *=
                .70;

        }

    }


    renderer.render(

        scene,

        camera

    );

}


/* =====================================================
   RESIZE
===================================================== */

function resizeGame(){


    camera.aspect =

        innerWidth /
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        innerWidth,

        innerHeight

    );

}


/* =====================================================
   INITIAL
===================================================== */

updateHP();

updateCounter();

</script>
