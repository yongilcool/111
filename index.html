<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIXEL ADVENTURE - NFC 전투 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            background: #000;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .browser-warning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10000;
            padding: 20px;
            text-align: center;
        }

        .browser-warning.show {
            display: flex;
        }

        .browser-warning h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        .browser-warning p {
            font-size: 12px;
            line-height: 1.8;
            margin-bottom: 30px;
            max-width: 400px;
        }

        .browser-warning button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Press Start 2P', monospace;
        }

        .browser-warning button:hover {
            background: #45a049;
        }

        .nfc-status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 10px;
            z-index: 100;
        }

        .nfc-status.active {
            background: rgba(76, 175, 80, 0.7);
        }

        .nfc-status.error {
            background: rgba(244, 67, 54, 0.7);
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-10px, -5px); }
            20%, 40%, 60%, 80% { transform: translate(10px, 5px); }
        }

        .shake {
            animation: shake 0.5s;
        }
    </style>
</head>
<body>
    <div class="browser-warning" id="browserWarning">
        <h2>⚠️ Chrome 브라우저 권장</h2>
        <p>
            이 게임은 NFC 기능을 사용합니다.<br>
            최적의 경험을 위해 Chrome 브라우저를<br>
            사용해주세요.
        </p>
        <button onclick="openInChrome()">Chrome에서 열기</button>
        <button onclick="continueAnyway()" style="margin-top: 10px; background: #666;">계속하기</button>
    </div>

    <div class="nfc-status" id="nfcStatus">NFC 초기화 중...</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // 브라우저 체크
        function isChrome() {
            const userAgent = navigator.userAgent.toLowerCase();
            return userAgent.includes('chrome') && !userAgent.includes('edge') && !userAgent.includes('edg');
        }

        function openInChrome() {
            const currentUrl = window.location.href;
            // Android Chrome intent
            window.location.href = 'googlechrome://navigate?url=' + encodeURIComponent(currentUrl);
            // iOS 또는 실패 시 안내
            setTimeout(() => {
                alert('Chrome 앱이 설치되어 있지 않다면, Play Store에서 다운로드해주세요.');
            }, 1000);
        }

        function continueAnyway() {
            document.getElementById('browserWarning').classList.remove('show');
            initGame();
        }

        // 페이지 로드 시 브라우저 체크
        window.addEventListener('load', () => {
            if (!isChrome()) {
                document.getElementById('browserWarning').classList.add('show');
            } else {
                initGame();
            }
        });

        // 게임 초기화
        function initGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const nfcStatus = document.getElementById('nfcStatus');

            // 캔버스 크기 설정
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 게임 상태
            const game = {
                state: 'approaching', // approaching, combat, victory
                playerHP: 100,
                monsterHP: 80,
                monsterMaxHP: 80,
                playerMaxHP: 100,
                distance: 100, // 몬스터까지의 거리 (0에 가까울수록 가까움)
                walkSpeed: 0.3,
                swordSwing: 0,
                swordSwingSpeed: 0,
                monsterAttackTimer: 0,
                monsterAttackInterval: 2000, // 2초마다 공격
                lastMonsterAttack: 0,
                monsterDamageFlash: 0,
                playerDamageFlash: 0,
                hpFlash: 0,
                monsterHpFlash: 0,
                backgroundOffset: 0,
                swordSway: 0,
                time: 0
            };

            // NFC 초기화
            let nfcReader = null;

            async function initNFC() {
                if ('NDEFReader' in window) {
                    try {
                        nfcReader = new NDEFReader();
                        await nfcReader.scan();
                        nfcStatus.textContent = 'NFC 활성화됨 ✓';
                        nfcStatus.classList.add('active');

                        nfcReader.addEventListener('reading', ({ message, serialNumber }) => {
                            console.log('NFC 태그 감지!', message);
                            
                            // chest001 문자 확인
                            let hasChest001 = false;
                            for (const record of message.records) {
                                const textDecoder = new TextDecoder(record.encoding || 'utf-8');
                                const text = textDecoder.decode(record.data);
                                console.log('NFC 데이터:', text);
                                if (text.includes('chest001')) {
                                    hasChest001 = true;
                                    break;
                                }
                            }

                            if (hasChest001 && game.state === 'combat') {
                                attackMonster();
                            }
                        });

                        // 읽기 에러 처리
                        nfcReader.addEventListener('readingerror', () => {
                            console.log('NFC 읽기 실패');
                        });

                    } catch (error) {
                        console.error('NFC 초기화 실패:', error);
                        nfcStatus.textContent = 'NFC 사용 불가';
                        nfcStatus.classList.add('error');
                    }
                } else {
                    nfcStatus.textContent = 'NFC 미지원 브라우저';
                    nfcStatus.classList.add('error');
                }
            }

            // 즉시 NFC 초기화 시작
            initNFC();

            // 몬스터 공격 함수
            function attackMonster() {
                if (game.monsterHP <= 0) return;

                // 검 휘두르기 애니메이션
                game.swordSwingSpeed = 0.5;

                // 몬스터 데미지
                const damage = 15 + Math.floor(Math.random() * 10);
                game.monsterHP -= damage;
                game.monsterDamageFlash = 1;
                game.monsterHpFlash = 1;

                // 강력한 진동 (200ms)
                if ('vibrate' in navigator) {
                    navigator.vibrate([200]);
                }

                // 화면 쉐이크
                canvas.classList.add('shake');
                setTimeout(() => canvas.classList.remove('shake'), 500);

                // 승리 체크
                if (game.monsterHP <= 0) {
                    game.monsterHP = 0;
                    game.state = 'victory';
                }
            }

            // 플레이어 피격
            function playerTakeDamage() {
                const damage = 8 + Math.floor(Math.random() * 5);
                game.playerHP -= damage;
                game.playerDamageFlash = 1;
                game.hpFlash = 1;

                // 중간 진동 (100ms)
                if ('vibrate' in navigator) {
                    navigator.vibrate([100]);
                }

                // 패배 체크
                if (game.playerHP <= 0) {
                    game.playerHP = 0;
                    game.state = 'defeat';
                }
            }

            // 배경 그리기
            function drawBackground() {
                const offset = game.backgroundOffset;
                
                // 하늘 그라데이션
                const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                skyGradient.addColorStop(0, '#87CEEB');
                skyGradient.addColorStop(1, '#B0E0E6');
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);

                // 구름 (간단한 픽셀 스타일)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 5; i++) {
                    const x = (i * 200 + offset * 0.1) % canvas.width;
                    const y = 50 + i * 30;
                    ctx.beginPath();
                    ctx.arc(x, y, 30, 0, Math.PI * 2);
                    ctx.arc(x + 40, y, 35, 0, Math.PI * 2);
                    ctx.arc(x + 80, y, 30, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 들판 그라데이션
                const fieldGradient = ctx.createLinearGradient(0, canvas.height * 0.6, 0, canvas.height);
                fieldGradient.addColorStop(0, '#7EC850');
                fieldGradient.addColorStop(1, '#5A8F35');
                ctx.fillStyle = fieldGradient;
                ctx.fillRect(0, canvas.height * 0.6, canvas.width, canvas.height * 0.4);

                // 언덕 실루엣
                ctx.fillStyle = '#4A7C2F';
                ctx.beginPath();
                ctx.moveTo(0, canvas.height * 0.7);
                for (let x = 0; x < canvas.width; x += 50) {
                    ctx.lineTo(x, canvas.height * 0.7 + Math.sin((x + offset) * 0.01) * 30);
                }
                ctx.lineTo(canvas.width, canvas.height);
                ctx.lineTo(0, canvas.height);
                ctx.closePath();
                ctx.fill();
            }

            // 몬스터 그리기 (2.5D 스케일링)
            function drawMonster() {
                const scale = 1 + (100 - game.distance) / 50; // 거리에 따른 크기 증가
                const baseSize = 150;
                const monsterSize = baseSize * scale;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2 - 100;

                // 데미지 플래시 효과
                if (game.monsterDamageFlash > 0) {
                    ctx.globalAlpha = game.monsterDamageFlash;
                    ctx.fillStyle = 'red';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalAlpha = 1;
                    game.monsterDamageFlash -= 0.05;
                }

                // 몬스터 흔들림
                const shakeX = game.monsterDamageFlash > 0 ? (Math.random() - 0.5) * 20 : 0;
                const shakeY = game.monsterDamageFlash > 0 ? (Math.random() - 0.5) * 20 : 0;

                ctx.save();
                ctx.translate(centerX + shakeX, centerY + shakeY);

                // 몬스터 다리/촉수
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const legLength = monsterSize * 0.8;
                    
                    ctx.strokeStyle = '#5C2E2E';
                    ctx.lineWidth = monsterSize * 0.08;
                    ctx.lineCap = 'round';
                    
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    
                    const wobble = Math.sin(game.time * 0.003 + i) * 20;
                    const endX = Math.cos(angle) * legLength + wobble;
                    const endY = Math.sin(angle) * legLength + wobble;
                    
                    ctx.quadraticCurveTo(
                        endX * 0.5,
                        endY * 0.5 + 30,
                        endX,
                        endY
                    );
                    ctx.stroke();
                }

                // 몬스터 몸체 (빨간 원)
                ctx.fillStyle = '#DC143C';
                ctx.beginPath();
                ctx.arc(0, 0, monsterSize * 0.5, 0, Math.PI * 2);
                ctx.fill();

                // 가시 효과
                ctx.fillStyle = '#8B0000';
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle) * monsterSize * 0.45, Math.sin(angle) * monsterSize * 0.45);
                    ctx.lineTo(Math.cos(angle) * monsterSize * 0.55, Math.sin(angle) * monsterSize * 0.55);
                    ctx.lineTo(Math.cos(angle + 0.1) * monsterSize * 0.45, Math.sin(angle + 0.1) * monsterSize * 0.45);
                    ctx.fill();
                }

                // 눈 (밝은 파란색)
                ctx.fillStyle = '#87CEEB';
                ctx.beginPath();
                ctx.arc(0, 0, monsterSize * 0.35, 0, Math.PI * 2);
                ctx.fill();

                // 동공
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(0, 0, monsterSize * 0.15, 0, Math.PI * 2);
                ctx.fill();

                // 하이라이트
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(-monsterSize * 0.05, -monsterSize * 0.05, monsterSize * 0.08, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // 몬스터 HP 바
                if (game.state === 'combat') {
                    const barWidth = 300;
                    const barHeight = 30;
                    const barX = canvas.width / 2 - barWidth / 2;
                    const barY = 50;

                    // HP 바 깜빡임
                    if (game.monsterHpFlash > 0) {
                        ctx.fillStyle = `rgba(255, 0, 0, ${game.monsterHpFlash})`;
                        ctx.fillRect(barX - 5, barY - 5, barWidth + 10, barHeight + 10);
                        game.monsterHpFlash -= 0.03;
                    }

                    // 배경
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    ctx.fillRect(barX, barY, barWidth, barHeight);

                    // HP
                    const hpPercent = game.monsterHP / game.monsterMaxHP;
                    ctx.fillStyle = hpPercent > 0.5 ? '#FF4444' : '#FF0000';
                    ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);

                    // 테두리
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(barX, barY, barWidth, barHeight);

                    // 텍스트
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`몬스터 HP: ${Math.max(0, game.monsterHP)} / ${game.monsterMaxHP}`, canvas.width / 2, barY + 20);
                }
            }

            // 칼 그리기 (1인칭 시점)
            function drawSword() {
                const swordX = canvas.width * 0.7 + game.swordSway + Math.sin(game.swordSwing) * 100;
                const swordY = canvas.height * 0.7;
                const swordLength = 200;
                const swordWidth = 30;

                ctx.save();
                ctx.translate(swordX, swordY);
                ctx.rotate(Math.sin(game.swordSwing) * 0.5 - 0.3);

                // 칼날 (빛나는 효과)
                const bladeGradient = ctx.createLinearGradient(0, 0, 0, -swordLength);
                bladeGradient.addColorStop(0, '#FFD700');
                bladeGradient.addColorStop(0.5, '#FFF');
                bladeGradient.addColorStop(1, '#FFFACD');
                
                ctx.fillStyle = bladeGradient;
                ctx.fillRect(-swordWidth / 2, -swordLength, swordWidth, swordLength);

                // 빛 효과
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 20;
                ctx.fillRect(-swordWidth / 2, -swordLength, swordWidth, swordLength);
                ctx.shadowBlur = 0;

                // 가드
                ctx.fillStyle = '#B8860B';
                ctx.fillRect(-swordWidth * 1.5, 0, swordWidth * 3, 15);

                // 보석
                ctx.fillStyle = '#4169E1';
                ctx.beginPath();
                ctx.arc(0, 7, 8, 0, Math.PI * 2);
                ctx.fill();

                // 손잡이
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(-swordWidth / 3, 0, swordWidth / 1.5, 80);

                ctx.restore();

                // 검 휘두르기 업데이트
                if (game.swordSwingSpeed > 0) {
                    game.swordSwing += game.swordSwingSpeed;
                    game.swordSwingSpeed *= 0.92; // 감속
                    if (game.swordSwingSpeed < 0.01) {
                        game.swordSwingSpeed = 0;
                    }
                }

                // 걷기 애니메이션
                if (game.state === 'approaching') {
                    game.swordSway = Math.sin(game.time * 0.003) * 20;
                }
            }

            // 플레이어 HP 바
            function drawPlayerHP() {
                const barWidth = 300;
                const barHeight = 30;
                const barX = canvas.width / 2 - barWidth / 2;
                const barY = canvas.height - 80;

                // HP 바 깜빡임
                if (game.hpFlash > 0) {
                    ctx.fillStyle = `rgba(255, 0, 0, ${game.hpFlash})`;
                    ctx.fillRect(barX - 5, barY - 5, barWidth + 10, barHeight + 10);
                    game.hpFlash -= 0.03;
                }

                // 플레이어 데미지 플래시
                if (game.playerDamageFlash > 0) {
                    ctx.globalAlpha = game.playerDamageFlash * 0.3;
                    ctx.fillStyle = 'red';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.globalAlpha = 1;
                    game.playerDamageFlash -= 0.05;
                }

                // 배경
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(barX, barY, barWidth, barHeight);

                // HP
                const hpPercent = game.playerHP / game.playerMaxHP;
                ctx.fillStyle = hpPercent > 0.5 ? '#4CAF50' : hpPercent > 0.25 ? '#FFA500' : '#FF0000';
                ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);

                // 테두리
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(barX, barY, barWidth, barHeight);

                // 텍스트
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`플레이어 HP: ${Math.max(0, game.playerHP)} / ${game.playerMaxHP}`, canvas.width / 2, barY + 20);
            }

            // 승리 화면
            function drawVictory() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.strokeText('미션 클리어!', canvas.width / 2, canvas.height / 2 - 50);
                ctx.fillText('미션 클리어!', canvas.width / 2, canvas.height / 2 - 50);

                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText('몬스터를 물리쳤습니다!', canvas.width / 2, canvas.height / 2 + 20);

                // 별 효과
                for (let i = 0; i < 50; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const size = Math.random() * 3;
                    ctx.fillStyle = `rgba(255, 215, 0, ${Math.random()})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 게임 루프
            function gameLoop(timestamp) {
                game.time = timestamp;

                // 화면 클리어
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 배경 그리기
                drawBackground();

                // 게임 상태별 로직
                if (game.state === 'approaching') {
                    // 몬스터에게 접근
                    game.distance -= game.walkSpeed;
                    game.backgroundOffset += game.walkSpeed * 10;

                    if (game.distance <= 0) {
                        game.distance = 0;
                        game.state = 'combat';
                        game.lastMonsterAttack = timestamp;
                    }

                    drawMonster();
                    drawSword();
                    
                } else if (game.state === 'combat') {
                    drawMonster();
                    drawSword();
                    drawPlayerHP();

                    // 몬스터 공격
                    if (timestamp - game.lastMonsterAttack > game.monsterAttackInterval) {
                        playerTakeDamage();
                        game.lastMonsterAttack = timestamp;
                    }

                } else if (game.state === 'victory') {
                    drawMonster();
                    drawSword();
                    drawPlayerHP();
                    drawVictory();
                }

                requestAnimationFrame(gameLoop);
            }

            // 게임 시작
            gameLoop(0);

            // 리사이즈 처리
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
    </script>
