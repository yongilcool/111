<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#07111d">

<title>PIXEL ADVENTURE</title>

<style>

:root{
    /* 더 음수 = 칼이 오른쪽 */
    --sword-right:-150%;

    /* 더 음수 = 칼이 아래 */
    --sword-bottom:-25%;

    /* 칼 크기 */
    --sword-size:135%;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080c;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:min(100vw,520px);
    height:100dvh;
    max-height:1000px;
    overflow:hidden;
    background:#101820;
    color:white;
    touch-action:manipulation;
}

#camera{
    position:absolute;
    inset:0;
    overflow:hidden;
    will-change:transform;
}

#world{
    position:absolute;
    inset:0;
    overflow:hidden;
}


/* =====================================================
   SKY
===================================================== */

#bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    z-index:1;

    transform:scale(1.01);
    transform-origin:center center;

    will-change:transform;
}


/* =====================================================
   BACK
===================================================== */

#backLayer{
    position:absolute;

    left:-6%;

    width:112%;
    height:61%;

    bottom:3%;

    object-fit:cover;
    object-position:center bottom;

    z-index:2;

    pointer-events:none;

    transform-origin:center bottom;

    will-change:transform;
}


#farHaze{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0) 0%,
            rgba(255,255,255,0) 45%,
            rgba(255,255,255,.025) 56%,
            rgba(80,120,70,.04) 76%,
            rgba(25,40,20,.10) 100%
        );
}


/* =====================================================
   FRONT
===================================================== */

#frontGroup{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:67%;

    z-index:5;

    transform-origin:50% 92%;

    will-change:transform;
}


#frontLayer{
    position:absolute;

    left:-13%;

    width:126%;
    height:100%;

    bottom:-1%;

    object-fit:cover;
    object-position:center top;

    z-index:1;

    pointer-events:none;
}


/* =====================================================
   MONSTER SHADOW
===================================================== */

#monsterShadow{
    position:absolute;

    left:50%;
    bottom:14.3%;

    width:38%;
    height:5%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,.52) 0%,
            rgba(0,0,0,.31) 42%,
            rgba(0,0,0,0) 76%
        );

    filter:blur(3px);

    opacity:.42;

    z-index:2;

    pointer-events:none;
}


/* =====================================================
   MONSTER
===================================================== */

#monsterWrap{
    position:absolute;

    left:50%;
    bottom:10.5%;

    width:55%;

    aspect-ratio:1/1;

    transform:
        translateX(-50%)
        scale(1);

    transform-origin:50% 91%;

    opacity:1;

    z-index:3;

    will-change:
        transform,
        opacity;
}


/* =====================================================
   MONSTER BREATH
===================================================== */

#monsterBreath{
    position:absolute;
    inset:0;

    transform-origin:50% 93%;

    animation:
        monsterBreathing
        1.65s
        ease-in-out
        infinite;

    will-change:transform;
}


@keyframes monsterBreathing{

    0%,
    100%{
        transform:
            scaleX(1)
            scaleY(1);
    }

    50%{
        transform:
            scaleX(.985)
            scaleY(1.035);
    }
}


/* =====================================================
   MONSTER IMAGE
===================================================== */

#monster{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    image-rendering:pixelated;

    translate:0 10%;

    filter:
        drop-shadow(
            0 8px 7px
            rgba(0,0,0,.38)
        );

    transform-origin:50% 90%;

    will-change:
        transform,
        filter,
        opacity;
}


/* =====================================================
   MONSTER DEAD
===================================================== */

#monster.dead{

    animation:
        monsterDead
        1.1s
        ease-out
        forwards;
}


@keyframes monsterDead{

    0%{
        opacity:1;

        transform:
            translate(0,0)
            rotate(0)
            scale(1);
    }

    18%{
        transform:
            translate(-16px,5px)
            rotate(-5deg)
            scale(1.04);

        filter:brightness(3);
    }

    35%{
        transform:
            translate(18px,-5px)
            rotate(5deg)
            scale(1.02);

        filter:brightness(2.3);
    }

    60%{
        transform:
            translate(-8px,10px)
            rotate(-3deg)
            scale(.94);

        opacity:.75;
    }

    100%{
        transform:
            translate(0,40px)
            rotate(7deg)
            scale(.65);

        opacity:0;
    }
}


/* =====================================================
   SWORD
===================================================== */

#sword{
    position:absolute;

    z-index:25;

    right:var(--sword-right);
    bottom:var(--sword-bottom);

    width:auto;

    height:var(--sword-size);

    max-width:none;

    object-fit:contain;

    transform-origin:82% 91%;

    filter:
        drop-shadow(
            0 7px 10px
            rgba(0,0,0,.7)
        );

    pointer-events:none;

    will-change:transform;
}


/* =====================================================
   SWORD WALK
===================================================== */

#sword.walking{

    animation:
        swordWalk
        .68s
        ease-in-out
        infinite
        alternate;
}


@keyframes swordWalk{

    from{
        transform:
            rotate(-19deg)
            translateY(5px);
    }

    to{
        transform:
            rotate(9deg)
            translateY(-5px);
    }
}


/* =====================================================
   SLASH
===================================================== */

#slash{
    position:absolute;

    z-index:24;

    right:0;
    bottom:18%;

    width:85%;
    height:68%;

    opacity:0;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at 70% 55%,
            rgba(255,255,255,.95) 0 2%,
            rgba(255,225,110,.85) 3% 5%,
            transparent 7%
        ),

        conic-gradient(
            from 205deg at 70% 55%,
            transparent 0 19%,
            rgba(255,245,190,.95) 20% 23%,
            rgba(255,180,40,.8) 24% 28%,
            transparent 29% 100%
        );

    mix-blend-mode:screen;

    will-change:
        transform,
        opacity;
}


/* =====================================================
   HUD
===================================================== */

#hud{
    position:absolute;

    z-index:50;

    left:5%;
    right:5%;
    top:12px;

    display:flex;

    gap:8px;

    justify-content:space-between;

    text-shadow:
        0 2px 3px #000;
}


.unit{
    width:48%;
}


.lab{
    font-size:12px;
    font-weight:900;

    margin-bottom:3px;
}


.bar{
    height:14px;

    border:2px solid #fff;

    border-radius:5px;

    background:#220b0b;

    overflow:hidden;

    box-shadow:
        0 2px 6px #000;
}


.fill{
    height:100%;

    transition:
        width .15s linear;
}


#pf{
    background:
        linear-gradient(
            #ff6868,
            #c41414
        );

    width:100%;
}


#ef{
    background:
        linear-gradient(
            #bd76ff,
            #6320a5
        );

    width:100%;
}


/* =====================================================
   NFC
===================================================== */

#nfc{
    position:absolute;

    z-index:55;

    top:48px;
    left:50%;

    transform:
        translateX(-50%);

    padding:
        7px 12px;

    border-radius:12px;

    background:
        rgba(0,0,0,.6);

    border:
        1px solid
        rgba(255,255,255,.35);

    font-size:12px;
    font-weight:700;

    white-space:nowrap;
}


#dot{
    display:inline-block;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffd84d;

    margin-right:5px;
}


/* =====================================================
   DAMAGE
===================================================== */

#dmg{
    position:absolute;

    z-index:65;

    left:65%;
    top:42%;

    font-size:38px;
    font-weight:1000;

    color:white;

    text-shadow:
        0 0 4px #900,
        3px 3px 0 #d00;

    opacity:0;

    pointer-events:none;
}


/* =====================================================
   RED FLASH
===================================================== */

#red{
    position:absolute;
    inset:0;

    z-index:60;

    background:
        rgba(255,0,0,.55);

    opacity:0;

    pointer-events:none;
}


/* =====================================================
   START
===================================================== */

#start{
    position:absolute;
    inset:0;

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(0,0,0,.2),
            rgba(0,0,0,.58)
        );

    text-align:center;
}


#start.hidden{
    display:none;
}


.startBox{
    width:86%;
    max-width:380px;

    padding:
        20px 16px;

    border-radius:18px;

    background:
        rgba(5,12,20,.65);

    border:
        1px solid
        rgba(255,255,255,.3);
}


.startBox h1{
    margin:
        0 0 10px;

    font-size:31px;

    letter-spacing:2px;

    color:#ffe17a;

    text-shadow:
        0 3px 4px #6b3500;
}


.startBox p{
    font-size:13px;

    line-height:1.6;

    color:#eee;
}


#go{
    border:0;

    border-radius:11px;

    padding:
        14px 28px;

    font-size:18px;
    font-weight:1000;

    color:#fff;

    background:
        linear-gradient(
            #f7a62b,
            #b94d08
        );

    box-shadow:
        0 4px 0 #6d2904;
}


/* =====================================================
   CHROME
===================================================== */

#chromeGuide{
    position:absolute;
    inset:0;

    z-index:300;

    display:none;

    align-items:center;
    justify-content:center;

    padding:22px;

    background:
        rgba(0,0,0,.78);
}


#chromeGuide.show{
    display:flex;
}


.chromeBox{
    width:100%;
    max-width:360px;

    padding:
        25px 20px 22px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #182635,
            #09121c
        );

    border:
        1px solid
        rgba(255,255,255,.25);

    text-align:center;
}


#chromeBtn{
    width:100%;

    border:0;

    border-radius:11px;

    padding:
        14px 10px;

    background:
        linear-gradient(
            #4285f4,
            #1769d1
        );

    color:#fff;

    font-size:17px;
    font-weight:900;
}

</style>
</head>


<body>

<div id="game">


    <div id="camera">


        <div id="world">


            <img
                id="bg"
                src="https://static.wixstatic.com/media/172435_d6012f4ec1594a17858298879561b509~mv2.png"
                alt=""
            >


            <img
                id="backLayer"
                src="https://static.wixstatic.com/media/172435_54aea94be0ae4c5eb4a1f5fa3f56e7ea~mv2.png"
                alt=""
            >


            <div id="farHaze"></div>


            <div id="frontGroup">


                <img
                    id="frontLayer"
                    src="https://static.wixstatic.com/media/172435_b05f44aab7384d4ead52127131d3fe8c~mv2.png"
                    alt=""
                >


                <div id="monsterShadow"></div>


                <div id="monsterWrap">


                    <div id="monsterBreath">


                        <img
                            id="monster"
                            src="https://static.wixstatic.com/media/172435_02b890fad23e48b29d15ad67934eda6d~mv2.png"
                            alt=""
                        >


                    </div>


                </div>


            </div>


        </div>


        <div id="slash"></div>


        <img
            id="sword"
            src="https://static.wixstatic.com/media/172435_1c16a5d4f8ca44d8a558923200659bb7~mv2.png"
            alt=""
        >


    </div>


    <!-- HUD -->

    <div id="hud">


        <div class="unit">

            <div class="lab">

                HP

                <span id="pt">
                    100 / 100
                </span>

            </div>


            <div class="bar">

                <div
                    class="fill"
                    id="pf"
                ></div>

            </div>

        </div>


        <div class="unit">

            <div class="lab">

                MONSTER HP

                <span id="et">
                    80 / 80
                </span>

            </div>


            <div class="bar">

                <div
                    class="fill"
                    id="ef"
                ></div>

            </div>

        </div>


    </div>


    <!-- NFC -->

    <div id="nfc">

        <span id="dot"></span>

        <span id="nt">
            NFC 준비 중
        </span>

    </div>


    <!-- DAMAGE -->

    <div id="dmg">
        -16
    </div>


    <!-- RED FLASH -->

    <div id="red"></div>


    <!-- START -->

    <div id="start">

        <div class="startBox">

            <h1>
                PIXEL ADVENTURE
            </h1>

            <p>
                NFC 1회 인식 = 검 1회 공격<br>
                몬스터를 쓰러뜨려도 계속 앞으로 진행합니다.
            </p>

            <button id="go">
                GAME START
            </button>

        </div>

    </div>


    <!-- CHROME GUIDE -->

    <div id="chromeGuide">

        <div class="chromeBox">

            <h2>
                Chrome으로 연결합니다
            </h2>

            <p>
                NFC 게임은 Chrome에서 실행해야 합니다.
            </p>

            <button id="chromeBtn">
                Chrome으로 연결하기
            </button>

        </div>

    </div>


</div>


<script>

/* =====================================================
   ★ 조절값
===================================================== */

const CONFIG = {

    /*
       몬스터 시작 크기
    */
    MONSTER_START_SCALE:1.00,


    /*
       몬스터 도착 크기
    */
    MONSTER_END_SCALE:1.66,


    /*
       몬스터 높이
    */
    MONSTER_BOTTOM:10.5,


    /*
       처음 몬스터까지 걷는 시간
    */
    WALK_TIME:8000,


    /*
       앞 풀밭 확대
    */
    FRONT_END_SCALE:1.30,


    /*
       뒤 배경 확대
    */
    BACK_END_SCALE:1.065,


    /*
       하늘 확대
    */
    SKY_END_SCALE:1.022,


    /*
       ★ NFC 쿨타임

       요청대로 1ms
    */
    NFC_COOLDOWN:1,


    /*
       몬스터 공격 간격
    */
    ENEMY_ATTACK_INTERVAL:1700,


    /*
       ★ 옆베기 속도

       이전 270ms
       → 절반인 135ms
    */
    HORIZONTAL_SLASH_SPEED:135,


    /*
       ★ 세로베기 속도

       이전 285ms
       → 약 절반인 142ms
    */
    VERTICAL_SLASH_SPEED:142
};


const $ =
    id => document.getElementById(id);


let started = false;

let battle = false;

let monsterDead = false;


let nfcOn = false;

let lastTag = 0;


let walkStart = 0;

let raf = 0;


let battleMotionStart = 0;

let battleRaf = 0;


let continueStart = 0;

let continueRaf = 0;


let enemyTimer = null;


let pHP = 100;

let eHP = 80;


/*
   0 = 옆베기
   1 = 세로베기
*/

let slashType = 0;


/*
   현재 실행 중인 애니메이션
*/

let swordAnimation = null;

let slashAnimation = null;

let monsterHitAnimation = null;

let monsterAttackAnimation = null;

let cameraAnimation = null;

let redAnimation = null;

let damageAnimation = null;


$('monsterWrap').style.bottom =
    CONFIG.MONSTER_BOTTOM + '%';


/* =====================================================
   BROWSER
===================================================== */

function isKakaoBrowser(){

    const ua =
        navigator.userAgent || '';


    return(

        /KAKAOTALK/i.test(ua) ||

        /KakaoTalk/i.test(ua)

    );
}


function isAndroid(){

    return(

        /Android/i.test(

            navigator.userAgent || ''

        )

    );
}


function openChrome(){

    const clean =

        window.location.href.replace(

            /^https?:\/\//i,

            ''

        );


    window.location.href =

        'intent://' +

        clean +

        '#Intent;' +

        'scheme=https;' +

        'package=com.android.chrome;' +

        'end';
}


if(

    isKakaoBrowser() &&

    isAndroid()

){

    $('chromeGuide')

        .classList

        .add('show');

}


$('chromeBtn').onclick =
    openChrome;


/* =====================================================
   HP
===================================================== */

function updateHP(){

    $('pf').style.width =
        pHP + '%';


    $('ef').style.width =

        (
            eHP /
            80 *
            100
        ) +

        '%';


    $('pt').textContent =

        pHP +

        ' / 100';


    $('et').textContent =

        eHP +

        ' / 80';

}


/* =====================================================
   CAMERA SHAKE

   offsetWidth 사용하지 않음
===================================================== */

function shakeCamera(){

    if(
        cameraAnimation
    ){

        cameraAnimation.cancel();

    }


    cameraAnimation =

        $('camera').animate(

            [

                {
                    transform:
                        'translate(0,0)'
                },

                {
                    transform:
                        'translate(-9px,5px)'
                },

                {
                    transform:
                        'translate(9px,-5px)'
                },

                {
                    transform:
                        'translate(-7px,4px)'
                },

                {
                    transform:
                        'translate(6px,-3px)'
                },

                {
                    transform:
                        'translate(-3px,2px)'
                },

                {
                    transform:
                        'translate(0,0)'
                }

            ],

            {

                duration:330,

                easing:'ease-out'

            }

        );

}


/* =====================================================
   RED FLASH
===================================================== */

function redFlash(){

    if(
        redAnimation
    ){

        redAnimation.cancel();

    }


    redAnimation =

        $('red').animate(

            [

                {
                    opacity:.62
                },

                {
                    opacity:.28
                },

                {
                    opacity:0
                }

            ],

            {

                duration:300,

                easing:'ease-out'

            }

        );

}


/* =====================================================
   DAMAGE NUMBER
===================================================== */

function damageNumber(){

    if(
        damageAnimation
    ){

        damageAnimation.cancel();

    }


    damageAnimation =

        $('dmg').animate(

            [

                {

                    opacity:0,

                    transform:
                        'translateY(10px) scale(.6)'

                },

                {

                    opacity:1,

                    transform:
                        'translateY(0) scale(1.3)'

                },

                {

                    opacity:0,

                    transform:
                        'translateY(-45px) scale(1)'

                }

            ],

            {

                duration:500,

                easing:'ease-out'

            }

        );

}


/* =====================================================
   MONSTER HIT VIBRATION
===================================================== */

function strongEnemyVibe(){

    if(
        navigator.vibrate
    ){

        /*
           ★ 몬스터가 맞을 때만 진동
        */

        navigator.vibrate(

            [120,25,100]

        );

    }

}


/* =====================================================
   MONSTER HIT EFFECT
===================================================== */

function monsterHitFX(){

    if(
        monsterHitAnimation
    ){

        monsterHitAnimation.cancel();

    }


    monsterHitAnimation =

        $('monster').animate(

            [

                {

                    transform:
                        'translate(0,0) rotate(0)',

                    filter:
                        'brightness(1)'

                },

                {

                    transform:
                        'translate(-13px,4px) rotate(-4deg) scale(1.04)',

                    filter:
                        'brightness(3.4) saturate(2.5) drop-shadow(0 0 24px red)'

                },

                {

                    transform:
                        'translate(13px,-4px) rotate(4deg) scale(1.04)',

                    filter:
                        'brightness(3) saturate(2.2) drop-shadow(0 0 18px red)'

                },

                {

                    transform:
                        'translate(-7px,2px) rotate(-2deg)',

                    filter:
                        'brightness(1.8)'

                },

                {

                    transform:
                        'translate(0,0) rotate(0)',

                    filter:
                        'brightness(1)'

                }

            ],

            {

                duration:310,

                easing:'ease-out'

            }

        );

}


/* =====================================================
   PLAYER HIT

   ★ 플레이어가 맞아도 진동 없음
===================================================== */

function playerHit(){

    if(

        !battle ||

        monsterDead ||

        pHP <= 0

    ){

        return;

    }


    /*
       기존 몬스터 공격 애니메이션이
       남아있다면 정리
    */

    if(
        monsterAttackAnimation
    ){

        monsterAttackAnimation.cancel();

    }


    /*
       ★ 몬스터 공격

       1. 살짝 움츠림
       2. 플레이어 쪽으로 돌진
       3. 원래 자리로 복귀
    */

    monsterAttackAnimation =

        $('monsterBreath').animate(

            [

                {

                    transform:
                        'translateY(0) scale(1)'

                },

                {

                    offset:.20,

                    transform:
                        'translateY(8px) scale(.94)'

                },

                {

                    offset:.48,

                    transform:
                        'translateY(-32px) scale(1.30)'

                },

                {

                    offset:.63,

                    transform:
                        'translateY(-38px) scale(1.36)'

                },

                {

                    transform:
                        'translateY(0) scale(1)'

                }

            ],

            {

                duration:520,

                easing:
                    'cubic-bezier(.2,.8,.25,1)'

            }

        );


    /*
       몬스터가 앞으로 튀어나오는
       순간에 데미지
    */

    setTimeout(

        ()=>{


            if(

                !battle ||

                monsterDead ||

                pHP <= 0

            ){

                return;

            }


            pHP =

                Math.max(

                    0,

                    pHP - 5

                );


            updateHP();


            /*
               ★ 플레이어 피격 시
               진동 없음
            */

            shakeCamera();

            redFlash();


            if(
                pHP <= 0
            ){

                clearInterval(
                    enemyTimer
                );

            }


        },

        230

    );

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function monsterDamage(){

    if(

        !battle ||

        monsterDead ||

        pHP <= 0

    ){

        return;

    }


    eHP =

        Math.max(

            0,

            eHP - 16

        );


    updateHP();


    /*
       ★ 몬스터가 맞을 때만
       강한 진동
    */

    strongEnemyVibe();


    /*
       타격 효과
    */

    monsterHitFX();

    shakeCamera();

    damageNumber();


    if(
        eHP <= 0
    ){

        defeatMonster();

    }

}


/* =====================================================
   ★ ATTACK 1

   빠른 옆베기

   기존 270ms
   → 135ms
===================================================== */

function horizontalSlash(){

    if(
        swordAnimation
    ){

        swordAnimation.cancel();

    }


    if(
        slashAnimation
    ){

        slashAnimation.cancel();

    }


    /*
       공격하는 동안만
       walking CSS 애니메이션 제거
    */

    $('sword')

        .classList

        .remove('walking');


    swordAnimation =

        $('sword').animate(

            [

                {

                    transform:
                        'rotate(-26deg) translate(0,0)'

                },

                {

                    offset:.25,

                    transform:
                        'rotate(-48deg) translate(-10px,5px)'

                },

                {

                    offset:.58,

                    transform:
                        'rotate(58deg) translate(-42px,-32px) scale(1.12)'

                },

                {

                    transform:
                        'rotate(-18deg) translate(0,0)'

                }

            ],

            {

                /*
                   ★ 절반 속도
                */

                duration:
                    CONFIG.HORIZONTAL_SLASH_SPEED,

                easing:
                    'cubic-bezier(.12,.9,.2,1)'

            }

        );


    slashAnimation =

        $('slash').animate(

            [

                {

                    opacity:0,

                    transform:
                        'rotate(-28deg) scale(.55)'

                },

                {

                    offset:.25,

                    opacity:.95

                },

                {

                    opacity:0,

                    transform:
                        'rotate(20deg) scale(1.15)'

                }

            ],

            {

                duration:
                    CONFIG.HORIZONTAL_SLASH_SPEED,

                easing:'ease-out'

            }

        );


    swordAnimation.onfinish =

        ()=>{

            if(
                started
            ){

                $('sword')

                    .classList

                    .add('walking');

            }

        };

}


/* =====================================================
   ★ ATTACK 2

   빠른 위 → 아래 세로베기

   기존 285ms
   → 142ms
===================================================== */

function verticalSlash(){

    if(
        swordAnimation
    ){

        swordAnimation.cancel();

    }


    if(
        slashAnimation
    ){

        slashAnimation.cancel();

    }


    $('sword')

        .classList

        .remove('walking');


    swordAnimation =

        $('sword').animate(

            [

                {

                    transform:
                        'rotate(-18deg) translate(0,0)'

                },

                {

                    offset:.25,

                    transform:
                        'rotate(-78deg) translate(-28px,-65px) scale(1.05)'

                },

                {

                    offset:.60,

                    transform:
                        'rotate(18deg) translate(-48px,35px) scale(1.14)'

                },

                {

                    transform:
                        'rotate(-18deg) translate(0,0)'

                }

            ],

            {

                /*
                   ★ 절반 속도
                */

                duration:
                    CONFIG.VERTICAL_SLASH_SPEED,

                easing:
                    'cubic-bezier(.15,.85,.22,1)'

            }

        );


    slashAnimation =

        $('slash').animate(

            [

                {

                    opacity:0,

                    transform:
                        'rotate(-70deg) scale(.5)'

                },

                {

                    offset:.28,

                    opacity:1

                },

                {

                    opacity:0,

                    transform:
                        'rotate(-5deg) scale(1.18)'

                }

            ],

            {

                duration:
                    CONFIG.VERTICAL_SLASH_SPEED,

                easing:'ease-out'

            }

        );


    swordAnimation.onfinish =

        ()=>{

            if(
                started
            ){

                $('sword')

                    .classList

                    .add('walking');

            }

        };

}


/* =====================================================
   ★ SINGLE ATTACK

   NFC 1번 = 공격 딱 1번

   첫 NFC  → 옆베기
   다음 NFC → 세로베기
   다음 NFC → 옆베기
   ...
===================================================== */

function attack(){

    if(
        !started
    ){

        return;

    }


    if(
        slashType === 0
    ){

        horizontalSlash();

        slashType = 1;

    }

    else{

        verticalSlash();

        slashType = 0;

    }


    /*
       몬스터와 실제 전투 중일 때만
       몬스터 HP 감소
    */

    if(

        battle &&

        !monsterDead

    ){

        monsterDamage();

    }

}


/* =====================================================
   MONSTER DEAD

   ★ 게임 종료 없음
   ★ CLEAR 없음
===================================================== */

function defeatMonster(){

    monsterDead = true;

    battle = false;


    clearInterval(
        enemyTimer
    );


    cancelAnimationFrame(
        battleRaf
    );


    /*
       몬스터 공격 애니메이션 정리
    */

    if(
        monsterAttackAnimation
    ){

        monsterAttackAnimation.cancel();

    }


    if(
        monsterHitAnimation
    ){

        monsterHitAnimation.cancel();

    }


    /*
       몬스터 사망
    */

    $('monster')

        .classList

        .add('dead');


    /*
       그림자 사라짐
    */

    $('monsterShadow').animate(

        [

            {
                opacity:.42
            },

            {
                opacity:0
            }

        ],

        {

            duration:500,

            fill:'forwards'

        }

    );


    /*
       ★ CLEAR 없음
       ★ 정지 없음

       바로 계속 앞으로 이동
    */

    continueStart = 0;


    cancelAnimationFrame(
        continueRaf
    );


    continueRaf =

        requestAnimationFrame(
            continueForward
        );

}


/* =====================================================
   BATTLE START

   ★ 아무 글자도 없음
   ★ NFC 건드리지 않음
   ★ 칼도 멈추지 않음
===================================================== */

function battleStart(){

    if(

        battle ||

        monsterDead

    ){

        return;

    }


    battle = true;


    /*
       ★ 여기서 NFC 관련
       아무것도 하지 않음.

       ★ 검 애니메이션도
       아무것도 건드리지 않음.

       ★ BATTLE START도 없음.
    */


    enemyTimer =

        setInterval(

            playerHit,

            CONFIG.ENEMY_ATTACK_INTERVAL

        );


    /*
       전투 중에도
       배경이 미세하게 움직임
    */

    battleMotionStart = 0;


    cancelAnimationFrame(
        battleRaf
    );


    battleRaf =

        requestAnimationFrame(
            battleMotion
        );

}


/* =====================================================
   FIRST WALK
===================================================== */

function walk(now){

    if(

        !started ||

        monsterDead

    ){

        return;

    }


    if(
        !walkStart
    ){

        walkStart = now;

    }


    const t =

        Math.min(

            (
                now -
                walkStart
            ) /

            CONFIG.WALK_TIME,

            1

        );


    /* =================================================
       SKY
    ================================================= */

    const skyScale =

        1.01 +

        (
            CONFIG.SKY_END_SCALE -
            1.01
        ) *

        t;


    $('bg').style.transform =

        `translateY(${-0.15 * t}%)
         scale(${skyScale})`;


    /* =================================================
       BACK
    ================================================= */

    const backScale =

        1 +

        (
            CONFIG.BACK_END_SCALE -
            1
        ) *

        t;


    $('backLayer').style.transform =

        `translateY(${1.1 * t}%)
         scale(${backScale})`;


    /* =================================================
       FRONT
    ================================================= */

    const frontScale =

        1 +

        (
            CONFIG.FRONT_END_SCALE -
            1
        ) *

        t;


    $('frontGroup').style.transform =

        `translate(
            ${-.8 * t}%,
            ${3 * t}%
        )
        scale(${frontScale})`;


    /* =================================================
       MONSTER
    ================================================= */

    const monsterScale =

        CONFIG.MONSTER_START_SCALE +

        (
            CONFIG.MONSTER_END_SCALE -
            CONFIG.MONSTER_START_SCALE
        ) *

        t;


    $('monsterWrap').style.transform =

        `translateX(-50%)
         scale(${monsterScale})`;


    /* =================================================
       몬스터에게 도착

       ★ 장면 전환 없음
       ★ 바로 전투 상태
    ================================================= */

    if(
        t >= 1
    ){

        battleStart();

        return;

    }


    raf =

        requestAnimationFrame(
            walk
        );

}


/* =====================================================
   BATTLE MOTION

   전투 중에도 화면을 완전히
   정지시키지 않음
===================================================== */

function battleMotion(now){

    if(

        !started ||

        !battle ||

        monsterDead

    ){

        return;

    }


    if(
        !battleMotionStart
    ){

        battleMotionStart = now;

    }


    const elapsed =

        now -

        battleMotionStart;


    const wave =

        Math.sin(

            elapsed /

            1200 *

            Math.PI *

            2

        );


    /*
       앞 풀밭
    */

    $('frontGroup').style.transform =

        `translate(
            ${-.8 + wave * .15}%,
            ${3 + wave * .28}%
        )
        scale(
            ${CONFIG.FRONT_END_SCALE + wave * .009}
        )`;


    /*
       뒤쪽 배경
    */

    $('backLayer').style.transform =

        `translateY(
            ${1.1 + wave * .13}%
        )
        scale(
            ${CONFIG.BACK_END_SCALE + wave * .003}
        )`;


    battleRaf =

        requestAnimationFrame(
            battleMotion
        );

}


/* =====================================================
   CONTINUE FORWARD

   몬스터 사망 후에도 계속 전진
===================================================== */

function continueForward(now){

    if(
        !started
    ){

        return;

    }


    if(
        !continueStart
    ){

        continueStart = now;

    }


    const elapsed =

        now -

        continueStart;


    const cycle =

        (
            elapsed %

            2400

        ) /

        2400;


    const wave =

        Math.sin(

            cycle *

            Math.PI

        );


    /*
       앞 풀밭
    */

    $('frontGroup').style.transform =

        `translate(
            ${-.8 - wave * .7}%,
            ${3 + wave * 2.5}%
        )
        scale(
            ${1.30 + wave * .07}
        )`;


    /*
       뒤 배경
    */

    $('backLayer').style.transform =

        `translateY(
            ${1.1 + wave * .8}%
        )
        scale(
            ${CONFIG.BACK_END_SCALE + wave * .015}
        )`;


    /*
       하늘
    */

    $('bg').style.transform =

        `translateY(-.15%)
         scale(
            ${CONFIG.SKY_END_SCALE + wave * .002}
         )`;


    continueRaf =

        requestAnimationFrame(
            continueForward
        );

}


/* =====================================================
   NFC
===================================================== */

async function startNFC(){

    if(

        !window.isSecureContext ||

        location.protocol !== 'https:'

    ){

        $('nt').textContent =
            'HTTPS 필요';


        return false;

    }


    if(

        !(
            'NDEFReader'
            in window
        )

    ){

        $('nt').textContent =
            'NFC 미지원';


        return false;

    }


    if(
        nfcOn
    ){

        return true;

    }


    try{


        const reader =
            new NDEFReader();


        await reader.scan();


        nfcOn = true;


        $('nt').textContent =
            'NFC 대기 중';


        $('dot').style.background =
            '#49ef6a';


        reader.onreadingerror =

            ()=>{

                $('nt').textContent =
                    'NFC 읽기 오류';

            };


        reader.onreading =

            ()=>{


                const now =
                    Date.now();


                /*
                   ★ NFC 쿨타임 1ms
                */

                if(

                    now -

                    lastTag <

                    CONFIG.NFC_COOLDOWN

                ){

                    return;

                }


                lastTag = now;


                /*
                   ★★★★★★★★★★★★★

                   NFC 1회 인식

                        ↓

                   공격 딱 1번

                   ★★★★★★★★★★★★★
                */

                attack();

            };


        return true;

    }


    catch(e){


        $('nt').textContent =
            'NFC 권한 확인';


        return false;

    }

}


/* =====================================================
   GAME START
===================================================== */

$('go').onclick =

    async function(){


        if(

            isKakaoBrowser() &&

            isAndroid()

        ){

            $('chromeGuide')

                .classList

                .add('show');


            return;

        }


        /*
           NFC는 처음에 한 번만 시작.

           이후 전투 시작이나
           몬스터 공격에서
           NFC를 건드리지 않는다.
        */

        await startNFC();


        started = true;


        $('start')

            .classList

            .add('hidden');


        pHP = 100;

        eHP = 80;


        updateHP();


        /*
           처음부터 검 걷기 모션
        */

        $('sword')

            .classList

            .add('walking');


        walkStart = 0;


        cancelAnimationFrame(
            raf
        );


        raf =

            requestAnimationFrame(
                walk
            );

    };


updateHP();

</script>
