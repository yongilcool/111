<!-- =====================================================
     ★★★ 가장 먼저 실행되는 브라우저 검사 ★★★

     Three.js보다 먼저 실행된다.

     따라서 카톡에서 Three.js 로딩 문제가 있어도
     Chrome 버튼은 정상 작동한다.
===================================================== -->

<script>

function isAndroid(){

    return(
        /Android/i.test(
            navigator.userAgent || ''
        )
    );

}


function isKakaoBrowser(){

    const ua =
        navigator.userAgent || '';

    return(
        /KAKAOTALK/i.test(ua) ||
        /KakaoTalk/i.test(ua)
    );

}


function isRealChrome(){

    const ua =
        navigator.userAgent || '';


    /*
       ★ 중요

       카카오톡 인앱브라우저도
       UA에 Chrome이라는 글자가 들어갈 수 있다.

       따라서 Kakao를 먼저 제외한다.
    */

    if(
        isKakaoBrowser()
    ){
        return false;
    }


    if(
        /SamsungBrowser/i.test(ua)
    ){
        return false;
    }


    if(
        /EdgA/i.test(ua)
    ){
        return false;
    }


    if(
        /OPR/i.test(ua)
    ){
        return false;
    }


    return(
        /Chrome/i.test(ua)
    );

}


/* =====================================================
   ★ Chrome 강제 이동
===================================================== */

function openChrome(){

    const current =
        window.location.href;


    const clean =
        current.replace(
            /^https?:\/\//i,
            ''
        );


    const intent =

        'intent://' +

        clean +

        '#Intent;' +

        'scheme=https;' +

        'package=com.android.chrome;' +

        'S.browser_fallback_url=' +

        encodeURIComponent(
            current
        ) +

        ';end';


    window.location.href =
        intent;

}


/* =====================================================
   ★ GAME START 버튼

   Android에서 Chrome이 아니면
   다른 기능보다 무조건 먼저 Chrome 이동.
===================================================== */

function handleStartButton(){


    if(
        isAndroid() &&
        !isRealChrome()
    ){

        document
            .getElementById(
                'chromeGuide'
            )
            .classList
            .add('show');


        return;
    }


    /*
       Chrome까지 들어온 뒤에만
       실제 3D 게임 시작.
    */

    startRealGame();

}


/* =====================================================
   ★ 페이지를 카톡에서 열었을 때도
   미리 Chrome 안내 표시
===================================================== */

window.addEventListener(
    'DOMContentLoaded',
    ()=>{

        if(
            isAndroid() &&
            !isRealChrome()
        ){

            document
                .getElementById(
                    'chromeGuide'
                )
                .classList
                .add('show');

        }

    }
);

</script>


<!-- =====================================================

<script

<script>

/* =====================================================
   ★ 게임 설정
===================================================== */

const CONFIG = {

    /*
       실제 몬스터 3D 위치
    */

    MONSTER_Z:-34,


    /*
       플레이어 시작 위치

    */

    /*
       몬스터 HP
    */

    MONSTER_HP:100,


    /*
       검 공격력
    */

    PLAYER_DAMAGE:20,


    /*
       몬스터 공격력
    */

    MONSTER_DAMAGE:5,


    /*
       몬스터 공격 간격
    */

    MONSTER_ATTACK_INTERVAL:1750,


    /*
       NFC 코드상 쿨타임
    */

    NFC_COOLDOWN:1,


    /*
       검 공격 속도

       ms

       약 0.14초
    */

    SWORD_SPEED:140,


    /*
       렌더링 해상도 제한

       낮을수록 가벼움.

       1.25면 모바일에서 상당히 가벼운 편.
    */

    MAX_PIXEL_RATIO:1.25

};



const $ =
    id =>
    document.getElementById(id);


/* =====================================================
   STATE
===================================================== */

let gameInitialized =
    false;


let started =
    false;


let battle =
    false;


let monsterDead =
    false;


let nfcStarted =
    false;


let lastTag =
    0;


let playerHP =
    CONFIG.PLAYER_HP;


let monsterHP =
    CONFIG.MONSTER_HP;


let lastTime =
    performance.now();


let walkingPhase =
    0;


let swordAttackType =
    0;


let swordAttacking =
    false;


let monsterAttackTimer =
    null;


let monsterAttackProgress =
    -1;


let monsterAttackHit =
    false;


let monsterHitTimer =
    0;


let cameraShake =
    0;


/*
   Three.js
*/

let scene;

let camera;

let renderer;

let clock;


let monster;

let monsterBody;

let monsterHead;

let monsterMaterial;

let monsterOriginalZ;


let sword;

let swordHomePosition;

let swordHomeRotation;


let monsterShadow;


/* =====================================================
   ★ Canvas 픽셀 텍스처 생성 함수

   외부 이미지를 받지 않아도
   코드 안에서 텍스처를 직접 생성.
===================================================== */

function makePixelTexture(
    size,
    colors,
    blockSize = 8
){

    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        size;


    canvas.height =
        size;


    const ctx =
        canvas.getContext(
            '2d'
        );


    ctx.imageSmoothingEnabled =
        false;


    for(
        let y = 0;
        y < size;
        y += blockSize
    ){

        for(
            let x = 0;
            x < size;
            x += blockSize
        ){

            const color =
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];


            ctx.fillStyle =
                color;


            ctx.fillRect(
                x,
                y,
                blockSize,
                blockSize
            );

        }

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.magFilter =
        THREE.NearestFilter;


    texture.minFilter =
        THREE.NearestFilter;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


/* =====================================================
   GRASS TEXTURE
===================================================== */

function createGrassTexture(){

    const texture =
        makePixelTexture(

            128,

            [
                '#4f6d32',
                '#5e7c38',
                '#405d29',
                '#6f893f',
                '#769249',
                '#354f26'
            ],

            8

        );


    texture.repeat.set(
        12,
        30
    );


    return texture;

}


/* =====================================================
   PATH TEXTURE
===================================================== */

function createPathTexture(){

    const texture =
        makePixelTexture(

            128,

            [
                '#766346',
                '#826e4c',
                '#68563e',
                '#917a53',
                '#5e503b'
            ],

            8

        );


    texture.repeat.set(
        3,
        35
    );


    return texture;

}


/* =====================================================
   TREE TEXTURE
===================================================== */

function createTreeTexture(){

    return makePixelTexture(

        64,

        [
            '#244b29',
            '#2f5a30',
            '#183c22',
            '#3e6936',
            '#31582a'
        ],

        8

    );

}


/* =====================================================
   MONSTER TEXTURE
===================================================== */

function createMonsterTexture(){

    return makePixelTexture(

        64,

        [
            '#526940',
            '#65794c',
            '#405436',
            '#718455',
            '#35462f',
            '#82915d'
        ],

        8

    );

}


/* =====================================================
   THREE INIT
===================================================== */

function init3D(){


    if(
        typeof THREE ===
        'undefined'
    ){

        alert(
            '3D 엔진을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.'
        );

        return false;

    }


    scene =
        new THREE.Scene();


    /*
       픽셀 RPG 느낌의
       푸른 안개
    */

    scene.background =
        new THREE.Color(
            0x80b4d5
        );


    scene.fog =
        new THREE.Fog(
            0x88abc0,
            18,
            75
        );


    /* =================================================
       CAMERA
    ================================================= */

    camera =
        new THREE.PerspectiveCamera(

            67,

            window.innerWidth /
            window.innerHeight,

            .1,

            160

        );


    camera.position.set(

        0,

        2.15,

        CONFIG.START_Z

    );


    /* =================================================
       RENDERER
    ================================================= */

    renderer =
        new THREE.WebGLRenderer({

            antialias:false,

            alpha:false,

            powerPreference:
                'high-performance'

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            CONFIG.MAX_PIXEL_RATIO

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.domElement.style.imageRendering =
        'pixelated';


    document
        .getElementById(
            'game'
        )
        .prepend(
            renderer.domElement
        );


    /* =================================================
       LIGHT
    ================================================= */

    const hemi =
        new THREE.HemisphereLight(

            0xd6efff,

            0x28361f,

            2.0

        );


    scene.add(
        hemi
    );


    const sun =
        new THREE.DirectionalLight(

            0xffe4a9,

            2.2

        );


    sun.position.set(

        -7,

        12,

        5

    );


    scene.add(
        sun
    );


    /* =================================================
       FLOOR
    ================================================= */

    const grassTexture =
        createGrassTexture();


    const groundMaterial =
        new THREE.MeshLambertMaterial({

            map:
                grassTexture

        });


    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                80,

                180

            ),

            groundMaterial

        );


    ground.rotation.x =
        -Math.PI /
        2;


    ground.position.set(

        0,

        0,

        -55

    );


    scene.add(
        ground
    );


    /* =================================================
       PATH
    ================================================= */

    const pathTexture =
        createPathTexture();


    const pathMaterial =
        new THREE.MeshLambertMaterial({

            map:
                pathTexture

        });


    const path =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                6,

                180

            ),

            pathMaterial

        );


    path.rotation.x =
        -Math.PI /
        2;


    path.position.set(

        0,

        .015,

        -55

    );


    scene.add(
        path
    );


    /* =================================================
       TREES
    ================================================= */

    const leafTexture =
        createTreeTexture();


    const trunkMaterial =
        new THREE.MeshLambertMaterial({

            color:
                0x49321f

        });


    const leafMaterial =
        new THREE.MeshLambertMaterial({

            map:
                leafTexture

        });


    const trunkGeo =
        new THREE.CylinderGeometry(

            .25,

            .38,

            3.0,

            5

        );


    const leafGeo =
        new THREE.ConeGeometry(

            1.75,

            4.7,

            6

        );


    function addTree(
        x,
        z,
        scale
    ){

        const tree =
            new THREE.Group();


        const trunk =
            new THREE.Mesh(

                trunkGeo,

                trunkMaterial

            );


        trunk.position.y =
            1.5;


        tree.add(
            trunk
        );


        const leaves1 =
            new THREE.Mesh(

                leafGeo,

                leafMaterial

            );


        leaves1.position.y =
            4.0;


        tree.add(
            leaves1
        );


        const leaves2 =
            new THREE.Mesh(

                leafGeo,

                leafMaterial

            );


        leaves2.scale.set(

            .72,

            .72,

            .72

        );


        leaves2.position.y =
            5.4;


        tree.add(
            leaves2
        );


        tree.position.set(

            x,

            0,

            z

        );


        tree.scale.setScalar(
            scale
        );


        tree.rotation.y =

            Math.random() *
            Math.PI;


        scene.add(
            tree
        );

    }


    /*
       실제 Z 거리마다 나무 배치.

       가까운 나무가 훨씬 빨리
       화면을 지나가게 됨.
    */

    for(
        let z = 5;
        z > -115;
        z -= 5
    ){

        addTree(

            -5 -
            Math.random() *
            6,

            z +
            Math.random() *
            2,

            .7 +
            Math.random() *
            .6

        );


        addTree(

            5 +
            Math.random() *
            6,

            z +
            Math.random() *
            2,

            .7 +
            Math.random() *
            .6

        );

    }


    /* =================================================
       PIXEL ROCKS
    ================================================= */

    const rockMaterial =
        new THREE.MeshLambertMaterial({

            color:
                0x596057

        });


    const rockGeo =
        new THREE.DodecahedronGeometry(

            .5,

            0

        );


    for(
        let i = 0;
        i < 45;
        i++
    ){

        const rock =
            new THREE.Mesh(

                rockGeo,

                rockMaterial

            );


        let x =

            3.7 +

            Math.random() *
            9;


        if(
            Math.random() <
            .5
        ){

            x *= -1;

        }


        rock.position.set(

            x,

            .25,

            5 -
            Math.random() *
            120

        );


        const s =

            .35 +

            Math.random() *
            .9;


        rock.scale.set(

            s,

            s * .6,

            s

        );


        scene.add(
            rock
        );

    }


    /* =================================================
       MONSTER
    ================================================= */

    createMonster();


    /* =================================================
       SWORD
    ================================================= */

    createSword();


    /*
       검이 카메라에 붙어있기 때문에
       카메라도 scene에 추가.
    */

    scene.add(
        camera
    );


    gameInitialized =
        true;


    window.addEventListener(

        'resize',

        onResize

    );


    requestAnimationFrame(
        gameLoop
    );


    return true;

}

/* =====================================================
   START REAL GAME
===================================================== */

async function startRealGame(){


    if(
        started
    ){
        return;
    }


    /*
       Android인데 Chrome이 아니라면
       절대로 NFC나 게임 시작 안 함.
    */

    if(
        isAndroid() &&
        !isRealChrome()
    ){

        $('chromeGuide')
            .classList
            .add('show');


        return;
    }


    $('loading')
        .classList
        .add('show');


    /*
       아직 3D 초기화 안 됐으면
       여기서 초기화.
    */

    if(
        !gameInitialized
    ){

        const result =
            init3D();


        if(
            !result
        ){

            $('loading')
                .classList
                .remove('show');


            return;
        }

    }


    /*
       NFC 시작
    */

    await startNFC();


    started =
        true;


    $('loading')
        .classList
        .remove('show');


    $('startScreen')
        .classList
        .add('hidden');

}


/* =====================================================
   NFC
===================================================== */

async function startNFC(){


    /*
       ★ 또 한 번 Chrome 확인

       실수로라도 인앱브라우저에서
       scan() 호출되지 않게 이중 방어.
    */

    if(
        isAndroid() &&
        !isRealChrome()
    ){

        $('nfcText').textContent =
            'Chrome 필요';


        return false;
    }


    if(
        !window.isSecureContext
    ){

        $('nfcText').textContent =
            'HTTPS 필요';


        return false;
    }


    if(
        !(
            'NDEFReader'
            in window
        )
    ){

        $('nfcText').textContent =
            'NFC 미지원';


        return false;
    }


    if(
        nfcStarted
    ){

        return true;
    }


    try{


        const reader =
            new NDEFReader();


        /*
           ★ 반드시 GAME START 버튼의
           사용자 클릭 흐름 안에서 scan()
        */

        await reader.scan();


        nfcStarted =
            true;


        $('nfcText').textContent =
            'NFC 대기 중';


        $('nfcDot').style.background =
            '#48ef69';


        reader.onreadingerror =
            ()=>{


                $('nfcText').textContent =
                    'NFC 읽기 오류';

            };


        reader.onreading =
            ()=>{


                const now =
                    Date.now();


                if(

                    now -
                    lastTag <

                    CONFIG.NFC_COOLDOWN

                ){

                    return;

                }


                lastTag =
                    now;


                /*
                   ★ NFC 1회
                   =
                   검 1회
                */

                attack();

            };


        return true;

    }


    catch(error){


        console.error(
            error
        );


        $('nfcText').textContent =
            'NFC 권한 확인';


        return false;

    }

}

/* =====================================================
   SWORD ATTACK
===================================================== */

function attack(){


    if(
        !started ||
        swordAttacking
    ){

        return;
    }


    swordAttacking =
        true;


    const attackMode =
        swordAttackType;


    swordAttackType =

        swordAttackType === 0
        ? 1
        : 0;


    const startTime =
        performance.now();


    let damageApplied =
        false;


    function animateSword(now){


        const t =

            Math.min(

                (
                    now -
                    startTime
                ) /

                CONFIG.SWORD_SPEED,

                1

            );


        /*
           0 → 1 → 0
        */

        const swing =

            Math.sin(

                t *
                Math.PI

            );


        if(
            attackMode === 0
        ){

            /*
               ★ 좌우 베기
            */

            sword.rotation.x =

                swordHomeRotation.x;


            sword.rotation.z =

                swordHomeRotation.z +

                swing *
                1.80;


            sword.rotation.y =

                swordHomeRotation.y -

                swing *
                .42;


            sword.position.x =

                swordHomePosition.x -

                swing *
                .72;


            sword.position.y =

                swordHomePosition.y +

                swing *
                .12;

        }

        else{

            /*
               ★ 위 → 아래 베기
            */

            sword.rotation.x =

                swordHomeRotation.x -

                swing *
                1.72;


            sword.rotation.z =

                swordHomeRotation.z +

                swing *
                .30;


            sword.position.y =

                swordHomePosition.y +

                swing *
                .80;


            sword.position.x =

                swordHomePosition.x -

                swing *
                .25;

        }


        /*
           공격 중간에 1번만
           실제 타격 판정
        */

        if(
            t >= .45 &&
            !damageApplied
        ){

            damageApplied =
                true;


            damageMonster();

        }


        if(
            t < 1
        ){

            requestAnimationFrame(
                animateSword
            );

        }

        else{


            sword.position.copy(
                swordHomePosition
            );


            sword.rotation.copy(
                swordHomeRotation
            );


            swordAttacking =
                false;

        }

    }


    requestAnimationFrame(
        animateSword
    );

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function damageMonster(){


    /*
       몬스터가 아직 멀리 있으면
       칼은 휘두르지만 데미지는 없음.
    */

    if(
        !battle ||
        monsterDead
    ){

        return;
    }


    monsterHP =

        Math.max(

            0,

            monsterHP -
            CONFIG.PLAYER_DAMAGE

        );


    updateHP();


    /* =================================================
       ★ 몬스터 맞을 때만 진동
    ================================================= */

    if(
        navigator.vibrate
    ){

        navigator.vibrate(

            [
                120,
                25,
                110
            ]

        );

    }


    /* =================================================
       RED HIT
    ================================================= */

    monsterMaterial.color.set(
        0xff3030
    );


    monsterHitTimer =
        .23;


    cameraShake =
        .24;


    showDamageNumber();


    if(
        monsterHP <= 0
    ){

        killMonster();

    }

}

/* =====================================================
   MONSTER ATTACK
===================================================== */

function triggerMonsterAttack(){


    if(
        !battle ||
        monsterDead
    ){

        return;
    }


    if(
        monsterAttackProgress >= 0
    ){

        return;
    }


    monsterAttackProgress =
        0;


    monsterAttackHit =
        false;

}


/* =====================================================
   BATTLE START

   ★ BATTLE START 글자 없음
   ★ 화면 정지 없음
   ★ NFC 중단 없음
===================================================== */

function startBattle(){


    if(
        battle ||
        monsterDead
    ){

        return;
    }


    battle =
        true;


    /*
       표시도 없고
       검도 안 멈추고
       NFC도 건드리지 않는다.
    */


    monsterAttackTimer =

        setInterval(

            triggerMonsterAttack,

            CONFIG.MONSTER_ATTACK_INTERVAL

        );

}


/* =====================================================
   MONSTER DEAD

   ★ CLEAR 없음
   ★ 계속 걸어감
===================================================== */

function killMonster(){


    monsterDead =
        true;


    battle =
        false;


    clearInterval(
        monsterAttackTimer
    );


    monsterAttackProgress =
        -1;


    /*
       이후 게임루프에서
       몬스터가 쓰러지고
       카메라는 계속 앞으로 이동.
    */

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){


    requestAnimationFrame(
        gameLoop
    );


    if(
        !renderer ||
        !scene ||
        !camera
    ){

        return;
    }


    const dt =

        Math.min(

            (
                now -
                lastTime
            ) /
            1000,

            .05

        );


    lastTime =
        now;


    if(
        started
    ){


        /* =================================================
           REAL FORWARD MOVEMENT
        ================================================= */

        if(
            !battle
        ){


            /*
               몬스터가 살아있으면
               일정 거리 앞에서 전투 시작.
            */

            if(
                !monsterDead
            ){


                const distance =

                    camera.position.z -

                    monster.position.z;


                if(
                    distance >
                    CONFIG.BATTLE_DISTANCE
                ){

                    camera.position.z -=

                        CONFIG.WALK_SPEED *

                        dt;

                }

                else{

                    startBattle();

                }

            }

            else{


                /*
                   ★ 몬스터 죽은 뒤에는
                   계속 앞으로.
                */

                camera.position.z -=

                    CONFIG.WALK_SPEED *

                    dt;

            }

        }


        /* =================================================
           WALK BOB
        ================================================= */

        walkingPhase +=

            dt *
            8.2;


        camera.position.y =

            2.15 +

            Math.sin(
                walkingPhase
            ) *
            .025;


        if(
            !swordAttacking
        ){


            sword.position.y =

                swordHomePosition.y +

                Math.sin(
                    walkingPhase
                ) *
                .045;


            sword.position.x =

                swordHomePosition.x +

                Math.sin(
                    walkingPhase *
                    .5
                ) *
                .035;

        }


        /* =================================================
           MONSTER BREATH
        ================================================= */

        if(
            !monsterDead &&
            monsterAttackProgress < 0
        ){


            const breathe =

                1 +

                Math.sin(
                    now *
                    .003
                ) *

                .025;


            monster.scale.set(

                1 -

                (
                    breathe -
                    1
                ) *
                .25,

                breathe,

                1

            );

        }


        /* =================================================
           MONSTER HIT
        ================================================= */

        if(
            monsterHitTimer >
            0
        ){


            monsterHitTimer -=
                dt;


            monster.position.x =

                Math.sin(
                    now *
                    .10
                ) *
                .17;


            if(
                monsterHitTimer <=
                0
            ){


                monster.position.x =
                    0;


                monsterMaterial.color.set(
                    0xffffff
                );

            }

        }


        /* =================================================
           MONSTER ATTACK

           움츠림
               ↓
           플레이어 쪽으로 돌진
               ↓
           데미지
               ↓
           원위치
        ================================================= */

        if(
            monsterAttackProgress >=
            0
        ){


            monsterAttackProgress +=

                dt *
                2.25;


            const t =
                monsterAttackProgress;


            /*
               살짝 뒤로
            */

            if(
                t <
                .22
            ){


                const p =

                    t /
                    .22;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterOriginalZ,

                        monsterOriginalZ -
                        .75,

                        p

                    );

            }


            /*
               앞으로 돌진
            */

            else if(
                t <
                .52
            ){


                const p =

                    (
                        t -
                        .22
                    ) /

                    .30;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterOriginalZ -
                        .75,

                        monsterOriginalZ +
                        3.6,

                        p

                    );


                monster.scale.setScalar(

                    1 +

                    p *
                    .13

                );

            }


            /*
               HIT
            */

            else if(
                t <
                .62
            ){


                if(
                    !monsterAttackHit
                ){


                    monsterAttackHit =
                        true;


                    damagePlayer();

                }

            }


            /*
               돌아감
            */

            else if(
                t <
                1
            ){


                const p =

                    (
                        t -
                        .62
                    ) /

                    .38;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterOriginalZ +
                        3.6,

                        monsterOriginalZ,

                        p

                    );


                const s =

                    THREE.MathUtils.lerp(

                        1.13,

                        1,

                        p

                    );


                monster.scale.setScalar(
                    s
                );

            }


            else{


                monster.position.z =
                    monsterOriginalZ;


                monster.scale.set(
                    1,
                    1,
                    1
                );


                monsterAttackProgress =
                    -1;


                monsterAttackHit =
                    false;

            }

        }


        /* =================================================
           MONSTER DEAD
        ================================================= */

        if(
            monsterDead
        ){


            monster.rotation.z +=

                dt *
                1.7;


            monster.position.y -=

                dt *
                .9;


            monster.scale.multiplyScalar(

                Math.max(

                    .965,

                    1 -
                    dt *
                    .65

                )

            );


            monsterShadow.material.opacity =

                Math.max(

                    0,

                    monsterShadow.material.opacity -

                    dt *
                    .8

                );

        }


        /* =================================================
           CAMERA SHAKE
        ================================================= */

        if(
            cameraShake >
            0
        ){


            cameraShake -=
                dt;


            camera.rotation.z =

                (
                    Math.random() -
                    .5
                ) *
                .032;


            camera.rotation.x =

                (
                    Math.random() -
                    .5
                ) *
                .023;

        }

        else{


            camera.rotation.z *=
                .72;


            camera.rotation.x *=
                .72;

        }

    }


    renderer.render(

        scene,

        camera

    );

}


/* =====================================================
   RESIZE
===================================================== */

function onResize(){


    if(
        !camera ||
        !renderer
    ){

        return;
    }


    camera.aspect =

        window.innerWidth /

        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =====================================================
   INITIAL HUD
===================================================== */

updateHP();

</script>
