<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>PIXEL ADVENTURE - 2.5D NFC BATTLE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:'Segoe UI',Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center}

#game{
  position:relative;width:min(100vw,520px);height:100vh;max-height:1000px;
  overflow:hidden;background:#000;color:white;touch-action:manipulation;
}

/* 2.5D Scene Container */
#scene{
  position:absolute;inset:0;overflow:hidden;background:#050508;
  perspective:1000px;
}

/* 배경 캔버스 / 레이어 */
#bgContainer{
  position:absolute;inset:-10%;width:120%;height:120%;
  transform-origin:center center;
  transition:transform 0.1s ease-out;
}
#bg{
  width:100%;height:100%;object-fit:cover;
  image-rendering:pixelated;
  filter:brightness(0.8) contrast(1.1);
}

/* 몬스터 2.5D 레이어 */
#monsterContainer{
  position:absolute;
  left:50%;top:42%;
  width:220px;height:220px;
  transform:translate(-50%, -50%) scale(0.2);
  transform-origin:center bottom;
  z-index:10;
  transition:transform 0.05s linear;
  pointer-events:none;
}
#monsterImg{
  width:100%;height:100%;
  object-fit:contain;
  image-rendering:pixelated;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,0.8));
}

/* 몬스터 피격 효과 */
#monsterContainer.hit #monsterImg{
  animation:monsterHitAnim 0.3s ease-out;
}
@keyframes monsterHitAnim{
  0%{ filter:brightness(4) sepia(1) hue-rotate(-50deg) saturate(5); transform:scale(1.1) translateY(-10px); }
  25%{ transform:translateX(-12px) rotate(-5deg); }
  50%{ transform:translateX(12px) rotate(5deg); }
  75%{ transform:translateX(-6px); }
  100%{ filter:drop-shadow(0 10px 20px rgba(0,0,0,0.8)); transform:scale(1) translateY(0); }
}

/* UI - HP Bars */
#hpBox{
  position:absolute;top:16px;left:6%;width:88%;z-index:30;text-align:center;
  text-shadow:0 2px 4px #000;
}
#monsterName{font-weight:900;font-size:15px;letter-spacing:2px;color:#ff4a4a;margin-bottom:4px}
.bar{height:16px;border:2px solid #fff;background:rgba(20,5,5,0.8);border-radius:6px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.7);position:relative}
#monsterHp{height:100%;width:100%;background:linear-gradient(90deg,#ff3b3b,#990000);transition:width 0.2s ease-out}
#monsterHp.flash,#playerHp.flash{animation:hpFlash 0.25s infinite alternate}
@keyframes hpFlash{ from{filter:brightness(1)} to{filter:brightness(2.5)} }

#playerHpBox{
  position:absolute;left:6%;bottom:20px;width:88%;z-index:30;
  text-shadow:0 2px 4px #000;
}
#playerLabel{font-size:13px;font-weight:bold;color:#51f578;margin-bottom:4px;display:flex;justify-content:space-between}
#playerHpBar{height:14px;border:2px solid #fff;background:rgba(5,20,10,0.8);border-radius:6px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.7)}
#playerHp{height:100%;width:100%;background:linear-gradient(90deg,#42f56c,#0b8027);transition:width 0.2s ease-out}

/* 1인칭 검 (Sword) */
#swordWrapper{
  position:absolute;z-index:25;left:50%;bottom:-8%;width:260px;height:380px;
  transform:translateX(-20%) rotate(-10deg);
  transform-origin:70% 90%;
  pointer-events:none;
}
#sword{
  position:relative;width:100%;height:100%;
}
#sword .blade{
  position:absolute;left:44%;top:0;width:12%;height:70%;
  background:linear-gradient(90deg,#ffffff 0%,#e1f5fe 40%,#90caf9 70%,#ffffff 100%);
  clip-path:polygon(50% 0%, 100% 8%, 85% 90%, 50% 100%, 15% 90%, 0% 8%);
  filter:drop-shadow(0 0 8px rgba(144,202,249,0.8));
}
#sword .guard{
  position:absolute;left:20%;top:66%;width:60%;height:6%;border-radius:4px;
  background:linear-gradient(90deg,#ffd700,#b8860b,#ffd700);box-shadow:0 3px 6px rgba(0,0,0,0.6);
}
#sword .handle{
  position:absolute;left:41%;top:71%;width:18%;height:22%;border-radius:4px;
  background:linear-gradient(90deg,#4a2c11,#8b5a2b,#4a2c11);
}

/* 검 애니메이션 */
.walking #swordWrapper{ animation:swordWalk 0.6s infinite alternate ease-in-out; }
@keyframes swordWalk{
  0%{ transform:translateX(-30%) translateY(0px) rotate(-14deg); }
  100%{ transform:translateX(-10%) translateY(-12px) rotate(-4deg); }
}

.slashing #swordWrapper{ animation:swordSlash 0.22s ease-out forwards; }
@keyframes swordSlash{
  0%{ transform:translateX(-20%) rotate(-10deg) scale(1); }
  30%{ transform:translateX(-80%) translateY(-30px) rotate(-65deg) scale(1.15); }
  100%{ transform:translateX(30%) translateY(20px) rotate(45deg) scale(1.1); }
}

/* 검 휘두름 잔상 / 궤적 효과 */
#slashEffect{
  position:absolute;inset:0;z-index:22;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8) 0%, rgba(0,229,255,0.4) 40%, transparent 70%);
}
#slashEffect.active{ animation:slashFx 0.2s ease-out; }
@keyframes slashFx{
  0%{ opacity:1; transform:scale(0.5) rotate(-20deg); }
  100%{ opacity:0; transform:scale(1.4) rotate(20deg); }
}

/* 화면 전체 쉐이크 & 피격 플래시 */
.shake-heavy{ animation:screenShakeHeavy 0.35s ease-out !important; }
@keyframes screenShakeHeavy{
  0%,100%{ transform:translate(0,0) rotate(0deg); }
  15%{ transform:translate(-18px, 12px) rotate(-2deg); }
  30%{ transform:translate(18px, -15px) rotate(2deg); }
  45%{ transform:translate(-12px, -8px) rotate(-1deg); }
  60%{ transform:translate(10px, 10px) rotate(1deg); }
  75%{ transform:translate(-5px, 4px); }
}

.shake-light{ animation:screenShakeLight 0.2s ease-out !important; }
@keyframes screenShakeLight{
  0%,100%{ transform:translate(0,0); }
  25%{ transform:translate(-6px, 4px); }
  75%{ transform:translate(6px, -4px); }
}

#flash{position:absolute;inset:0;z-index:35;background:#fff;opacity:0;pointer-events:none}
#flash.red{background:#ff0000}
#flash.on{animation:flashAnim 0.15s ease-out}
@keyframes flashAnim{ 0%{opacity:0.7} 100%{opacity:0} }

/* UI 메시지 */
#nfcStatus{
  position:absolute;z-index:45;top:48px;right:12px;padding:6px 12px;border-radius:20px;
  background:rgba(0,0,0,0.65);font-size:11px;border:1px solid rgba(255,255,255,0.25);
  display:flex;align-items:center;backdrop-filter:blur(4px);
}
#nfcDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffcc00;margin-right:6px;box-shadow:0 0 8px #ffcc00}
#nfcDot.active{background:#00ff66;box-shadow:0 0 8px #00ff66}

#message{
  position:absolute;z-index:50;left:50%;top:45%;transform:translate(-50%,-50%);
  width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity 0.3s ease;
}
#message.show{opacity:1}
#message .big{
  font-size:36px;font-weight:900;letter-spacing:2px;color:#ffe600;
  text-shadow:0 0 15px rgba(255,230,0,0.6), 0 4px 8px #000;
}
#message .small{margin-top:10px;font-size:16px;color:#fff;text-shadow:0 2px 4px #000}

/* 시작 오버레이 */
#startOverlay{
  position:absolute;inset:0;z-index:100;background:rgba(5,7,11,0.92);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  backdrop-filter:blur(8px);
}
#startOverlay.hidden{display:none}
.panel{max-width:360px;width:100%}
.panel h1{font-size:26px;margin:0 0 14px;color:#ffe600;letter-spacing:1px;text-shadow:0 0 10px rgba(255,230,0,0.4)}
.panel p{font-size:14px;line-height:1.6;color:#ccc;margin-bottom:24px}
#startBtn{
  width:100%;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:800;
  background:linear-gradient(180deg,#ffe066,#f5b800);color:#1f1600;
  box-shadow:0 6px 20px rgba(245,184,0,0.4), 0 4px 0 #9e7700;
  cursor:pointer;active:transform 2px;
}
</style>
</head>
<body>
<div id="game">
  <div id="scene">
    <div id="bgContainer">
      <img id="bg" alt="Game Background">
    </div>

    <div id="monsterContainer">
      <img id="monsterImg" alt="Monster">
    </div>

    <div id="slashEffect"></div>

    <div id="hpBox">
      <div id="monsterName">ANCIENT GOLEM</div>
      <div class="bar"><div id="monsterHp"></div></div>
    </div>

    <div id="swordWrapper" class="walking">
      <div id="sword">
        <div class="blade"></div>
        <div class="guard"></div>
        <div class="handle"></div>
      </div>
    </div>
  </div>

  <div id="playerHpBox">
    <div id="playerLabel"><span>PLAYER HP</span><span id="hpText">100 / 100</span></div>
    <div id="playerHpBar"><div id="playerHp"></div></div>
  </div>

  <div id="nfcStatus"><span id="nfcDot"></span><span id="nfcText">NFC 대기 중</span></div>
  
  <div id="flash"></div>

  <div id="message">
    <div class="big" id="messageBig"></div>
    <div class="small" id="messageSmall"></div>
  </div>

  <div id="startOverlay">
    <div class="panel">
      <h1>PIXEL ADVENTURE</h1>
      <p id="introText">몬스터를 향해 전진합니다.<br>NFC 태그를 대면 검을 휘둘러 공격합니다!</p>
      <button id="startBtn">모험 시작</button>
    </div>
  </div>
</div>
