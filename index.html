<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<title>PIXEL ADVENTURE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center}
#game{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:#000;color:#fff;touch-action:manipulation}
#world{position:absolute;inset:0;overflow:hidden;background:#000}
#bg{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;image-rendering:pixelated;transform:scale(1);will-change:transform}
#bgGlow{position:absolute;inset:0;background:radial-gradient(circle at 55% 35%,rgba(255,240,180,.10),transparent 45%),linear-gradient(to bottom,rgba(0,0,0,.02),rgba(0,0,0,.12));pointer-events:none}
#farParallax{position:absolute;left:-8%;right:-8%;top:25%;height:45%;background:linear-gradient(to bottom,transparent 0%,rgba(255,255,255,.02) 25%,transparent 100%);will-change:transform;pointer-events:none}
#foreground{position:absolute;left:-10%;right:-10%;bottom:-12%;height:37%;background:linear-gradient(to top,rgba(20,28,8,.58),rgba(40,65,18,.12) 55%,transparent 100%);filter:blur(1px);transform:translateY(0);will-change:transform;pointer-events:none}
#sceneText{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);z-index:9;font-weight:900;font-size:18px;letter-spacing:1px;text-shadow:0 3px 7px #000;opacity:0;transition:opacity .2s;white-space:nowrap}
#sceneText.show{opacity:1}
/* real 2.5D enemy layer */
#enemyLayer{position:absolute;left:50%;top:3%;width:86%;height:49%;transform:translateX(-50%) scale(.36);transform-origin:50% 78%;z-index:8;will-change:transform,filter,opacity;pointer-events:none}
#enemyImg{position:absolute;left:50%;top:0;width:100%;height:100%;object-fit:contain;object-position:center top;image-rendering:pixelated;transform:translateX(-50%);filter:drop-shadow(0 20px 10px rgba(0,0,0,.28));will-change:transform,filter}
#enemyAura{position:absolute;left:50%;top:42%;width:58%;height:42%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,60,35,.14),transparent 70%);filter:blur(10px);opacity:.7}
#enemyHitOverlay{position:absolute;inset:12%;background:#ff1f24;opacity:0;mix-blend-mode:screen;clip-path:polygon(0 10%,20% 0,40% 8%,65% 0,100% 18%,94% 48%,100% 78%,75% 100%,48% 93%,20% 100%,3% 72%,0 45%);}
#enemyLayer.hit #enemyHitOverlay{animation:enemyHitFlash .24s ease-out}
#enemyLayer.hit #enemyImg{animation:enemyHitMove .28s ease-out}
#enemyLayer.dead #enemyImg{animation:enemyDeath .85s ease forwards}
@keyframes enemyHitFlash{0%{opacity:0}22%{opacity:.85}100%{opacity:0}}
@keyframes enemyHitMove{0%{transform:translateX(-50%) scale(1)}25%{transform:translateX(calc(-50% - 10px)) scale(1.03)}55%{transform:translateX(calc(-50% + 11px)) scale(.99)}100%{transform:translateX(-50%) scale(1)}}
@keyframes enemyApproach{0%{transform:translateX(-50%) scale(.34)}75%{transform:translateX(-50%) scale(.72)}100%{transform:translateX(-50%) scale(.98)}}
@keyframes enemyDeath{0%{transform:translateX(-50%) scale(1);filter:brightness(1)}40%{transform:translateX(-50%) scale(1.06);filter:brightness(2.2) saturate(1.6)}100%{transform:translate(-50%,35%) scale(.38) rotate(12deg);opacity:0;filter:brightness(2.8)}}
/* UI */
#topUI{position:absolute;left:5%;right:5%;top:10px;z-index:40;display:flex;gap:10px;align-items:flex-start}
.card{flex:1;background:rgba(0,0,0,.46);border:1px solid rgba(255,255,255,.22);box-shadow:0 3px 10px rgba(0,0,0,.3);border-radius:10px;padding:7px 9px;backdrop-filter:blur(2px)}
.label{font-size:11px;font-weight:800;letter-spacing:.4px;text-shadow:0 2px 3px #000;display:flex;justify-content:space-between}
.bar{height:12px;margin-top:4px;background:#240c0d;border:1px solid #fff;border-radius:4px;overflow:hidden;position:relative}
.fill{height:100%;width:100%;transition:width .18s linear}
#enemyHPFill{background:linear-gradient(#ff8a8a,#c51717)}
#playerHPFill{background:linear-gradient(#8cf08c,#18a23d)}
.bar.blink .fill{animation:hpBlink .32s linear 2}
@keyframes hpBlink{0%,100%{opacity:1}50%{opacity:.05}}
#nfcStatus{position:absolute;top:78px;right:10px;z-index:40;padding:6px 9px;border-radius:10px;background:rgba(0,0,0,.54);border:1px solid rgba(255,255,255,.25);font-size:10px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#nfcDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffd84d;margin-right:5px}
/* sword */
#sword{position:absolute;left:50%;bottom:-12%;width:31%;height:68%;z-index:30;transform:translateX(-50%) rotate(-20deg);transform-origin:65% 90%;pointer-events:none;will-change:transform,filter}
#sBlade{position:absolute;left:42%;top:0;width:17%;height:74%;clip-path:polygon(50% 0,100% 10%,100% 87%,50% 100%,0 87%,0 10%);background:linear-gradient(90deg,#fff 0%,#eefbff 37%,#b5d3de 58%,#fff 79%,#9fb8c1 100%);filter:drop-shadow(0 0 7px rgba(255,255,255,.9))}
#sGuard{position:absolute;left:11%;top:68%;width:78%;height:8%;border-radius:50%;background:linear-gradient(#f3c45e,#a86d20);box-shadow:0 3px 0 #6a3d14}
#sHandle{position:absolute;left:35%;top:72%;width:31%;height:22%;border-radius:8px 8px 18px 18px;background:linear-gradient(90deg,#5b351a,#d19a4b,#5b351a);transform:rotate(-6deg)}
#sPommel{position:absolute;left:28%;bottom:1%;width:45%;height:9%;border-radius:50%;background:#d7a24f;box-shadow:0 2px 0 #704113}
#slash{position:absolute;left:12%;top:4%;width:78%;height:72%;z-index:29;opacity:0;pointer-events:none;transform:rotate(-14deg)}
#slash::before,#slash::after{content:"";position:absolute;left:8%;right:3%;top:40%;height:12%;border-radius:999px;background:linear-gradient(90deg,transparent,#fff,#dff8ff,transparent);filter:blur(2px);transform:rotate(-19deg)}
#slash::after{top:53%;height:7%;opacity:.65;filter:blur(4px)}
.attack #sword{animation:swordSlash .32s cubic-bezier(.18,.8,.22,1) both;filter:brightness(1.25)}
.attack #slash{animation:slashFX .3s ease-out both}
@keyframes swordSlash{0%{transform:translateX(-50%) rotate(-24deg) translateY(0)}28%{transform:translateX(-50%) rotate(42deg) translateY(-4%) scale(1.08)}58%{transform:translateX(-50%) rotate(58deg) translateY(-8%) scale(1.13)}100%{transform:translateX(-50%) rotate(-18deg) translateY(0) scale(1)}}
@keyframes slashFX{0%{opacity:0;transform:translateX(-15%) scale(.6) rotate(-35deg)}28%{opacity:1;transform:translateX(2%) scale(1) rotate(-18deg)}100%{opacity:0;transform:translateX(25%) scale(1.12) rotate(-5deg)}}
.walk #sword{animation:swordWalk .7s ease-in-out infinite alternate}
@keyframes swordWalk{from{transform:translateX(-50%) rotate(-25deg) translateY(4px)}to{transform:translateX(-50%) rotate(14deg) translateY(-2px)}}
/* feedback */
#damageVignette{position:absolute;inset:0;z-index:34;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 25%,rgba(255,0,0,.18) 55%,rgba(255,0,0,.48) 100%)}
#damageVignette.on{animation:redVignette .34s ease-out}
#whiteHit{position:absolute;inset:0;z-index:35;pointer-events:none;opacity:0;background:#fff}
#whiteHit.on{animation:whiteHit .11s linear}
@keyframes redVignette{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@keyframes whiteHit{0%{opacity:.5}100%{opacity:0}}
#game.shake{animation:screenShake .34s cubic-bezier(.36,.07,.19,.97) both}
#game.bigShake{animation:bigShake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes screenShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,3px)}30%{transform:translate(6px,-4px)}45%{transform:translate(-5px,4px)}60%{transform:translate(4px,-3px)}75%{transform:translate(-2px,2px)}}
@keyframes bigShake{0%,100%{transform:translate(0,0)}10%{transform:translate(-11px,6px)}25%{transform:translate(10px,-7px)}40%{transform:translate(-9px,7px)}55%{transform:translate(7px,-5px)}70%{transform:translate(-5px,3px)}85%{transform:translate(3px,-2px)}}
/* Messages */
#centerMsg{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);z-index:50;width:90%;text-align:center;opacity:0;pointer-events:none}
#centerMsg.show{opacity:1}
#bigMsg{font-size:30px;font-weight:1000;text-shadow:0 4px 8px #000;letter-spacing:1px}
#smallMsg{margin-top:8px;font-size:14px;font-weight:800;text-shadow:0 2px 4px #000}
#damageNumber{position:absolute;z-index:52;left:62%;top:43%;font-size:34px;font-weight:1000;color:#fff;text-shadow:0 3px 6px #000,0 0 8px #ff2e2e;opacity:0;pointer-events:none}
#damageNumber.show{animation:damageNum .6s ease-out}
@keyframes damageNum{0%{opacity:0;transform:translate(0,10px) scale(.6)}15%{opacity:1;transform:translate(0,0) scale(1.2)}100%{opacity:0;transform:translate(10px,-35px) scale(.95)}}
#overlay{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}
#overlay.hidden{display:none}
.panel{max-width:380px}
.panel h1{font-size:28px;margin:0 0 12px;text-shadow:0 3px 7px #000}
.panel p{font-size:14px;line-height:1.6;color:#ddd}
#startBtn{border:0;border-radius:12px;padding:14px 30px;font-size:17px;font-weight:900;background:#f5d46a;color:#2c2208;box-shadow:0 4px 0 #8c6d21}
#toast{position:absolute;left:50%;bottom:83px;z-index:80;transform:translateX(-50%) translateY(15px);opacity:0;background:rgba(0,0,0,.82);border:1px solid #aaa;padding:8px 12px;border-radius:10px;font-size:12px;transition:.18s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="game">
  <div id="world">
    <img id="bg" alt="">
    <div id="bgGlow"></div><div id="farParallax"></div><div id="foreground"></div>
    <div id="enemyLayer"><div id="enemyAura"></div><img id="enemyImg" alt="enemy"><div id="enemyHitOverlay"></div></div>
    <div id="sceneText"></div>
    <div id="sword"><div id="sBlade"></div><div id="sGuard"></div><div id="sHandle"></div><div id="sPommel"></div></div>
    <div id="slash"></div>
  </div>
  <div id="topUI">
    <div class="card"><div class="label"><span>PLAYER HP</span><span id="playerTxt">100 / 100</span></div><div id="playerBar" class="bar"><div id="playerHPFill" class="fill"></div></div></div>
    <div class="card"><div class="label"><span>MONSTER HP</span><span id="enemyTxt">80 / 80</span></div><div id="enemyBar" class="bar"><div id="enemyHPFill" class="fill"></div></div></div>
  </div>
  <div id="nfcStatus"><span id="nfcDot"></span><span id="nfcText">NFC 준비 중</span></div>
  <div id="damageVignette"></div><div id="whiteHit"></div><div id="damageNumber">-16</div>
  <div id="centerMsg"><div id="bigMsg"></div><div id="smallMsg"></div></div>
  <div id="toast"></div>
  <div id="overlay">
    <div class="panel">
      <h1>PIXEL ADVENTURE</h1>
      <p id="intro">게임 시작을 누르면 NFC 대기가 시작됩니다.<br>몬스터에게 전진한 뒤 NFC 태그를 대면 검이 공격합니다.</p>
      <button id="startBtn">게임 시작</button>
    </div>
  </div>
</div>

const game=document.getElementById('game'), world=document.getElementById('world'), bg=document.getElementById('bg'), enemy=document.getElementById('enemyLayer'), sword=document.getElementById('sword');
const enemyBar=document.getElementById('enemyBar'), playerBar=document.getElementById('playerBar'), enemyFill=document.getElementById('enemyHPFill'), playerFill=document.getElementById('playerHPFill');
const enemyTxt=document.getElementById('enemyTxt'), playerTxt=document.getElementById('playerTxt'), nfcText=document.getElementById('nfcText'), nfcDot=document.getElementById('nfcDot');
const overlay=document.getElementById('overlay'), centerMsg=document.getElementById('centerMsg'), bigMsg=document.getElementById('bigMsg'), smallMsg=document.getElementById('smallMsg'), toast=document.getElementById('toast'), damageVignette=document.getElementById('damageVignette'), whiteHit=document.getElementById('whiteHit'), damageNumber=document.getElementById('damageNumber');
let gameStarted=false,battle=false,dead=false,nfcRunning=false,lastTag=0,enemyTimer=null,enemyHP=80,playerHP=100;
function vibrate(p){if(navigator.vibrate)navigator.vibrate(p)}
function status(t,c){nfcText.textContent=t;nfcDot.style.background=c==='on'?'#59ee76':c==='bad'?'#ff4b4b':'#ffd84d'}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1500)}
function shake(big=false){game.classList.remove('shake','bigShake');void game.offsetWidth;game.classList.add(big?'bigShake':'shake')}
function flashDamage(enemyHit=false){whiteHit.classList.remove('on');damageVignette.classList.remove('on');void whiteHit.offsetWidth;void damageVignette.offsetWidth;whiteHit.classList.add('on');damageVignette.classList.add('on');if(enemyHit){enemy.classList.remove('hit');void enemy.offsetWidth;enemy.classList.add('hit');setTimeout(()=>enemy.classList.remove('hit'),300)}}
function hpBlink(bar){bar.classList.remove('blink');void bar.offsetWidth;bar.classList.add('blink');setTimeout(()=>bar.classList.remove('blink'),700)}
function setPlayerHP(v){playerHP=Math.max(0,v);playerFill.style.width=playerHP+'%';playerTxt.textContent=playerHP+' / 100';hpBlink(playerBar)}
function setEnemyHP(v){enemyHP=Math.max(0,v);enemyFill.style.width=(enemyHP/80*100)+'%';enemyTxt.textContent=enemyHP+' / 80';hpBlink(enemyBar)}
function showDamage(n){damageNumber.textContent='-'+n;damageNumber.classList.remove('show');void damageNumber.offsetWidth;damageNumber.classList.add('show')}
function attack(){if(!battle||dead)return;sword.classList.remove('attack');void sword.offsetWidth;sword.classList.add('attack');enemy.style.filter='brightness(1.2)';setTimeout(()=>enemy.style.filter='',220);setEnemyHP(enemyHP-16);showDamage(16);flashDamage(true);shake(true);vibrate([260,70,260,70,180]);if(enemyHP<=0){dead=true;clearInterval(enemyTimer);enemy.classList.add('dead');setTimeout(()=>{centerMsg.classList.add('show');bigMsg.textContent='MISSION CLEAR!';smallMsg.textContent='몬스터가 쓰러졌습니다!'},650)}}
function enemyAttack(){if(!battle||dead)return;setPlayerHP(playerHP-4);flashDamage(false);shake(false);vibrate([120,50,120]);if(playerHP<=0){dead=true;clearInterval(enemyTimer);centerMsg.classList.add('show');bigMsg.textContent='YOU DIED';smallMsg.textContent='새로고침하면 다시 시작할 수 있습니다.'}}
function startBattle(){if(battle)return;battle=true;world.classList.add('battle');enemy.style.transform='translateX(-50%) scale(1)';toastMsg('몬스터가 공격하기 시작했습니다!');enemyTimer=setInterval(enemyAttack,1500)}
function startApproach(){world.classList.add('approach');sword.classList.add('walk');setTimeout(()=>{sword.classList.remove('walk');startBattle()},7200)}
async function startNFC(){if(!window.isSecureContext){status('HTTPS 필요','bad');toastMsg('Netlify의 https:// 주소에서 실행해주세요.');return false}if(!('NDEFReader' in window)){status('NFC 미지원','bad');toastMsg('Android Chrome에서 Web NFC를 사용할 수 있습니다.');return false}try{const r=new NDEFReader();await r.scan();nfcRunning=true;status('NFC 대기 중','on');r.onreadingerror=()=>{status('NFC 읽기 오류','bad');setTimeout(()=>nfcRunning&&status('NFC 대기 중','on'),900)};r.onreading=()=>{const now=Date.now();if(now-lastTag<700)return;lastTag=now;if(gameStarted&&!dead)attack()};return true}catch(e){nfcRunning=false;status('NFC 시작 실패','bad');toastMsg('NFC를 켜고 다시 게임 시작을 눌러주세요.');return false}}
document.getElementById('startBtn').onclick=async()=>{if(!isChrome()&&/Android/i.test(navigator.userAgent)){if(confirm('Chrome에서 열어야 NFC가 작동합니다. Chrome으로 열까요?')){const u=location.href.replace(/^https?:\/\//,'');location.href='intent://'+u+'#Intent;scheme=https;package=com.android.chrome;end';return}}if(location.protocol!=='https:'&&location.hostname!=='localhost'){document.getElementById('intro').innerHTML='HTTPS 웹주소에서 실행해야 합니다.<br><br>Netlify 주소에서 다시 열어주세요.';return}const ok=await startNFC();overlay.classList.add('hidden');gameStarted=true;startApproach();if(!ok)toastMsg('NFC를 사용할 수 없지만 게임은 시작합니다.');};
function isChrome(){const ua=navigator.userAgent;return /Chrome|CriOS/i.test(ua)&&!/Edg|OPR|SamsungBrowser|KAKAOTALK/i.test(ua)}
</script>
