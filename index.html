<style>

/* =====================================================
   ★★★★★ 조절용 설정 ★★★★★
===================================================== */

:root{

    /*
       칼 크기
    */
    --sword-size:92vh;

    /*
       칼 오른쪽 위치
       더 음수 = 더 오른쪽
    */
    --sword-right:-18vh;

    /*
       칼 아래 위치
    */
    --sword-bottom:-17vh;

}


/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111d;
    font-family:Arial,sans-serif;
}

body{
    position:fixed;
    inset:0;
}

#game{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#07111d;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}


/* =====================================================
   ★ 칼 + 손 PNG
===================================================== */

#sword{
    position:absolute;

    z-index:40;

    right:
        var(--sword-right);

    bottom:
        var(--sword-bottom);

    width:auto;

    height:
        var(--sword-size);

    max-width:none;

    pointer-events:none;

    user-select:none;

    transform-origin:
        84% 91%;

    will-change:
        transform;

    filter:
        drop-shadow(
            0 10px 10px
            rgba(0,0,0,.32)
        );
}


/* =====================================================
   평상시 걸을 때 검 흔들림
===================================================== */

#sword.walking{

    animation:
        swordWalk
        .74s
        ease-in-out
        infinite
        alternate;
}


@keyframes swordWalk{

    from{

        transform:
            translateY(0)
            rotate(-3deg);

    }

    to{

        transform:
            translateY(-7px)
            rotate(2deg);

    }

}


/* =====================================================
   HUD
===================================================== */

#hud{
    position:absolute;

    z-index:60;

    top:14px;
    left:5%;
    right:5%;

    display:flex;

    gap:12px;

    color:white;

.unit{

}

.label{

}

.bar{

    height:15px;

        2px solid white;

    border-radius:6px;

    background:#180707;

.fill{

<script>

function isAndroid(){

    return(
        /Android/i.test(
            navigator.userAgent || ''
        )
    );

}


function isKakaoBrowser(){

    const ua =
        navigator.userAgent || '';

    return(
        /KAKAOTALK/i.test(ua) ||
        /KakaoTalk/i.test(ua)
    );

}


function isRealChrome(){

    const ua =
        navigator.userAgent || '';


    if(
        isKakaoBrowser()
    ){
        return false;
    }


    if(
        /SamsungBrowser/i.test(ua)
    ){
        return false;
    }


    if(
        /EdgA/i.test(ua)
    ){
        return false;
    }


    if(
        /OPR/i.test(ua)
    ){
        return false;
    }


    return(
        /Chrome/i.test(ua)
    );

}


/* =====================================================
   Chrome 열기
===================================================== */

function openChrome(){

    const current =
        window.location.href;


    const clean =
        current.replace(
            /^https?:\/\//i,
            ''
        );


    window.location.href =

        'intent://' +

        clean +

        '#Intent;' +

        'scheme=https;' +

        'package=com.android.chrome;' +

        'S.browser_fallback_url=' +

        encodeURIComponent(
            current
        ) +

        ';end';

}


window.addEventListener(
    'DOMContentLoaded',
    ()=>{

        if(
            isAndroid() &&
            !isRealChrome()
        ){

            document
                .getElementById(
                    'chromeGuide'
                )
                .classList
                .add('show');

        }

    }
);


document
    .getElementById(
        'chromeButton'
    )
    .addEventListener(
        'click',
        openChrome
    );

</script>

/* =====================================================
   GROUND TEXTURE
===================================================== */

function makeGroundTexture(){

    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        128;

    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            '2d'
        );


    ctx.imageSmoothingEnabled =
        false;


    const colors = [

        '#527637',

        '#668744',

        '#46692f',

        '#75944c',

        '#3c602a'

    ];


    for(
        let y = 0;
        y < 128;
        y += 8
    ){

        for(
            let x = 0;
            x < 128;
            x += 8
        ){

            ctx.fillStyle =

                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];


            ctx.fillRect(
                x,
                y,
                8,
                8
            );

        }

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.magFilter =
        THREE.NearestFilter;


    texture.minFilter =
        THREE.NearestFilter;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        12,
        35
    );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


/* =====================================================
   ROAD TEXTURE
===================================================== */

/* =====================================================

===================================================== */

function init3D(){

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(

        );


    scene.fog =

    );

    );

            new THREE.MeshLambertMaterial({

    */

    window.addEventListener(

    );

    );

}


/* =====================================================
   FOREST
===================================================== */

function createForest(){


    const trunkGeo =
        new THREE.CylinderGeometry(
            .23,
            .35,
            2.8,
            5
        );


    const trunkMat =
        new THREE.MeshLambertMaterial({

            color:
                0x49331f

        });


    const leavesGeo =
        new THREE.ConeGeometry(
            1.55,
            4.3,
            6
        );


    const leavesMat =
        new THREE.MeshLambertMaterial({

            color:
                0x315d2f

        });


    for(
        let z = 5;
        z > -180;
        z -= 4.8
    ){


        for(
            const side
            of [-1,1]
        ){


            const tree =
                new THREE.Group();


            const trunk =
                new THREE.Mesh(
                    trunkGeo,
                    trunkMat
                );


            trunk.position.y =
                1.4;


            tree.add(
                trunk
            );


            const leaves1 =
                new THREE.Mesh(
                    leavesGeo,
                    leavesMat
                );


            leaves1.position.y =
                3.9;


            tree.add(
                leaves1
            );


            const leaves2 =
                leaves1.clone();


            leaves2.scale.setScalar(
                .70
            );


            leaves2.position.y =
                5.15;


            tree.add(
                leaves2
            );


            tree.position.set(

                side *
                (
                    5 +
                    Math.random() *
                    7
                ),

                0,

                z +
                Math.random() *
                2

            );


            const scale =

                .65 +

                Math.random() *
                .65;


            tree.scale.setScalar(
                scale
            );


            scene.add(
                tree
            );

        }

    }

}


/* =====================================================
   ROCKS
===================================================== */

function createRocks(){


    const geo =
        new THREE.DodecahedronGeometry(
            .45,
            0
        );


    const mat =
        new THREE.MeshLambertMaterial({

            color:
                0x62675d

        });


    for(
        let i = 0;
        i < 70;
        i++
    ){


        const rock =
            new THREE.Mesh(
                geo,
                mat
            );


        let x =

            4 +

            Math.random() *
            10;


        if(
            Math.random() <
            .5
        ){

            x *= -1;

        }


        rock.position.set(

            x,

            .25,

            5 -
            Math.random() *
            180

        );


        const scale =

            .35 +

            Math.random() *
            .85;


        rock.scale.set(

            scale,

            scale *
            .6,

            scale

        );


        scene.add(
            rock
        );

    }

}


/* =====================================================
   MONSTER SPAWN
===================================================== */

    if(

        scene.remove(

    if(

    currentMonsterIndex =
        index;


    currentMonsterHP =
        CONFIG.MONSTER_HP;


    monsterDead =
        false;


    battle =
        false;


    deathProgress =
        -1;


    const imageURL =
        MONSTER_IMAGES[
            index
        ];


    let texture;


    if(
        imageURL &&
        !imageURL.startsWith(
            'MONSTER_'
        )
    ){


        texture =

            new THREE
            .TextureLoader()
            .load(
                imageURL
            );


        texture.colorSpace =
            THREE.SRGBColorSpace;


        texture.magFilter =
            THREE.NearestFilter;


        texture.minFilter =
            THREE.LinearFilter;

    }

    else{


        texture =
            createTemporaryMonster(
                index
            );

    }


    monsterMaterial =
        new THREE.MeshBasicMaterial({

            map:
                texture,

            transparent:true,

            alphaTest:.05,

            side:
                THREE.DoubleSide

        });


    monster =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                5,
                5
            ),

            monsterMaterial

        );


    monster.position.set(

        0,

        2.5,

        CONFIG.MONSTER_POSITIONS[
            index
        ]

    );


    monsterHomeZ =

        CONFIG.MONSTER_POSITIONS[
            index
        ];


    scene.add(
        monster
    );


    monsterShadow =
        new THREE.Mesh(

            new THREE.CircleGeometry(
                1.5,
                18
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x000000,

                transparent:true,

                opacity:.27,

                depthWrite:false

            })

        );


    monsterShadow.rotation.x =
        -Math.PI / 2;


    monsterShadow.position.set(

        0,

        .025,

        monsterHomeZ

    );


    scene.add(
        monsterShadow
    );


    updateHP();

    updateCounter();

}


/* =====================================================
   TEMP MONSTER
===================================================== */

function createTemporaryMonster(
    index
){


    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        128;

    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            '2d'
        );


    ctx.imageSmoothingEnabled =
        false;


    ctx.clearRect(
        0,
        0,
        128,
        128
    );


    const colors = [

        '#516c3e',

        '#285b74',

        '#8a3428'

    ];


    ctx.fillStyle =
        colors[index];


    ctx.fillRect(
        35,
        40,
        58,
        55
    );


    ctx.fillRect(
        26,
        53,
        14,
        35
    );


    ctx.fillRect(
        88,
        53,
        14,
        35
    );


    ctx.fillRect(
        41,
        88,
        16,
        25
    );


    ctx.fillRect(
        71,
        88,
        16,
        25
    );


    ctx.fillRect(
        40,
        20,
        48,
        38
    );


    ctx.fillStyle =
        '#e7ff89';


    ctx.fillRect(
        49,
        32,
        8,
        8
    );


    ctx.fillRect(
        72,
        32,
        8,
        8
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.magFilter =
        THREE.NearestFilter;


    texture.minFilter =
        THREE.NearestFilter;


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


/* =====================================================
   HP
===================================================== */

function updateHP(){


    $('playerHP').style.width =
        playerHP +
        '%';


    $('enemyHP').style.width =
        currentMonsterHP +
        '%';


    $('playerText').textContent =

        playerHP +
        ' / 100';


    $('enemyText').textContent =

        currentMonsterHP +
        ' / 100';

}


/* =====================================================
   COUNTER
===================================================== */

function updateCounter(){


    $('monsterCount').textContent =

        '☠ ' +

        (
            currentMonsterIndex +
            1
        ) +

        ' / 3';

}


/* =====================================================
   ★★★★★★★★★★★★★★★★★★★★★

   새로운 큰 칼 휘두르기

   330ms

   1. 살짝 뒤로 당김
   2. 화면 중앙까지 크게 베기
   3. 타격점을 지나감
   4. 빠르게 원위치

   ★★★★★★★★★★★★★★★★★★★★★
===================================================== */

function attack(){


    if(
        !started ||
        swordAttacking
    ){

        return;

    }


    swordAttacking =
        true;


    /*
       평상시 흔들림을 잠깐 중지
    */

    sword.classList.remove(
        'walking'
    );


    if(
        swordAnimation
    ){

        swordAnimation.cancel();

    }


    const horizontal =

        swordAttackType ===
        0;


    /*
       다음 NFC에서는
       반대 공격
    */

    swordAttackType =

        swordAttackType === 0
        ? 1
        : 0;


    let frames;


    /* =================================================
       ★ 1번 공격
       좌 → 중앙으로 크게 옆베기
    ================================================= */

    if(
        horizontal
    ){


        frames = [


            /*
               평상시
            */

            {

                offset:0,

                transform:
                    'translate(0px,0px) rotate(-3deg) scale(1)'

            },


            /*
               ★ 살짝 뒤로 당김

               공격 준비 동작이 눈에 보이게 함.
            */

            {

                offset:.14,

                transform:
                    'translate(38px,18px) rotate(-18deg) scale(.98)'

            },


            /*
               ★ 빠르게 앞으로 들어오기 시작
            */

            {

                offset:.32,

                transform:
                    'translate(-35px,-35px) rotate(7deg) scale(1.03)'

            },


            /*
               ★★★★★

               화면 중앙까지 크게 베기

               기존 -115px보다
               훨씬 크게 움직임.

               ★★★★★
            */

            {

                offset:.53,

                transform:
                    'translate(-205px,-145px) rotate(67deg) scale(1.12)'

            },


            /*
               타격 후 약간 더 지나감

               검이 타격점에서 바로
               순간이동하지 않게 만듦.
            */

            {

                offset:.67,

                transform:
                    'translate(-155px,-105px) rotate(51deg) scale(1.09)'

            },


            /*
               복귀 시작
            */

            {

                offset:.82,

                transform:
                    'translate(-45px,-25px) rotate(13deg) scale(1.03)'

            },


            /*
               원위치
            */

            {

                offset:1,

                transform:
                    'translate(0px,0px) rotate(-3deg) scale(1)'

            }

        ];

    }


    /* =================================================
       ★ 2번 공격
       위 → 아래 크게 내려베기
    ================================================= */

    else{


        frames = [


            /*
               평상시
            */

            {

                offset:0,

                transform:
                    'translate(0px,0px) rotate(-3deg) scale(1)'

            },


            /*
               ★ 칼을 위쪽/뒤쪽으로 들어 올림
            */

            {

                offset:.16,

                transform:
                    'translate(45px,-125px) rotate(-48deg) scale(.98)'

            },


            /*
               내려치기 시작
            */

            {

                offset:.34,

                transform:
                    'translate(-30px,-150px) rotate(-28deg) scale(1.03)'

            },


            /*
               ★★★★★

               화면 중앙으로 크게 내려베기

               ★★★★★
            */

            {

                offset:.55,

                transform:
                    'translate(-175px,45px) rotate(34deg) scale(1.13)'

            },


            /*
               타격점을 지나서 조금 더 내려감
            */

            {

                offset:.68,

                transform:
                    'translate(-135px,80px) rotate(24deg) scale(1.09)'

            },


            /*
               복귀
            */

            {

                offset:.83,

                transform:
                    'translate(-40px,20px) rotate(5deg) scale(1.03)'

            },


            /*
               원위치
            */

            {

                offset:1,

                transform:
                    'translate(0px,0px) rotate(-3deg) scale(1)'

            }

        ];

    }


    swordAnimation =

        sword.animate(

            frames,

            {

                duration:
                    CONFIG.SWORD_SPEED,

                easing:
                    'cubic-bezier(.16,.74,.22,1)',

                fill:'none'

            }

        );


    /* =================================================
       ★ 실제 몬스터 타격

       검이 화면 중앙에 들어오는
       약 53% 지점에서 타격.
    ================================================= */

    setTimeout(

        ()=>{

            damageMonster();

        },

        CONFIG.SWORD_SPEED *
        .53

    );


    /* =================================================
       공격 종료
    ================================================= */

    swordAnimation.onfinish =

        ()=>{


            swordAttacking =
                false;


            /*
               다시 걸을 때
               칼 흔들림 복구
            */

            sword.classList.add(
                'walking'
            );

        };

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function damageMonster(){


    if(
        !battle ||
        monsterDead
    ){

        return;

    }


    currentMonsterHP =

        Math.max(

            0,

            currentMonsterHP -
            CONFIG.PLAYER_DAMAGE

        );


    updateHP();


    /*
       적이 실제로 맞을 때만
       강한 진동
    */

    if(
        navigator.vibrate
    ){

        navigator.vibrate(

            [
                120,
                25,
                110
            ]

        );

    }


    monsterMaterial.color.set(
        0xff4040
    );


    monsterHitTimer =
        .22;


    cameraShake =
        .22;


    showDamage();


    if(
        currentMonsterHP <=
        0
    ){

        killMonster();

    }

}


/* =====================================================
   DAMAGE NUMBER
===================================================== */

function showDamage(){


    $('damageNumber').animate(

        [

            {

                opacity:0,

                transform:
                    'translate(-50%,15px) scale(.6)'

            },

            {

                opacity:1,

                transform:
                    'translate(-50%,0) scale(1.35)'

            },

            {

                opacity:0,

                transform:
                    'translate(-50%,-55px) scale(1)'

            }

        ],

        {

            duration:420,

            easing:'ease-out'

        }

    );

}


/* =====================================================
   MONSTER KILLED
===================================================== */

function killMonster(){


    monsterDead =
        true;


    battle =
        false;


    deathProgress =
        0;


    clearInterval(
        monsterAttackTimer
    );


    monsterAttackProgress =
        -1;

}


/* =====================================================
   NEXT MONSTER
===================================================== */

function nextMonster(){


    const next =

        currentMonsterIndex +
        1;


    /*
       세 마리 전부 죽었어도
       게임 종료 없음.
    */

    if(
        next >=
        CONFIG.MONSTER_POSITIONS.length
    ){


        if(
            monster
        ){

            scene.remove(
                monster
            );


            monster =
                null;

        }


        if(
            monsterShadow
        ){

            scene.remove(
                monsterShadow
            );


            monsterShadow =
                null;

        }


        currentMonsterIndex =
            2;


        $('monsterCount').textContent =
            '☠ 3 / 3';


        $('enemyText').textContent =
            '0 / 100';


        $('enemyHP').style.width =
            '0%';


        return;

    }


    spawnMonster(
        next
    );

}


/* =====================================================
   MONSTER ATTACK
===================================================== */

function triggerMonsterAttack(){


    if(
        !battle ||
        monsterDead ||
        !monster
    ){

        return;

    }


    if(
        monsterAttackProgress >=
        0
    ){

        return;

    }


    monsterAttackProgress =
        0;


    monsterAttackHit =
        false;

}


/* =====================================================
   PLAYER DAMAGE
===================================================== */

function damagePlayer(){


    if(
        !battle ||
        monsterDead
    ){

        return;

    }


    playerHP =

        Math.max(

            0,

            playerHP -
            CONFIG.MONSTER_DAMAGE

        );


    updateHP();


    /*
       플레이어가 맞을 때
       진동 없음
    */


    $('damageFlash').animate(

        [

            {opacity:0},

            {opacity:.85},

            {opacity:.28},

            {opacity:0}

        ],

        {

            duration:300

        }

    );


    cameraShake =
        .28;

}


/* =====================================================
   BATTLE START
   글자 없음 / NFC 중단 없음
===================================================== */

function startBattle(){


    if(
        battle ||
        monsterDead
    ){

        return;

    }


    battle =
        true;


    monsterAttackTimer =

        setInterval(

            triggerMonsterAttack,

            CONFIG.MONSTER_ATTACK_INTERVAL

        );

}


/* =====================================================
   NFC
===================================================== */

async function startNFC(){


    /*
       Android에서는 반드시 Chrome
    */

    if(
        isAndroid() &&
        !isRealChrome()
    ){

        $('nfcText').textContent =
            'Chrome 필요';


        return false;

    }


    if(
        !window.isSecureContext
    ){

        $('nfcText').textContent =
            'HTTPS 필요';


        return false;

    }


    if(
        !(
            'NDEFReader'
            in window
        )
    ){

        $('nfcText').textContent =
            'NFC 미지원';


        return false;

    }


    if(
        nfcStarted
    ){

        return true;

    }


    try{


        const reader =
            new NDEFReader();


        await reader.scan();


        nfcStarted =
            true;


        $('nfcText').textContent =
            'NFC 대기 중';


        $('nfcDot').style.background =
            '#50ef51';


        reader.onreading =
            ()=>{


                const now =
                    Date.now();


                if(
                    now -
                    lastTag <
                    CONFIG.NFC_COOLDOWN
                ){

                    return;

                }


                lastTag =
                    now;


                /*
                   NFC 한 번
                   =
                   검 한 번
                */

                attack();

            };


        reader.onreadingerror =
            ()=>{


                $('nfcText').textContent =
                    'NFC 읽기 오류';

            };


        return true;

    }

    catch(error){


        console.error(
            error
        );


        $('nfcText').textContent =
            'NFC 권한 확인';


        return false;

    }

}


/* =====================================================
   START
===================================================== */

$('startButton')
.addEventListener(
    'click',

    async ()=>{


        /*
           ★ Android + Chrome이 아니면
           무조건 Chrome 안내부터.
        */

        if(
            isAndroid() &&
            !isRealChrome()
        ){

            $('chromeGuide')
                .classList
                .add('show');


            return;

        }


        $('loading')
            .classList
            .add('show');


        if(
            !gameInitialized
        ){

            init3D();

        }


        await startNFC();


        started =
            true;


        sword.classList.add(
            'walking'
        );


        $('loading')
            .classList
            .remove('show');


        $('startScreen')
            .classList
            .add('hidden');

    }
);


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){


    requestAnimationFrame(
        gameLoop
    );


    const dt =

        Math.min(

            (
                now -
                lastTime
            ) /
            1000,

            .05

        );


    lastTime =
        now;


    if(
        started
    ){


        /* =================================================
           WALK
        ================================================= */

        if(
            !battle
        ){


            if(
                monster &&
                !monsterDead
            ){


                const distance =

                    camera.position.z -

                    monster.position.z;


                if(
                    distance >
                    CONFIG.BATTLE_DISTANCE
                ){


                    camera.position.z -=

                        CONFIG.WALK_SPEED *
                        dt;

                }

                else{


                    startBattle();

                }

            }

            else{


                camera.position.z -=

                    CONFIG.WALK_SPEED *
                    dt;

            }

        }


        /* =================================================
           CAMERA WALK BOB
        ================================================= */

        walkPhase +=

            dt *
            8;


        camera.position.y =

            2.15 +

            Math.sin(
                walkPhase
            ) *
            .026;


        /* =================================================
           BILLBOARD
        ================================================= */

        if(
            monster &&
            !monsterDead
        ){


            monster.rotation.y =

                Math.atan2(

                    camera.position.x -
                    monster.position.x,

                    camera.position.z -
                    monster.position.z

                );

        }


        /* =================================================
           MONSTER BREATH
        ================================================= */

        if(
            monster &&
            !monsterDead &&
            monsterAttackProgress <
            0
        ){


            const breathe =

                1 +

                Math.sin(
                    now *
                    .003
                ) *
                .025;


            monster.scale.set(

                1 -
                (
                    breathe -
                    1
                ) *
                .35,

                breathe,

                1

            );

        }


        /* =================================================
           MONSTER HIT SHAKE
        ================================================= */

        if(
            monster &&
            monsterHitTimer >
            0
        ){


            monsterHitTimer -=
                dt;


            monster.position.x =

                Math.sin(
                    now *
                    .11
                ) *
                .18;


            if(
                monsterHitTimer <=
                0
            ){


                monster.position.x =
                    0;


                monsterMaterial.color.set(
                    0xffffff
                );

            }

        }


        /* =================================================
           MONSTER ATTACK
        ================================================= */

        if(
            monster &&
            monsterAttackProgress >=
            0
        ){


            monsterAttackProgress +=

                dt *
                2.3;


            const t =
                monsterAttackProgress;


            /*
               살짝 뒤로
            */

            if(
                t <
                .20
            ){


                const p =

                    t /
                    .20;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ,

                        monsterHomeZ -
                        .7,

                        p

                    );

            }


            /*
               앞으로 돌진
            */

            else if(
                t <
                .52
            ){


                const p =

                    (
                        t -
                        .20
                    ) /
                    .32;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ -
                        .7,

                        monsterHomeZ +
                        3.8,

                        p

                    );

            }


            /*
               HIT
            */

            else if(
                t <
                .62
            ){


                if(
                    !monsterAttackHit
                ){


                    monsterAttackHit =
                        true;


                    damagePlayer();

                }

            }


            /*
               돌아감
            */

            else if(
                t <
                1
            ){


                const p =

                    (
                        t -
                        .62
                    ) /
                    .38;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ +
                        3.8,

                        monsterHomeZ,

                        p

                    );

            }


            else{


                monster.position.z =
                    monsterHomeZ;


                monsterAttackProgress =
                    -1;


                monsterAttackHit =
                    false;

            }

        }


        /* =================================================
           MONSTER DEATH
        ================================================= */

        if(
            monster &&
            monsterDead
        ){


            if(
                deathProgress <
                0
            ){

                deathProgress =
                    0;

            }


            deathProgress +=

                dt *
                1.4;


            monster.rotation.z =

                Math.min(

                    deathProgress,

                    1

                ) *

                1.25;


            monster.position.y =

                THREE.MathUtils.lerp(

                    2.5,

                    .95,

                    Math.min(
                        deathProgress,
                        1
                    )

                );


            monsterMaterial.opacity =

                Math.max(

                    0,

                    1 -
                    deathProgress *
                    .8

                );


            if(
                monsterShadow
            ){

                monsterShadow
                    .material
                    .opacity =

                    Math.max(

                        0,

                        .27 -
                        deathProgress *
                        .25

                    );

            }


            /*
               죽으면서도 계속 전진
            */

            camera.position.z -=

                CONFIG.WALK_SPEED *
                dt;


            if(
                deathProgress >
                1.3
            ){


                nextMonster();

            }

        }


        /* =================================================
           CAMERA SHAKE
        ================================================= */

        if(
            cameraShake >
            0
        ){


            cameraShake -=
                dt;


            camera.rotation.z =

                (
                    Math.random() -
                    .5
                ) *
                .032;


            camera.rotation.x =

                (
                    Math.random() -
                    .5
                ) *
                .024;

        }

        else{


            camera.rotation.z *=
                .70;


            camera.rotation.x *=
                .70;

        }

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE
===================================================== */

function resizeGame(){


    camera.aspect =

        innerWidth /
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );

}


/* =====================================================
   INITIAL
===================================================== */

updateHP();

updateCounter();

</script>
