<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>PIXEL ADVENTURE - NFC MONSTER</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center}
#game{
  position:relative;width:min(100vw,520px);height:100vh;max-height:1000px;
  overflow:hidden;background:#111;color:white;touch-action:manipulation;
}
#scene{
  position:absolute;inset:0;overflow:hidden;background:#000;
}
#bg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  image-rendering:pixelated;
  transform:scale(1.02);
  transition:transform .12s linear;
}
#dark{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.05) 0%,rgba(0,0,0,0) 45%,rgba(0,0,0,.18) 100%);
  pointer-events:none;
}
#scene.zooming #bg{
  transform:scale(1.34);
  transition:transform 7s cubic-bezier(.35,.05,.2,1);
}
#scene.battle #bg{
  transform:scale(1.34);
  transition:none;
}
#scene.monsterDead{
  animation:monsterDeath .7s ease forwards;
}
@keyframes monsterDeath{
  0%{filter:brightness(1)}
  45%{filter:brightness(2)}
  100%{filter:brightness(.35);transform:scale(1.08)}
}
#hpBox{
  position:absolute;top:16px;left:8%;width:84%;z-index:20;text-align:center;
  text-shadow:0 2px 3px #000;
}
#monsterName{font-weight:800;font-size:16px;letter-spacing:2px}
.bar{height:14px;margin-top:5px;border:2px solid #fff;background:#250b0b;border-radius:5px;overflow:hidden;box-shadow:0 2px 5px #000}
#monsterHp{height:100%;width:100%;background:linear-gradient(#ff6969,#a81414);transition:width .18s}
#playerHpBox{
  position:absolute;left:6%;bottom:24px;width:88%;z-index:30;
  text-shadow:0 2px 3px #000;
}
#playerLabel{font-size:13px;font-weight:bold}
#playerHpBar{height:12px;margin-top:4px;border:2px solid #fff;background:#08240f;border-radius:5px;overflow:hidden}
#playerHp{height:100%;width:100%;background:linear-gradient(#65e77b,#159438);transition:width .18s}
#sword{
  position:absolute;z-index:18;left:50%;bottom:-10%;width:25%;height:62%;
  transform:translateX(-50%) rotate(-18deg);transform-origin:70% 88%;
  transition:transform .12s ease-out;
  pointer-events:none;
}
#sword .blade{
  position:absolute;left:42%;top:0;width:18%;height:72%;
  background:linear-gradient(90deg,#fff 0%,#eaf9ff 45%,#b9d6e0 70%,#fff 100%);
  clip-path:polygon(48% 0,100% 9%,100% 87%,50% 100%,0 87%,0 9%);
  filter:drop-shadow(0 0 7px rgba(255,255,220,.9));
}
#sword .guard{
  position:absolute;left:14%;top:67%;width:72%;height:8%;border-radius:50%;
  background:#c98c35;box-shadow:0 2px 0 #744514;
}
#sword .handle{
  position:absolute;left:36%;top:71%;width:30%;height:24%;border-radius:8px 8px 18px 18px;
  background:linear-gradient(90deg,#70431d,#d59b45,#70431d);transform:rotate(-5deg);
}
#sword .pommel{
  position:absolute;left:29%;bottom:1%;width:44%;height:9%;border-radius:50%;
  background:#d19a46;
}
.walking #sword{animation:swordWalk .72s ease-in-out infinite alternate}
@keyframes swordWalk{
  from{transform:translateX(-50%) rotate(-25deg) translateY(4px)}
  to{transform:translateX(-50%) rotate(15deg) translateY(-3px)}
}
.attack #sword{animation:none;transform:translateX(-50%) rotate(48deg) translateY(-12%) scale(1.06)}
.enemyAttack #scene{animation:shake .16s linear 0s 2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#message{
  position:absolute;z-index:40;left:50%;top:53%;transform:translate(-50%,-50%);
  width:88%;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .25s;
}
#message.show{opacity:1}
#message .big{
  font-size:28px;font-weight:900;letter-spacing:1px;
  text-shadow:0 3px 5px #000;
}
#message .small{margin-top:8px;font-size:15px;text-shadow:0 2px 3px #000}
#nfcStatus{
  position:absolute;z-index:45;top:48px;right:12px;padding:7px 10px;border-radius:10px;
  background:rgba(0,0,0,.55);font-size:11px;border:1px solid rgba(255,255,255,.35)
}
#nfcDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffd84d;margin-right:5px}
#startOverlay{
  position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.82);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;
}
#startOverlay.hidden{display:none}
.panel{max-width:380px}
.panel h1{font-size:25px;margin:0 0 12px}
.panel p{font-size:14px;line-height:1.6;color:#ddd}
#startBtn{
  border:0;border-radius:12px;padding:14px 28px;font-size:17px;font-weight:800;
  background:#f5d46a;color:#2c2208;box-shadow:0 4px 0 #8c6d21;
}
#toast{
  position:absolute;left:50%;bottom:82px;z-index:80;transform:translateX(-50%) translateY(20px);
  opacity:0;background:rgba(0,0,0,.78);border:1px solid #aaa;padding:8px 12px;border-radius:10px;
  font-size:12px;transition:.2s;white-space:nowrap
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#flash{position:absolute;inset:0;z-index:35;background:white;opacity:0;pointer-events:none}
#flash.on{animation:flash .14s}
@keyframes flash{0%{opacity:.65}100%{opacity:0}}
</style>
</head>
<body>
<div id="game">
  <div id="scene">
    <img id="bg" alt="">
    <div id="dark"></div>


    <div id="hpBox">
      <div id="monsterName">SKY ABYSS BEAST</div>
      <div class="bar"><div id="monsterHp"></div></div>
    </div>

    <div id="sword">
      <div class="blade"></div><div class="guard"></div><div class="handle"></div><div class="pommel"></div>
    </div>
  </div>

  <div id="playerHpBox">
    <div id="playerLabel">HP <span id="hpText">100 / 100</span></div>
    <div id="playerHpBar"><div id="playerHp"></div></div>
  </div>

  <div id="nfcStatus"><span id="nfcDot"></span><span id="nfcText">NFC 준비 중</span></div>
  <div id="flash"></div>
  <div id="toast"></div>

  <div id="message">
    <div class="big" id="messageBig"></div>
    <div class="small" id="messageSmall"></div>
  </div>

  <div id="startOverlay">
    <div class="panel">
      <h1>PIXEL ADVENTURE</h1>
      <p id="introText">게임 시작을 누르면 NFC 대기가 시작됩니다.<br>몬스터에게 전진한 뒤 NFC 태그를 대면 검이 공격합니다.</p>
      <button id="startBtn">게임 시작</button>
    </div>
  </div>
</div>

document.getElementById("bg").src = "data:image/png;base64," + BG_DATA;

const game = document.getElementById("game");
const scene = document.getElementById("scene");
const sword = document.getElementById("sword");
const monsterHp = document.getElementById("monsterHp");
const playerHp = document.getElementById("playerHp");
const hpText = document.getElementById("hpText");
const nfcText = document.getElementById("nfcText");
const nfcDot = document.getElementById("nfcDot");
const overlay = document.getElementById("startOverlay");
const toast = document.getElementById("toast");
const message = document.getElementById("message");
const messageBig = document.getElementById("messageBig");
const messageSmall = document.getElementById("messageSmall");
const flash = document.getElementById("flash");

let playerMaxHP = 100;
let playerHP = 100;
let monsterMaxHP = 80;
let monsterCurrentHP = 80;
let gameStarted = false;
let battleStarted = false;
let gameCleared = false;
let nfcReader = null;
let nfcRunning = false;
let enemyTimer = null;
let walkTimer = null;
let lastTagTime = 0;

function vibrate(pattern=[80]) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t = setTimeout(()=>toast.classList.remove("show"), 1600);
}

function setNfcStatus(text, state) {
  nfcText.textContent = text;
  nfcDot.style.background =
    state === "on" ? "#55e66e" :
    state === "bad" ? "#ff5555" : "#ffd84d";
}

function damagePlayer(amount) {
  if (gameCleared) return;
  playerHP = Math.max(0, playerHP - amount);
  playerHp.style.width = playerHP + "%";
  hpText.textContent = playerHP + " / " + playerMaxHP;
  vibrate([90,40,90]);
  flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
  scene.classList.remove("enemyAttack"); void scene.offsetWidth; scene.classList.add("enemyAttack");

  if (playerHP <= 0) {
    clearInterval(enemyTimer);
    showResult("YOU DIED", "다시 시작하려면 화면을 새로고침하세요.");
  }
}

function damageMonster(amount) {
  if (gameCleared || !battleStarted) return;
  monsterCurrentHP = Math.max(0, monsterCurrentHP - amount);
  monsterHp.style.width = (monsterCurrentHP / monsterMaxHP * 100) + "%";
  vibrate([55,25,55]);
  if (monsterCurrentHP <= 0) {
    gameCleared = true;
    clearInterval(enemyTimer);
    scene.classList.add("monsterDead");
    setTimeout(()=>{
      showResult("MISSION CLEAR!", "몬스터가 쓰러졌습니다!");
    },450);
  }
}

function playerAttack() {
  if (!battleStarted || gameCleared || playerHP <= 0) return;
  sword.classList.remove("attack"); void sword.offsetWidth; sword.classList.add("attack");
  setTimeout(()=>sword.classList.remove("attack"),150);
  damageMonster(16);
}

function startBattle() {
  if (battleStarted) return;
  battleStarted = true;
  game.classList.remove("walking");
  scene.classList.add("battle");
  showToast("몬스터가 공격하기 시작했습니다!");
  enemyTimer = setInterval(()=>{
    if (!gameCleared && playerHP > 0) damagePlayer(5);
  }, 1300);
}

function startWalking() {
  game.classList.add("walking");
  scene.classList.add("zooming");
  // 약 7초 동안 몬스터에게 접근
  setTimeout(()=>{
    if (!gameStarted || gameCleared) return;
    startBattle();
  },7000);
}

async function startNFC() {
  if (!window.isSecureContext) {
    setNfcStatus("HTTPS 필요", "bad");
    showToast("Netlify HTTPS 주소에서 실행해주세요.");
    return false;
  }

  if (!("NDEFReader" in window)) {
    setNfcStatus("NFC 미지원", "bad");
    showToast("Android Chrome에서 Web NFC를 사용할 수 있습니다.");
    return false;
  }

  if (nfcRunning) return true;

  try {
    nfcReader = new NDEFReader();
    await nfcReader.scan();
    nfcRunning = true;
    setNfcStatus("NFC 대기 중", "on");

    nfcReader.onreadingerror = () => {
      setNfcStatus("NFC 읽기 오류", "bad");
      setTimeout(() => {
        if (nfcRunning) setNfcStatus("NFC 대기 중", "on");
      }, 1000);
    };

    nfcReader.onreading = event => {
      const now = Date.now();
      if (now - lastTagTime < 700) return;
      lastTagTime = now;
      if (!gameStarted || gameCleared) return;
      playerAttack();
    };
    return true;
  } catch (err) {
    nfcRunning = false;
    if (err && err.name === "NotAllowedError") {
      setNfcStatus("NFC 권한 차단됨", "bad");
      showToast("Chrome에서 NFC 권한을 허용해주세요.");
    } else {
      setNfcStatus("NFC 시작 실패", "bad");
      showToast("NFC를 켜고 다시 게임 시작을 눌러주세요.");
    }
    console.error("Web NFC error:", err);
    return false;
  }
}

function showResult(big, small) {
  messageBig.textContent = big;
  messageSmall.textContent = small;
  message.classList.add("show");
}

function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}
function isChrome() {
  const ua = navigator.userAgent;
  return /Chrome|CriOS/i.test(ua) && !/Edg|OPR|SamsungBrowser|KAKAOTALK/i.test(ua);
}

function guideChrome() {
  if (isChrome()) return false;

  if (isAndroid()) {
    const current = location.href.replace(/^https?:\/\//, "");
    const intentUrl = "intent://" + current +
      "#Intent;scheme=https;package=com.android.chrome;end";
    document.getElementById("introText").innerHTML =
      "이 게임은 Chrome에서 실행해야 합니다.<br><br>Chrome으로 열어주세요.";
    document.getElementById("startBtn").textContent = "Chrome으로 열기";
    document.getElementById("startBtn").onclick = () => {
      location.href = intentUrl;
    };
  } else {
    document.getElementById("introText").innerHTML =
      "이 게임은 Google Chrome에서 실행하는 것을 권장합니다.<br><br>Chrome으로 열어주세요.";
    document.getElementById("startBtn").textContent = "Chrome에서 계속";
  }
  return true;
}

document.getElementById("startBtn").addEventListener("click", async () => {
  if (!isChrome() && isAndroid()) {
    guideChrome();
    return;
  }

  if (location.protocol !== "https:" && location.hostname !== "localhost") {
    document.getElementById("introText").innerHTML =
      "이 페이지는 HTTPS 웹주소에서 실행해야 합니다.<br><br>" +
      "Netlify 주소(https://...netlify.app)에서 다시 열어주세요.";
    showToast("HTTPS 주소가 필요합니다.");
    return;
  }

  // 게임 시작 버튼의 실제 사용자 터치 안에서 NFC 권한을 요청합니다.
  const nfcStarted = await startNFC();

  overlay.classList.add("hidden");
  gameStarted = true;
  playerHP = playerMaxHP;
  monsterCurrentHP = monsterMaxHP;
  playerHp.style.width = "100%";
  monsterHp.style.width = "100%";
  hpText.textContent = "100 / 100";

  if (!nfcStarted) setNfcStatus("NFC 사용 불가", "bad");
  startWalking();
});

// 화면의 첫 터치에서도 NFC를 재시도.
// Web NFC는 Chrome 보안정책상 사용자 제스처가 필요한 경우가 있습니다.
if (!isChrome()) {
  guideChrome();
}
</script>
