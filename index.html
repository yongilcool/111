/* =====================================================
   기본 설정
===================================================== */

       칼 크기
    */

    /*
       ★ 이전 -18vh
       약 20% 이상 더 오른쪽
    */
    --sword-right:-22vh;

    --sword-bottom:-17vh;
}


*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111d;
    font-family:Arial,sans-serif;
}

body{
    position:fixed;
    inset:0;
}

#game{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#07111d;
}


/* =====================================================
   실제 게임 화면 영역

   NFC 모드 = 100%

   QR 모드 =
   게임 70%
   QR 카메라 30%
===================================================== */

#playArea{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    overflow:hidden;

    transition:
        height .22s ease;
}

#game.qr-mode #playArea{
    height:70%;
}


canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;
}


/* =====================================================
   SWORD
===================================================== */

#sword{
    position:absolute;

    z-index:40;

    right:
        var(--sword-right);

    bottom:
        var(--sword-bottom);

    width:auto;

    height:
        var(--sword-size);

    max-width:none;

    pointer-events:none;

    user-select:none;

    /*
       손 부분을 회전축으로
    */
    transform-origin:
        84% 91%;

    will-change:
        transform;

    filter:
        drop-shadow(
            0 10px 10px
            rgba(0,0,0,.32)
        );
}


/* =====================================================
   ★ 걸어갈 때

   빠르고 크게
   왼쪽 ↔ 오른쪽

   전투 중에는 사용하지 않음.
===================================================== */

#sword.walking{

    animation:
        swordWalk
        .30s
        ease-in-out
        infinite
        alternate;
}


@keyframes swordWalk{

    from{

        transform:
            translate(-34px,8px)
            rotate(-17deg);

    }

    to{

        transform:
            translate(35px,-11px)
            rotate(17deg);

    }

}


/* =====================================================
   ★ 몬스터 앞 전투 대기

   좌우로 막 흔들지 않고
   위아래로 작게만 움직임.
===================================================== */

#sword.battle-idle{

    animation:
        swordBattleIdle
        .85s
        ease-in-out
        infinite
        alternate;
}


@keyframes swordBattleIdle{

    from{

        transform:
            translateY(3px)
            rotate(-4deg);

    }

    to{

        transform:
            translateY(-8px)
            rotate(-2deg);

    }

}

<script>

window.isAndroid =
function(){

    return(
        /Android/i.test(
            navigator.userAgent || ''
        )
    );

};


window.isKakaoBrowser =
function(){

    const ua =
        navigator.userAgent || '';

    return(
        /KAKAOTALK/i.test(ua) ||
        /KakaoTalk/i.test(ua)
    );

};


window.isRealChrome =
function(){

    const ua =
        navigator.userAgent || '';


    if(
        window.isKakaoBrowser()
    ){
        return false;
    }


    if(
        /SamsungBrowser/i.test(ua)
    ){
        return false;
    }


    if(
        /EdgA/i.test(ua)
    ){
        return false;
    }


    if(
        /OPR/i.test(ua)
    ){
        return false;
    }


    return(
        /Chrome/i.test(ua)
    );

};


/* =====================================================
   Chrome 열기
===================================================== */

window.openChrome =
function(){

    const url =
        window.location.href;


    const clean =
        url.replace(
            /^https?:\/\//i,
            ''
        );


    window.location.href =

        'intent://' +

        clean +

        '#Intent;' +

        'scheme=https;' +

        'package=com.android.chrome;' +

        'end';

};


window.addEventListener(
    'DOMContentLoaded',
    ()=>{

        if(
            window.isAndroid() &&
            !window.isRealChrome()
        ){

            document
                .getElementById(
                    'chromeGuide'
                )
                .classList
                .add('show');

        }

    }
);


document
    .getElementById(
        'chromeButton'
    )
    .addEventListener(
        'click',
        window.openChrome
    );

</script>

/* =====================================================

===================================================== */

function initAudio(){


    if(audioCtx){

        if(
            audioCtx.state ===
            'suspended'
        ){

            audioCtx.resume();

        }


        return;

    }


    const AC =

        window.AudioContext ||

        window.webkitAudioContext;


    if(!AC){
        return;
    }


    audioCtx =
        new AC();

}


/* =====================================================
   NOISE
===================================================== */

function createNoiseBuffer(
    duration=.2
){


    if(!audioCtx){
        return null;
    }


    const length =

        Math.floor(

            audioCtx.sampleRate *
            duration

        );


    const buffer =

        audioCtx.createBuffer(

            1,

            length,

            audioCtx.sampleRate

        );


    const data =
        buffer.getChannelData(
            0
        );


    for(
        let i=0;
        i<length;
        i++
    ){

        data[i] =

            Math.random()*2-1;

    }


    return buffer;

}


/* =====================================================
   ★ 배경음

   외부 음악 파일 없이
   조용한 판타지 / 숲 탐험 느낌
===================================================== */

function startBGM(){


    if(
        !audioCtx ||
        bgmStarted
    ){
        return;
    }


    bgmStarted =
        true;


    const master =
        audioCtx.createGain();


    master.gain.value =
        .065;


    master.connect(
        audioCtx.destination
    );


    /*
       낮은 드론
    */

    const drone1 =
        audioCtx.createOscillator();


    const drone2 =
        audioCtx.createOscillator();


    drone1.type =
        'sine';


    drone2.type =
        'triangle';


    drone1.frequency.value =
        110;


    drone2.frequency.value =
        164.81;


    const g1 =
        audioCtx.createGain();


    const g2 =
        audioCtx.createGain();


    g1.gain.value =
        .45;


    g2.gain.value =
        .20;


    drone1.connect(g1);
    drone2.connect(g2);


    g1.connect(master);
    g2.connect(master);


    drone1.start();
    drone2.start();


    bgmNodes.push(
        drone1,
        drone2,
        master
    );


    /*
       작은 판타지 벨
    */

    const notes = [

        329.63,

        392,

        440,

        523.25,

        392

    ];


    let noteIndex =
        0;


    bgmBellTimer =
        setInterval(
            ()=>{

                if(
                    !audioCtx ||
                    gameIsOver
                ){
                    return;
                }


                const now =
                    audioCtx.currentTime;


                const osc =
                    audioCtx.createOscillator();


                const gain =
                    audioCtx.createGain();


                osc.type =
                    'sine';


                osc.frequency.value =
                    notes[
                        noteIndex %
                        notes.length
                    ];


                noteIndex++;


                gain.gain.setValueAtTime(
                    .0001,
                    now
                );


                gain.gain.exponentialRampToValueAtTime(
                    .10,
                    now+.03
                );


                gain.gain.exponentialRampToValueAtTime(
                    .0001,
                    now+1.15
                );


                osc.connect(
                    gain
                );


                gain.connect(
                    master
                );


                osc.start(
                    now
                );


                osc.stop(
                    now+1.2
                );

            },

            1900
        );

}

function playSwordSound(){


    if(!audioCtx){
        return;
    }


    const now =
        audioCtx.currentTime;


    const source =
        audioCtx.createBufferSource();


    source.buffer =
        createNoiseBuffer(
            .27
        );


    const filter =
        audioCtx.createBiquadFilter();


    filter.type =
        'bandpass';


    filter.frequency.setValueAtTime(
        600,
        now
    );


    filter.frequency.exponentialRampToValueAtTime(
        3300,
        now+.16
    );


    const gain =
        audioCtx.createGain();


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .48,
        now+.02
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.25
    );


    source.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        audioCtx.destination
    );


    source.start(
        now
    );


    source.stop(
        now+.27
    );

}

function makeGroundTexture(){


    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        128;

    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            '2d'
        );


    const colors = [

        '#527637',

        '#668744',

        '#46692f',

        '#75944c',

        '#3c602a'

    ];


    for(
        let y=0;
        y<128;
        y+=8
    ){

        for(
            let x=0;
            x<128;
            x+=8
        ){

            ctx.fillStyle =

                colors[
                    Math.floor(
                        Math.random()*
                        colors.length
                    )
                ];


            ctx.fillRect(
                x,
                y,
                8,
                8
            );

        }

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.magFilter =
        THREE.NearestFilter;


    texture.minFilter =
        THREE.NearestFilter;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        12,
        35
    );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}

/* =====================================================
   FOREST
===================================================== */

function createForest(){


    const trunkGeo =
        new THREE.CylinderGeometry(
            .23,
            .35,
            2.8,
            5
        );


    const trunkMat =
        new THREE.MeshLambertMaterial({
            color:0x49331f
        });


    const leavesGeo =
        new THREE.ConeGeometry(
            1.55,
            4.3,
            6
        );


    const leavesMat =
        new THREE.MeshLambertMaterial({
            color:0x315d2f
        });


    for(
        let z=5;
        z>-180;
        z-=4.8
    ){


        for(
            const side
            of [-1,1]
        ){


            const tree =
                new THREE.Group();


            const trunk =
                new THREE.Mesh(
                    trunkGeo,
                    trunkMat
                );


            trunk.position.y =
                1.4;


            tree.add(
                trunk
            );


            const leaves1 =
                new THREE.Mesh(
                    leavesGeo,
                    leavesMat
                );


            leaves1.position.y =
                3.9;


            tree.add(
                leaves1
            );


            const leaves2 =
                leaves1.clone();


            leaves2.scale.setScalar(
                .70
            );


            leaves2.position.y =
                5.15;


            tree.add(
                leaves2
            );


            tree.position.set(

                side*
                (
                    5+
                    Math.random()*7
                ),

                0,

                z+
                Math.random()*2

            );


            tree.scale.setScalar(

                .65+
                Math.random()*.65

            );


            scene.add(
                tree
            );

        }

    }

}


/* =====================================================
   ROCKS
===================================================== */

function createRocks(){


    const geo =
        new THREE.DodecahedronGeometry(
            .45,
            0
        );


    const mat =
        new THREE.MeshLambertMaterial({
            color:0x62675d
        });


    for(
        let i=0;
        i<70;
        i++
    ){


        const rock =
            new THREE.Mesh(
                geo,
                mat
            );


        let x =
            4+
            Math.random()*10;


        if(
            Math.random()<.5
        ){

            x *= -1;

        }


        rock.position.set(

            x,

            .25,

            5-
            Math.random()*180

        );


        const s =
            .35+
            Math.random()*.85;


        rock.scale.set(
            s,
            s*.6,
            s
        );


        scene.add(
            rock
        );

    }

}


/* =====================================================
   MONSTER
===================================================== */

function spawnMonster(index){


    if(monster){
        scene.remove(monster);
    }


    if(monsterShadow){
        scene.remove(monsterShadow);
    }


    currentMonsterIndex =
        index;


    currentMonsterHP =
        CONFIG.MONSTER_HP;


    monsterDead =
        false;


    battle =
        false;


    deathProgress =
        -1;


    const imageURL =
        MONSTER_IMAGES[
            index
        ];


    let texture;


    if(
        imageURL &&
        !imageURL.startsWith(
            'MONSTER_'
        )
    ){


        texture =

            new THREE
            .TextureLoader()
            .load(
                imageURL
            );


        texture.colorSpace =
            THREE.SRGBColorSpace;


        texture.magFilter =
            THREE.NearestFilter;


        texture.minFilter =
            THREE.LinearFilter;

    }

    else{


        texture =
            createTemporaryMonster(
                index
            );

    }


    monsterMaterial =
        new THREE.MeshBasicMaterial({

            map:texture,

            transparent:true,

            alphaTest:.05,

            side:
                THREE.DoubleSide

        });


    monster =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                5,
                5
            ),

            monsterMaterial

        );


    monster.position.set(

        0,

        2.5,

        CONFIG.MONSTER_POSITIONS[
            index
        ]

    );


    monsterHomeZ =

        CONFIG.MONSTER_POSITIONS[
            index
        ];


    scene.add(
        monster
    );


    monsterShadow =
        new THREE.Mesh(

            new THREE.CircleGeometry(
                1.5,
                18
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x000000,

                transparent:true,

                opacity:.27,

                depthWrite:false

            })

        );


    monsterShadow.rotation.x =
        -Math.PI/2;


    monsterShadow.position.set(
        0,
        .025,
        monsterHomeZ
    );


    scene.add(
        monsterShadow
    );


    setSwordMotion();

    updateHP();

    updateCounter();

}

   ★ 걷기 / 전투 대기 검 모션 변경
===================================================== */

function setSwordMotion(){


    sword.classList.remove(

        'walking',

        'battle-idle'

    );


    if(
        !started ||
        gameIsOver ||
        swordAttacking
    ){

        return;

    }


    if(battle){

        sword.classList.add(
            'battle-idle'
        );

    }

    else{

        sword.classList.add(
            'walking'
        );

    }

}


/* =====================================================
   ★ ATTACK

   중요:

   오른쪽 바깥
       ↓
   화면 안쪽

   즉 OUT → IN
===================================================== */

function attack(){


    if(
        !started ||
        gameIsOver ||
        swordAttacking
    ){

        return;

    }


    swordAttacking =
        true;


    sword.classList.remove(

        'walking',

        'battle-idle'

    );


    if(swordAnimation){

        swordAnimation.cancel();

    }


    /*
       검 소리
    */

    playSwordSound();


    /*
       ★ 공격 시작 즉시 적 데미지
    */

    if(
        battle &&
        !monsterDead
    ){

        damageMonster();

    }


    const horizontal =

        swordAttackType ===
        0;


    swordAttackType =

        horizontal
        ? 1
        : 0;


    let frames;


    /* =================================================
       ★ 밖 → 안 옆베기
    ================================================= */

    if(horizontal){


        frames = [

                offset:.86,

                transform:
                    'translate(-100px,45px) rotate(30deg) scale(1.06)'

            },


            {

                offset:1,

                transform:
                    'translate(0,0) rotate(-4deg) scale(1)'

            }

        ];

    }


    swordAnimation =
        sword.animate(

            frames,

            {

                duration:
                    CONFIG.SWORD_SPEED,

                easing:
                    'cubic-bezier(.18,.70,.18,1)'

            }

        );


    swordAnimation.onfinish =
        ()=>{


            swordAttacking =
                false;


            setSwordMotion();

        };

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function damageMonster(){


    if(
        !battle ||
        monsterDead ||
        gameIsOver
    ){

        return;

    }


    currentMonsterHP =

        Math.max(

            0,

            currentMonsterHP-

        );

        navigator.vibrate

                25,
                110
            ]

        );

    }

    );

        .22;


    cameraShake =
        .22;

}

        false;

/* =====================================================
   NEXT MONSTER
===================================================== */

function nextMonster(){


    const next =

        currentMonsterIndex+
        1;


    if(
        next >=
        CONFIG.MONSTER_POSITIONS.length
    ){


        if(monster){

            scene.remove(
                monster
            );


            monster =
                null;

        }


        if(monsterShadow){

            scene.remove(
                monsterShadow
            );


            monsterShadow =
                null;

        }


        $('#monsterCount')
            .textContent =
            '☠ 3 / 3';


        $('#enemyText')
            .textContent =
            '0 / 100';


        $('#enemyHP')
            .style
            .width =
            '0%';


        return;

    }


    spawnMonster(
        next
    );

}

/* =====================================================
   NFC
===================================================== */

async function startNFC(){


    if(
        window.isAndroid() &&
        !window.isRealChrome()
    ){

        $('#statusText')
            .textContent =
            'Chrome 필요';


        return false;

    }


    if(
        !window.isSecureContext
    ){

        $('#statusText')
            .textContent =
            'HTTPS 필요';


        return false;

    }


    if(
        !(
            'NDEFReader'
            in window
        )
    ){

        $('#statusText')
            .textContent =
            'NFC 미지원';


        return false;

    }


    if(nfcStarted){
        return true;
    }


    try{


        const reader =
            new NDEFReader();


        await reader.scan();


        nfcStarted =
            true;


        updateInputStatus();


        reader.onreading =
            ()=>{


                if(
                    inputMode !==
                    'nfc'
                ){

                    return;

                }


                const now =
                    Date.now();


                if(
                    now-lastTag <
                    CONFIG.NFC_COOLDOWN
                ){

                    return;

                }


                lastTag =
                    now;


                attack();

            };


        reader.onreadingerror =
            ()=>{


                if(
                    inputMode ===
                    'nfc'
                ){

                    $('#statusText')
                        .textContent =
                        'NFC 읽기 오류';

                }

            };


        return true;

    }

    catch(error){


        console.error(
            error
        );


        $('#statusText')
            .textContent =
            'NFC 권한 확인';


        return false;

    }

}


/* =====================================================
   ★ QR
===================================================== */

let qrStream =
    null;


let qrRunning =
    false;


let qrAnimationFrame =
    0;


let barcodeDetector =
    null;


let jsQRReady =
    false;


let qrLocked =
    false;


let lastQRSeen =
    0;


/* =====================================================
   JSQR FALLBACK LOAD
===================================================== */

function loadJsQR(){


    return new Promise(

        resolve=>{


            if(
                window.jsQR
            ){

                jsQRReady =
                    true;


                resolve();

                return;

            }


            const script =
                document.createElement(
                    'script'
                );


            script.src =

"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


            script.onload =
                ()=>{

                    jsQRReady =
                        true;


                    resolve();

                };


            script.onerror =
                ()=>{

                    resolve();

                };


            document.head
                .appendChild(
                    script
                );

        }

    );

}


/* =====================================================
   START QR CAMERA
===================================================== */

async function startQR(){


    if(qrRunning){
        return;
    }


    try{


        qrStream =

            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:'environment'
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                }

            });


        $('#qrVideo')
            .srcObject =
            qrStream;


        await $('#qrVideo')
            .play();


        qrRunning =
            true;


        /*
           Chrome BarcodeDetector 우선
        */

        if(
            'BarcodeDetector'
            in window
        ){


            try{


                barcodeDetector =

                    new BarcodeDetector({

                        formats:[
                            'qr_code'
                        ]

                    });

            }

            catch(e){

                barcodeDetector =
                    null;

            }

        }


        /*
           BarcodeDetector가 없으면
           jsQR 준비
        */

        if(
            !barcodeDetector
        ){

            await loadJsQR();

        }


        updateInputStatus();


        qrAnimationFrame =
            requestAnimationFrame(
                scanQR
            );

    }

    catch(error){


        console.error(
            error
        );


        $('#statusText')
            .textContent =
            '카메라 권한 필요';

    }

}


/* =====================================================
   STOP QR
===================================================== */

function stopQR(){


    qrRunning =
        false;


    cancelAnimationFrame(
        qrAnimationFrame
    );


    if(qrStream){


        qrStream
        .getTracks()
        .forEach(
            track=>track.stop()
        );


        qrStream =
            null;

    }


    $('#qrVideo')
        .srcObject =
        null;


    qrLocked =
        false;

}


/* =====================================================
   QR HIT
===================================================== */

function handleQRCode(value){


    const clean =
        String(value || '')
        .trim()
        .toUpperCase();


    if(
        clean !==
        CONFIG.QR_VALUE
    ){

        return;

    }


    const now =
        performance.now();


    /*
       한 번 읽었으면
       화면에서 빠졌다가
       다시 보여야 재공격 가능
    */

    lastQRSeen =
        now;


    if(qrLocked){
        return;
    }


    qrLocked =
        true;


    /*
       NFC와 동일
    */

    attack();

}


/* =====================================================
   QR SCAN
===================================================== */

async function scanQR(){


    if(
        !qrRunning ||
        inputMode !==
        'qr'
    ){

        return;

    }


    const video =
        $('#qrVideo');


    let found =
        false;


    if(
        video.readyState >=
        2
    ){


        /*
           1. BarcodeDetector
        */

        if(barcodeDetector){


            try{


                const codes =
                    await barcodeDetector
                    .detect(
                        video
                    );


                if(
                    codes &&
                    codes.length
                ){


                    for(
                        const code
                        of codes
                    ){


                        if(
                            String(
                                code.rawValue ||
                                ''
                            )
                            .trim()
                            .toUpperCase() ===
                            CONFIG.QR_VALUE
                        ){


                            found =
                                true;


                            handleQRCode(
                                code.rawValue
                            );


                            break;

                        }

                    }

                }

            }

            catch(e){}

        }


        /*
           2. jsQR fallback
        */

        else if(
            jsQRReady &&
            window.jsQR
        ){


            const canvas =
                $('#qrCanvas');


            const ctx =
                canvas.getContext(
                    '2d',
                    {
                        willReadFrequently:true
                    }
                );


            /*
               성능 때문에
               QR 분석 해상도 축소
            */

            canvas.width =
                480;


            canvas.height =
                270;


            ctx.drawImage(

                video,

                0,
                0,

                canvas.width,
                canvas.height

            );


            const image =
                ctx.getImageData(

                    0,
                    0,

                    canvas.width,
                    canvas.height

                );


            const result =
                window.jsQR(

                    image.data,

                    image.width,

                    image.height,

                    {

                        inversionAttempts:
                            'dontInvert'

                    }

                );


            if(result){


                if(
                    String(
                        result.data ||
                        ''
                    )
                    .trim()
                    .toUpperCase() ===
                    CONFIG.QR_VALUE
                ){


                    found =
                        true;


                    handleQRCode(
                        result.data
                    );

                }

            }

        }

    }


    /*
       QR이 화면에서 사라지면
       다시 공격 가능하게 재장전
    */

    if(
        !found &&
        qrLocked
    ){


        if(
            performance.now() -
            lastQRSeen >
            CONFIG.QR_REARM_TIME
        ){


            qrLocked =
                false;

        }

    }


    qrAnimationFrame =
        requestAnimationFrame(
            scanQR
        );

}

$('#startButton')

/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){


    requestAnimationFrame(
        gameLoop
    );


    const dt =

        Math.min(

            (
                now-
                lastTime
            )/
            1000,

            .05

        );


    lastTime =
        now;


    if(
        started &&
        !gameIsOver
    ){


        let currentlyWalking =
            false;


        /* =================================================
           WALK
        ================================================= */

        if(!battle){


            if(
                monster &&
                !monsterDead
            ){


                const distance =

                    camera.position.z-
                    monster.position.z;


                if(
                    distance >
                    CONFIG.BATTLE_DISTANCE
                ){


                    camera.position.z -=

                        CONFIG.WALK_SPEED*
                        dt;


                    currentlyWalking =
                        true;

                }

                else{


                    startBattle();

                }

            }

            else{


                camera.position.z -=

                    CONFIG.WALK_SPEED*
                    dt;


                currentlyWalking =
                    true;

            }

        }


        /* =================================================
           FOOTSTEP
        ================================================= */

        if(currentlyWalking){


            footstepTimer +=
                dt;


            if(
                footstepTimer >=
                CONFIG.FOOTSTEP_INTERVAL
            ){


                footstepTimer =
                    0;


                playFootstep();

            }

        }

        else{


            footstepTimer =
                0;

        }


        /* =================================================
           CAMERA WALK BOB
        ================================================= */

        if(currentlyWalking){


            walkPhase +=

                dt*
                15.5;

        }

        else{


            walkPhase +=

                dt*
                4;

        }


        camera.position.y =

            2.15+

            Math.sin(
                walkPhase
            )*

            (
                currentlyWalking
                ? .045
                : .015
            );


        /* =================================================
           BILLBOARD MONSTER
        ================================================= */

        if(
            monster &&
            !monsterDead
        ){


            monster.rotation.y =

                Math.atan2(

                    camera.position.x-
                    monster.position.x,

                    camera.position.z-
                    monster.position.z

                );

        }


        /* =================================================
           MONSTER BREATH
        ================================================= */

        if(
            monster &&
            !monsterDead &&
            monsterAttackProgress<0
        ){


            const breathe =

                1+

                Math.sin(
                    now*.003
                )*
                .025;


            monster.scale.set(

                1-
                (
                    breathe-1
                )*.35,

                breathe,

                1

            );

        }


        /* =================================================
           MONSTER HIT
        ================================================= */

        if(
            monster &&
            monsterHitTimer>0
        ){


            monsterHitTimer -=
                dt;


            monster.position.x =

                Math.sin(
                    now*.11
                )*
                .18;


            if(
                monsterHitTimer<=0
            ){


                monster.position.x =
                    0;


                monsterMaterial
                    .color
                    .set(
                        0xffffff
                    );

            }

        }


        /* =================================================
           MONSTER ATTACK
        ================================================= */

        if(
            monster &&
            monsterAttackProgress>=0
        ){


            monsterAttackProgress +=

                dt*
                2.3;


            const t =
                monsterAttackProgress;


            /*
               움츠림
            */

            if(t<.20){


                const p =
                    t/.20;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ,

                        monsterHomeZ-.7,

                        p

                    );

            }


            /*
               돌진
            */

            else if(t<.52){


                const p =

                    (
                        t-.20
                    )/
                    .32;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ-.7,

                        monsterHomeZ+3.8,

                        p

                    );

            }


            /*
               HIT
            */

            else if(t<.62){


                if(
                    !monsterAttackHit
                ){


                    monsterAttackHit =
                        true;


                    damagePlayer();

                }

            }


            /*
               돌아감
            */

            else if(t<1){


                const p =

                    (
                        t-.62
                    )/
                    .38;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ+3.8,

                        monsterHomeZ,

                        p

                    );

            }


            else{


                monster.position.z =
                    monsterHomeZ;


                monsterAttackProgress =
                    -1;


                monsterAttackHit =
                    false;

            }

        }


        /* =================================================
           MONSTER DEAD
        ================================================= */

        if(
            monster &&
            monsterDead
        ){


            if(
                deathProgress<0
            ){

                deathProgress =
                    0;

            }


            deathProgress +=

                dt*
                1.4;


            monster.rotation.z =

                Math.min(
                    deathProgress,
                    1
                )*
                1.25;


            monster.position.y =

                THREE.MathUtils.lerp(

                    2.5,

                    .95,

                    Math.min(
                        deathProgress,
                        1
                    )

                );


            monsterMaterial.opacity =

                Math.max(

                    0,

                    1-
                    deathProgress*.8

                );


            if(monsterShadow){


                monsterShadow
                    .material
                    .opacity =

                    Math.max(

                        0,

                        .27-
                        deathProgress*.25

                    );

            }


            /*
               죽는 동안에도 계속 앞으로
            */

            camera.position.z -=

                CONFIG.WALK_SPEED*
                dt;


            footstepTimer +=
                dt;


            if(
                footstepTimer >=
                CONFIG.FOOTSTEP_INTERVAL
            ){


                footstepTimer =
                    0;


                playFootstep();

            }


            if(
                deathProgress>1.3
            ){


                nextMonster();

            }

        }


        /* =================================================
           SHAKE
        ================================================= */

        if(
            cameraShake>0
        ){


            cameraShake -=
                dt;


            camera.rotation.z =

                (
                    Math.random()-.5
                )*
                .032;


            camera.rotation.x =

                (
                    Math.random()-.5
                )*
                .024;

        }

        else{


            camera.rotation.z *=
                .70;


            camera.rotation.x *=
                .70;

        }

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE

   QR 모드에서
   3D 화면을 70% 높이에 맞춤.
===================================================== */

function resizeGame(){


    if(
        !camera ||
        !renderer
    ){

        return;

    }


    const playArea =
        $('#playArea');


    const width =
        playArea.clientWidth;


    const height =
        playArea.clientHeight;


    if(
        !width ||
        !height
    ){

        return;

    }


    camera.aspect =
        width/height;


    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height
    );

}
