<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>NFC / QR 웹게임</title>


<!-- QR 카메라 스캐너 -->
<script src="https://unpkg.com/html5-qrcode"></script>


<style>

/* =====================================================
   기본
===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #111;

    color: white;

    font-family:
        Arial,
        sans-serif;

}


body {

    overflow-x: hidden;

}


/* =====================================================
   게임 화면
===================================================== */

#game {

    min-height: 100vh;

    padding: 30px 20px 50px;

    text-align: center;

}


h1 {

    margin-top: 35px;

    font-size: 28px;

}


#instruction {

    line-height: 1.7;

    margin-top: 15px;

}


/* =====================================================
   NFC / QR 선택 버튼
===================================================== */

#methodSelect {

    display: flex;

    justify-content: center;

    gap: 12px;

    margin-top: 35px;

}


.methodButton {

    width: 145px;

    min-height: 75px;

    border: none;

    border-radius: 16px;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

}


#nfcSelect {

    background: #15945c;

    color: white;

}


#qrSelect {

    background: #3478e5;

    color: white;

}


.methodButton:active {

    transform: scale(0.96);

}


/* =====================================================
   상태창
===================================================== */

#status {

    width: 100%;

    max-width: 500px;

    margin: 30px auto 0;

    padding: 20px;

    background: #222;

    border-radius: 16px;

    line-height: 1.7;

    min-height: 80px;

}


/* =====================================================
   QR 영역
===================================================== */

#qrArea {

    display: none;

    width: 100%;

    max-width: 500px;

    margin: 25px auto 0;

}


#reader {

    width: 100%;

    max-width: 500px;

    margin: auto;

}


/*
   html5-qrcode가 생성하는
   카메라 화면
*/

#reader video {

    width: 100% !important;

    border-radius: 18px !important;

}


/*
   QR 스캔 네모 영역

   html5-qrcode의 qrbox도
   같이 사용한다.
*/

#scanGuide {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 220px;

    height: 220px;

    transform:
        translate(-50%, -50%);

    border:
        4px solid #00ff88;

    border-radius: 20px;

    pointer-events: none;

    box-shadow:
        0 0 20px
        rgba(0,255,136,0.8);

}


/* =====================================================
   QR 설명
===================================================== */

#qrMessage {

    margin-bottom: 15px;

    line-height: 1.6;

}


/* =====================================================
   뒤로가기
===================================================== */

#backButton {

    display: none;

    margin-top: 20px;

    padding: 14px 22px;

    border: none;

    border-radius: 12px;

    background: #555;

    color: white;

    font-size: 16px;

    font-weight: bold;

}


/* =====================================================
   Chrome 안내
===================================================== */

#chromeWarning {

    position: fixed;

    inset: 0;

    z-index: 999999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,0.95);

}


#warningBox {

    width: 100%;

    max-width: 420px;

    padding: 30px 22px;

    background: white;

    color: #222;

    border-radius: 22px;

    text-align: center;

}


#warningBox h2 {

    margin-top: 0;

    font-size: 25px;

}


#warningBox p {

    line-height: 1.7;

}


#chromeButton {

    width: 100%;

    margin-top: 20px;

    padding: 17px;

    border: none;

    border-radius: 14px;

    background: #4285f4;

    color: white;

    font-size: 18px;

    font-weight: bold;

}


/* =====================================================
   정답 화면
===================================================== */

#successScreen {

    position: fixed;

    inset: 0;

    z-index: 50000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,0.95);

}


#successBox {

    width: 100%;

    max-width: 420px;

    padding: 35px 25px;

    background: #202020;

    border-radius: 22px;

    text-align: center;

}


#successBox h2 {

    margin-top: 0;

    color: #55dd88;

    font-size: 28px;

}


#successBox p {

    line-height: 1.7;

}


#continueButton {

    width: 100%;

    margin-top: 20px;

    padding: 17px;

    border: none;

    border-radius: 14px;

    background: #55aa77;

    color: white;

    font-size: 18px;

    font-weight: bold;

}


/* =====================================================
   모바일
===================================================== */

@media(max-width:500px) {

    #methodSelect {

        gap: 8px;

    }


    .methodButton {

        width: 45%;

        font-size: 18px;

    }

}

</style>

</head>



<body>


<!-- =====================================================
     게임
===================================================== -->

<div id="game">


    <h1>
        ⚔️ 게임 시작
    </h1>


    <p id="instruction">

        NFC 또는 QR 코드를 선택하세요.

    </p>


    <!-- NFC / QR -->

    <div id="methodSelect">


        <button
            id="nfcSelect"
            class="methodButton">

            📱 NFC

        </button>


        <button
            id="qrSelect"
            class="methodButton">

            📷 QR

        </button>


    </div>


    <!-- 상태 -->

    <div id="status">

        NFC 또는 QR을 선택해주세요.

    </div>


    <!-- QR -->

    <div id="qrArea">


        <div id="qrMessage">

            📷 QR 코드를 네모 안에 맞춰주세요.

        </div>


        <div id="reader"></div>


    </div>


    <!-- 뒤로 -->

    <button
        id="backButton">

        ↩️ NFC / QR 선택

    </button>


</div>



<!-- =====================================================
     Chrome 안내
===================================================== -->

<div id="chromeWarning">


    <div id="warningBox">


        <h2>
            ⚠️ Chrome에서 실행해주세요
        </h2>


        <p>

            현재 카카오톡 또는
            다른 앱 내부 브라우저에서
            게임이 실행되었습니다.

        </p>


        <p>

            이 게임은 NFC 기능을 사용하기 때문에

            <strong>
                Android Chrome
            </strong>

            에서 실행해야
            정상적으로 작동합니다.

        </p>


        <button
            id="chromeButton">

            🌐 Chrome으로 계속하기

        </button>


    </div>

</div>



<!-- =====================================================
     정답 화면
===================================================== -->

<div id="successScreen">


    <div id="successBox">


        <h2>
            ✅ 정답입니다!
        </h2>


        <p>

            올바른 코드를 찾았습니다.

        </p>


        <p>

            <strong>
                다음 단계로 이동합니다.
            </strong>

        </p>


        <button
            id="continueButton">

            ▶ 다음 단계

        </button>


    </div>

</div>



<script>


/* =====================================================
   ★★★★★ 정답 코드 ★★★★★
===================================================== */


/*
   NFC와 QR의 정답은 둘 다

   CHEST_001

   입니다.
*/

const CORRECT_CODE =
    "MISSION_CLEAR_1234";



/* =====================================================
   브라우저 감지
===================================================== */


/* Android */

function isAndroid() {

    return /Android/i.test(
        navigator.userAgent
    );

}


/* 카카오톡 */

function isKakaoTalk() {

    const ua =
        navigator.userAgent.toLowerCase();


    return (

        ua.includes("kakaotalk") ||

        ua.includes("kakao") ||

        ua.includes("daumapps")

    );

}


/* 네이버 */

function isNaverApp() {

    const ua =
        navigator.userAgent.toLowerCase();


    return (

        ua.includes("naver") ||

        ua.includes("naver(inapp")

    );

}


/* 인스타그램 */

function isInstagram() {

    return /instagram/i.test(
        navigator.userAgent
    );

}


/* 페이스북 */

function isFacebook() {

    const ua =
        navigator.userAgent.toLowerCase();


    return (

        ua.includes("fbav") ||

        ua.includes("fban")

    );

}


/* Chrome */

function isChrome() {

    const ua =
        navigator.userAgent;


    /*
       인앱 브라우저는
       무조건 Chrome이 아니라고 처리
    */

    if (isKakaoTalk())
        return false;


    if (isNaverApp())
        return false;


    if (isInstagram())
        return false;


    if (isFacebook())
        return false;


    /*
       Android Chrome
    */

    return (

        /Android/i.test(ua) &&

        /Chrome\/[0-9.]+/i.test(ua) &&

        !/EdgA/i.test(ua) &&

        !/OPR/i.test(ua) &&

        !/SamsungBrowser/i.test(ua) &&

        !/Firefox/i.test(ua)

    );

}



/* =====================================================
   Chrome 안내
===================================================== */

const chromeWarning =
    document.getElementById(
        "chromeWarning"
    );


if (!isChrome()) {

    chromeWarning.style.display =
        "flex";

}



/* =====================================================
   Chrome으로 열기
===================================================== */

document
.getElementById("chromeButton")
.addEventListener(
    "click",
    function() {


        const currentURL =
            window.location.href;


        /*
           Android
        */

        if (isAndroid()) {


            /*
               https:// 제거
            */

            const cleanURL =
                currentURL.replace(
                    /^https?:\/\//i,
                    ""
                );


            /*
               Chrome Intent
            */

            const chromeIntent =

                "intent://" +

                cleanURL +

                "#Intent;" +

                "scheme=https;" +

                "package=com.android.chrome;" +

                "action=android.intent.action.VIEW;" +

                "category=android.intent.category.BROWSABLE;" +

                "end";


            /*
               Chrome 실행
            */

            window.location.href =
                chromeIntent;


        }


        else {


            /*
               PC 등
            */

            window.open(
                currentURL,
                "_blank"
            );

        }

    }
);



/* =====================================================
   화면 요소
===================================================== */

const nfcSelect =
    document.getElementById(
        "nfcSelect"
    );


const qrSelect =
    document.getElementById(
        "qrSelect"
    );


const methodSelect =
    document.getElementById(
        "methodSelect"
    );


const status =
    document.getElementById(
        "status"
    );


const instruction =
    document.getElementById(
        "instruction"
    );


const qrArea =
    document.getElementById(
        "qrArea"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


const successScreen =
    document.getElementById(
        "successScreen"
    );


const continueButton =
    document.getElementById(
        "continueButton"
    );



/* =====================================================
   상태 변수
===================================================== */

let ndef = null;

let html5QrCode = null;

let currentMethod = null;

let gameCompleted = false;

let qrStarting = false;



/* =====================================================
   NFC 선택
===================================================== */

nfcSelect.addEventListener(
    "click",
    function() {

        startNFC();

    }
);



/* =====================================================
   NFC 시작
===================================================== */

async function startNFC() {


    currentMethod =
        "NFC";


    gameCompleted =
        false;


    /*
       QR 숨기기
    */

    qrArea.style.display =
        "none";


    /*
       선택 버튼 숨기기
    */

    methodSelect.style.display =
        "none";


    /*
       뒤로 버튼
    */

    backButton.style.display =
        "inline-block";


    instruction.innerHTML =

        "📱 NFC 태그를 휴대폰 뒷면에 가까이 대주세요.";


    status.innerHTML =

        "📡 NFC를 기다리는 중...";


    /*
       Web NFC 확인
    */

    if (!("NDEFReader" in window)) {

        status.innerHTML =

            "❌ 이 브라우저에서는 NFC를 사용할 수 없습니다." +

            "<br><br>" +

            "Android Chrome에서 실행해주세요.";

        return;

    }


    try {


        /*
           Reader 생성
        */

        ndef =
            new NDEFReader();


        /*
           NFC 읽기 시작

           이 순간부터
           별도 버튼 없이 대기한다.
        */

        await ndef.scan();


        status.innerHTML =

            "📡 NFC 대기 중..." +

            "<br><br>" +

            "태그를 휴대폰 뒷면에 대주세요.";


        /*
           NFC 발견
        */

        ndef.onreading =
            function(event) {

                readNFC(event);

            };


    }


    catch(error) {


        console.error(error);


        status.innerHTML =

            "❌ NFC를 시작하지 못했습니다." +

            "<br><br>" +

            error.message;

    }

}



/* =====================================================
   NFC 읽기
===================================================== */

function readNFC(event) {


    if (gameCompleted) {

        return;

    }


    let code =
        "";


    /*
       모든 Record 확인
    */

    for (
        const record
        of event.message.records
    ) {


        try {


            const decoder =
                new TextDecoder(
                    record.encoding
                );


            const value =
                decoder.decode(
                    record.data
                ).trim();


            if (value) {

                code =
                    value;

                break;

            }


        }


        catch(error) {

            console.log(error);

        }

    }


    /*
       값 없음
    */

    if (!code) {


        status.innerHTML =

            "❌ NFC 내용을 읽지 못했습니다." +

            "<br><br>" +

            "다시 태그를 대주세요.";


        return;

    }


    /*
       정답 확인
    */

    checkAnswer(code);

}



/* =====================================================
   QR 선택
===================================================== */

qrSelect.addEventListener(
    "click",
    function() {

        startQR();

    }
);



/* =====================================================
   QR 시작
===================================================== */

async function startQR() {


    currentMethod =
        "QR";


    gameCompleted =
        false;


    methodSelect.style.display =
        "none";


    qrArea.style.display =
        "block";


    backButton.style.display =
        "inline-block";


    instruction.innerHTML =

        "📷 QR 코드를 네모 안에 맞춰주세요.";


    status.innerHTML =

        "📷 카메라를 시작하는 중...";


    /*
       이미 실행 중이면
       종료
    */

    if (html5QrCode) {

        try {

            await html5QrCode.stop();

        }

        catch(e) {}

    }


    /*
       QR Reader 생성
    */

    html5QrCode =
        new Html5Qrcode(
            "reader"
        );


    try {


        /*
           카메라 시작
        */

        await html5QrCode.start(

            {
                facingMode:
                    "environment"
            },


            {


                /*
                   초당 검사 횟수
                */

                fps: 10,


                /*
                   ★ QR 네모
                */

                qrbox: {

                    width: 220,

                    height: 220

                },


                /*
                   화면 전체 영역
                */

                aspectRatio: 1.0

            },


            /*
               QR 발견
            */

            function(decodedText) {


                if (
                    gameCompleted
                ) {

                    return;

                }


                /*
                   QR 코드에서
                   읽은 값
                */

                const code =
                    decodedText.trim();


                /*
                   정답 확인
                */

                checkAnswer(code);


            },


            /*
               QR을 아직 못 찾은 것은
               정상적인 상태이므로
               아무것도 하지 않는다.
            */

            function(errorMessage) {

                // 계속 스캔

            }

        );


        status.innerHTML =

            "📷 QR 스캔 중..." +

            "<br><br>" +

            "초록색 네모 안에 " +

            "QR 코드를 맞춰주세요.";


    }


    catch(error) {


        console.error(error);


        status.innerHTML =

            "❌ 카메라를 사용할 수 없습니다." +

            "<br><br>" +

            "카메라 권한을 허용해주세요.";


    }

}



/* =====================================================
   정답 확인
===================================================== */

function checkAnswer(value) {


    /*
       이미 성공했다면
       무시
    */

    if (gameCompleted) {

        return;

    }


    const received =
        String(value)
        .trim()
        .toUpperCase();


    const correct =
        CORRECT_CODE
        .trim()
        .toUpperCase();


    /*
       ==========================================
       정답
       ==========================================
    */

    if (
        received === correct
    ) {


        gameCompleted =
            true;


        /*
           QR 카메라 정지
        */

        stopQR();


        /*
           NFC 이벤트 정지
        */

        if (ndef) {

            try {

                ndef.onreading =
                    null;

            }

            catch(e) {}

        }


        /*
           성공 화면
        */

        successScreen.style.display =
            "flex";


        status.innerHTML =

            "✅ 정답입니다!";


        return;

    }



    /*
       ==========================================
       오답
       ==========================================
    */


    if (
        currentMethod === "NFC"
    ) {


        /*
           NFC
        */

        status.innerHTML =

            "❌ 틀렸습니다." +

            "<br><br>" +

            "다시 NFC 태그를 읽어주세요.";


        /*
           NFC Reader는
           계속 살아 있으므로
           다시 자동 대기한다.
        */

        setTimeout(
            function() {


                if (
                    !gameCompleted &&
                    currentMethod === "NFC"
                ) {


                    status.innerHTML =

                        "📡 NFC 대기 중..." +

                        "<br><br>" +

                        "다시 NFC 태그를 대주세요.";

                }


            },
            1200
        );


    }


    else {


        /*
           QR
        */

        status.innerHTML =

            "❌ 틀렸습니다." +

            "<br><br>" +

            "다시 QR 코드를 스캔해주세요.";


        /*
           QR 카메라는
           계속 켜져 있으므로
           자동으로 다시 찾는다.
        */

    }

}



/* =====================================================
   QR 정지
===================================================== */

async function stopQR() {


    if (
        html5QrCode
    ) {


        try {


            await html5QrCode.stop();


        }


        catch(error) {


            console.log(
                "QR 카메라 종료:",
                error
            );

        }


        try {


            await html5QrCode.clear();


        }


        catch(error) {


            console.log(
                "QR 화면 정리:",
                error
            );

        }


        html5QrCode =
            null;

    }


}



/* =====================================================
   뒤로가기
===================================================== */

backButton.addEventListener(
    "click",
    async function() {


        /*
           QR 종료
        */

        await stopQR();


        /*
           NFC 종료
        */

        if (ndef) {

            try {

                ndef.onreading =
                    null;

            }

            catch(e) {}

        }


        currentMethod =
            null;


        gameCompleted =
            false;


        /*
           QR 숨기기
        */

        qrArea.style.display =
            "none";


        /*
           선택 화면
        */

        methodSelect.style.display =
            "flex";


        /*
           뒤로 버튼 숨기기
        */

        backButton.style.display =
            "none";


        instruction.innerHTML =

            "NFC 또는 QR 코드를 선택하세요.";


        status.innerHTML =

            "NFC 또는 QR을 선택해주세요.";

    }
);



/* =====================================================
   다음 단계
===================================================== */

continueButton.addEventListener(
    "click",
    function() {


        successScreen.style.display =
            "none";


        /*
           현재는 테스트용으로
           다음 단계 문구만 표시한다.
           
           실제 게임에서는
           여기서 다음 페이지로
           이동시키면 된다.

           예:

           window.location.href =
           "stage2.html";
        */


        instruction.innerHTML =

            "🎉 다음 단계입니다!";


        status.innerHTML =

            "다음 단계의 NFC 또는 QR 코드를 선택해주세요.";


        methodSelect.style.display =
            "flex";


        backButton.style.display =
            "none";


        currentMethod =
            null;


        gameCompleted =
            false;


    }
);


</script>


</body>

</html>
