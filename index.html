<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111d">

<title>PIXEL ADVENTURE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080c;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:min(100vw,520px);
  height:100dvh;
  overflow:hidden;
  background:#101820;
  color:#fff;
  touch-action:manipulation;
}

#camera{
  position:absolute;
  inset:0;
  overflow:hidden;
  will-change:transform;
}

#world{
  position:absolute;
  inset:0;
  overflow:hidden;
}

/* =========================
   하늘
========================= */

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  z-index:1;
  transform-origin:center center;
  will-change:transform;
}

/* =========================
   뒤 풀밭
========================= */

#backLayer{
  position:absolute;
  left:-10%;
  width:120%;
  height:78%;
  bottom:3%;
  object-fit:fill;
  z-index:2;
  pointer-events:none;
  transform-origin:center bottom;
  will-change:transform;
}

/* =========================
   안개
========================= */

#farHaze{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0) 42%,
      rgba(255,255,255,.015) 55%,
      rgba(70,110,60,.04) 75%,
      rgba(20,35,15,.12) 100%
    );
}

/* =========================
   몬스터
========================= */

#monsterWrap{
  position:absolute;
  left:50%;
  top:13%;
  width:82%;
  aspect-ratio:1 / 1;
  transform:
    translateX(-50%)
    scale(.30);
  transform-origin:50% 80%;
  opacity:.2;
  z-index:6;
  will-change:transform,opacity;
}

#monster{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  image-rendering:pixelated;
  filter:
    drop-shadow(
      0 14px 10px
      rgba(0,0,0,.48)
    );
  will-change:transform,filter;
}

/* =========================
   몬스터 피격
========================= */

#monster.hit{
  animation:
    monsterHit
    .88s
    steps(9,end);
}

@keyframes monsterHit{
  0%{
    transform:translate(0,0) rotate(0);
    filter:brightness(1);
  }

  9%{
    transform:
      translate(-20px,7px)
      rotate(-5deg)
      scale(1.03);
    filter:
      brightness(3.5)
      saturate(2.4);
  }

  20%{
    transform:
      translate(22px,-9px)
      rotate(5deg)
      scale(1.05);
    filter:
      brightness(3.7)
      saturate(2.5);
  }

  31%{
    transform:
      translate(-21px,9px)
      rotate(-5deg);
    filter:
      brightness(3.4)
      saturate(2.4);
  }

  42%{
    transform:
      translate(19px,-8px)
      rotate(5deg);
    filter:
      brightness(3.1)
      saturate(2.3);
  }

  53%{
    transform:
      translate(-16px,7px)
      rotate(-4deg);
    filter:
      brightness(2.7)
      saturate(2);
  }

  64%{
    transform:
      translate(13px,-6px)
      rotate(3deg);
    filter:
      brightness(2.3)
      saturate(1.8);
  }

  76%{
    transform:
      translate(-9px,4px)
      rotate(-2deg);
    filter:
      brightness(1.8);
  }

  88%{
    transform:
      translate(5px,-2px)
      rotate(1deg);
    filter:
      brightness(1.35);
  }

  100%{
    transform:
      translate(0,0)
      rotate(0);
    filter:
      brightness(1);
  }
}

/* =========================
   몬스터 사망
========================= */

#monster.dead{
  animation:
    monsterDead
    1.2s
    ease-out
    forwards;
}

@keyframes monsterDead{
  0%{
    opacity:1;
    transform:translate(0,0) scale(1);
    filter:brightness(1);
  }

  12%{
    transform:
      translate(-20px,7px)
      rotate(-5deg);
    filter:
      brightness(3.3)
      saturate(2);
  }

  24%{
    transform:
      translate(21px,-8px)
      rotate(5deg);
    filter:
      brightness(2.8);
  }

  38%{
    transform:
      translate(-18px,7px)
      rotate(-4deg);
    filter:
      brightness(2.2);
  }

  52%{
    transform:
      translate(14px,-6px)
      rotate(4deg);
    filter:
      brightness(1.8);
  }

  68%{
    transform:
      translate(-10px,4px)
      rotate(-2deg)
      scale(.97);
    opacity:.72;
  }

  82%{
    transform:
      translate(6px,-3px)
      rotate(1deg)
      scale(.92);
    opacity:.35;
  }

  100%{
    transform:
      translate(0,0)
      rotate(0)
      scale(.87);
    opacity:0;
    filter:brightness(1);
  }
}

/* =========================
   앞 풀밭
========================= */

#frontLayer{
  position:absolute;
  left:-10%;
  width:120%;
  height:63%;
  bottom:-4%;
  object-fit:fill;
  z-index:8;
  pointer-events:none;
  transform-origin:center bottom;
  will-change:transform;
}

/* =========================
   칼
========================= */

#sword{
  position:absolute;
  z-index:25;

  /*
    화면 오른쪽 아래를
    두 번째 사진처럼 크게 차지
  */

  right:-27%;
  bottom:-17%;

  width:142%;
  height:125%;

  object-fit:contain;
  object-position:right bottom;

  transform-origin:82% 91%;

  filter:
    drop-shadow(
      0 8px 10px
      rgba(0,0,0,.72)
    );

  will-change:transform;
  pointer-events:none;
}

/* =========================
   칼 숨쉬기 Idle
========================= */

#sword.idle{
  animation:
    swordIdle
    1.7s
    ease-in-out
    infinite;
}

@keyframes swordIdle{
  0%,100%{
    transform:
      translateY(0)
      rotate(-18deg)
      scale(1);
  }

  50%{
    transform:
      translateY(-13px)
      rotate(-15.5deg)
      scale(1.008);
  }
}

/* =========================
   칼 이동
========================= */

#sword.walking{
  animation:
    swordWalk
    .68s
    ease-in-out
    infinite
    alternate;
}

@keyframes swordWalk{
  from{
    transform:
      rotate(-20deg)
      translateY(7px)
      scale(1);
  }

  to{
    transform:
      rotate(14deg)
      translateY(-7px)
      scale(1);
  }
}

/* =========================
   칼 공격
========================= */

#sword.attack{
  animation:
    swordSlash
    .34s
    cubic-bezier(.12,.9,.2,1)
    forwards;
}

@keyframes swordSlash{
  0%{
    transform:
      rotate(-18deg)
      translate(0,0)
      scale(1);
  }

  14%{
    transform:
      rotate(-43deg)
      translate(-15px,8px)
      scale(1.03);
  }

  47%{
    transform:
      rotate(57deg)
      translate(-42px,-34px)
      scale(1.16);
  }

  68%{
    transform:
      rotate(34deg)
      translate(-17px,-15px)
      scale(1.08);
  }

  100%{
    transform:
      rotate(-18deg)
      translate(0,0)
      scale(1);
  }
}

/* =========================
   베기 효과
========================= */

#slash{
  position:absolute;
  z-index:24;
  right:0;
  bottom:18%;
  width:85%;
  height:68%;
  opacity:0;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 70% 55%,
      rgba(255,255,255,.95) 0 2%,
      rgba(255,225,110,.85) 3% 5%,
      transparent 7%
    ),
    conic-gradient(
      from 205deg at 70% 55%,
      transparent 0 19%,
      rgba(255,245,190,.95) 20% 23%,
      rgba(255,180,40,.8) 24% 28%,
      transparent 29% 100%
    );

  filter:blur(.3px);
  transform:rotate(-18deg);
  mix-blend-mode:screen;
}

#slash.on{
  animation:
    slashFx
    .34s
    ease-out
    forwards;
}

@keyframes slashFx{
  0%{
    opacity:0;
    transform:
      rotate(-25deg)
      scale(.55);
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      rotate(20deg)
      scale(1.18);
  }
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  z-index:50;
  left:5%;
  right:5%;
  top:12px;
  display:flex;
  gap:8px;
  justify-content:space-between;
  text-shadow:
    0 2px 3px #000;
}

.unit{
  width:48%;
}

.lab{
  font-size:12px;
  font-weight:900;
  margin-bottom:3px;
}

.bar{
  height:14px;
  border:
    2px solid #fff;
  border-radius:5px;
  background:#220b0b;
  overflow:hidden;
  box-shadow:
    0 2px 6px #000;
}

.fill{
  height:100%;
  transition:
    width .18s;
}

#pf{
  background:
    linear-gradient(
      #ff6868,
      #c41414
    );
  width:100%;
}

#ef{
  background:
    linear-gradient(
      #bd76ff,
      #6320a5
    );
  width:100%;
}

#pb.blink,
#eb.blink{
  animation:
    hpBlink
    .32s
    steps(2,end);
}

@keyframes hpBlink{
  50%{
    filter:brightness(2.8);
  }
}

/* =========================
   NFC
========================= */

#nfc{
  position:absolute;
  z-index:55;
  top:48px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.6);
  border:
    1px solid
    rgba(255,255,255,.35);
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  box-shadow:
    0 3px 10px
    rgba(0,0,0,.35);
}

#dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ffd84d;
  margin-right:5px;
}

/* =========================
   TOAST
========================= */

#toast{
  position:absolute;
  z-index:70;
  left:50%;
  bottom:88px;
  transform:
    translateX(-50%)
    translateY(16px);
  opacity:0;
  padding:8px 13px;
  border-radius:10px;
  background:rgba(0,0,0,.78);
  border:
    1px solid
    rgba(255,255,255,.3);
  font-size:12px;
  white-space:nowrap;
  transition:.18s;
}

#toast.show{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   DAMAGE
========================= */

#dmg{
  position:absolute;
  z-index:65;
  left:65%;
  top:42%;
  font-size:38px;
  font-weight:1000;
  color:#fff;
  text-shadow:
    0 0 4px #900,
    3px 3px 0 #d00;
  opacity:0;
  pointer-events:none;
}

#dmg.show{
  animation:
    dmgPop
    .65s
    ease-out;
}

@keyframes dmgPop{
  0%{
    opacity:0;
    transform:
      scale(.5)
      translateY(15px);
  }

  20%{
    opacity:1;
    transform:
      scale(1.35)
      translateY(0);
  }

  100%{
    opacity:0;
    transform:
      scale(1)
      translateY(-50px);
  }
}

/* =========================
   RED FLASH
========================= */

#red{
  position:absolute;
  inset:0;
  z-index:60;
  background:
    rgba(255,0,0,.58);
  opacity:0;
  pointer-events:none;
}

#red.on{
  animation:
    redHit
    .62s
    ease-out;
}

@keyframes redHit{
  0%{
    opacity:.98;
  }

  18%{
    opacity:.85;
  }

  38%{
    opacity:.62;
  }

  58%{
    opacity:.34;
  }

  100%{
    opacity:0;
  }
}

/* =========================
   BATTLE START
========================= */

#battle{
  position:absolute;
  z-index:70;
  left:50%;
  top:50%;
  transform:
    translate(-50%,-50%)
    scale(.7)
    skewX(-8deg);
  opacity:0;
  padding:10px 22px;
  background:
    linear-gradient(
      90deg,
      #9b0909,
      #ff4b13,
      #9b0909
    );
  border:
    3px solid
    #ffdf52;
  color:#fff;
  font-size:27px;
  font-weight:1000;
  white-space:nowrap;
  text-shadow:
    0 3px 4px
    #4b0000;
  box-shadow:
    0 0 20px
    rgba(255,80,0,.65);
}

#battle.show{
  animation:
    battleIn
    .8s
    ease-out;
}

@keyframes battleIn{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1.8)
      skewX(-8deg);
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1)
      skewX(-8deg);
  }
}

/* =========================
   CLEAR
========================= */

#clear{
  position:absolute;
  inset:0;
  z-index:90;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    rgba(0,0,0,.2);
  opacity:0;
  pointer-events:none;
}

#clear.show{
  opacity:1;
  transition:.3s;
}

.cb{
  padding:18px 25px;
  text-align:center;
  background:
    linear-gradient(
      #ffdf65,
      #a85a08
    );
  border:
    4px solid
    #fff1a4;
  border-radius:14px;
  box-shadow:
    0 0 35px
    rgba(255,200,50,.8),
    inset 0 0 20px
    rgba(255,255,255,.25);
  text-shadow:
    0 4px 4px
    #6b2b00;
}

.ct{
  font-size:34px;
  font-weight:1000;
}

.cs{
  font-size:15px;
  margin-top:7px;
  font-weight:800;
}

/* =========================
   START
========================= */

#start{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      rgba(0,0,0,.2),
      rgba(0,0,0,.58)
    );
  text-align:center;
}

#start.hidden{
  display:none;
}

.startBox{
  width:86%;
  max-width:380px;
  padding:20px 16px;
  border-radius:18px;
  background:
    rgba(5,12,20,.65);
  border:
    1px solid
    rgba(255,255,255,.3);
  backdrop-filter:blur(5px);
}

.startBox h1{
  margin:0 0 10px;
  font-size:31px;
  letter-spacing:2px;
  color:#ffe17a;
  text-shadow:
    0 3px 4px
    #6b3500;
}

.startBox p{
  font-size:13px;
  line-height:1.6;
  color:#eee;
}

#go{
  border:0;
  border-radius:11px;
  padding:14px 28px;
  font-size:18px;
  font-weight:1000;
  color:#fff;
  background:
    linear-gradient(
      #f7a62b,
      #b94d08
    );
  box-shadow:
    0 4px 0
    #6d2904;
  cursor:pointer;
}

#go:active{
  transform:translateY(3px);
  box-shadow:
    0 1px 0
    #6d2904;
}

/* =========================
   KAKAO → CHROME 안내
========================= */

#chromeGuide{
  position:absolute;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    rgba(0,0,0,.78);
  backdrop-filter:blur(5px);
}

#chromeGuide.show{
  display:flex;
}

.chromeBox{
  width:100%;
  max-width:360px;
  padding:25px 20px 22px;
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      #182635,
      #09121c
    );
  border:
    1px solid
    rgba(255,255,255,.25);
  box-shadow:
    0 15px 45px
    rgba(0,0,0,.65);
  text-align:center;
}

.chromeIcon{
  width:58px;
  height:58px;
  margin:0 auto 14px;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #4285f4 0 33%,
      #34a853 33% 66%,
      #fbbc05 66% 100%
    );
  border:4px solid #fff;
  box-shadow:
    0 4px 15px
    rgba(0,0,0,.4);
}

.chromeBox h2{
  margin:0 0 10px;
  font-size:22px;
}

.chromeBox p{
  margin:0 0 19px;
  color:#ddd;
  font-size:14px;
  line-height:1.65;
}

#chromeBtn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px 10px;
  background:
    linear-gradient(
      #4285f4,
      #1769d1
    );
  color:#fff;
  font-size:17px;
  font-weight:900;
  box-shadow:
    0 4px 0 #0b438c;
}

#chromeBtn:active{
  transform:translateY(3px);
  box-shadow:
    0 1px 0 #0b438c;
}

/* =========================
   CAMERA SHAKE
========================= */

#camera.shake{
  animation:
    cameraShake
    .88s
    steps(9,end);
}

@keyframes cameraShake{
  0%{
    transform:translate(0);
  }

  10%{
    transform:
      translate(-13px,8px);
  }

  21%{
    transform:
      translate(15px,-8px);
  }

  32%{
    transform:
      translate(-14px,9px);
  }

  43%{
    transform:
      translate(13px,-8px);
  }

  54%{
    transform:
      translate(-11px,7px);
  }

  65%{
    transform:
      translate(9px,-5px);
  }

  76%{
    transform:
      translate(-7px,4px);
  }

  88%{
    transform:
      translate(4px,-2px);
  }

  100%{
    transform:
      translate(0);
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="camera">

    <div id="world">

      <!-- 하늘 -->
      <img
        id="bg"
        src="https://static.wixstatic.com/media/172435_d6012f4ec1594a17858298879561b509~mv2.png"
        alt=""
      >

      <!-- 뒤 풀밭 -->
      <img
        id="backLayer"
        src="https://static.wixstatic.com/media/172435_54aea94be0ae4c5eb4a1f5fa3f56e7ea~mv2.png"
        alt=""
      >

      <div id="farHaze"></div>

      <!-- 몬스터 -->
      <div id="monsterWrap">

        <img
          id="monster"
          src="https://static.wixstatic.com/media/172435_02b890fad23e48b29d15ad67934eda6d~mv2.png"
          alt=""
        >

      </div>

      <!-- 앞 풀밭 -->
      <img
        id="frontLayer"
        src="https://static.wixstatic.com/media/172435_b05f44aab7384d4ead52127131d3fe8c~mv2.png"
        alt=""
      >

    </div>

    <!-- 베기 효과 -->
    <div id="slash"></div>

    <!-- 칼 -->
    <img
      id="sword"
      src="https://static.wixstatic.com/media/172435_1c16a5d4f8ca44d8a558923200659bb7~mv2.png"
      alt=""
    >

  </div>


  <!-- HUD -->

  <div id="hud">

    <div class="unit">

      <div class="lab">
        HP <span id="pt">100 / 100</span>
      </div>

      <div class="bar" id="pb">
        <div class="fill" id="pf"></div>
      </div>

    </div>

    <div class="unit">

      <div class="lab">
        MONSTER HP
        <span id="et">80 / 80</span>
      </div>

      <div class="bar" id="eb">
        <div class="fill" id="ef"></div>
      </div>

    </div>

  </div>


  <!-- NFC -->

  <div id="nfc">
    <span id="dot"></span>
    <span id="nt">NFC 준비 중</span>
  </div>


  <div id="toast"></div>

  <div id="dmg">-16</div>

  <div id="red"></div>

  <div id="battle">
    BATTLE START!
  </div>


  <!-- CLEAR -->

  <div id="clear">

    <div class="cb">

      <div class="ct">
        MISSION CLEAR!
      </div>

      <div class="cs">
        몬스터가 쓰러졌습니다!
      </div>

    </div>

  </div>


  <!-- GAME START -->

  <div id="start">

    <div class="startBox">

      <h1>
        PIXEL ADVENTURE
      </h1>

      <p>
        게임 시작과 동시에 앞으로 전진합니다.<br>
        NFC는 걷는 동안에도 사용할 수 있습니다.<br>
        몬스터 앞에 도착하면 NFC 공격이 데미지가 됩니다.
      </p>

      <button id="go">
        GAME START
      </button>

    </div>

  </div>


  <!-- =================================================
       카카오톡 → Chrome 안내
  ================================================== -->

  <div id="chromeGuide">

    <div class="chromeBox">

      <div class="chromeIcon"></div>

      <h2>
        Chrome으로 연결합니다
      </h2>

      <p>
        이 게임의 NFC 기능은<br>
        Chrome 브라우저에서 실행해야 합니다.<br><br>
        아래 버튼을 눌러 Chrome으로 이동해주세요.
      </p>

      <button id="chromeBtn">
        Chrome으로 연결하기
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   기본 변수
===================================================== */

const $ =
  id => document.getElementById(id);

let started = false;
let battle = false;
let won = false;

let nfcOn = false;
let lastTag = 0;

let walkStart = 0;
let raf = 0;
let enemyTimer = null;

let pHP = 100;
let eHP = 80;


/* =====================================================
   카카오톡 인앱 브라우저 감지
===================================================== */

function isKakaoBrowser(){

  const ua =
    navigator.userAgent || '';

  return (
    /KAKAOTALK/i.test(ua) ||
    /KakaoTalk/i.test(ua) ||
    /; wv\)/i.test(ua)
  );

}


/* =====================================================
   Android인지 확인
===================================================== */

function isAndroid(){

  return /Android/i.test(
    navigator.userAgent || ''
  );

}


/* =====================================================
   Chrome인지 확인
===================================================== */

function isChrome(){

  const ua =
    navigator.userAgent || '';

  return (
    /Chrome/i.test(ua) &&
    !/Edge|Edg|OPR|SamsungBrowser/i.test(ua)
  );

}


/* =====================================================
   Chrome으로 열기
===================================================== */

function openChrome(){

  const currentURL =
    window.location.href;

  if(isAndroid()){

    const withoutScheme =
      currentURL.replace(
        /^https?:\/\//i,
        ''
      );

    const intentURL =
      'intent://' +
      withoutScheme +
      '#Intent;' +
      'scheme=https;' +
      'package=com.android.chrome;' +
      'end';

    window.location.href =
      intentURL;

  }
  else{

    /*
      iPhone에서는 Chrome 앱으로
      강제 이동할 수 없는 경우가 있으므로
      일반 브라우저 열기 시도
    */

    window.open(
      currentURL,
      '_blank'
    );

  }

}


/* =====================================================
   페이지 로딩 즉시 카카오톡 검사
===================================================== */

(function(){

  if(isKakaoBrowser()){

    /*
      카카오톡 안에서는 게임 시작 화면보다
      Chrome 안내가 먼저 뜬다.
    */

    $('chromeGuide')
      .classList
      .add('show');

  }

})();


/* =====================================================
   Chrome 버튼
===================================================== */

$('chromeBtn').onclick =
  function(){

    openChrome();

  };


/* =====================================================
   TOAST
===================================================== */

function toast(text){

  $('toast').textContent =
    text;

  $('toast')
    .classList
    .add('show');

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () => {

        $('toast')
          .classList
          .remove('show');

      },
      1200
    );

}


/* =====================================================
   HP
===================================================== */

function hp(){

  $('pf').style.width =
    pHP + '%';

  $('ef').style.width =
    (eHP / 80 * 100) + '%';

  $('pt').textContent =
    pHP + ' / 100';

  $('et').textContent =
    eHP + ' / 80';

}


function blink(el){

  el.classList
    .remove('blink');

  void el.offsetWidth;

  el.classList
    .add('blink');

}


/* =====================================================
   CAMERA SHAKE
===================================================== */

function shake(){

  $('camera')
    .classList
    .remove('shake');

  void $('camera').offsetWidth;

  $('camera')
    .classList
    .add('shake');

}


/* =====================================================
   적 피격 진동
   딱 한 번만 90ms
===================================================== */

function strongEnemyVibe(){

  if(
    navigator.vibrate
  ){

    navigator.vibrate(90);

  }

}


/* =====================================================
   플레이어 피격
===================================================== */

function playerHit(){

  if(
    won ||
    pHP <= 0
  ){

    return;

  }

  pHP =
    Math.max(
      0,
      pHP - 5
    );

  hp();

  blink(
    $('pb')
  );

}


/* =====================================================
   몬스터 피격
===================================================== */

function monsterDamage(){

  if(
    !battle ||
    won ||
    pHP <= 0
  ){

    return;

  }

  eHP =
    Math.max(
      0,
      eHP - 16
    );

  hp();

  blink(
    $('eb')
  );


  /* 진동 한 번 */

  strongEnemyVibe();


  /* 강한 화면 흔들림 */

  shake();


  /* 빨간 플래시 */

  $('red')
    .classList
    .remove('on');

  void $('red').offsetWidth;

  $('red')
    .classList
    .add('on');


  /* 몬스터 피격 */

  $('monster')
    .classList
    .remove(
      'hit',
      'dead'
    );

  void $('monster').offsetWidth;

  $('monster')
    .classList
    .add('hit');


  /* 데미지 숫자 */

  $('dmg')
    .classList
    .remove('show');

  void $('dmg').offsetWidth;

  $('dmg')
    .classList
    .add('show');


  if(
    eHP <= 0
  ){

    win();

  }

}


/* =====================================================
   NFC 공격
===================================================== */

function attack(){

  if(
    won ||
    pHP <= 0
  ){

    return;

  }


  $('sword')
    .classList
    .remove(
      'attack',
      'idle',
      'walking'
    );


  $('slash')
    .classList
    .remove('on');


  void $('sword').offsetWidth;
  void $('slash').offsetWidth;


  $('sword')
    .classList
    .add('attack');


  $('slash')
    .classList
    .add('on');


  if(battle){

    toast(
      'NFC 인식! 검 공격!'
    );

    monsterDamage();

  }
  else{

    toast(
      'NFC 인식! 검을 휘둘렀습니다!'
    );

  }


  /*
    공격이 끝나면
    반드시 다시 idle
  */

  setTimeout(
    () => {

      if(
        !won &&
        started
      ){

        $('sword')
          .classList
          .remove(
            'attack',
            'walking'
          );

        $('sword')
          .classList
          .add('idle');

      }

    },
    360
  );

}


/* =====================================================
   승리
===================================================== */

function win(){

  won = true;

  clearInterval(
    enemyTimer
  );

  $('monster')
    .classList
    .remove('hit');

  $('monster')
    .classList
    .add('dead');

  $('sword')
    .classList
    .remove(
      'idle',
      'walking',
      'attack'
    );

  setTimeout(
    () => {

      $('clear')
        .classList
        .add('show');

    },
    900
  );

}


/* =====================================================
   전투 시작
===================================================== */

function battleStart(){

  if(
    battle ||
    won
  ){

    return;

  }

  battle = true;

  $('battle')
    .classList
    .remove('show');

  void $('battle').offsetWidth;

  $('battle')
    .classList
    .add('show');

  toast(
    '몬스터 앞에 도착했습니다!'
  );

  /*
    몬스터가 공격
  */

  enemyTimer =
    setInterval(
      playerHit,
      1700
    );

}


/* =====================================================
   이동
===================================================== */

function walk(now){

  if(
    !started ||
    won
  ){

    return;

  }


  if(
    !walkStart
  ){

    walkStart =
      now;

  }


  const t =
    Math.min(
      (now - walkStart) / 8000,
      1
    );


  /* 하늘 */

  const bgScale =
    1.02 + t * .28;

  const bgX =
    -t * 1.5;

  const bgY =
    -t * 2;

  $('bg').style.transform =
    'translate(' +
    bgX +
    '%,' +
    bgY +
    '%) scale(' +
    bgScale +
    ')';


  /* 뒤 풀밭 */

  $('backLayer').style.transform =
    'translate(' +
    (-t * 4) +
    '%,' +
    (-t * 2) +
    '%) scale(' +
    (1 + t * .16) +
    ')';


  /* 앞 풀밭 */

  $('frontLayer').style.transform =
    'translate(' +
    (-t * 7) +
    '%,' +
    (t * 2) +
    '%) scale(' +
    (1 + t * .14) +
    ')';


  /* 몬스터 접근 */

  const monsterScale =
    .30 + t * 1.70;

  const monsterY =
    2 + t * 29;

  $('monsterWrap').style.transform =
    'translate(-50%,' +
    monsterY +
    '%) scale(' +
    monsterScale +
    ')';

  $('monsterWrap').style.opacity =
    Math.min(
      1,
      .25 + t * 1.1
    );


  /* 전투 */

  if(
    t >= 1
  ){

    battleStart();

    return;

  }


  raf =
    requestAnimationFrame(
      walk
    );

}


/* =====================================================
   NFC 시작
===================================================== */

async function startNFC(){

  if(
    !window.isSecureContext ||
    location.protocol !== 'https:'
  ){

    $('nt').textContent =
      'HTTPS 필요';

    toast(
      'HTTPS 주소에서 실행해주세요.'
    );

    return false;

  }


  if(
    !('NDEFReader' in window)
  ){

    $('nt').textContent =
      'NFC 미지원';

    toast(
      'Android Chrome에서 Web NFC를 사용할 수 있습니다.'
    );

    return false;

  }


  if(nfcOn){

    return true;

  }


  try{

    const reader =
      new NDEFReader();


    await reader.scan();


    nfcOn = true;


    $('nt').textContent =
      'NFC 대기 중';


    $('dot').style.background =
      '#49ef6a';


    reader.onreadingerror =
      () => {

        toast(
          'NFC 읽기 오류'
        );

      };


    reader.onreading =
      () => {

        const now =
          Date.now();


        /*
          같은 태그가 연속으로 읽혀서
          공격이 여러 번 들어가는 것 방지
        */

        if(
          now - lastTag < 650
        ){

          return;

        }


        lastTag =
          now;


        attack();

      };


    return true;

  }
  catch(e){

    $('nt').textContent =
      'NFC 권한 확인';

    toast(
      'Chrome에서 NFC 권한을 허용해주세요.'
    );

    return false;

  }

}


/* =====================================================
   GAME START
===================================================== */

$('go').onclick =
  async function(){

    /*
      혹시 카카오톡에서 이 버튼까지
      도달하더라도 다시 한번 차단
    */

    if(isKakaoBrowser()){

      $('chromeGuide')
        .classList
        .add('show');

      return;

    }


    /*
      Android인데 Chrome이 아니면
      Chrome으로 이동
    */

    if(
      isAndroid() &&
      !isChrome()
    ){

      openChrome();

      return;

    }


    const nfcReady =
      await startNFC();


    started = true;

    $('start')
      .classList
      .add('hidden');


    pHP = 100;
    eHP = 80;

    hp();


    /*
      게임 시작할 때는
      칼을 살짝 움직이면서 이동
    */

    $('sword')
      .classList
      .add('walking');


    walkStart = 0;


    cancelAnimationFrame(
      raf
    );


    raf =
      requestAnimationFrame(
        walk
      );

  };


/* 초기 HP */

hp();

</script>

</body>
</html>
