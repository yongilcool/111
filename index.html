<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111d">

<title>PIXEL ADVENTURE</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080c;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:min(100vw,520px);
    height:100dvh;
    max-height:1000px;
    overflow:hidden;
    background:#101820;
    color:#fff;
    touch-action:manipulation;
}


/* =====================================================
   CAMERA
===================================================== */

#camera{
    position:absolute;
    inset:0;
    overflow:hidden;
    will-change:transform;
}

#world{
    position:absolute;
    inset:0;
    overflow:hidden;
}


/* =====================================================
   SKY
   하늘은 거의 고정
===================================================== */

#bg{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center top;

    z-index:1;

    transform:scale(1.01);

    transform-origin:center center;

    will-change:transform;
}


/* =====================================================
   BACK LAYER
   산 / 뒤쪽 풀밭
===================================================== */

#backLayer{
    position:absolute;

    left:-6%;

    width:112%;
    height:61%;

    bottom:3%;

    object-fit:cover;
    object-position:center bottom;

    z-index:2;

    pointer-events:none;

    transform-origin:center bottom;

    will-change:transform;
}


/* =====================================================
   HAZE
===================================================== */

#farHaze{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0) 0%,
            rgba(255,255,255,0) 45%,
            rgba(255,255,255,.025) 56%,
            rgba(80,120,70,.04) 76%,
            rgba(25,40,20,.10) 100%
        );
}


/* =====================================================
   FRONT GRASS
   가장 가까운 풀밭
===================================================== */

#frontLayer{
    position:absolute;

    left:-13%;

    width:126%;
    height:65%;

    bottom:-1%;

    object-fit:cover;
    object-position:center top;

    z-index:5;

    pointer-events:none;

    transform-origin:50% 80%;

    will-change:transform;
}


/* =====================================================
   MONSTER SHADOW

   ★ 추가
   몬스터 발 바로 아래 그림자.
   공중에 떠 보이는 느낌을 줄여줌.
===================================================== */

#monsterShadow{
    position:absolute;

    left:50%;
    bottom:22.5%;

    width:28%;
    height:4%;

    transform:
        translateX(-50%)
        scale(.2);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,.45) 0%,
            rgba(0,0,0,.26) 45%,
            rgba(0,0,0,0) 75%
        );

    opacity:.1;

    z-index:6;

    filter:blur(4px);

    will-change:
        transform,
        opacity,
        bottom;
}


/* =====================================================
   MONSTER

   ★ 수정 핵심

   top 기준 제거.
   bottom 기준으로 이동.

   그래서 몬스터의 발이
   풀밭 위에 붙은 상태로 접근함.
===================================================== */

#monsterWrap{
    position:absolute;

    left:50%;

    /*
        게임 시작 시 멀리 있는 위치
    */
    bottom:48%;

    width:64%;

    aspect-ratio:1 / 1;

    transform:
        translateX(-50%)
        scale(.17);

    /*
        발쪽을 중심으로 확대
    */
    transform-origin:
        50% 88%;

    opacity:.20;

    z-index:7;

    will-change:
        transform,
        opacity,
        bottom;
}


#monster{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    image-rendering:pixelated;

    filter:
        drop-shadow(
            0 8px 7px
            rgba(0,0,0,.38)
        );

    will-change:
        transform,
        filter,
        opacity;
}


/* =====================================================
   MONSTER HIT
===================================================== */

#monster.hit{
    animation:
        monsterHit
        .88s
        steps(9,end);
}


@keyframes monsterHit{

    0%{
        transform:
            translate(0,0)
            rotate(0);

        filter:
            brightness(1);
    }

    9%{
        transform:
            translate(-20px,7px)
            rotate(-5deg)
            scale(1.03);

        filter:
            brightness(3.5)
            saturate(2.4)
            drop-shadow(
                0 0 28px
                rgba(255,0,0,.95)
            );
    }

    20%{
        transform:
            translate(22px,-9px)
            rotate(5deg)
            scale(1.05);

        filter:
            brightness(3.8)
            saturate(2.6)
            drop-shadow(
                0 0 35px
                red
            );
    }

    31%{
        transform:
            translate(-21px,9px)
            rotate(-5deg);

        filter:
            brightness(3.3)
            saturate(2.3);
    }

    42%{
        transform:
            translate(19px,-8px)
            rotate(5deg);

        filter:
            brightness(3);
    }

    53%{
        transform:
            translate(-16px,7px)
            rotate(-4deg);

        filter:
            brightness(2.6);
    }

    64%{
        transform:
            translate(13px,-6px)
            rotate(3deg);

        filter:
            brightness(2.1);
    }

    76%{
        transform:
            translate(-9px,4px)
            rotate(-2deg);

        filter:
            brightness(1.7);
    }

    88%{
        transform:
            translate(5px,-2px)
            rotate(1deg);

        filter:
            brightness(1.3);
    }

    100%{
        transform:
            translate(0,0)
            rotate(0);

        filter:
            brightness(1);
    }
}


/* =====================================================
   MONSTER DEAD
===================================================== */

#monster.dead{
    animation:
        monsterDead
        1.2s
        ease-out
        forwards;
}


@keyframes monsterDead{

    0%{
        opacity:1;

        transform:
            translate(0,0)
            scale(1);

        filter:brightness(1);
    }

    12%{
        transform:
            translate(-20px,7px)
            rotate(-5deg);

        filter:
            brightness(3.4)
            saturate(2);
    }

    24%{
        transform:
            translate(21px,-8px)
            rotate(5deg);

        filter:
            brightness(2.8);
    }

    38%{
        transform:
            translate(-18px,7px)
            rotate(-4deg);

        filter:
            brightness(2.2);
    }

    52%{
        transform:
            translate(14px,-6px)
            rotate(4deg);

        opacity:.9;
    }

    68%{
        transform:
            translate(-10px,4px)
            rotate(-2deg)
            scale(.98);

        opacity:.68;
    }

    82%{
        transform:
            translate(6px,-3px)
            scale(.93);

        opacity:.32;
    }

    100%{
        transform:
            translate(0,0)
            scale(.88);

        opacity:0;
    }
}


/* =====================================================
   SWORD

   ★ 수정
   두 번째 참고사진처럼 처음부터 크게.
===================================================== */

#sword{
    position:absolute;

    z-index:25;

    /*
        오른쪽 아래에서 크게 보이게
    */
    right:-28%;
    bottom:-18%;

    width:170%;
    height:148%;

    object-fit:contain;
    object-position:right bottom;

    transform-origin:
        82% 91%;

    filter:
        drop-shadow(
            0 7px 10px
            rgba(0,0,0,.7)
        );

    will-change:transform;

    pointer-events:none;
}


/* =====================================================
   SWORD IDLE
===================================================== */

#sword.idle{
    animation:
        swordIdle
        1.7s
        ease-in-out
        infinite;
}


@keyframes swordIdle{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(-18deg)
            scale(1);
    }

    50%{
        transform:
            translateY(-9px)
            rotate(-16deg)
            scale(1.005);
    }
}


/* =====================================================
   WALKING SWORD
===================================================== */

#sword.walking{
    animation:
        swordWalk
        .68s
        ease-in-out
        infinite
        alternate;
}


@keyframes swordWalk{

    from{
        transform:
            rotate(-19deg)
            translateY(5px);
    }

    to{
        transform:
            rotate(10deg)
            translateY(-5px);
    }
}


/* =====================================================
   SWORD ATTACK
===================================================== */

#sword.attack{
    animation:
        swordSlash
        .34s
        cubic-bezier(.12,.9,.2,1)
        forwards;
}


@keyframes swordSlash{

    0%{
        transform:
            rotate(-18deg)
            translate(0,0)
            scale(1);
    }

    14%{
        transform:
            rotate(-43deg)
            translate(-15px,8px)
            scale(1.03);
    }

    47%{
        transform:
            rotate(57deg)
            translate(-42px,-34px)
            scale(1.16);
    }

    68%{
        transform:
            rotate(34deg)
            translate(-17px,-15px)
            scale(1.08);
    }

    100%{
        transform:
            rotate(-18deg)
            translate(0,0)
            scale(1);
    }
}


/* =====================================================
   SLASH
===================================================== */

#slash{
    position:absolute;

    z-index:24;

    right:0;
    bottom:18%;

    width:85%;
    height:68%;

    opacity:0;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at 70% 55%,
            rgba(255,255,255,.95) 0 2%,
            rgba(255,225,110,.85) 3% 5%,
            transparent 7%
        ),

        conic-gradient(
            from 205deg at 70% 55%,
            transparent 0 19%,
            rgba(255,245,190,.95) 20% 23%,
            rgba(255,180,40,.8) 24% 28%,
            transparent 29% 100%
        );

    transform:
        rotate(-18deg);

    mix-blend-mode:screen;
}


#slash.on{
    animation:
        slashFx
        .34s
        ease-out
        forwards;
}


@keyframes slashFx{

    0%{
        opacity:0;

        transform:
            rotate(-25deg)
            scale(.55);
    }

    30%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            rotate(20deg)
            scale(1.18);
    }
}


/* =====================================================
   HUD
===================================================== */

#hud{
    position:absolute;

    z-index:50;

    left:5%;
    right:5%;
    top:12px;

    display:flex;
    gap:8px;

    justify-content:space-between;

    text-shadow:
        0 2px 3px #000;
}

.unit{
    width:48%;
}

.lab{
    font-size:12px;
    font-weight:900;
    margin-bottom:3px;
}

.bar{
    height:14px;

    border:
        2px solid #fff;

    border-radius:5px;

    background:#220b0b;

    overflow:hidden;

    box-shadow:
        0 2px 6px #000;
}

.fill{
    height:100%;
    transition:width .18s;
}

#pf{
    background:
        linear-gradient(
            #ff6868,
            #c41414
        );

    width:100%;
}

#ef{
    background:
        linear-gradient(
            #bd76ff,
            #6320a5
        );

    width:100%;
}

#pb.blink,
#eb.blink{
    animation:
        hpBlink
        .32s
        steps(2,end);
}

@keyframes hpBlink{
    50%{
        filter:brightness(2.8);
    }
}


/* =====================================================
   NFC
===================================================== */

#nfc{
    position:absolute;

    z-index:55;

    top:48px;
    left:50%;

    transform:
        translateX(-50%);

    padding:7px 12px;

    border-radius:12px;

    background:
        rgba(0,0,0,.6);

    border:
        1px solid
        rgba(255,255,255,.35);

    font-size:12px;
    font-weight:700;

    white-space:nowrap;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.35);
}

#dot{
    display:inline-block;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffd84d;

    margin-right:5px;
}


/* =====================================================
   TOAST
===================================================== */

#toast{
    position:absolute;

    z-index:70;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(16px);

    opacity:0;

    padding:8px 13px;

    border-radius:10px;

    background:
        rgba(0,0,0,.78);

    border:
        1px solid
        rgba(255,255,255,.3);

    font-size:12px;

    white-space:nowrap;

    transition:.18s;
}

#toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =====================================================
   DAMAGE
===================================================== */

#dmg{
    position:absolute;

    z-index:65;

    left:65%;
    top:42%;

    font-size:38px;
    font-weight:1000;

    color:#fff;

    text-shadow:
        0 0 4px #900,
        3px 3px 0 #d00;

    opacity:0;

    pointer-events:none;
}

#dmg.show{
    animation:
        dmgPop
        .65s
        ease-out;
}

@keyframes dmgPop{

    0%{
        opacity:0;

        transform:
            scale(.5)
            translateY(15px);
    }

    20%{
        opacity:1;

        transform:
            scale(1.35)
            translateY(0);
    }

    100%{
        opacity:0;

        transform:
            scale(1)
            translateY(-50px);
    }
}


/* =====================================================
   RED FLASH
===================================================== */

#red{
    position:absolute;

    inset:0;

    z-index:60;

    background:
        rgba(255,0,0,.58);

    opacity:0;

    pointer-events:none;
}

#red.on{
    animation:
        redHit
        .62s
        ease-out;
}

@keyframes redHit{

    0%{opacity:.98;}
    18%{opacity:.85;}
    38%{opacity:.62;}
    58%{opacity:.34;}
    100%{opacity:0;}
}


/* =====================================================
   BATTLE START
===================================================== */

#battle{
    position:absolute;

    z-index:70;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.7)
        skewX(-8deg);

    opacity:0;

    padding:10px 22px;

    background:
        linear-gradient(
            90deg,
            #9b0909,
            #ff4b13,
            #9b0909
        );

    border:
        3px solid #ffdf52;

    color:#fff;

    font-size:27px;
    font-weight:1000;

    white-space:nowrap;

    text-shadow:
        0 3px 4px #4b0000;

    box-shadow:
        0 0 20px
        rgba(255,80,0,.65);
}

#battle.show{
    animation:
        battleIn
        .8s
        ease-out;
}

@keyframes battleIn{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.8)
            skewX(-8deg);
    }

    30%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1)
            skewX(-8deg);
    }
}


/* =====================================================
   CLEAR
===================================================== */

#clear{
    position:absolute;
    inset:0;

    z-index:90;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.2);

    opacity:0;

    pointer-events:none;
}

#clear.show{
    opacity:1;
    transition:.3s;
}

.cb{
    padding:18px 25px;

    text-align:center;

    background:
        linear-gradient(
            #ffdf65,
            #a85a08
        );

    border:
        4px solid #fff1a4;

    border-radius:14px;

    box-shadow:
        0 0 35px
        rgba(255,200,50,.8);

    text-shadow:
        0 4px 4px #6b2b00;
}

.ct{
    font-size:34px;
    font-weight:1000;
}

.cs{
    font-size:15px;
    margin-top:7px;
    font-weight:800;
}


/* =====================================================
   START
===================================================== */

#start{
    position:absolute;
    inset:0;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(0,0,0,.2),
            rgba(0,0,0,.58)
        );

    text-align:center;
}

#start.hidden{
    display:none;
}

.startBox{
    width:86%;
    max-width:380px;

    padding:20px 16px;

    border-radius:18px;

    background:
        rgba(5,12,20,.65);

    border:
        1px solid
        rgba(255,255,255,.3);

    backdrop-filter:
        blur(5px);
}

.startBox h1{
    margin:0 0 10px;

    font-size:31px;

    letter-spacing:2px;

    color:#ffe17a;

    text-shadow:
        0 3px 4px #6b3500;
}

.startBox p{
    font-size:13px;
    line-height:1.6;
    color:#eee;
}

#go{
    border:0;

    border-radius:11px;

    padding:14px 28px;

    font-size:18px;
    font-weight:1000;

    color:#fff;

    background:
        linear-gradient(
            #f7a62b,
            #b94d08
        );

    box-shadow:
        0 4px 0 #6d2904;

    cursor:pointer;
}


/* =====================================================
   CHROME GUIDE
===================================================== */

#chromeGuide{
    position:absolute;
    inset:0;

    z-index:300;

    display:none;

    align-items:center;
    justify-content:center;

    padding:22px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(5px);
}

#chromeGuide.show{
    display:flex;
}

.chromeBox{
    width:100%;
    max-width:360px;

    padding:25px 20px 22px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #182635,
            #09121c
        );

    border:
        1px solid
        rgba(255,255,255,.25);

    text-align:center;
}

#chromeBtn{
    width:100%;

    border:0;

    border-radius:11px;

    padding:14px 10px;

    background:
        linear-gradient(
            #4285f4,
            #1769d1
        );

    color:#fff;

    font-size:17px;

    font-weight:900;
}


/* =====================================================
   CAMERA SHAKE
===================================================== */

#camera.shake{
    animation:
        cameraShake
        .88s
        steps(9,end);
}

@keyframes cameraShake{

    0%{transform:translate(0);}

    10%{transform:translate(-13px,8px);}

    21%{transform:translate(15px,-8px);}

    32%{transform:translate(-14px,9px);}

    43%{transform:translate(13px,-8px);}

    54%{transform:translate(-11px,7px);}

    65%{transform:translate(9px,-5px);}

    76%{transform:translate(-7px,4px);}

    88%{transform:translate(4px,-2px);}

    100%{transform:translate(0);}
}

</style>
</head>

<body>

<div id="game">

    <div id="camera">

        <div id="world">

            <!-- 하늘 -->
            <img
                id="bg"
                src="https://static.wixstatic.com/media/172435_d6012f4ec1594a17858298879561b509~mv2.png"
                alt=""
            >

            <!-- 뒤 풀밭 -->
            <img
                id="backLayer"
                src="https://static.wixstatic.com/media/172435_54aea94be0ae4c5eb4a1f5fa3f56e7ea~mv2.png"
                alt=""
            >

            <div id="farHaze"></div>

            <!-- 맨앞 풀밭 -->
            <img
                id="frontLayer"
                src="https://static.wixstatic.com/media/172435_b05f44aab7384d4ead52127131d3fe8c~mv2.png"
                alt=""
            >

            <!-- 몬스터 발 그림자 -->
            <div id="monsterShadow"></div>

            <!-- 몬스터 -->
            <div id="monsterWrap">

                <img
                    id="monster"
                    src="https://static.wixstatic.com/media/172435_02b890fad23e48b29d15ad67934eda6d~mv2.png"
                    alt=""
                >

            </div>

        </div>


        <div id="slash"></div>


        <!-- 검 -->
        <img
            id="sword"
            src="https://static.wixstatic.com/media/172435_1c16a5d4f8ca44d8a558923200659bb7~mv2.png"
            alt=""
        >

    </div>


    <!-- HUD -->

    <div id="hud">

        <div class="unit">

            <div class="lab">
                HP
                <span id="pt">
                    100 / 100
                </span>
            </div>

            <div class="bar" id="pb">
                <div class="fill" id="pf"></div>
            </div>

        </div>


        <div class="unit">

            <div class="lab">

                MONSTER HP

                <span id="et">
                    80 / 80
                </span>

            </div>

            <div class="bar" id="eb">
                <div class="fill" id="ef"></div>
            </div>

        </div>

    </div>


    <!-- NFC -->

    <div id="nfc">

        <span id="dot"></span>

        <span id="nt">
            NFC 준비 중
        </span>

    </div>


    <div id="toast"></div>

    <div id="dmg">
        -16
    </div>

    <div id="red"></div>


    <div id="battle">
        BATTLE START!
    </div>


    <!-- CLEAR -->

    <div id="clear">

        <div class="cb">

            <div class="ct">
                MISSION CLEAR!
            </div>

            <div class="cs">
                몬스터가 쓰러졌습니다!
            </div>

        </div>

    </div>


    <!-- START -->

    <div id="start">

        <div class="startBox">

            <h1>
                PIXEL ADVENTURE
            </h1>

            <p>
                게임 시작과 동시에 앞으로 전진합니다.<br>
                NFC는 걷는 동안에도 사용할 수 있습니다.<br>
                몬스터 앞에 도착하면 NFC 공격이 데미지가 됩니다.
            </p>

            <button id="go">
                GAME START
            </button>

        </div>

    </div>


    <!-- CHROME GUIDE -->

    <div id="chromeGuide">

        <div class="chromeBox">

            <h2>
                Chrome으로 연결합니다
            </h2>

            <p>
                NFC 게임은 Chrome에서 실행해야 합니다.<br>
                아래 버튼을 눌러 Chrome으로 이동해주세요.
            </p>

            <button id="chromeBtn">
                Chrome으로 연결하기
            </button>

        </div>

    </div>

</div>


<script>

const $ =
    id => document.getElementById(id);


let started = false;
let battle = false;
let won = false;

let nfcOn = false;
let lastTag = 0;

let walkStart = 0;
let raf = 0;

let enemyTimer = null;

let pHP = 100;
let eHP = 80;


/* =====================================================
   BROWSER
===================================================== */

function isKakaoBrowser(){

    const ua =
        navigator.userAgent || '';

    return (
        /KAKAOTALK/i.test(ua) ||
        /KakaoTalk/i.test(ua)
    );

}


function isAndroid(){

    return (
        /Android/i.test(
            navigator.userAgent || ''
        )
    );

}


function openChrome(){

    const url =
        window.location.href;

    const clean =
        url.replace(
            /^https?:\/\//i,
            ''
        );

    window.location.href =
        'intent://' +
        clean +
        '#Intent;' +
        'scheme=https;' +
        'package=com.android.chrome;' +
        'end';

}


(function(){

    if(
        isKakaoBrowser() &&
        isAndroid()
    ){

        $('chromeGuide')
            .classList
            .add('show');

    }

})();


$('chromeBtn').onclick =
    function(){

        openChrome();

    };


/* =====================================================
   TOAST
===================================================== */

function toast(text){

    $('toast').textContent =
        text;

    $('toast')
        .classList
        .add('show');

    clearTimeout(
        toast.timer
    );

    toast.timer =
        setTimeout(
            () => {

                $('toast')
                    .classList
                    .remove('show');

            },
            1200
        );

}


/* =====================================================
   HP
===================================================== */

function hp(){

    $('pf').style.width =
        pHP + '%';

    $('ef').style.width =
        (
            eHP /
            80 *
            100
        ) + '%';

    $('pt').textContent =
        pHP +
        ' / 100';

    $('et').textContent =
        eHP +
        ' / 80';

}


function blink(el){

    el.classList
        .remove('blink');

    void el.offsetWidth;

    el.classList
        .add('blink');

}


/* =====================================================
   SHAKE
===================================================== */

function shake(){

    $('camera')
        .classList
        .remove('shake');

    void $('camera').offsetWidth;

    $('camera')
        .classList
        .add('shake');

}


/* =====================================================
   MONSTER HIT VIBRATION

   몬스터가 맞을 때만 진동
===================================================== */

function strongEnemyVibe(){

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            90
        );

    }

}


/* =====================================================
   PLAYER HIT

   플레이어 피격은 진동 없음
===================================================== */

function playerHit(){

    if(
        won ||
        pHP <= 0
    ){

        return;

    }


    pHP =
        Math.max(
            0,
            pHP - 5
        );


    hp();


    blink(
        $('pb')
    );


    /*
       내 피격:
       진동 없음.
       화면 효과만.
    */

    shake();


    $('red')
        .classList
        .remove('on');

    void $('red').offsetWidth;

    $('red')
        .classList
        .add('on');


    if(
        pHP <= 0
    ){

        clearInterval(
            enemyTimer
        );


        toast(
            'YOU DIED'
        );

    }

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function monsterDamage(){

    if(
        !battle ||
        won ||
        pHP <= 0
    ){

        return;

    }


    eHP =
        Math.max(
            0,
            eHP - 16
        );


    hp();


    blink(
        $('eb')
    );


    /*
       몬스터가 맞았을 때만
       진동
    */

    strongEnemyVibe();


    /*
       화면 흔들림
    */

    shake();


    /*
       빨간 플래시
    */

    $('red')
        .classList
        .remove('on');

    void $('red').offsetWidth;

    $('red')
        .classList
        .add('on');


    /*
       몬스터 자체 흔들림
    */

    $('monster')
        .classList
        .remove(
            'hit',
            'dead'
        );

    void $('monster').offsetWidth;

    $('monster')
        .classList
        .add('hit');


    /*
       데미지 표시
    */

    $('dmg')
        .classList
        .remove('show');

    void $('dmg').offsetWidth;

    $('dmg')
        .classList
        .add('show');


    if(
        eHP <= 0
    ){

        win();

    }

}


/* =====================================================
   ATTACK

   걷는 중에도 NFC 공격 가능
===================================================== */

function attack(){

    if(
        won ||
        pHP <= 0
    ){

        return;

    }


    $('sword')
        .classList
        .remove(
            'attack',
            'idle',
            'walking'
        );


    $('slash')
        .classList
        .remove('on');


    void $('sword').offsetWidth;
    void $('slash').offsetWidth;


    $('sword')
        .classList
        .add('attack');


    $('slash')
        .classList
        .add('on');


    /*
       전투 시작 이후라면
       실제 몬스터 데미지
    */

    if(
        battle
    ){

        toast(
            'NFC 인식! 검 공격!'
        );

        monsterDamage();

    }

    else{

        /*
           걷는 중에도 칼은 휘두름.
           단 데미지는 아직 없음.
        */

        toast(
            'NFC 인식! 검을 휘둘렀습니다!'
        );

    }


    /*
       공격이 끝나면

       이동 중이면 다시 walking
       전투 중이면 idle
    */

    setTimeout(
        () => {

            if(
                !won &&
                started
            ){

                $('sword')
                    .classList
                    .remove(
                        'attack',
                        'idle',
                        'walking'
                    );


                if(
                    battle
                ){

                    $('sword')
                        .classList
                        .add('idle');

                }

                else{

                    $('sword')
                        .classList
                        .add('walking');

                }

            }

        },
        360
    );

}


/* =====================================================
   WIN
===================================================== */

function win(){

    won = true;


    clearInterval(
        enemyTimer
    );


    $('monster')
        .classList
        .remove('hit');


    $('monster')
        .classList
        .add('dead');


    $('sword')
        .classList
        .remove(
            'idle',
            'walking',
            'attack'
        );


    setTimeout(
        () => {

            $('clear')
                .classList
                .add('show');

        },
        900
    );

}


/* =====================================================
   BATTLE START
===================================================== */

function battleStart(){

    if(
        battle ||
        won
    ){

        return;

    }


    battle = true;


    /*
       걷는 모션 종료
       전투 idle로 전환
    */

    $('sword')
        .classList
        .remove('walking');

    $('sword')
        .classList
        .add('idle');


    $('battle')
        .classList
        .remove('show');

    void $('battle').offsetWidth;

    $('battle')
        .classList
        .add('show');


    toast(
        '몬스터 앞에 도착했습니다!'
    );


    enemyTimer =
        setInterval(
            playerHit,
            1700
        );

}


/* =====================================================
   2.5D WALK

   ★ 이번 핵심 변경

   하늘:
       거의 고정

   뒤쪽 산:
       천천히 이동

   앞 풀밭:
       빠르게 확대

   몬스터:
       발 위치가 지면을 따라
       멀리서 → 앞 풀밭까지 이동
===================================================== */

function walk(now){

    if(
        !started ||
        won
    ){

        return;

    }


    if(
        !walkStart
    ){

        walkStart =
            now;

    }


    /*
       8초 접근
    */

    const t =
        Math.min(
            (
                now -
                walkStart
            ) /
            8000,
            1
        );


    /* =================================================
       SKY
    ================================================= */

    const skyScale =
        1.01 +
        t * .015;


    const skyY =
        t * -.2;


    $('bg').style.transform =

        'translateY(' +
        skyY +
        '%) scale(' +
        skyScale +
        ')';



    /* =================================================
       BACK LAYER
    ================================================= */

    const backScale =
        1 +
        t * .07;


    const backY =
        t * 1.5;


    $('backLayer').style.transform =

        'translateY(' +
        backY +
        '%) scale(' +
        backScale +
        ')';



    /* =================================================
       FRONT GRASS
    ================================================= */

    const frontScale =
        1 +
        t * .26;


    const frontY =
        t * 5;


    const frontX =
        -t * 1.2;


    $('frontLayer').style.transform =

        'translate(' +
        frontX +
        '%,' +
        frontY +
        '%) scale(' +
        frontScale +
        ')';



    /* =================================================
       MONSTER

       ★ 중요한 부분

       예전:
       top 위치에서 그냥 커짐.
       그래서 둥실 떠 보였음.

       지금:
       bottom 위치가 계속 변하면서
       지면을 따라 접근함.
    ================================================= */


    const monsterScale =
        .17 +
        t * .69;


    /*
       멀리 있을 때

       bottom 48%

       가까이 왔을 때

       bottom 23%
    */

    const monsterBottom =
        48 -
        t * 25;


    const monsterX =
        t * .4;


    $('monsterWrap').style.bottom =
        monsterBottom + '%';


    $('monsterWrap').style.transform =

        'translateX(calc(-50% + ' +
        monsterX +
        '%)) scale(' +
        monsterScale +
        ')';


    $('monsterWrap').style.opacity =

        Math.min(
            1,
            .20 +
            t * 1.3
        );



    /* =================================================
       MONSTER SHADOW

       몬스터가 가까워지면서
       그림자도 같이 커짐.
    ================================================= */

    const shadowScale =
        .2 +
        t * .8;


    const shadowBottom =
        46.5 -
        t * 24;


    $('monsterShadow').style.bottom =
        shadowBottom + '%';


    $('monsterShadow').style.transform =

        'translateX(-50%) scale(' +
        shadowScale +
        ')';


    $('monsterShadow').style.opacity =

        Math.min(
            .42,
            .1 +
            t * .36
        );



    /* =================================================
       BATTLE POSITION
    ================================================= */

    if(
        t >= 1
    ){

        /*
           ★ 최종 위치

           참고 이미지처럼
           화면 중하단의 앞 풀밭에
           딱 붙도록 고정
        */

        $('monsterWrap').style.bottom =
            '23%';


        $('monsterWrap').style.transform =
            'translateX(-50%) scale(.86)';


        $('monsterWrap').style.opacity =
            '1';


        /*
           그림자도 발 아래 고정
        */

        $('monsterShadow').style.bottom =
            '22%';


        $('monsterShadow').style.transform =
            'translateX(-50%) scale(1)';


        $('monsterShadow').style.opacity =
            '.42';


        battleStart();


        return;

    }


    raf =
        requestAnimationFrame(
            walk
        );

}


/* =====================================================
   NFC
===================================================== */

async function startNFC(){

    if(
        !window.isSecureContext ||
        location.protocol !==
        'https:'
    ){

        $('nt').textContent =
            'HTTPS 필요';


        toast(
            'HTTPS 주소에서 실행해주세요.'
        );


        return false;

    }


    if(
        !(
            'NDEFReader'
            in window
        )
    ){

        $('nt').textContent =
            'NFC 미지원';


        toast(
            'Android Chrome에서 Web NFC를 사용할 수 있습니다.'
        );


        return false;

    }


    if(
        nfcOn
    ){

        return true;

    }


    try{


        const reader =
            new NDEFReader();


        await reader.scan();


        nfcOn =
            true;


        $('nt').textContent =
            'NFC 대기 중';


        $('dot').style.background =
            '#49ef6a';


        reader.onreadingerror =
            () => {

                toast(
                    'NFC 읽기 오류'
                );

            };


        reader.onreading =
            () => {


                const now =
                    Date.now();


                /*
                   같은 NFC를 한 번 댔는데
                   여러 번 연속 인식되는 것 방지
                */

                if(
                    now -
                    lastTag <
                    650
                ){

                    return;

                }


                lastTag =
                    now;


                attack();

            };


        return true;

    }

    catch(e){


        $('nt').textContent =
            'NFC 권한 확인';


        toast(
            'Chrome에서 NFC 권한을 허용해주세요.'
        );


        return false;

    }

}


/* =====================================================
   GAME START
===================================================== */

$('go').onclick =
    async function(){


        if(
            isKakaoBrowser() &&
            isAndroid()
        ){

            $('chromeGuide')
                .classList
                .add('show');


            return;

        }


        await startNFC();


        started =
            true;


        $('start')
            .classList
            .add('hidden');


        pHP =
            100;


        eHP =
            80;


        hp();


        /*
           처음부터 큰 칼이 보이고
           걷기 모션 시작
        */

        $('sword')
            .classList
            .remove('idle');


        $('sword')
            .classList
            .add('walking');


        walkStart =
            0;


        cancelAnimationFrame(
            raf
        );


        raf =
            requestAnimationFrame(
                walk
            );

    };


hp();

</script>

</body>
</html>
