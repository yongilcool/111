<style>

/* =====================================================
   조절값
===================================================== */

:root{

    /* 칼 크기 */
    --sword-size:92vh;

    /* 더 음수 = 더 오른쪽 */
    --sword-right:-18vh;

    /* 더 음수 = 더 아래 */
    --sword-bottom:-17vh;
}


/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111d;
    font-family:Arial,sans-serif;
}

body{
    position:fixed;
    inset:0;
}

#game{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#07111d;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}


/* =====================================================
   SWORD
===================================================== */

#sword{
    position:absolute;

    z-index:40;

    right:var(--sword-right);
    bottom:var(--sword-bottom);

    width:auto;
    height:var(--sword-size);

    max-width:none;

    pointer-events:none;
    user-select:none;

    /*
       손잡이 근처를 회전축으로
    */
    transform-origin:
        84% 91%;

    will-change:transform;

    filter:
        drop-shadow(
            0 10px 10px
            rgba(0,0,0,.32)
        );
}


/* =====================================================
   ★ 걷는 칼 모션

   이전보다 훨씬 빠르고
   좌우 이동폭도 크게.
===================================================== */

#sword.walking{

    animation:
        swordWalk
        .34s
        ease-in-out
        infinite
        alternate;
}


@keyframes swordWalk{

    from{

        transform:
            translate(-26px,5px)
            rotate(-13deg);

    }

    to{

        transform:
            translate(27px,-9px)
            rotate(14deg);

    }

}


/* =====================================================
   HUD
===================================================== */

#hud{
    position:absolute;

    z-index:60;

    top:14px;
    left:5%;
    right:5%;

<!-- =====================================================

===================================================== -->

<script>

function isAndroid(){

    return(
        /Android/i.test(
            navigator.userAgent || ''
        )
    );

}


function isKakaoBrowser(){

    const ua =
        navigator.userAgent || '';

    return(
        /KAKAOTALK/i.test(ua) ||
        /KakaoTalk/i.test(ua)
    );

}


function isRealChrome(){

    const ua =
        navigator.userAgent || '';


    if(
        isKakaoBrowser()
    ){
        return false;
    }


    if(
        /SamsungBrowser/i.test(ua)
    ){
        return false;
    }


    if(
        /EdgA/i.test(ua)
    ){
        return false;
    }


    if(
        /OPR/i.test(ua)
    ){
        return false;
    }


    return(
        /Chrome/i.test(ua)
    );

}


/* =====================================================
   ★ Chrome 열기
===================================================== */

function openChrome(){

    const url =
        window.location.href;


    const clean =
        url.replace(
            /^https?:\/\//i,
            ''
        );


    window.location.href =

        'intent://' +

        clean +

        '#Intent;' +

        'scheme=https;' +

        'package=com.android.chrome;' +

        'end';

}


window.addEventListener(
    'DOMContentLoaded',
    ()=>{

        if(
            isAndroid() &&
            !isRealChrome()
        ){

            document
                .getElementById(
                    'chromeGuide'
                )
                .classList
                .add('show');

        }

    }
);


document
    .getElementById(
        'chromeButton'
    )
    .addEventListener(
        'click',
        openChrome
    );

</script>

/* =====================================================
   ★★★★★★★★★★★★★★★★★★★★★

   AUDIO ENGINE

   별도 MP3 없이
   Web Audio API로 효과음 생성.

   ★★★★★★★★★★★★★★★★★★★★★
===================================================== */

let audioCtx =
    null;


function initAudio(){


    if(
        audioCtx
    ){

        if(
            audioCtx.state ===
            'suspended'
        ){

            audioCtx.resume();

        }


        return;

    }


    const AudioContextClass =

        window.AudioContext ||

        window.webkitAudioContext;


    if(
        !AudioContextClass
    ){

        return;

    }


    audioCtx =
        new AudioContextClass();

}


/* =====================================================
   NOISE 생성
===================================================== */

function createNoiseBuffer(
    duration = .3
){


    if(
        !audioCtx
    ){

        return null;

    }


    const length =

        Math.floor(

            audioCtx.sampleRate *

            duration

        );


    const buffer =

        audioCtx.createBuffer(

            1,

            length,

            audioCtx.sampleRate

        );


    const data =

        buffer.getChannelData(
            0
        );


    for(
        let i = 0;
        i < length;
        i++
    ){

        data[i] =

            Math.random() *
            2 -
            1;

    }


    return buffer;

}


/* =====================================================
   ★ 검 휘두르는 소리

   "슈욱!"
===================================================== */

function playSwordSound(){


    if(
        !audioCtx
    ){
        return;
    }


    const now =
        audioCtx.currentTime;


    const source =
        audioCtx.createBufferSource();


    source.buffer =
        createNoiseBuffer(
            .22
        );


    const filter =
        audioCtx.createBiquadFilter();


    filter.type =
        'bandpass';


    filter.frequency.setValueAtTime(
        850,
        now
    );


    filter.frequency.exponentialRampToValueAtTime(
        2800,
        now + .12
    );


    const gain =
        audioCtx.createGain();


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .25,
        now + .025
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .20
    );


    source.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        audioCtx.destination
    );


    source.start(
        now
    );


    source.stop(
        now + .22
    );

}


/* =====================================================
   ★ 적 맞는 소리

}

        );


    const filter =
        audioCtx.createBiquadFilter();


    filter.type =
        'lowpass';


    filter.frequency.value =
        360;


    const gain =
        audioCtx.createGain();


    gain.gain.setValueAtTime(
        .15,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .085
    );


    noise.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        audioCtx.destination
    );


    noise.start(
        now
    );


    noise.stop(
        now + .09
    );

}

function makeGroundTexture(){


    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        128;

    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            '2d'
        );


    ctx.imageSmoothingEnabled =
        false;


    const colors = [

        '#527637',

        '#668744',

        '#46692f',

        '#75944c',

        '#3c602a'

    ];


    for(
        let y = 0;
        y < 128;
        y += 8
    ){

        for(
            let x = 0;
            x < 128;
            x += 8
        ){

            ctx.fillStyle =

                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];


            ctx.fillRect(
                x,
                y,
                8,
                8
            );

        }

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.magFilter =
        THREE.NearestFilter;


    texture.minFilter =
        THREE.NearestFilter;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.repeat.set(
        12,
        35
    );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}

/* =====================================================
   FOREST
===================================================== */

function createForest(){


    const trunkGeo =
        new THREE.CylinderGeometry(
            .23,
            .35,
            2.8,
            5
        );


    const trunkMat =
        new THREE.MeshLambertMaterial({
            color:0x49331f
        });


    const leavesGeo =
        new THREE.ConeGeometry(
            1.55,
            4.3,
            6
        );


    const leavesMat =
        new THREE.MeshLambertMaterial({
            color:0x315d2f
        });


    for(
        let z = 5;
        z > -180;
        z -= 4.8
    ){


        for(
            const side
            of [-1,1]
        ){


            const tree =
                new THREE.Group();


            const trunk =
                new THREE.Mesh(
                    trunkGeo,
                    trunkMat
                );


            trunk.position.y =
                1.4;


            tree.add(
                trunk
            );


            const leaves1 =
                new THREE.Mesh(
                    leavesGeo,
                    leavesMat
                );


            leaves1.position.y =
                3.9;


            tree.add(
                leaves1
            );


            const leaves2 =
                leaves1.clone();


            leaves2.scale.setScalar(
                .70
            );


            leaves2.position.y =
                5.15;


            tree.add(
                leaves2
            );


            tree.position.set(

                side *
                (
                    5 +
                    Math.random() *
                    7
                ),

                0,

                z +
                Math.random() *
                2

            );


            const scale =

                .65 +

                Math.random() *
                .65;


            tree.scale.setScalar(
                scale
            );


            scene.add(
                tree
            );

        }

    }

}


/* =====================================================
   ROCKS
===================================================== */

function createRocks(){


    const geo =
        new THREE.DodecahedronGeometry(
            .45,
            0
        );


    const mat =
        new THREE.MeshLambertMaterial({
            color:0x62675d
        });


    for(
        let i = 0;
        i < 70;
        i++
    ){


        const rock =
            new THREE.Mesh(
                geo,
                mat
            );


        let x =

            4 +

            Math.random() *
            10;


        if(
            Math.random() <
            .5
        ){

            x *= -1;

        }


        rock.position.set(

            x,

            .25,

            5 -
            Math.random() *
            180

        );


        const scale =

            .35 +

            Math.random() *
            .85;


        rock.scale.set(

            scale,

            scale *
            .6,

            scale

        );


        scene.add(
            rock
        );

    }

}


/* =====================================================
   MONSTER
===================================================== */

function spawnMonster(index){


    if(monster){
        scene.remove(monster);
    }


    if(monsterShadow){
        scene.remove(monsterShadow);
    }


    currentMonsterIndex =
        index;


    currentMonsterHP =
        CONFIG.MONSTER_HP;


    monsterDead =
        false;


    battle =
        false;


    deathProgress =
        -1;


    const imageURL =
        MONSTER_IMAGES[index];


    let texture;


    if(
        imageURL &&
        !imageURL.startsWith(
            'MONSTER_'
        )
    ){


        texture =

            new THREE
            .TextureLoader()
            .load(
                imageURL
            );


        texture.colorSpace =
            THREE.SRGBColorSpace;


        texture.magFilter =
            THREE.NearestFilter;


        texture.minFilter =
            THREE.LinearFilter;

    }

    else{


        texture =
            createTemporaryMonster(
                index
            );

    }


    monsterMaterial =
        new THREE.MeshBasicMaterial({

            map:texture,

            transparent:true,

            alphaTest:.05,

            side:
                THREE.DoubleSide

        });


    monster =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                5,
                5
            ),

            monsterMaterial

        );


    monster.position.set(

        0,

        2.5,

        CONFIG.MONSTER_POSITIONS[index]

    );


    monsterHomeZ =
        CONFIG.MONSTER_POSITIONS[index];


    scene.add(
        monster
    );


    monsterShadow =
        new THREE.Mesh(

            new THREE.CircleGeometry(
                1.5,
                18
            ),

            new THREE.MeshBasicMaterial({

                color:0x000000,

                transparent:true,

                opacity:.27,

                depthWrite:false

            })

        );


    monsterShadow.rotation.x =
        -Math.PI / 2;


    monsterShadow.position.set(
        0,
        .025,
        monsterHomeZ
    );


    scene.add(
        monsterShadow
    );


    updateHP();

    updateCounter();

}

/* =====================================================
   ★★★★★★★★★★★★★★★★★★★★★

   SWORD ATTACK

   ★ 방향 변경

   화면 바깥쪽
        ↓
   화면 안쪽 / 몬스터 방향

   ★ 공격 시작 즉시 적 데미지

   ★★★★★★★★★★★★★★★★★★★★★
===================================================== */

function attack(){


    if(
        !started ||
        gameIsOver ||
        swordAttacking
    ){

        return;

    }


    swordAttacking =
        true;


    sword.classList.remove(
        'walking'
    );


    if(
        swordAnimation
    ){

        swordAnimation.cancel();

    }


    /*
       ★ 칼 휘두르는 소리를
       공격 시작 즉시.
    */

    playSwordSound();


    /*
       ★★★★★★★★★★★★★★★★★

       여기 중요.

       예전처럼 58% 지점에서
       적에게 데미지를 주지 않는다.

       NFC → 칼 공격 시작과 거의 동시에
       몬스터 데미지.

       ★★★★★★★★★★★★★★★★★
    */

    if(
        battle &&
        !monsterDead
    ){

        damageMonster();

    }


    const horizontal =

        swordAttackType === 0;


    swordAttackType =

        swordAttackType === 0
        ? 1
        : 0;


    let frames;


    /* =================================================
       ★ 1. 밖 → 안쪽 대형 옆베기
    ================================================= */

    if(horizontal){


        frames = [


            /*
               ★ 시작하자마자
               화면 오른쪽 바깥으로 먼저 이동.

               이것이 "밖".
            */

            {

                offset:0,

                transform:
                    'translate(95px,35px) rotate(-58deg) scale(.98)'

            },


            /*
               오른쪽 바깥쪽에서
               힘을 모음
            */

            {

                offset:.16,

                transform:
                    'translate(110px,25px) rotate(-72deg) scale(.97)'

            },


            /*
               ★ 안쪽으로 진입
            */

            {

                offset:.31,

                transform:
                    'translate(25px,-20px) rotate(-20deg) scale(1.02)'

            },


            /*
               화면 중앙
            */

            {

                offset:.48,

                transform:
                    'translate(-145px,-115px) rotate(48deg) scale(1.09)'

            },


            /*
               ★ 최대 안쪽 베기
            */

            {

                offset:.62,

                transform:
                    'translate(-285px,-175px) rotate(108deg) scale(1.16)'

            },


            /*
               관성으로 조금 더 지나감
            */

            {

                offset:.73,

                transform:
                    'translate(-245px,-135px) rotate(92deg) scale(1.13)'

            },


            /*
               복귀
            */

            {

                offset:.86,

                transform:
                    'translate(-85px,-45px) rotate(32deg) scale(1.05)'

            },


            {

                offset:1,

                transform:
                    'translate(0px,0px) rotate(-4deg) scale(1)'

            }

        ];

    }


    /* =================================================
       ★ 2. 바깥 위쪽 → 안쪽 내려베기
    ================================================= */

    else{


        frames = [


            /*
               화면 오른쪽 바깥 위
            */

            {

                offset:0,

                transform:
                    'translate(95px,-115px) rotate(-95deg) scale(.98)'

            },


            {

                offset:.17,

                transform:
                    'translate(75px,-195px) rotate(-110deg) scale(.97)'

            },


            /*
               안쪽 진입
            */

            {

                offset:.34,

                transform:
                    'translate(-30px,-155px) rotate(-60deg) scale(1.03)'

            },


            /*
               몬스터 중앙
            */

            {

                offset:.52,

                transform:
                    'translate(-190px,-15px) rotate(24deg) scale(1.11)'

            },


            /*
               크게 내려침
            */

            {

                offset:.67,

                transform:
                    'translate(-250px,105px) rotate(68deg) scale(1.15)'

            },


            /*
               지나감
            */

            {

                offset:.77,

                transform:
                    'translate(-210px,120px) rotate(58deg) scale(1.12)'

            },


            /*
               복귀
            */

            {

                offset:.89,

                transform:
                    'translate(-70px,35px) rotate(20deg) scale(1.04)'

            },


            {

                offset:1,

                transform:
                    'translate(0px,0px) rotate(-4deg) scale(1)'

            }

        ];

    }


    swordAnimation =
        sword.animate(

            frames,

            {

                duration:
                    CONFIG.SWORD_SPEED,

                easing:
                    'cubic-bezier(.18,.70,.18,1)',

                fill:'none'

            }

        );


    swordAnimation.onfinish =
        ()=>{


            swordAttacking =
                false;


            if(
                started &&
                !gameIsOver
            ){

                sword.classList.add(
                    'walking'
                );

            }

        };

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function damageMonster(){


    if(
        !battle ||
        monsterDead ||
        gameIsOver
    ){

        return;

    }


    currentMonsterHP =

        Math.max(

            0,

            currentMonsterHP -
            CONFIG.PLAYER_DAMAGE

        );


    updateHP();


    /*
       ★ 적 맞는 소리
    */

    playEnemyHitSound();


    /*
       적 맞을 때만 진동
    */

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            [
                120,
                25,
                110
            ]
        );

    }


    monsterMaterial.color.set(
        0xff4040
    );


    monsterHitTimer =
        .22;


    cameraShake =
        .22;


    showDamage();


    if(
        currentMonsterHP <= 0
    ){

        killMonster();

    }

}

   DAMAGE NUMBER
===================================================== */

    $('damageNumber').animate(

                transform:

            {

                opacity:1,

                opacity:0,

                transform:

            }

        ],

        {

            duration:420,

            easing:'ease-out'

        }

    );

}


/* =====================================================
   MONSTER DEAD
===================================================== */

function killMonster(){


    monsterDead =
        true;


    battle =
        false;


    deathProgress =
        0;


    clearInterval(
        monsterAttackTimer
    );


    monsterAttackProgress =
        -1;


    /*
       ★ 죽는 소리
    */

    playMonsterDeathSound();

}


/* =====================================================
   NEXT MONSTER
===================================================== */

function nextMonster(){


    const next =

        currentMonsterIndex +
        1;


    if(
        next >=
        CONFIG.MONSTER_POSITIONS.length
    ){


        if(monster){

            scene.remove(
                monster
            );


            monster =
                null;

        }


        if(monsterShadow){

            scene.remove(
                monsterShadow
            );


            monsterShadow =
                null;

        }


        currentMonsterIndex =
            2;


        $('monsterCount').textContent =
            '☠ 3 / 3';


        $('enemyText').textContent =
            '0 / 100';


        $('enemyHP').style.width =
            '0%';


        return;

    }


    spawnMonster(
        next
    );

}


/* =====================================================
   ★ MONSTER ATTACK
===================================================== */

function triggerMonsterAttack(){


    if(
        !battle ||
        monsterDead ||
        !monster ||
        gameIsOver
    ){

        return;

    }


    if(
        monsterAttackProgress >= 0
    ){

        return;

    }


    monsterAttackProgress =
        0;


    monsterAttackHit =
        false;


    /*
       ★ 적이 공격하기 시작하는 소리
    */

    playMonsterAttackSound();

}


/* =====================================================
   PLAYER DAMAGE
===================================================== */

function damagePlayer(){


    if(
        !battle ||
        monsterDead ||
        gameIsOver
    ){

        return;

    }


    playerHP =

        Math.max(

            0,

            playerHP -
            CONFIG.MONSTER_DAMAGE

        );


    updateHP();


    /*
       ★ 내가 맞는 소리
    */

    playPlayerHitSound();


    /*
       내가 맞을 때
       진동 없음.
    */


    $('damageFlash').animate(

        [

            {opacity:0},

            {opacity:.9},

            {opacity:.34},

            {opacity:0}

        ],

        {

            duration:330

        }

    );


    cameraShake =
        .30;


    /*
       ★★★★★★★★★★★★★★★★★

       HP 0
       → GAME OVER

       ★★★★★★★★★★★★★★★★★
    */

    if(
        playerHP <= 0
    ){

        gameOver();

    }

}


/* =====================================================
   ★ GAME OVER
===================================================== */

function gameOver(){


    if(
        gameIsOver
    ){

        return;

    }


    gameIsOver =
        true;


    started =
        false;


    battle =
        false;


    clearInterval(
        monsterAttackTimer
    );


    monsterAttackProgress =
        -1;


    sword.classList.remove(
        'walking'
    );


    if(
        swordAnimation
    ){

        swordAnimation.cancel();

    }


    /*
       NFC 리더 자체는 브라우저에서
       살아있어도 attack()이 gameIsOver를
       검사하므로 더 이상 공격되지 않음.
    */


    $('gameOver')
        .classList
        .add('show');

}

    if(

    monsterAttackTimer =

/* =====================================================
   NFC
===================================================== */

async function startNFC(){


    if(
        isAndroid() &&
        !isRealChrome()
    ){

        $('nfcText').textContent =
            'Chrome 필요';


        return false;

    }


    if(
        !window.isSecureContext
    ){

        $('nfcText').textContent =
            'HTTPS 필요';


        return false;

    }


    if(
        !(
            'NDEFReader'
            in window
        )
    ){

        $('nfcText').textContent =
            'NFC 미지원';


        return false;

    }


    if(
        nfcStarted
    ){

        return true;

    }


    try{


        const reader =
            new NDEFReader();


        await reader.scan();


        nfcStarted =
            true;


        $('nfcText').textContent =
            'NFC 대기 중';


        $('nfcDot').style.background =
            '#50ef51';


        reader.onreading =
            ()=>{


                const now =
                    Date.now();


                if(
                    now -
                    lastTag <
                    CONFIG.NFC_COOLDOWN
                ){

                    return;

                }


                lastTag =
                    now;


                attack();

            };


        reader.onreadingerror =
            ()=>{


                $('nfcText').textContent =
                    'NFC 읽기 오류';

            };


        return true;

    }

    catch(error){


        console.error(
            error
        );


        $('nfcText').textContent =
            'NFC 권한 확인';


        return false;

    }

}


/* =====================================================
   START
===================================================== */

$('startButton')
.addEventListener(
    'click',

    async ()=>{


        /*
           ★ Android에서는
           Chrome 먼저
        */

        if(
            isAndroid() &&
            !isRealChrome()
        ){

            $('chromeGuide')
                .classList
                .add('show');


            return;

        }


        /*
           ★ 사용자 클릭 순간
           오디오 활성화.
        */

        initAudio();


        $('loading')
            .classList
            .add('show');


        if(
            !gameInitialized
        ){

            init3D();

        }


        await startNFC();


        started =
            true;


        gameIsOver =
            false;


        sword.classList.add(
            'walking'
        );


        $('loading')
            .classList
            .remove('show');


        $('startScreen')
            .classList
            .add('hidden');

    }
);


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(now){


    requestAnimationFrame(
        gameLoop
    );


    const dt =

        Math.min(

            (
                now -
                lastTime
            ) /
            1000,

            .05

        );


    lastTime =
        now;


    if(
        started &&
        !gameIsOver
    ){


        /* =================================================
           WALK
        ================================================= */

        let currentlyWalking =
            false;


        if(
            !battle
        ){


            if(
                monster &&
                !monsterDead
            ){


                const distance =

                    camera.position.z -
                    monster.position.z;


                if(
                    distance >
                    CONFIG.BATTLE_DISTANCE
                ){


                    camera.position.z -=

                        CONFIG.WALK_SPEED *
                        dt;


                    currentlyWalking =
                        true;

                }

                else{


                    startBattle();

                }

            }

            else{


                camera.position.z -=

                    CONFIG.WALK_SPEED *
                    dt;


                currentlyWalking =
                    true;

            }

        }


        /* =================================================
           ★ 흙길 발걸음

           실제로 앞으로 움직일 때만 재생.
        ================================================= */

        if(
            currentlyWalking
        ){


            footstepTimer +=
                dt;


            if(
                footstepTimer >=
                CONFIG.FOOTSTEP_INTERVAL
            ){


                footstepTimer =
                    0;


                playFootstep();

            }

        }

        else{


            footstepTimer =
                0;

        }


        /* =================================================
           WALK BOB

           이동속도에 맞게
           이전보다 빠르게.
        ================================================= */

        if(
            currentlyWalking
        ){


            walkPhase +=

                dt *
                15.5;

        }

        else{


            walkPhase +=

                dt *
                5;

        }


        camera.position.y =

            2.15 +

            Math.sin(
                walkPhase
            ) *
            (
                currentlyWalking
                ? .045
                : .018
            );


        /* =================================================
           BILLBOARD
        ================================================= */

        if(
            monster &&
            !monsterDead
        ){


            monster.rotation.y =

                Math.atan2(

                    camera.position.x -
                    monster.position.x,

                    camera.position.z -
                    monster.position.z

                );

        }


        /* =================================================
           MONSTER BREATH
        ================================================= */

        if(
            monster &&
            !monsterDead &&
            monsterAttackProgress < 0
        ){


            const breathe =

                1 +

                Math.sin(
                    now *
                    .003
                ) *
                .025;


            monster.scale.set(

                1 -
                (
                    breathe -
                    1
                ) *
                .35,

                breathe,

                1

            );

        }


        /* =================================================
           MONSTER HIT
        ================================================= */

        if(
            monster &&
            monsterHitTimer > 0
        ){


            monsterHitTimer -=
                dt;


            monster.position.x =

                Math.sin(
                    now *
                    .11
                ) *
                .18;


            if(
                monsterHitTimer <= 0
            ){


                monster.position.x =
                    0;


                monsterMaterial.color.set(
                    0xffffff
                );

            }

        }


        /* =================================================
           MONSTER ATTACK
        ================================================= */

        if(
            monster &&
            monsterAttackProgress >= 0
        ){


            monsterAttackProgress +=

                dt *
                2.3;


            const t =
                monsterAttackProgress;


            /*
               움츠림
            */

            if(
                t < .20
            ){


                const p =
                    t /
                    .20;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ,

                        monsterHomeZ -
                        .7,

                        p

                    );

            }


            /*
               돌진
            */

            else if(
                t < .52
            ){


                const p =

                    (
                        t -
                        .20
                    ) /
                    .32;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ -
                        .7,

                        monsterHomeZ +
                        3.8,

                        p

                    );

            }


            /*
               HIT
            */

            else if(
                t < .62
            ){


                if(
                    !monsterAttackHit
                ){


                    monsterAttackHit =
                        true;


                    damagePlayer();

                }

            }


            /*
               복귀
            */

            else if(
                t < 1
            ){


                const p =

                    (
                        t -
                        .62
                    ) /
                    .38;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterHomeZ +
                        3.8,

                        monsterHomeZ,

                        p

                    );

            }


            else{


                monster.position.z =
                    monsterHomeZ;


                monsterAttackProgress =
                    -1;


                monsterAttackHit =
                    false;

            }

        }


        /* =================================================
           DEATH
        ================================================= */

        if(
            monster &&
            monsterDead
        ){


            if(
                deathProgress < 0
            ){

                deathProgress =
                    0;

            }


            deathProgress +=

                dt *
                1.4;


            monster.rotation.z =

                Math.min(
                    deathProgress,
                    1
                ) *
                1.25;


            monster.position.y =

                THREE.MathUtils.lerp(

                    2.5,

                    .95,

                    Math.min(
                        deathProgress,
                        1
                    )

                );


            monsterMaterial.opacity =

                Math.max(

                    0,

                    1 -
                    deathProgress *
                    .8

                );


            if(
                monsterShadow
            ){


                monsterShadow
                    .material
                    .opacity =

                    Math.max(

                        0,

                        .27 -
                        deathProgress *
                        .25

                    );

            }


            /*
               죽는 동안에도
               빠르게 계속 앞으로.
            */

            camera.position.z -=

                CONFIG.WALK_SPEED *
                dt;


            /*
               죽은 직후에도
               걷고 있으므로 발소리.
            */

            footstepTimer +=
                dt;


            if(
                footstepTimer >=
                CONFIG.FOOTSTEP_INTERVAL
            ){


                footstepTimer =
                    0;


                playFootstep();

            }


            if(
                deathProgress >
                1.3
            ){


                nextMonster();

            }

        }


        /* =================================================
           CAMERA SHAKE
        ================================================= */

        if(
            cameraShake > 0
        ){


            cameraShake -=
                dt;


            camera.rotation.z =

                (
                    Math.random() -
                    .5
                ) *
                .032;


            camera.rotation.x =

                (
                    Math.random() -
                    .5
                ) *
                .024;

        }

        else{


            camera.rotation.z *=
                .70;


            camera.rotation.x *=
                .70;

        }

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE
===================================================== */

function resizeGame(){


    camera.aspect =

        innerWidth /
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );

}

updateCounter();
