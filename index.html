<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<title>PIXEL ADVENTURE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080c;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:min(100vw,520px);
  height:100dvh;
  max-height:1000px;
  overflow:hidden;
  background:#101820;
  color:#fff;
  touch-action:manipulation;
}

#camera{
  position:absolute;
  inset:0;
  overflow:hidden;
  will-change:transform;
}

#world{
  position:absolute;
  inset:-8%;
  transform-origin:50% 62%;
  will-change:transform;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  image-rendering:auto;
  will-change:transform;
}

#farHaze{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(90,150,210,.08),
      transparent 45%,
      rgba(28,45,30,.12) 100%
    );
  pointer-events:none;
}

/* =========================
   MONSTER
========================= */

#monsterWrap{
  position:absolute;
  left:50%;
  top:22%;
  width:43%;
  aspect-ratio:1/1;
  transform:translateX(-50%) scale(.12);
  transform-origin:50% 80%;
  opacity:.25;
  will-change:transform,opacity;
  z-index:8;
}

#monster{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  image-rendering:pixelated;
  filter:drop-shadow(0 10px 8px rgba(0,0,0,.38));
  will-change:transform,filter;
}

/* 몬스터 피격 */
#monster.hit{
  animation:monsterHit .28s steps(2,end);
}

@keyframes monsterHit{
  0%{
    filter:
      brightness(1)
      drop-shadow(0 10px 8px rgba(0,0,0,.38));
    transform:translateX(0);
  }

  20%{
    filter:
      brightness(2.7)
      saturate(1.6)
      drop-shadow(0 0 26px rgba(255,30,30,.95));
    transform:translateX(-10px);
  }

  45%{
    filter:
      brightness(2.2)
      saturate(1.8)
      drop-shadow(0 0 35px red);
    transform:translateX(12px);
  }

  70%{
    filter:
      brightness(1.6)
      saturate(1.4);
    transform:translateX(-7px);
  }

  100%{
    filter:brightness(1);
    transform:translateX(0);
  }
}

/* 몬스터 사망 */
#monster.dead{
  animation:monsterDead .8s ease forwards;
}

@keyframes monsterDead{
  0%{
    opacity:1;
    filter:brightness(1);
  }

  35%{
    filter:
      brightness(3)
      drop-shadow(0 0 35px red);
  }

  100%{
    opacity:0;
    transform:scale(.25) rotate(18deg);
    filter:brightness(2);
  }
}

/* =========================
   FIRST PERSON SWORD
========================= */

#sword{
  position:absolute;
  z-index:20;
  right:1%;
  bottom:-10%;
  width:48%;
  height:70%;
  object-fit:contain;
  object-position:center bottom;
  transform-origin:82% 91%;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.65));
  will-change:transform;
  pointer-events:none;
}

/* 걸어갈 때 */
#sword.walking{
  animation:swordWalk .64s ease-in-out infinite alternate;
}

@keyframes swordWalk{
  from{
    transform:rotate(-20deg) translateY(5px);
  }

  to{
    transform:rotate(16deg) translateY(-5px);
  }
}

/* NFC 공격 */
#sword.attack{
  animation:swordSlash .34s cubic-bezier(.12,.9,.2,1) forwards;
}

@keyframes swordSlash{

  0%{
    transform:
      rotate(-18deg)
      translate(0,0)
      scale(1);
  }

  14%{
    transform:
      rotate(-43deg)
      translate(-12px,7px)
      scale(1.03);
  }

  47%{
    transform:
      rotate(57deg)
      translate(-38px,-30px)
      scale(1.16);
  }

  68%{
    transform:
      rotate(34deg)
      translate(-15px,-13px)
      scale(1.08);
  }

  100%{
    transform:
      rotate(-18deg)
      translate(0,0)
      scale(1);
  }
}

/* 검 베기 궤적 */

#slash{
  position:absolute;
  z-index:19;
  right:5%;
  bottom:20%;
  width:68%;
  height:62%;
  opacity:0;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 70% 55%,
      rgba(255,255,255,.9) 0 2%,
      rgba(255,225,110,.8) 3% 5%,
      transparent 6%
    ),

    conic-gradient(
      from 205deg at 70% 55%,
      transparent 0 19%,
      rgba(255,245,190,.9) 20% 23%,
      rgba(255,180,40,.75) 24% 28%,
      transparent 29% 100%
    );

  filter:blur(.3px);
  transform:rotate(-18deg);
  mix-blend-mode:screen;
}

#slash.on{
  animation:slashFx .34s ease-out forwards;
}

@keyframes slashFx{
  0%{
    opacity:0;
    transform:rotate(-25deg) scale(.55);
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:rotate(20deg) scale(1.18);
  }
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  z-index:40;
  left:5%;
  right:5%;
  top:12px;

  display:flex;
  gap:8px;
  justify-content:space-between;

  text-shadow:0 2px 3px #000;
}

.unit{
  width:48%;
}

.lab{
  font-size:12px;
  font-weight:900;
  margin-bottom:3px;
}

.bar{
  height:14px;
  border:2px solid #fff;
  border-radius:5px;
  background:#220b0b;
  overflow:hidden;
  box-shadow:0 2px 6px #000;
}

.fill{
  height:100%;
  transition:width .18s;
}

#pf{
  background:linear-gradient(#ff6868,#c41414);
  width:100%;
}

#ef{
  background:linear-gradient(#bd76ff,#6320a5);
  width:100%;
}

#pb.blink,
#eb.blink{
  animation:hpBlink .32s steps(2,end);
}

@keyframes hpBlink{
  50%{
    filter:brightness(2.8);
  }
}

/* =========================
   NFC
========================= */

#nfc{
  position:absolute;
  z-index:50;
  top:48px;
  left:50%;
  transform:translateX(-50%);

  padding:7px 12px;
  border-radius:12px;

  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.35);

  font-size:12px;
  font-weight:700;

  white-space:nowrap;

  box-shadow:0 3px 10px rgba(0,0,0,.35);
}

#dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ffd84d;
  margin-right:5px;
}

/* =========================
   TOAST
========================= */

#toast{
  position:absolute;
  z-index:70;

  left:50%;
  bottom:88px;

  transform:
    translateX(-50%)
    translateY(16px);

  opacity:0;

  padding:8px 13px;

  border-radius:10px;

  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,255,255,.3);

  font-size:12px;

  white-space:nowrap;

  transition:.18s;
}

#toast.show{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   DAMAGE NUMBER
========================= */

#dmg{
  position:absolute;
  z-index:60;

  left:65%;
  top:42%;

  font-size:38px;
  font-weight:1000;

  color:#fff;

  text-shadow:
    0 0 4px #900,
    3px 3px 0 #d00;

  opacity:0;

  pointer-events:none;
}

#dmg.show{
  animation:dmgPop .65s ease-out;
}

@keyframes dmgPop{

  0%{
    opacity:0;
    transform:
      scale(.5)
      translateY(15px);
  }

  20%{
    opacity:1;
    transform:
      scale(1.35)
      translateY(0);
  }

  100%{
    opacity:0;
    transform:
      scale(1)
      translateY(-50px);
  }
}

/* =========================
   RED HIT FLASH
========================= */

#red{
  position:absolute;
  inset:0;
  z-index:55;

  background:rgba(255,0,0,.48);

  opacity:0;

  pointer-events:none;
}

#red.on{
  animation:redHit .34s ease-out;
}

@keyframes redHit{

  0%{
    opacity:.85;
  }

  35%{
    opacity:.5;
  }

  100%{
    opacity:0;
  }
}

/* =========================
   BATTLE START
========================= */

#battle{
  position:absolute;
  z-index:52;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.7)
    skewX(-8deg);

  opacity:0;

  padding:10px 22px;

  background:
    linear-gradient(
      90deg,
      #9b0909,
      #ff4b13,
      #9b0909
    );

  border:3px solid #ffdf52;

  color:#fff;

  font-size:27px;
  font-weight:1000;

  white-space:nowrap;

  text-shadow:0 3px 4px #4b0000;

  box-shadow:
    0 0 20px rgba(255,80,0,.65);
}

#battle.show{
  animation:battleIn .8s ease-out;
}

@keyframes battleIn{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1.8)
      skewX(-8deg);
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1)
      skewX(-8deg);
  }
}

/* =========================
   MISSION CLEAR
========================= */

#clear{
  position:absolute;
  inset:0;

  z-index:90;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.2);

  opacity:0;

  pointer-events:none;
}

#clear.show{
  opacity:1;
  transition:.3s;
}

.cb{
  padding:18px 25px;

  text-align:center;

  background:
    linear-gradient(
      #ffdf65,
      #a85a08
    );

  border:4px solid #fff1a4;
  border-radius:14px;

  box-shadow:
    0 0 35px rgba(255,200,50,.8),
    inset 0 0 20px rgba(255,255,255,.25);

  text-shadow:
    0 4px 4px #6b2b00;
}

.ct{
  font-size:34px;
  font-weight:1000;
}

.cs{
  font-size:15px;
  margin-top:7px;
  font-weight:800;
}

/* =========================
   START SCREEN
========================= */

#start{
  position:absolute;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      rgba(0,0,0,.2),
      rgba(0,0,0,.58)
    );

  text-align:center;
}

#start.hidden{
  display:none;
}

.startBox{
  width:86%;
  max-width:380px;

  padding:20px 16px;

  border-radius:18px;

  background:rgba(5,12,20,.65);

  border:1px solid rgba(255,255,255,.3);

  backdrop-filter:blur(5px);
}

.startBox h1{
  margin:0 0 10px;

  font-size:31px;
  letter-spacing:2px;

  color:#ffe17a;

  text-shadow:
    0 3px 4px #6b3500;
}

.startBox p{
  font-size:13px;
  line-height:1.6;
  color:#eee;
}

#go{
  border:0;
  border-radius:11px;

  padding:14px 28px;

  font-size:18px;
  font-weight:1000;

  color:#fff;

  background:
    linear-gradient(
      #f7a62b,
      #b94d08
    );

  box-shadow:
    0 4px 0 #6d2904;

  cursor:pointer;
}

#go:active{
  transform:translateY(3px);
  box-shadow:
    0 1px 0 #6d2904;
}

/* =========================
   CAMERA SHAKE
========================= */

#camera.shake{
  animation:cameraShake .22s steps(2,end);
}

@keyframes cameraShake{

  0%{
    transform:translate(0);
  }

  20%{
    transform:translate(-8px,5px);
  }

  40%{
    transform:translate(8px,-5px);
  }

  60%{
    transform:translate(-6px,-3px);
  }

  80%{
    transform:translate(5px,4px);
  }

  100%{
    transform:translate(0);
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="camera">

    <div id="world">

      <img
        id="bg"
        src="data:image/webp;base64,UklGRiQdAABXRUJQVlA4IBAdAABwAgCdASoQAA4ABUB8JaQAA3AA/vuUAAA="
        alt=""
      >

      <div id="farHaze"></div>

      <div id="monsterWrap">
        <img
          id="monster"
          src="data:image/webp;base64,UklGRiQJAABXRUJQVlA4IBQAAADwAQCdASoQAAkABUB8JaQAA3AA/vuUAAA="
          alt=""
        >
      </div>

    </div>

    <div id="slash"></div>

    <img
      id="sword"
      src="data:image/webp;base64,UklGRiYAAABXRUJQVlA4IBoAAAAQAgCdASoQAAUABUB8JaQAA3AA/vuUAAA="
      alt=""
    >

  </div>

  <div id="hud">

    <div class="unit">

      <div class="lab">
        HP <span id="pt">100 / 100</span>
      </div>

      <div class="bar" id="pb">
        <div class="fill" id="pf"></div>
      </div>

    </div>

    <div class="unit">

      <div class="lab">
        MONSTER HP <span id="et">80 / 80</span>
      </div>

      <div class="bar" id="eb">
        <div class="fill" id="ef"></div>
      </div>

    </div>

  </div>

  <div id="nfc">
    <span id="dot"></span>
    <span id="nt">NFC 준비 중</span>
  </div>

  <div id="toast"></div>

  <div id="dmg">-16</div>

  <div id="red"></div>

  <div id="battle">
    BATTLE START!
  </div>

  <div id="clear">

    <div class="cb">

      <div class="ct">
        MISSION CLEAR!
      </div>

      <div class="cs">
        몬스터가 쓰러졌습니다!
      </div>

    </div>

  </div>

  <div id="start">

    <div class="startBox">

      <h1>
        PIXEL ADVENTURE
      </h1>

      <p>
        게임 시작과 동시에 앞으로 전진합니다.<br>
        NFC는 걷는 동안에도 사용할 수 있습니다.<br>
        몬스터 앞에 도착하면 NFC 공격이 실제 데미지가 됩니다.
      </p>

      <button id="go">
        GAME START
      </button>

    </div>

  </div>

</div>

<script>

const $ = id => document.getElementById(id);

let started = false;
let battle = false;
let won = false;

let nfcOn = false;
let lastTag = 0;

let walkStart = 0;
let raf = 0;
let enemyTimer = null;

let pHP = 100;
let eHP = 80;


/* =========================
   TOAST
========================= */

function toast(t){

  $('toast').textContent = t;

  $('toast').classList.add('show');

  clearTimeout(toast.t);

  toast.t = setTimeout(
    () => $('toast').classList.remove('show'),
    1200
  );
}


/* =========================
   HP
========================= */

function hp(){

  $('pf').style.width =
    pHP + '%';

  $('ef').style.width =
    (eHP / 80 * 100) + '%';

  $('pt').textContent =
    pHP + ' / 100';

  $('et').textContent =
    eHP + ' / 80';
}


function blink(el){

  el.classList.remove('blink');

  void el.offsetWidth;

  el.classList.add('blink');
}


/* =========================
   CAMERA SHAKE
========================= */

function shake(){

  $('camera').classList.remove('shake');

  void $('camera').offsetWidth;

  $('camera').classList.add('shake');
}


/* =========================
   MONSTER HIT VIBRATION
   적이 맞을 때만 진동
========================= */

function strongEnemyVibe(){

  if(navigator.vibrate){

    navigator.vibrate([
      700,
      100,
      700,
      100,
      450
    ]);

  }

}


/* =========================
   PLAYER HIT
   진동 없음
========================= */

function playerHit(){

  if(
    won ||
    pHP <= 0
  ){
    return;
  }

  pHP =
    Math.max(
      0,
      pHP - 5
    );

  hp();

  blink(
    $('pb')
  );

  /*
    플레이어가 맞을 때는
    진동을 사용하지 않습니다.
  */

  shake();

  $('red')
    .classList
    .remove('on');

  void $('red').offsetWidth;

  $('red')
    .classList
    .add('on');

  if(pHP <= 0){

    clearInterval(
      enemyTimer
    );

    toast(
      'YOU DIED'
    );

  }

}


/* =========================
   MONSTER DAMAGE
========================= */

function monsterDamage(){

  if(
    !battle ||
    won ||
    pHP <= 0
  ){
    return;
  }

  eHP =
    Math.max(
      0,
      eHP - 16
    );

  hp();

  blink(
    $('eb')
  );

  /*
    몬스터가 맞을 때만
    강하고 긴 진동
  */

  strongEnemyVibe();

  /*
    전체 화면 흔들림
  */

  shake();

  /*
    빨간 피격 플래시
  */

  $('red')
    .classList
    .remove('on');

  void $('red').offsetWidth;

  $('red')
    .classList
    .add('on');

  /*
    몬스터 자체 피격
  */

  $('monster')
    .classList
    .remove('hit');

  void $('monster').offsetWidth;

  $('monster')
    .classList
    .add('hit');

  /*
    데미지 숫자
  */

  $('dmg')
    .classList
    .remove('show');

  void $('dmg').offsetWidth;

  $('dmg')
    .classList
    .add('show');

  if(eHP <= 0){

    win();

  }

}


/* =========================
   NFC SWORD ATTACK
========================= */

function attack(){

  if(
    won ||
    pHP <= 0
  ){
    return;
  }

  /*
    기존 걷기 애니메이션을 잠시 덮어쓰고
    실제 베기 모션을 실행합니다.
  */

  $('sword')
    .classList
    .remove('attack');

  $('slash')
    .classList
    .remove('on');

  void $('sword').offsetWidth;
  void $('slash').offsetWidth;

  $('sword')
    .classList
    .add('attack');

  $('slash')
    .classList
    .add('on');

  /*
    걷는 중에도 NFC를 읽으면
    검은 무조건 휘두릅니다.
  */

  if(battle){

    toast(
      'NFC 인식! 검 공격!'
    );

    /*
      전투 중일 때만
      실제 몬스터 데미지
    */

    monsterDamage();

  }else{

    toast(
      'NFC 인식! 검을 휘둘렀습니다!'
    );

  }

}


/* =========================
   WIN
========================= */

function win(){

  won = true;

  clearInterval(
    enemyTimer
  );

  $('monster')
    .classList
    .remove('hit');

  $('monster')
    .classList
    .add('dead');

  setTimeout(
    () => {
      $('clear')
        .classList
        .add('show');
    },
    480
  );

}


/* =========================
   BATTLE START
========================= */

function battleStart(){

  if(
    battle ||
    won
  ){
    return;
  }

  battle = true;

  $('battle')
    .classList
    .remove('show');

  void $('battle').offsetWidth;

  $('battle')
    .classList
    .add('show');

  toast(
    '몬스터 앞에 도착했습니다!'
  );

  /*
    몬스터가 플레이어를 공격
  */

  enemyTimer =
    setInterval(
      playerHit,
      1700
    );

}


/* =========================
   2.5D WALK
========================= */

function walk(now){

  if(
    !started ||
    won
  ){
    return;
  }

  if(!walkStart){

    walkStart = now;

  }

  /*
    8초 동안 전진
  */

  const t =
    Math.min(
      (now - walkStart) / 8000,
      1
    );

  /*
    배경

    단순히 화면 전체를 갑자기
    바꾸는 것이 아니라

    계속 확대하면서
    아래쪽으로 이동시킵니다.
  */

  const bgScale =
    1.03 + t * .34;

  const bgX =
    -t * 1.8;

  const bgY =
    -t * 3.8;

  $('bg').style.transform =
    'translate(' +
    bgX +
    '%,' +
    bgY +
    '%) scale(' +
    bgScale +
    ')';


  /*
    몬스터

    아주 멀리 있는 작은 몬스터에서
    시작해서

    계속 커지면서
    플레이어 쪽으로 내려옵니다.
  */

  const monsterScale =
    .11 + t * .89;

  const monsterY =
    5 + t * 28;

  const monsterX =
    t * .8;

  $('monsterWrap').style.transform =
    'translate(calc(-50% + ' +
    monsterX +
    '%),' +
    monsterY +
    '%) scale(' +
    monsterScale +
    ')';

  /*
    처음에는 아주 희미하게
    멀리 보이고

    가까워질수록 선명해집니다.
  */

  $('monsterWrap').style.opacity =
    Math.min(
      1,
      .25 + t * 1.2
    );


  /*
    8초가 지나면
    몬스터 바로 앞에서 정지
  */

  if(t >= 1){

    battleStart();

    return;

  }

  raf =
    requestAnimationFrame(
      walk
    );

}


/* =========================
   START NFC
========================= */

async function startNFC(){

  /*
    Web NFC는 HTTPS 필요
  */

  if(
    !window.isSecureContext ||
    location.protocol !== 'https:'
  ){

    $('nt').textContent =
      'HTTPS 필요';

    toast(
      'Netlify HTTPS에서 실행해주세요.'
    );

    return false;

  }


  /*
    Android Chrome Web NFC
  */

  if(
    !('NDEFReader' in window)
  ){

    $('nt').textContent =
      'NFC 미지원';

    toast(
      'Android Chrome에서 Web NFC를 사용할 수 있습니다.'
    );

    return false;

  }


  if(nfcOn){

    return true;

  }


  try{

    const reader =
      new NDEFReader();

    /*
      반드시 게임 시작 버튼을
      누른 순간 실행
    */

    await reader.scan();

    nfcOn = true;

    $('nt').textContent =
      'NFC 대기 중';

    $('dot').style.background =
      '#49ef6a';


    reader.onreadingerror =
      () => {

        toast(
          'NFC 읽기 오류'
        );

      };


    reader.onreading =
      () => {

        const now =
          Date.now();

        /*
          같은 태그가 연속으로
          여러 번 읽히는 것 방지
        */

        if(
          now - lastTag < 650
        ){

          return;

        }

        lastTag = now;

        /*
          NFC = 검 공격
        */

        attack();

      };


    return true;

  }catch(e){

    $('nt').textContent =
      'NFC 권한 확인';

    toast(
      'Chrome에서 NFC 권한을 허용해주세요.'
    );

    return false;

  }

}


/* =========================
   OPEN CHROME
========================= */

function openChrome(){

  const u =
    location.href.replace(
      /^https?:\/\//,
      ''
    );

  location.href =
    'intent://' +
    u +
    '#Intent;scheme=https;package=com.android.chrome;end';

}


/* =========================
   GAME START
========================= */

$('go').onclick =
  async () => {

    const ua =
      navigator.userAgent;


    /*
      Android에서 Chrome이 아니면
      Chrome으로 이동
    */

    if(
      /Android/i.test(ua) &&
      !/Chrome|CriOS/i.test(ua)
    ){

      openChrome();

      return;

    }


    /*
      HTTPS 확인
    */

    if(
      !window.isSecureContext ||
      location.protocol !== 'https:'
    ){

      toast(
        'Netlify HTTPS 주소에서 실행해주세요.'
      );

      return;

    }


    /*
      게임 시작 버튼을 누른 순간
      NFC 권한 요청
    */

    await startNFC();


    /*
      게임 시작
    */

    started = true;

    $('start')
      .classList
      .add('hidden');


    pHP = 100;
    eHP = 80;

    hp();


    /*
      걷는 동안 검도 계속 좌우로 흔들림
    */

    $('sword')
      .classList
      .add('walking');


    /*
      즉시 전진 시작
    */

    walkStart = 0;

    cancelAnimationFrame(
      raf
    );

    raf =
      requestAnimationFrame(
        walk
      );

  };

</script>
