<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050812">
<title>PIXEL ADVENTURE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812}
body{display:flex;justify-content:center;font-family:Arial,sans-serif}
#game{position:relative;width:min(100vw,520px);height:100vh;overflow:hidden;background:#07101b;touch-action:manipulation;user-select:none}
#camera{position:absolute;inset:0;transform-origin:50% 58%;overflow:hidden}
#world{position:absolute;inset:-8%;transform-origin:50% 55%;}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02);will-change:transform}
#atmosphere{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.02),rgba(0,0,0,.14));z-index:4;pointer-events:none}
/* 실제 몬스터 이미지 */
#monster{position:absolute;z-index:10;left:50%;top:7%;width:78%;opacity:0;transform:translateX(-50%) scale(.16);transform-origin:50% 52%;will-change:transform,opacity,filter}
#monster img{display:block;width:100%;height:auto;image-rendering:auto}
#monster.hit{animation:monsterHit .48s ease-out}
#monster.dead{animation:monsterDead .85s forwards}
@keyframes monsterHit{
0%{filter:none;transform:translateX(-50%) scale(var(--monster-scale))}
12%{filter:brightness(2.7) saturate(2) drop-shadow(0 0 24px #ff1717);transform:translateX(calc(-50% - 13px)) scale(calc(var(--monster-scale)*1.08))}
25%{filter:brightness(.55) saturate(2) drop-shadow(0 0 16px red);transform:translateX(calc(-50% + 13px)) scale(calc(var(--monster-scale)*.98))}
42%{filter:brightness(2.3) drop-shadow(0 0 22px red);transform:translateX(calc(-50% - 9px)) scale(calc(var(--monster-scale)*1.04))}
60%{transform:translateX(calc(-50% + 7px)) scale(var(--monster-scale))}
100%{filter:none;transform:translateX(-50%) scale(var(--monster-scale))}
}
@keyframes monsterDead{
0%{filter:brightness(1);transform:translateX(-50%) scale(var(--monster-scale))}
25%{filter:brightness(3) drop-shadow(0 0 35px red);transform:translateX(-50%) scale(calc(var(--monster-scale)*1.15))}
55%{filter:brightness(2) drop-shadow(0 0 45px red);transform:translateX(-50%) scale(calc(var(--monster-scale)*.9)) rotate(4deg)}
100%{opacity:0;filter:brightness(4);transform:translateX(-50%) translateY(90px) scale(.08) rotate(18deg)}
}
/* 1인칭 검: 별도 이미지라 NFC 때 확실하게 움직임 */
#sword{position:absolute;z-index:25;right:3%;bottom:-13%;width:55%;height:72%;object-fit:contain;object-position:bottom right;transform-origin:84% 91%;transform:rotate(-18deg);filter:drop-shadow(0 5px 8px rgba(0,0,0,.65));pointer-events:none;will-change:transform}
#sword.walking{animation:swordWalk .62s ease-in-out infinite alternate}
#sword.attack{animation:swordSlash .34s cubic-bezier(.15,.9,.2,1) forwards}
@keyframes swordWalk{
from{transform:rotate(-24deg) translateY(5px)}
to{transform:rotate(17deg) translateY(-4px)}
}
@keyframes swordSlash{
0%{transform:rotate(-18deg) translate(0,0) scale(1)}
14%{transform:rotate(-40deg) translate(-10px,6px) scale(1.02)}
48%{transform:rotate(55deg) translate(-30px,-24px) scale(1.12)}
70%{transform:rotate(35deg) translate(-13px,-11px) scale(1.06)}
100%{transform:rotate(-18deg) translate(0,0) scale(1)}
}
#slash{position:absolute;z-index:27;left:19%;top:31%;width:90%;height:35%;opacity:0;pointer-events:none}
#slash:before,#slash:after{content:"";position:absolute;left:0;right:0;height:10%;border-radius:100%;background:linear-gradient(90deg,transparent,#fff,#fff2a0,#fff,transparent);filter:drop-shadow(0 0 11px #fff)}
#slash:before{top:38%;transform:rotate(-14deg)}
#slash:after{top:58%;height:7%;transform:rotate(-9deg)}
#slash.on{animation:slashFx .34s ease-out}
@keyframes slashFx{
0%{opacity:0;transform:translate(18%,15%) scale(.25) rotate(-8deg)}
18%{opacity:1}
100%{opacity:0;transform:translate(-6%,-8%) scale(1.25) rotate(-8deg)}
}
#red{position:absolute;inset:0;z-index:35;background:rgba(255,10,10,.58);opacity:0;pointer-events:none}
#red.on{animation:redFlash .5s ease-out}
@keyframes redFlash{0%{opacity:.78}18%{opacity:.22}35%{opacity:.62}55%{opacity:.12}100%{opacity:0}}
#camera.shake{animation:cameraShake .42s linear}
@keyframes cameraShake{
0%,100%{transform:translate(0,0)}
10%{transform:translate(-10px,5px) rotate(-.4deg)}
20%{transform:translate(11px,-6px) rotate(.4deg)}
30%{transform:translate(-9px,-7px) rotate(-.3deg)}
40%{transform:translate(9px,7px) rotate(.3deg)}
50%{transform:translate(-7px,3px)}
60%{transform:translate(7px,-3px)}
70%{transform:translate(-4px,2px)}
80%{transform:translate(4px,-2px)}
}
#hud{position:absolute;inset:0;z-index:50;pointer-events:none}
.unit{position:absolute;top:12px;width:44%;text-shadow:0 2px 3px #000}
#p{left:4%}#e{right:4%;text-align:right}
.lab{font-size:12px;font-weight:900;margin-bottom:3px}
.bar{height:15px;border:2px solid white;border-radius:5px;background:#1a0b12;overflow:hidden;box-shadow:0 2px 6px #000}
.fill{height:100%;transition:width .12s}
#pf{background:linear-gradient(#ff7070,#b51620);width:100%}
#ef{background:linear-gradient(#c678ff,#5d1db8);width:100%}
.blink{animation:hpBlink .5s}
@keyframes hpBlink{0%,100%{filter:brightness(1)}15%{filter:brightness(2.8)}32%{filter:brightness(.35)}52%{filter:brightness(2.5)}72%{filter:brightness(1)}}
#nfc{position:absolute;z-index:55;top:65px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:12px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.35);font-size:12px;font-weight:bold;white-space:nowrap}
#dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd34f;box-shadow:0 0 8px #ffd34f;margin-right:5px}
#toast{position:absolute;z-index:80;left:50%;bottom:90px;transform:translateX(-50%) translateY(15px);opacity:0;background:#000d;padding:9px 13px;border:1px solid #fff8;border-radius:10px;font-size:13px;transition:.2s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#dmg{position:absolute;z-index:70;left:68%;top:40%;font-size:38px;font-weight:1000;color:#fff;text-shadow:3px 3px #920000;opacity:0;pointer-events:none}
#dmg.show{animation:dmg .65s ease-out}
@keyframes dmg{0%{opacity:0;transform:translateY(18px) scale(.45)}18%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:translate(8px,-48px) scale(1)}}
#battle{position:absolute;z-index:75;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-3deg);font-size:34px;font-weight:1000;color:#fff1a0;text-shadow:4px 4px #82180d,0 0 15px #ffc03a;opacity:0;white-space:nowrap}
#battle.show{animation:bst .9s ease-out}
@keyframes bst{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-68%) scale(1.02)}}
#clear{display:none;position:absolute;z-index:100;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.28);text-align:center}
#clear.show{display:flex}
.cb{background:#061326e8;border:2px solid #f5d36a;border-radius:18px;padding:25px 28px;box-shadow:0 0 35px #ffd45a88}
.ct{font-size:40px;font-weight:1000;color:#ffd968;text-shadow:4px 4px #693010}
.cs{font-size:16px;font-weight:bold;margin-top:8px}
#start{position:absolute;z-index:110;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.18)}
.box{width:88%;padding:24px 18px;border:2px solid #f5d36a99;border-radius:18px;background:#061326dd}
h1{margin:0 0 8px;color:#ffe083;font-size:38px;text-shadow:3px 3px #713414}
p{font-size:14px;line-height:1.6;color:#eee}
button{border:0;border-radius:12px;padding:14px 32px;background:#ffd75d;color:#392506;font-size:18px;font-weight:900;box-shadow:0 4px #8d661d}
.hidden{display:none!important}
</style>
</head>

      <div id="slash"></div>
    </div>
    <div id="red"></div>
  </div>

  <div id="hud">
    <div class="unit" id="p"><div class="lab">HP <span id="pt">100 / 100</span></div><div class="bar" id="pb"><div class="fill" id="pf"></div></div></div>
    <div class="unit" id="e"><div class="lab">MONSTER HP <span id="et">80 / 80</span></div><div class="bar" id="eb"><div class="fill" id="ef"></div></div></div>
  </div>

  <div id="nfc"><span id="dot"></span><span id="nt">NFC 준비 중</span></div>
  <div id="toast"></div>
  <div id="dmg">-16</div>
  <div id="battle">BATTLE START!</div>

  <div id="clear"><div class="cb"><div class="ct">MISSION CLEAR!</div><div class="cs">몬스터가 쓰러졌습니다!</div></div></div>

  <div id="start">
    <div class="box">
      <h1>PIXEL ADVENTURE</h1>
      <p>게임 시작을 누르면 바로 전진합니다.<br>NFC를 대면 걷는 중에도 검을 휘두릅니다.<br>몬스터 앞에 도착하면 데미지가 들어갑니다.</p>
      <button id="go">GAME START</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let pHP=100,eHP=80,started=false,battle=false,won=false,nfc=false,lastTag=0;
let walkStart=0, walkRaf=0, enemyTimer=null;

function toast(t){
  $('toast').textContent=t;
  $('toast').classList.add('show');
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>$('toast').classList.remove('show'),1300);
}
function hp(){
  $('pf').style.width=pHP+'%';
  $('ef').style.width=(eHP/80*100)+'%';
  $('pt').textContent=pHP+' / 100';
  $('et').textContent=eHP+' / 80';
}
function blink(el){
  el.classList.remove('blink'); void el.offsetWidth; el.classList.add('blink');
}
function shake(){
  $('camera').classList.remove('shake'); void $('camera').offsetWidth; $('camera').classList.add('shake');
}
function enemyVibrate(){
  // 적이 맞을 때만 강하고 긴 진동
  if(navigator.vibrate) navigator.vibrate([520,90,520,90,360]);
}
function playerHit(){
  if(won || pHP<=0) return;
  pHP=Math.max(0,pHP-5);
  hp();
  blink($('pb'));
  // 플레이어 피격 진동은 의도적으로 없음
  if(pHP<=0){
    clearInterval(enemyTimer);
    toast('YOU DIED');
  }
}
function monsterDamage(){
  if(won || !battle || pHP<=0) return;
  eHP=Math.max(0,eHP-16);
  hp();
  blink($('eb'));
  enemyVibrate();
  shake();

  $('red').classList.remove('on'); void $('red').offsetWidth; $('red').classList.add('on');
  $('monster').classList.remove('hit'); void $('monster').offsetWidth; $('monster').classList.add('hit');

  $('dmg').classList.remove('show'); void $('dmg').offsetWidth; $('dmg').classList.add('show');

  if(eHP<=0) win();
}
function swordAttack(){
  if(won || pHP<=0) return;

  // 걷는 중에도 무조건 검 모션
  $('sword').classList.remove('attack');
  $('slash').classList.remove('on');
  void $('sword').offsetWidth; void $('slash').offsetWidth;
  $('sword').classList.add('attack');
  $('slash').classList.add('on');
  toast(battle ? 'NFC 인식! 검 공격!' : 'NFC 인식! 검을 휘둘렀습니다!');

  // 몬스터 앞에 도착한 뒤부터만 실제 데미지
  if(battle) monsterDamage();
}
function win(){
  won=true;
  clearInterval(enemyTimer);
  $('monster').classList.remove('hit');
  $('monster').classList.add('dead');
  setTimeout(()=>$('clear').classList.add('show'),420);
}
function battleStart(){
  if(battle || won) return;
  battle=true;
  $('battle').classList.remove('show'); void $('battle').offsetWidth; $('battle').classList.add('show');
  toast('몬스터 앞에 도착했습니다!');
  clearInterval(enemyTimer);
  enemyTimer=setInterval(playerHit,1600);
}
function walkFrame(now){
  if(!started || won) return;
  if(!walkStart) walkStart=now;
  const elapsed=now-walkStart;
  const duration=6200;
  const t=Math.min(elapsed/duration,1);

  // 배경: 실제 전진처럼 확대 + 살짝 아래로 패닝
  const bgScale=1.02 + t*0.27;
  const bgY=t*5.5;
  $('bg').style.transform='scale('+bgScale+') translateY('+bgY+'%)';

  // 몬스터: 멀리서 시작해서 실제로 점점 커지고 내려오며 접근
  const ms=.16 + t*.84;
  const top=7 + t*18;
  $('monster').style.setProperty('--monster-scale',ms);
  $('monster').style.transform='translateX(-50%) translateY('+top+'%) scale('+ms+')';
  $('monster').style.opacity=String(Math.min(1, t/.10));

  if(t>=1){
    battleStart();
    return;
  }
  walkRaf=requestAnimationFrame(walkFrame);
}
async function startNFC(){
  if(!window.isSecureContext || location.protocol!=='https:'){
    $('nt').textContent='HTTPS 필요'; return false;
  }
  if(!('NDEFReader' in window)){
    $('nt').textContent='NFC 미지원'; return false;
  }
  if(nfc) return true;
  try{
    const reader=new NDEFReader();
    await reader.scan();
    nfc=true;
    $('nt').textContent='NFC 대기 중';
    $('dot').style.background='#48ed69';
    reader.onreadingerror=()=>toast('NFC 읽기 오류');
    reader.onreading=()=>{
      const now=Date.now();
      if(now-lastTag<600) return;
      lastTag=now;
      swordAttack();
    };
    return true;
  }catch(e){
    $('nt').textContent='NFC 권한 확인';
    toast('Chrome에서 NFC 권한을 허용해주세요.');
    return false;
  }
}
$('go').onclick=async()=>{
  if(/Android/i.test(navigator.userAgent) && !/Chrome|CriOS/i.test(navigator.userAgent)){
    toast('Android Chrome에서 열어주세요.'); return;
  }
  if(!window.isSecureContext || location.protocol!=='https:'){
    toast('Netlify HTTPS 주소에서 실행해주세요.'); return;
  }

  // 버튼을 누른 바로 그 순간 NFC 권한 요청
  await startNFC();

  started=true;
  $('start').classList.add('hidden');
  pHP=100;eHP=80;hp();
  $('sword').classList.add('walking');

  // 다음 프레임부터 즉시 전진 시작 — 긴 setTimeout 없음
  walkStart=0;
  cancelAnimationFrame(walkRaf);
  walkRaf=requestAnimationFrame(walkFrame);
};
</script>
</body>
</html>
