<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>3D NFC ADVENTURE</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  z-index:20;

  left:5%;
  right:5%;
  top:15px;

  display:flex;
  justify-content:space-between;
  gap:10px;

  color:white;

  text-shadow:
    2px 2px 3px #000;
}

.unit{
  width:48%;
}

.label{
  font-size:12px;
  font-weight:bold;
  margin-bottom:4px;
}

.bar{
  width:100%;
  height:15px;

  border:2px solid white;
  border-radius:5px;

  overflow:hidden;

  background:#210909;

  box-shadow:
    0 2px 6px black;
}

.fill{
  height:100%;
  transition:width .12s linear;
}

#playerHP{
  width:100%;
  background:linear-gradient(#ff6c6c,#c41313);
}

#enemyHP{
  width:100%;
  background:linear-gradient(#c77aff,#6e1eb5);
}

/* =========================
   NFC
========================= */

#nfcStatus{
  position:absolute;

  z-index:30;

  top:58px;
  left:50%;

  transform:translateX(-50%);

  padding:7px 13px;

  border-radius:14px;

  background:rgba(0,0,0,.55);

  border:1px solid rgba(255,255,255,.3);

  color:white;

  font-size:12px;
  font-weight:bold;

  white-space:nowrap;
}

#nfcDot{
  display:inline-block;

  width:8px;
  height:8px;

  margin-right:5px;

  border-radius:50%;

  background:#ffd43b;
}

/* =========================
   FLASH
========================= */

#damageFlash{
  position:absolute;
  inset:0;

  z-index:15;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      circle,
      rgba(255,0,0,0) 25%,
      rgba(255,0,0,.5) 100%
    );
}

/* =========================
   DAMAGE NUMBER
========================= */

#damageNumber{
  position:absolute;

  z-index:25;

  left:50%;
  top:39%;

  transform:translateX(-50%);

  color:white;

  font-size:38px;
  font-weight:1000;

  text-shadow:
    3px 3px 0 #b00000,
    0 0 8px red;

  opacity:0;

  pointer-events:none;
}

/* =========================
   START
========================= */

#startScreen{
  position:absolute;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      rgba(5,10,15,.25),
      rgba(0,0,0,.75)
    );

  color:white;

  text-align:center;
}

#startScreen.hidden{
  display:none;
}

.startBox{
  width:86%;
  max-width:380px;

  padding:24px 18px;

  border-radius:18px;

  background:rgba(4,12,18,.72);

  border:1px solid rgba(255,255,255,.25);
}

.startBox h1{
  margin:0 0 10px;

  color:#ffe178;

  font-size:29px;

  text-shadow:
    0 3px 4px #6b3300;
}

.startBox p{
  font-size:13px;
  line-height:1.6;
}

#startButton{
  margin-top:10px;

  border:0;

  padding:15px 28px;

  border-radius:11px;

  color:white;

  font-size:18px;
  font-weight:900;

  background:
    linear-gradient(
      #f6a52b,
      #b94d08
    );

  box-shadow:
    0 4px 0 #6c2904;
}

/* =========================
   CHROME
========================= */

#chromeGuide{
  position:absolute;
  inset:0;

  z-index:300;

  display:none;

  align-items:center;
  justify-content:center;

  padding:22px;

  background:rgba(0,0,0,.85);

  color:white;

  text-align:center;
}

#chromeGuide.show{
  display:flex;
}

.chromeBox{
  width:100%;
  max-width:360px;

  padding:25px 20px;

  border-radius:18px;

  background:#111d29;

  border:1px solid rgba(255,255,255,.25);
}

#chromeButton{
  width:100%;

  border:0;

  border-radius:10px;

  padding:14px;

  background:#4285f4;

  color:white;

  font-size:17px;
  font-weight:bold;
}

</style>
</head>

<body>

<div id="game">

  <div id="hud">

    <div class="unit">

      <div class="label">
        HP
        <span id="playerText">
          100 / 100
        </span>
      </div>

      <div class="bar">
        <div
          class="fill"
          id="playerHP"
        ></div>
      </div>

    </div>


    <div class="unit">

      <div class="label">
        MONSTER
        <span id="enemyText">
          100 / 100
        </span>
      </div>

      <div class="bar">
        <div
          class="fill"
          id="enemyHP"
        ></div>
      </div>

    </div>

  </div>


  <div id="nfcStatus">

    <span id="nfcDot"></span>

    <span id="nfcText">
      NFC 준비 중
    </span>

  </div>


  <div id="damageFlash"></div>

  <div id="damageNumber">
    -20
  </div>


  <div id="startScreen">

    <div class="startBox">

      <h1>
        3D ADVENTURE
      </h1>

      <p>
        이번 버전은 이미지 확대 방식이 아니라<br>
        실제 3D 공간을 앞으로 이동합니다.<br><br>

        NFC 1회 = 검 1회 공격
      </p>

      <button id="startButton">
        GAME START
      </button>

    </div>

  </div>


  <div id="chromeGuide">

    <div class="chromeBox">

      <h2>
        Chrome으로 열어주세요
      </h2>

      <p>
        NFC 기능은 Android Chrome에서 실행합니다.
      </p>

      <button id="chromeButton">
        Chrome으로 연결
      </button>

    </div>

  </div>

</div>


<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>


<script>

/* =====================================================
   기본 설정
===================================================== */

const CONFIG = {

  /*
    몬스터 실제 위치

    더 큰 음수 =
    더 멀리 있음
  */
  MONSTER_Z:-32,


  /*
    처음 카메라 위치
  */
  START_Z:8,


  /*
    몬스터 앞에서 멈추는 위치
  */
  STOP_Z:-25,


  /*
    걷는 속도
  */
  WALK_SPEED:2.8,


  /*
    몬스터 HP
  */
  MONSTER_HP:100,


  /*
    플레이어 공격력
  */
  PLAYER_DAMAGE:20,


  /*
    몬스터 공격력
  */
  MONSTER_DAMAGE:5,


  /*
    몬스터 공격 간격
  */
  MONSTER_ATTACK_TIME:1700,


  /*
    NFC 쿨타임
  */
  NFC_COOLDOWN:1,


  /*
    검 공격속도

    0.14초 정도
  */
  SWORD_SPEED:140

};


const $ =
  id => document.getElementById(id);


/* =====================================================
   상태
===================================================== */

let started = false;

let battle = false;

let monsterDead = false;


let playerHP = 100;

let monsterHP =
  CONFIG.MONSTER_HP;


let lastTag = 0;


let nfcStarted = false;


let lastTime = 0;


let walkTime = 0;


let attackType = 0;


let swordAttacking = false;


let enemyAttackTimer = null;


let monsterHitTime = 0;


let monsterAttackProgress = -1;


let cameraShake = 0;


/* =====================================================
   THREE 기본
===================================================== */

const scene =
  new THREE.Scene();


/*
  진짜 3D 안개
*/

scene.fog =
  new THREE.Fog(
    0x91a9a2,
    12,
    70
  );


/*
  카메라

  PerspectiveCamera이므로
  실제 원근법 적용.
*/

const camera =
  new THREE.PerspectiveCamera(
    68,
    innerWidth / innerHeight,
    0.1,
    150
  );


camera.position.set(
  0,
  2.15,
  CONFIG.START_Z
);


/*
  렌더러
*/

const renderer =
  new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    1.5
  )
);


renderer.setSize(
  innerWidth,
  innerHeight
);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


document
  .getElementById('game')
  .prepend(
    renderer.domElement
  );


/* =====================================================
   하늘
===================================================== */

scene.background =
  new THREE.Color(
    0x9fb5ae
  );


/* =====================================================
   LIGHT
===================================================== */

/*
  전체적으로 밝히는 빛
*/

const ambient =
  new THREE.HemisphereLight(
    0xdde8dc,
    0x26311e,
    2.1
  );


scene.add(
  ambient
);


/*
  햇빛
*/

const sun =
  new THREE.DirectionalLight(
    0xfff0c4,
    2.2
  );


sun.position.set(
  -5,
  10,
  4
);


scene.add(
  sun
);


/* =====================================================
   바닥
===================================================== */

const groundGeometry =
  new THREE.PlaneGeometry(
    80,
    150,
    1,
    1
  );


const groundMaterial =
  new THREE.MeshLambertMaterial({
    color:0x536b35
  });


const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );


ground.rotation.x =
  -Math.PI / 2;


ground.position.set(
  0,
  0,
  -35
);


scene.add(
  ground
);


/* =====================================================
   길
===================================================== */

const pathGeometry =
  new THREE.PlaneGeometry(
    6,
    150
  );


const pathMaterial =
  new THREE.MeshLambertMaterial({
    color:0x756847
  });


const path =
  new THREE.Mesh(
    pathGeometry,
    pathMaterial
  );


path.rotation.x =
  -Math.PI / 2;


path.position.set(
  0,
  .012,
  -35
);


scene.add(
  path
);


/* =====================================================
   풀 생성
===================================================== */

const grassMaterial =
  new THREE.MeshLambertMaterial({
    color:0x48682d
  });


const grassGeometry =
  new THREE.ConeGeometry(
    .08,
    .5,
    3
  );


function createGrass(
  x,
  z
){

  const grass =
    new THREE.Mesh(
      grassGeometry,
      grassMaterial
    );


  grass.position.set(
    x,
    .25,
    z
  );


  grass.rotation.z =
    (
      Math.random() -
      .5
    ) *
    .3;


  const scale =
    .6 +
    Math.random() *
    .8;


  grass.scale.set(
    scale,
    scale,
    scale
  );


  scene.add(
    grass
  );

}


/*
  길 양옆에 풀
*/

for(
  let i = 0;
  i < 230;
  i++
){

  let x;


  if(
    Math.random() <
    .5
  ){

    x =
      -3.4 -
      Math.random() *
      10;

  }

  else{

    x =
      3.4 +
      Math.random() *
      10;

  }


  const z =
    10 -
    Math.random() *
    100;


  createGrass(
    x,
    z
  );

}


/* =====================================================
   나무
===================================================== */

const trunkGeometry =
  new THREE.CylinderGeometry(
    .28,
    .4,
    3.5,
    6
  );


const trunkMaterial =
  new THREE.MeshLambertMaterial({
    color:0x49321f
  });


const leafGeometry =
  new THREE.ConeGeometry(
    2,
    5,
    7
  );


const leafMaterial =
  new THREE.MeshLambertMaterial({
    color:0x244623
  });


function createTree(
  x,
  z,
  scale
){

  const group =
    new THREE.Group();


  const trunk =
    new THREE.Mesh(
      trunkGeometry,
      trunkMaterial
    );


  trunk.position.y =
    1.75;


  group.add(
    trunk
  );


  const leaves =
    new THREE.Mesh(
      leafGeometry,
      leafMaterial
    );


  leaves.position.y =
    5;


  group.add(
    leaves
  );


  group.position.set(
    x,
    0,
    z
  );


  group.scale.setScalar(
    scale
  );


  /*
    살짝 랜덤 회전
  */

  group.rotation.y =
    Math.random() *
    Math.PI;


  scene.add(
    group
  );

}


/*
  숲길 생성
*/

for(
  let z = 5;
  z > -85;
  z -= 5
){

  createTree(
    -5 -
    Math.random() * 5,
    z +
    Math.random() * 2,
    .75 +
    Math.random() * .65
  );


  createTree(
    5 +
    Math.random() * 5,
    z +
    Math.random() * 2,
    .75 +
    Math.random() * .65
  );

}


/* =====================================================
   돌
===================================================== */

const rockGeometry =
  new THREE.DodecahedronGeometry(
    .45,
    0
  );


const rockMaterial =
  new THREE.MeshLambertMaterial({
    color:0x55594d
  });


for(
  let i = 0;
  i < 30;
  i++
){

  const rock =
    new THREE.Mesh(
      rockGeometry,
      rockMaterial
    );


  let x =
    3.5 +
    Math.random() *
    8;


  if(
    Math.random() <
    .5
  ){

    x *= -1;

  }


  rock.position.set(

    x,

    .25,

    5 -
    Math.random() *
    90

  );


  const s =
    .4 +
    Math.random() *
    1.1;


  rock.scale.set(
    s,
    s * .7,
    s
  );


  scene.add(
    rock
  );

}


/* =====================================================
   몬스터

   지금은 테스트용 실제 3D 모델.
   나중에 GLB로 교체 가능.
===================================================== */

const monster =
  new THREE.Group();


/*
  몸통
*/

const monsterBodyGeometry =
  new THREE.SphereGeometry(
    1.45,
    10,
    8
  );


const monsterMaterial =
  new THREE.MeshLambertMaterial({
    color:0x65764a
  });


const monsterBody =
  new THREE.Mesh(
    monsterBodyGeometry,
    monsterMaterial
  );


monsterBody.scale.set(
  1.25,
  1.35,
  .9
);


monsterBody.position.y =
  1.55;


monster.add(
  monsterBody
);


/*
  머리
*/

const monsterHead =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      1,
      9,
      7
    ),

    monsterMaterial

  );


monsterHead.position.set(
  0,
  3.15,
  0
);


monster.add(
  monsterHead
);


/*
  눈
*/

const eyeMaterial =
  new THREE.MeshBasicMaterial({
    color:0xff2200
  });


function createEye(x){

  const eye =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .12,
        6,
        6
      ),

      eyeMaterial

    );


  eye.position.set(
    x,
    3.35,
    .91
  );


  monster.add(
    eye
  );

}


createEye(-.32);
createEye(.32);


/*
  팔
*/

const armGeometry =
  new THREE.CylinderGeometry(
    .22,
    .3,
    2.4,
    6
  );


const leftArm =
  new THREE.Mesh(
    armGeometry,
    monsterMaterial
  );


leftArm.position.set(
  -1.45,
  1.7,
  0
);


leftArm.rotation.z =
  -.45;


monster.add(
  leftArm
);


const rightArm =
  leftArm.clone();


rightArm.position.x =
  1.45;


rightArm.rotation.z =
  .45;


monster.add(
  rightArm
);


/*
  몬스터 실제 3D 위치
*/

monster.position.set(
  0,
  0,
  CONFIG.MONSTER_Z
);


scene.add(
  monster
);


/* =====================================================
   몬스터 그림자
===================================================== */

const shadow =
  new THREE.Mesh(

    new THREE.CircleGeometry(
      1.7,
      24
    ),

    new THREE.MeshBasicMaterial({

      color:0x000000,

      transparent:true,

      opacity:.32

    })

  );


shadow.rotation.x =
  -Math.PI / 2;


shadow.position.set(
  0,
  .03,
  CONFIG.MONSTER_Z
);


scene.add(
  shadow
);


/* =====================================================
   ★ 1인칭 3D 검
===================================================== */

/*
  검은 월드가 아니라
  카메라 자식으로 붙인다.

  따라서 항상 플레이어 손 앞에 있음.
*/

const sword =
  new THREE.Group();


/*
  칼날
*/

const blade =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      .13,
      2.3,
      .12
    ),

    new THREE.MeshStandardMaterial({

      color:0xd8e1e3,

      roughness:.35,

      metalness:.8

    })

  );


blade.position.y =
  1.25;


sword.add(
  blade
);


/*
  가드
*/

const guard =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      .9,
      .13,
      .18
    ),

    new THREE.MeshStandardMaterial({
      color:0xb38a28,
      metalness:.55,
      roughness:.45
    })

  );


guard.position.y =
  .12;


sword.add(
  guard
);


/*
  손잡이
*/

const handle =
  new THREE.Mesh(

    new THREE.CylinderGeometry(
      .11,
      .13,
      .85,
      7
    ),

    new THREE.MeshLambertMaterial({
      color:0x402416
    })

  );


handle.position.y =
  -.35;


sword.add(
  handle
);


/*
  ★ 검 화면 위치

  x 증가 = 오른쪽
  y 증가 = 위
  z 더 음수 = 화면 안쪽
*/

sword.position.set(
  1.35,
  -1.35,
  -2.8
);


sword.rotation.set(
  -.35,
  0,
  -.38
);


camera.add(
  sword
);


scene.add(
  camera
);


/* =====================================================
   HP
===================================================== */

function updateHP(){

  $('playerHP').style.width =
    playerHP + '%';


  $('enemyHP').style.width =
    monsterHP + '%';


  $('playerText').textContent =
    playerHP + ' / 100';


  $('enemyText').textContent =
    monsterHP + ' / 100';

}


/* =====================================================
   DAMAGE NUMBER
===================================================== */

function showDamage(){

  $('damageNumber').animate(

    [

      {
        opacity:0,
        transform:
          'translate(-50%,20px) scale(.5)'
      },

      {
        opacity:1,
        transform:
          'translate(-50%,0) scale(1.3)'
      },

      {
        opacity:0,
        transform:
          'translate(-50%,-50px) scale(1)'
      }

    ],

    {
      duration:430,
      easing:'ease-out'
    }

  );

}


/* =====================================================
   PLAYER FLASH
===================================================== */

function playerFlash(){

  $('damageFlash').animate(

    [

      {opacity:0},

      {opacity:.85},

      {opacity:.25},

      {opacity:0}

    ],

    {
      duration:300
    }

  );

}


/* =====================================================
   몬스터 데미지
===================================================== */

function damageMonster(){

  if(
    !battle ||
    monsterDead
  ){
    return;
  }


  monsterHP -=
    CONFIG.PLAYER_DAMAGE;


  if(
    monsterHP < 0
  ){
    monsterHP = 0;
  }


  updateHP();


  /*
    ★ 몬스터 맞았을 때만 진동
  */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [130,25,110]
    );

  }


  /*
    몬스터 빨간 피격
  */

  monsterMaterial.color.set(
    0xff2020
  );


  monsterHitTime =
    .22;


  /*
    화면 흔들기
  */

  cameraShake =
    .22;


  showDamage();


  if(
    monsterHP <= 0
  ){

    killMonster();

  }

}


/* =====================================================
   몬스터 사망
===================================================== */

function killMonster(){

  monsterDead = true;

  battle = false;


  clearInterval(
    enemyAttackTimer
  );


  /*
    게임은 계속 진행.

    몬스터만 쓰러짐.
  */

}


/* =====================================================
   검 공격
===================================================== */

function attack(){

  if(
    !started ||
    swordAttacking
  ){
    return;
  }


  swordAttacking =
    true;


  const horizontal =
    attackType === 0;


  attackType =
    attackType === 0
    ? 1
    : 0;


  const startRot = {

    x:sword.rotation.x,

    y:sword.rotation.y,

    z:sword.rotation.z

  };


  const start =
    performance.now();


  const duration =
    CONFIG.SWORD_SPEED;


  function slash(now){

    const t =
      Math.min(
        (now-start) /
        duration,
        1
      );


    /*
      빠르게 들어갔다 돌아오는
      공격 곡선
    */

    const swing =
      Math.sin(
        t *
        Math.PI
      );


    if(horizontal){

      /*
        ★ 좌우 베기
      */

      sword.rotation.z =
        startRot.z +
        swing *
        1.65;


      sword.rotation.y =
        startRot.y -
        swing *
        .35;


      sword.position.x =
        1.35 -
        swing *
        .65;

    }

    else{

      /*
        ★ 위 → 아래 베기
      */

      sword.rotation.x =
        startRot.x -
        swing *
        1.55;


      sword.rotation.z =
        startRot.z +
        swing *
        .30;


      sword.position.y =
        -1.35 +
        swing *
        .65;

    }


    /*
      공격 중간 지점에서
      실제 데미지
    */

    if(
      t >= .45 &&
      t < .65 &&
      !slash.hit
    ){

      slash.hit = true;

      damageMonster();

    }


    if(
      t < 1
    ){

      requestAnimationFrame(
        slash
      );

    }

    else{

      sword.rotation.set(
        startRot.x,
        startRot.y,
        startRot.z
      );


      sword.position.set(
        1.35,
        -1.35,
        -2.8
      );


      swordAttacking =
        false;

    }

  }


  slash.hit = false;


  requestAnimationFrame(
    slash
  );

}


/* =====================================================
   몬스터 공격
===================================================== */

function monsterAttack(){

  if(
    !battle ||
    monsterDead ||
    playerHP <= 0
  ){
    return;
  }


  /*
    공격 애니메이션 시작
  */

  monsterAttackProgress =
    0;

}


/* =====================================================
   전투 시작
===================================================== */

function startBattle(){

  if(
    battle ||
    monsterDead
  ){
    return;
  }


  battle = true;


  enemyAttackTimer =
    setInterval(
      monsterAttack,
      CONFIG.MONSTER_ATTACK_TIME
    );

}


/* =====================================================
   NFC
===================================================== */

async function startNFC(){

  if(
    !window.isSecureContext
  ){

    $('nfcText').textContent =
      'HTTPS 필요';

    return;

  }


  if(
    !('NDEFReader' in window)
  ){

    $('nfcText').textContent =
      'NFC 미지원';

    return;

  }


  if(
    nfcStarted
  ){
    return;
  }


  try{

    const reader =
      new NDEFReader();


    await reader.scan();


    nfcStarted =
      true;


    $('nfcText').textContent =
      'NFC 대기 중';


    $('nfcDot').style.background =
      '#46ef68';


    reader.onreading =
      ()=>{


        const now =
          Date.now();


        if(
          now-lastTag <
          CONFIG.NFC_COOLDOWN
        ){
          return;
        }


        lastTag =
          now;


        /*
          ★ NFC 한 번
          =
          검 한 번
        */

        attack();

      };


    reader.onreadingerror =
      ()=>{

        $('nfcText').textContent =
          'NFC 읽기 오류';

      };

  }

  catch(e){

    $('nfcText').textContent =
      'NFC 권한 확인';

  }

}


/* =====================================================
   브라우저
===================================================== */

function isKakao(){

  return(
    /KAKAOTALK|KakaoTalk/i.test(
      navigator.userAgent
    )
  );

}


function isAndroid(){

  return(
    /Android/i.test(
      navigator.userAgent
    )
  );

}


function openChrome(){

  const clean =
    location.href.replace(
      /^https?:\/\//,
      ''
    );


  location.href =

    'intent://' +

    clean +

    '#Intent;' +

    'scheme=https;' +

    'package=com.android.chrome;' +

    'end';

}


if(
  isKakao() &&
  isAndroid()
){

  $('chromeGuide')
    .classList
    .add('show');

}


$('chromeButton').onclick =
  openChrome;


/* =====================================================
   GAME START
===================================================== */

$('startButton').onclick =
  async ()=>{


    await startNFC();


    started =
      true;


    $('startScreen')
      .classList
      .add('hidden');

};


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  'resize',
  ()=>{

    camera.aspect =
      innerWidth /
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =====================================================
   MAIN GAME LOOP
===================================================== */

function animate(time){

  requestAnimationFrame(
    animate
  );


  const dt =

    Math.min(

      (
        time -
        lastTime
      ) /
      1000,

      .05

    );


  lastTime =
    time;


  if(started){


    /* ===============================================
       걷기
    =============================================== */

    if(
      !battle
    ){

      /*
        몬스터 살아있을 때는
        몬스터 앞까지만 이동
      */

      if(
        !monsterDead
      ){

        camera.position.z -=

          CONFIG.WALK_SPEED *
          dt;


        if(
          camera.position.z <=
          CONFIG.STOP_Z
        ){

          camera.position.z =
            CONFIG.STOP_Z;


          startBattle();

        }

      }

      else{

        /*
          ★ 몬스터 죽은 뒤에는
          계속 앞으로
        */

        camera.position.z -=

          CONFIG.WALK_SPEED *
          dt;

      }

    }


    /* ===============================================
       걸음 흔들림
    =============================================== */

    walkTime +=
      dt * 8;


    if(
      !swordAttacking
    ){

      sword.position.y =

        -1.35 +

        Math.sin(
          walkTime
        ) *
        .045;


      sword.position.x =

        1.35 +

        Math.sin(
          walkTime * .5
        ) *
        .035;

    }


    /*
      카메라도 아주 조금 걷기
    */

    camera.position.y =

      2.15 +

      Math.sin(
        walkTime
      ) *
      .025;


    /* ===============================================
       몬스터 숨쉬기

       실제 3D scale 변화
    =============================================== */

    if(
      !monsterDead &&
      monsterAttackProgress < 0
    ){

      const breathe =

        1 +

        Math.sin(
          time * .003
        ) *

        .025;


      monster.scale.set(

        1,

        breathe,

        1

      );

    }


    /* ===============================================
       몬스터 맞음
    =============================================== */

    if(
      monsterHitTime > 0
    ){

      monsterHitTime -=
        dt;


      monster.position.x =

        Math.sin(
          time * .09
        ) *
        .18;


      if(
        monsterHitTime <= 0
      ){

        monster.position.x =
          0;


        monsterMaterial.color.set(
          0x65764a
        );

      }

    }


    /* ===============================================
       몬스터 죽음
    =============================================== */

    if(
      monsterDead
    ){

      monster.rotation.z +=
        dt * 1.8;


      monster.position.y -=
        dt * 1.6;


      monster.scale.multiplyScalar(
        Math.max(
          .96,
          1-dt
        )
      );


      shadow.material.opacity =

        Math.max(
          0,
          shadow.material.opacity -
          dt
        );

    }


    /* ===============================================
       ★ 몬스터 돌진 공격
    =============================================== */

    if(
      monsterAttackProgress >= 0
    ){

      monsterAttackProgress +=
        dt * 2.5;


      const t =
        monsterAttackProgress;


      /*
        0 → 0.25
        살짝 뒤로
      */

      if(
        t < .25
      ){

        monster.position.z =

          CONFIG.MONSTER_Z -

          t * 2;

      }


      /*
        0.25 → 0.55
        플레이어에게 돌진
      */

      else if(
        t < .55
      ){

        const p =

          (
            t-.25
          ) /
          .30;


        monster.position.z =

          CONFIG.MONSTER_Z +

          p *
          3.2;

      }


      /*
        ★ 공격 적중
      */

      else if(
        t < .62
      ){

        if(
          !monsterAttack.hit
        ){

          monsterAttack.hit =
            true;


          playerHP =

            Math.max(

              0,

              playerHP -
              CONFIG.MONSTER_DAMAGE

            );


          updateHP();


          /*
            ★ 플레이어가 맞을 때는
            진동 없음
          */

          playerFlash();


          cameraShake =
            .28;

        }

      }


      /*
        원래 위치로 돌아감
      */

      else if(
        t < 1
      ){

        const p =

          (
            t-.62
          ) /
          .38;


        monster.position.z =

          THREE.MathUtils.lerp(

            CONFIG.MONSTER_Z + 3.2,

            CONFIG.MONSTER_Z,

            p

          );

      }

      else{

        monster.position.z =
          CONFIG.MONSTER_Z;


        monsterAttackProgress =
          -1;


        monsterAttack.hit =
          false;

      }

    }


    /* ===============================================
       CAMERA SHAKE
    =============================================== */

    if(
      cameraShake > 0
    ){

      cameraShake -=
        dt;


      camera.rotation.z =

        (
          Math.random() -
          .5
        ) *
        .035;


      camera.rotation.x =

        (
          Math.random() -
          .5
        ) *
        .025;

    }

    else{

      camera.rotation.z *=
        .75;


      camera.rotation.x *=
        .75;

    }

  }


  renderer.render(
    scene,
    camera
  );

}


updateHP();


requestAnimationFrame(
  animate
);

</script>

</html>
