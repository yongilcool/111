<!-- =====================================================
     ★★★★★
     브라우저/Chrome 이동 코드는
     Three.js 모듈보다 먼저 실행
     ★★★★★
===================================================== -->

<script>

function isAndroid(){

    return(
        /Android/i.test(
            navigator.userAgent || ''
        )
    );

}


function isKakaoBrowser(){

    const ua =
        navigator.userAgent || '';

    return(
        /KAKAOTALK/i.test(ua) ||
        /KakaoTalk/i.test(ua)
    );

}


function isRealChrome(){

    const ua =
        navigator.userAgent || '';


    if(
        isKakaoBrowser()
    ){
        return false;
    }


    if(
        /SamsungBrowser/i.test(ua)
    ){
        return false;
    }


    if(
        /EdgA/i.test(ua)
    ){
        return false;
    }


    if(
        /OPR/i.test(ua)
    ){
        return false;
    }


    return(
        /Chrome/i.test(ua)
    );

}


/* =====================================================
   ★ Android Chrome 열기
===================================================== */

function openChrome(){

    const current =
        window.location.href;


    const clean =
        current.replace(
            /^https?:\/\//i,
            ''
        );


    window.location.href =

        'intent://' +

        clean +

        '#Intent;' +

        'scheme=https;' +

        'package=com.android.chrome;' +

        'S.browser_fallback_url=' +

        encodeURIComponent(
            current
        ) +

        ';end';

}


/* =====================================================
   ★ Android + Chrome 아닌 경우
   처음부터 Chrome 안내 표시
===================================================== */

window.addEventListener(
    'DOMContentLoaded',
    ()=>{

        if(
            isAndroid() &&
            !isRealChrome()
        ){

            document
                .getElementById(
                    'chromeGuide'
                )
                .classList
                .add('show');

        }

    }
);


document
    .getElementById(
        'chromeButton'
    )
    .addEventListener(
        'click',
        openChrome
    );

</script>

/* =====================================================
   PIXEL TEXTURE GENERATOR
===================================================== */

function makePixelTexture(
    size,
    colors,
    blockSize = 8
){

    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        size;

    canvas.height =
        size;


    const ctx =
        canvas.getContext(
            '2d'
        );


    ctx.imageSmoothingEnabled =
        false;


    for(
        let y = 0;
        y < size;
        y += blockSize
    ){

        for(
            let x = 0;
            x < size;
            x += blockSize
        ){

            const color =

                colors[

                    Math.floor(

                        Math.random() *

                        colors.length

                    )

                ];


            ctx.fillStyle =
                color;


            ctx.fillRect(

                x,
                y,

                blockSize,
                blockSize

            );

        }

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.magFilter =
        THREE.NearestFilter;


    texture.minFilter =
        THREE.NearestFilter;


    texture.wrapS =
        THREE.RepeatWrapping;


    texture.wrapT =
        THREE.RepeatWrapping;


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


/* =====================================================
   TEXTURES
===================================================== */

function createGrassTexture(){

    const texture =
        makePixelTexture(

            128,

            [
                '#4f6d32',
                '#5e7c38',
                '#405d29',
                '#6f893f',
                '#769249',
                '#354f26'
            ],

            8

        );


    texture.repeat.set(
        12,
        30
    );


    return texture;

}


function createPathTexture(){

    const texture =
        makePixelTexture(

            128,

            [
                '#766346',
                '#826e4c',
                '#68563e',
                '#917a53',
                '#5e503b'
            ],

            8

        );


    texture.repeat.set(
        3,
        35
    );


    return texture;

}


function createTreeTexture(){

}


function createMonsterTexture(){

}


/* =====================================================
   INIT
===================================================== */

function init3D(){


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x80b4d5
        );


    scene.fog =
        new THREE.Fog(

            0x88abc0,

            18,

            75

        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(

            67,

            window.innerWidth /
            window.innerHeight,

            .1,

            160

        );


    camera.position.set(

        0,

        2.15,

        CONFIG.START_Z

    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({

            antialias:false,

            powerPreference:
                'high-performance'

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            CONFIG.MAX_PIXEL_RATIO

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.domElement.style.imageRendering =
        'pixelated';


    document
        .getElementById(
            'game'
        )
        .prepend(
            renderer.domElement
        );


    /* LIGHT */

    const hemi =
        new THREE.HemisphereLight(

            0xd6efff,

            0x28361f,

            2

        );


    scene.add(
        hemi
    );


    const sun =
        new THREE.DirectionalLight(

            0xffe4a9,

            2.2

        );


    sun.position.set(

        -7,

        12,

        5

    );


    scene.add(
        sun
    );


    /* GROUND */

    const grassTexture =
        createGrassTexture();


    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                80,

                180

            ),

            new THREE.MeshLambertMaterial({

                map:
                    grassTexture

            })

        );


    ground.rotation.x =
        -Math.PI / 2;


    ground.position.set(

        0,

        0,

        -55

    );


    scene.add(
        ground
    );


    /* PATH */

    const pathTexture =
        createPathTexture();


    const path =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                6,

                180

            ),

            new THREE.MeshLambertMaterial({

                map:
                    pathTexture

            })

        );


    path.rotation.x =
        -Math.PI / 2;


    path.position.set(

        0,

        .015,

        -55

    );


    scene.add(
        path
    );


    /* TREES */

    const leafTexture =
        createTreeTexture();


    const trunkMaterial =
        new THREE.MeshLambertMaterial({

            color:
                0x49321f

        });


    const leafMaterial =
        new THREE.MeshLambertMaterial({

            map:
                leafTexture

        });


    const trunkGeo =
        new THREE.CylinderGeometry(

            .25,

            .38,

            3,

            5

        );


    const leafGeo =
        new THREE.ConeGeometry(

            1.75,

            4.7,

            6

        );


    function addTree(
        x,
        z,
        scale
    ){

        const tree =
            new THREE.Group();


        const trunk =
            new THREE.Mesh(

                trunkGeo,

                trunkMaterial

            );


        trunk.position.y =
            1.5;


        tree.add(
            trunk
        );


        const leaves1 =
            new THREE.Mesh(

                leafGeo,

                leafMaterial

            );


        leaves1.position.y =
            4;


        tree.add(
            leaves1
        );


        const leaves2 =
            new THREE.Mesh(

                leafGeo,

                leafMaterial

            );


        leaves2.scale.set(

            .72,
            .72,
            .72

        );


        leaves2.position.y =
            5.4;


        tree.add(
            leaves2
        );


        tree.position.set(

            x,
            0,
            z

        );


        tree.scale.setScalar(
            scale
        );


        tree.rotation.y =
            Math.random() *
            Math.PI;


        scene.add(
            tree
        );

    }


    for(
        let z = 5;
        z > -115;
        z -= 5
    ){

        addTree(

            -5 -
            Math.random() *
            6,

            z +
            Math.random() *
            2,

            .7 +
            Math.random() *
            .6

        );


        addTree(

            5 +
            Math.random() *
            6,

            z +
            Math.random() *
            2,

            .7 +
            Math.random() *
            .6

        );

    }


    /* ROCKS */

    const rockMaterial =
        new THREE.MeshLambertMaterial({

            color:
                0x596057

        });


    const rockGeo =
        new THREE.DodecahedronGeometry(

            .5,

            0

        );


    for(
        let i = 0;
        i < 45;
        i++
    ){

        const rock =
            new THREE.Mesh(

                rockGeo,

                rockMaterial

            );


        let x =

            3.7 +

            Math.random() *
            9;


        if(
            Math.random() <
            .5
        ){

            x *= -1;

        }


        rock.position.set(

            x,

            .25,

            5 -
            Math.random() *
            120

        );


        const s =

            .35 +

            Math.random() *
            .9;


        rock.scale.set(

            s,

            s * .6,

            s

        );


        scene.add(
            rock
        );

    }


    createMonster();

    createSword();


    scene.add(
        camera
    );


    gameInitialized =
        true;


    window.addEventListener(

        'resize',

        onResize

    );


    requestAnimationFrame(
        gameLoop
    );


    return true;

}


/* =====================================================
   MONSTER
===================================================== */

function createMonster(){


    monster =
        new THREE.Group();


    monsterMaterial =
        new THREE.MeshLambertMaterial({

            map:
                createMonsterTexture()

        });


    const body =
        new THREE.Mesh(

            new THREE.SphereGeometry(

                1.4,

                8,

                6

            ),

            monsterMaterial

        );


    body.scale.set(

        1.35,
        1.15,
        .85

    );


    body.position.y =
        1.35;


    monster.add(
        body
    );


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(

                1.05,

                8,

                6

            ),

            monsterMaterial

        );


    head.position.set(

        0,

        2.75,

        .08

    );


    monster.add(
        head
    );


    /* EYES */

    const eyeMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xd9ff9a

        });


    const pupilMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x182019

        });


    const eyePositions = [

        [-.48,2.95,.92],

        [0,3.12,1.02],

        [.48,2.95,.92],

        [-.25,2.63,1.02],

        [.25,2.63,1.02]

    ];


    for(
        const pos
        of eyePositions
    ){

        const eye =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    .16,

                    6,

                    5

                ),

                eyeMaterial

            );


        eye.position.set(
            ...pos
        );


        monster.add(
            eye
        );


        const pupil =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    .07,

                    5,

                    4

                ),

                pupilMaterial

            );


        pupil.position.set(

            pos[0],

            pos[1],

            pos[2] +
            .13

        );


        monster.add(
            pupil
        );

    }


    /* ARMS */

    const limbGeo =
        new THREE.CylinderGeometry(

            .20,

            .30,

            2,

            5

        );


    const leftArm =
        new THREE.Mesh(

            limbGeo,

            monsterMaterial

        );


    leftArm.position.set(

        -1.4,

        1.35,

        0

    );


    leftArm.rotation.z =
        -.7;


    monster.add(
        leftArm
    );


    const rightArm =
        leftArm.clone();


    rightArm.position.x =
        1.4;


    rightArm.rotation.z =
        .7;


    monster.add(
        rightArm
    );


    /* LEGS */

    const legGeo =
        new THREE.CylinderGeometry(

            .28,

            .36,

            1.15,

            5

        );


    const leftLeg =
        new THREE.Mesh(

            legGeo,

            monsterMaterial

        );


    leftLeg.position.set(

        -.72,

        .45,

        0

    );


    monster.add(
        leftLeg
    );


    const rightLeg =
        leftLeg.clone();


    rightLeg.position.x =
        .72;


    monster.add(
        rightLeg
    );


    monster.position.set(

        0,

        0,

        CONFIG.MONSTER_Z

    );


    monsterOriginalZ =
        CONFIG.MONSTER_Z;


    scene.add(
        monster
    );


    /* SHADOW */

    monsterShadow =
        new THREE.Mesh(

            new THREE.CircleGeometry(

                1.7,

                16

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x000000,

                transparent:true,

                opacity:.28

            })

        );


    monsterShadow.rotation.x =
        -Math.PI /
        2;


    monsterShadow.position.set(

        0,

        .025,

        CONFIG.MONSTER_Z

    );


    scene.add(
        monsterShadow
    );

}

/* =====================================================
   START BUTTON
===================================================== */

$('startButton')
    .addEventListener(
        'click',
        async ()=>{


            /*
               ★★★★★★★★★★★★★

               Android에서 Chrome이 아니면
               다른 작업보다 무조건 먼저
               Chrome 안내.

               ★★★★★★★★★★★★★
            */

            if(
                isAndroid() &&
                !isRealChrome()
            ){

                $('chromeGuide')
                    .classList
                    .add('show');


                return;
            }


            await startRealGame();

        }
    );


/* =====================================================
   REAL GAME START
===================================================== */

async function startRealGame(){


    if(
        started
    ){
        return;
    }


    $('loading')
        .classList
        .add('show');


    try{


        if(
            !gameInitialized
        ){

            init3D();

        }


        await startNFC();


        started =
            true;


        $('loading')
            .classList
            .remove('show');


        $('startScreen')
            .classList
            .add('hidden');

    }


    catch(error){


        console.error(
            error
        );


        $('loading')
            .classList
            .remove('show');


        alert(
            '게임 시작 중 오류가 발생했습니다.'
        );

    }

}


/* =====================================================
   NFC
===================================================== */

async function startNFC(){


    /*
       Android에서 Chrome 아닌 경우
       Web NFC 호출 금지.
    */

    if(
        isAndroid() &&
        !isRealChrome()
    ){

        $('nfcText').textContent =
            'Chrome 필요';


        return false;
    }


    if(
        !window.isSecureContext
    ){

        $('nfcText').textContent =
            'HTTPS 필요';


        return false;
    }


    if(
        !(
            'NDEFReader'
            in window
        )
    ){

        $('nfcText').textContent =
            'NFC 미지원';


        return false;
    }


    if(
        nfcStarted
    ){

        return true;
    }


    try{


        const reader =
            new NDEFReader();


        await reader.scan();


        nfcStarted =
            true;


        $('nfcText').textContent =
            'NFC 대기 중';


        $('nfcDot').style.background =
            '#48ef69';


        reader.onreadingerror =
            ()=>{

                $('nfcText').textContent =
                    'NFC 읽기 오류';

            };


        reader.onreading =
            ()=>{


                const now =
                    Date.now();


                if(
                    now -
                    lastTag <
                    CONFIG.NFC_COOLDOWN
                ){

                    return;

                }


                lastTag =
                    now;


                attack();

            };


        return true;

    }


    catch(error){


        console.error(
            'NFC ERROR:',
            error
        );


        $('nfcText').textContent =
            'NFC 권한 확인';


        return false;

    }

}


/* =====================================================
   HP
===================================================== */

function updateHP(){


    $('playerHP').style.width =

        (
            playerHP /
            CONFIG.PLAYER_HP *
            100
        ) +
        '%';


    $('enemyHP').style.width =

        (
            monsterHP /
            CONFIG.MONSTER_HP *
            100
        ) +
        '%';


    $('playerText').textContent =

        playerHP +

        ' / ' +

        CONFIG.PLAYER_HP;


    $('enemyText').textContent =

        monsterHP +

        ' / ' +

        CONFIG.MONSTER_HP;

}


/* =====================================================
   ATTACK
===================================================== */

function attack(){


    if(
        !started ||
        swordAttacking
    ){

        return;
    }


    swordAttacking =
        true;


    const mode =
        swordAttackType;


    swordAttackType =

        swordAttackType === 0
        ? 1
        : 0;


    const start =
        performance.now();


    let hit =
        false;


    function animateSword(now){


        const t =

            Math.min(

                (
                    now -
                    start
                ) /

                CONFIG.SWORD_SPEED,

                1

            );


        const swing =

            Math.sin(

                t *
                Math.PI

            );


        if(
            mode === 0
        ){

            sword.rotation.z =

                swordHomeRotation.z +

                swing *
                1.80;


            sword.rotation.y =

                swordHomeRotation.y -

                swing *
                .42;


            sword.position.x =

                swordHomePosition.x -

                swing *
                .72;


            sword.position.y =

                swordHomePosition.y +

                swing *
                .12;

        }

        else{


            sword.rotation.x =

                swordHomeRotation.x -

                swing *
                1.72;


            sword.rotation.z =

                swordHomeRotation.z +

                swing *
                .30;


            sword.position.y =

                swordHomePosition.y +

                swing *
                .80;


            sword.position.x =

                swordHomePosition.x -

                swing *
                .25;

        }


        if(
            t >= .45 &&
            !hit
        ){

            hit =
                true;


            damageMonster();

        }


        if(
            t < 1
        ){

            requestAnimationFrame(
                animateSword
            );

        }

        else{


            sword.position.copy(
                swordHomePosition
            );


            sword.rotation.copy(
                swordHomeRotation
            );


            swordAttacking =
                false;

        }

    }


    requestAnimationFrame(
        animateSword
    );

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function damageMonster(){


    if(
        !battle ||
        monsterDead
    ){

        return;

    }


    monsterHP =

        Math.max(

            0,

            monsterHP -
            CONFIG.PLAYER_DAMAGE

        );


    updateHP();


    /*
       ★ 적이 맞을 때만 진동
    */

    if(
        navigator.vibrate
    ){

        navigator.vibrate(

            [
                120,
                25,
                110
            ]

        );

    }


    monsterMaterial.color.set(
        0xff3030
    );


    monsterHitTimer =
        .23;


    cameraShake =
        .24;


    showDamageNumber();


    if(
        monsterHP <= 0
    ){

        killMonster();

    }

}


/* =====================================================
   DAMAGE NUMBER
===================================================== */

function showDamageNumber(){


    $('damageNumber')
        .animate(

            [

                {
                    opacity:0,
                    transform:
                        'translate(-50%,15px) scale(.55)'
                },

                {
                    opacity:1,
                    transform:
                        'translate(-50%,0) scale(1.3)'
                },

                {
                    opacity:0,
                    transform:
                        'translate(-50%,-55px) scale(1)'
                }

            ],

            {

                duration:430,

                easing:
                    'ease-out'

            }

        );

}


/* =====================================================
   PLAYER DAMAGE
===================================================== */

function damagePlayer(){


    if(
        monsterDead ||
        !battle
    ){

        return;

    }


    playerHP =

        Math.max(

            0,

            playerHP -
            CONFIG.MONSTER_DAMAGE

        );


    updateHP();


    /*
       ★ 내가 맞을 때는 진동 없음
    */


    $('damageFlash')
        .animate(

            [

                {opacity:0},

                {opacity:.82},

                {opacity:.28},

                {opacity:0}

            ],

            {

                duration:300

            }

        );


    cameraShake =
        .30;

}


/* =====================================================
   MONSTER ATTACK
===================================================== */

function triggerMonsterAttack(){


    if(
        !battle ||
        monsterDead
    ){

        return;

    }


    if(
        monsterAttackProgress >= 0
    ){

        return;

    }


    monsterAttackProgress =
        0;


    monsterAttackHit =
        false;

}


/* =====================================================
   BATTLE
===================================================== */

function startBattle(){


    if(
        battle ||
        monsterDead
    ){

        return;

    }


    battle =
        true;


    /*
       ★ BATTLE START 문구 없음
       ★ NFC 안 건드림
       ★ 검 안 멈춤
    */


    monsterAttackTimer =

        setInterval(

            triggerMonsterAttack,

            CONFIG.MONSTER_ATTACK_INTERVAL

        );

}


/* =====================================================
   MONSTER DEAD
===================================================== */

function killMonster(){


    monsterDead =
        true;


    battle =
        false;


    clearInterval(
        monsterAttackTimer
    );


    monsterAttackProgress =
        -1;

}


/* =====================================================
   LOOP
===================================================== */

function gameLoop(now){


    requestAnimationFrame(
        gameLoop
    );


    const dt =

        Math.min(

            (
                now -
                lastTime
            ) /

            1000,

            .05

        );


    lastTime =
        now;


    if(
        started
    ){


        /* ===============================================
           REAL WALK
        =============================================== */

        if(
            !battle
        ){


            if(
                !monsterDead
            ){


                const distance =

                    camera.position.z -

                    monster.position.z;


                if(
                    distance >
                    CONFIG.BATTLE_DISTANCE
                ){


                    camera.position.z -=

                        CONFIG.WALK_SPEED *

                        dt;

                }

                else{


                    startBattle();

                }

            }

            else{


                /*
                   적이 죽으면
                   그대로 계속 앞으로.
                */

                camera.position.z -=

                    CONFIG.WALK_SPEED *

                    dt;

            }

        }


        /* ===============================================
           WALK BOB
        =============================================== */

        walkingPhase +=

            dt *
            8.2;


        camera.position.y =

            2.15 +

            Math.sin(
                walkingPhase
            ) *
            .025;


        if(
            !swordAttacking
        ){


            sword.position.y =

                swordHomePosition.y +

                Math.sin(
                    walkingPhase
                ) *
                .045;


            sword.position.x =

                swordHomePosition.x +

                Math.sin(
                    walkingPhase *
                    .5
                ) *
                .035;

        }


        /* ===============================================
           MONSTER BREATHING
        =============================================== */

        if(
            !monsterDead &&
            monsterAttackProgress < 0
        ){


            const breathe =

                1 +

                Math.sin(
                    now *
                    .003
                ) *

                .025;


            monster.scale.set(

                1 -
                (
                    breathe -
                    1
                ) *
                .25,

                breathe,

                1

            );

        }


        /* ===============================================
           MONSTER HIT
        =============================================== */

        if(
            monsterHitTimer >
            0
        ){


            monsterHitTimer -=
                dt;


            monster.position.x =

                Math.sin(
                    now *
                    .10
                ) *
                .17;


            if(
                monsterHitTimer <=
                0
            ){


                monster.position.x =
                    0;


                monsterMaterial.color.set(
                    0xffffff
                );

            }

        }


        /* ===============================================
           MONSTER ATTACK
        =============================================== */

        if(
            monsterAttackProgress >=
            0
        ){


            monsterAttackProgress +=

                dt *
                2.25;


            const t =
                monsterAttackProgress;


            /*
               움츠림
            */

            if(
                t <
                .22
            ){


                const p =

                    t /
                    .22;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterOriginalZ,

                        monsterOriginalZ -
                        .75,

                        p

                    );

            }


            /*
               돌진
            */

            else if(
                t <
                .52
            ){


                const p =

                    (
                        t -
                        .22
                    ) /

                    .30;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterOriginalZ -
                        .75,

                        monsterOriginalZ +
                        3.6,

                        p

                    );


                monster.scale.setScalar(

                    1 +
                    p *
                    .13

                );

            }


            /*
               플레이어 맞음
            */

            else if(
                t <
                .62
            ){


                if(
                    !monsterAttackHit
                ){


                    monsterAttackHit =
                        true;


                    damagePlayer();

                }

            }


            /*
               복귀
            */

            else if(
                t <
                1
            ){


                const p =

                    (
                        t -
                        .62
                    ) /

                    .38;


                monster.position.z =

                    THREE.MathUtils.lerp(

                        monsterOriginalZ +
                        3.6,

                        monsterOriginalZ,

                        p

                    );


                const s =

                    THREE.MathUtils.lerp(

                        1.13,

                        1,

                        p

                    );


                monster.scale.setScalar(
                    s
                );

            }

            else{


                monster.position.z =
                    monsterOriginalZ;


                monster.scale.set(
                    1,
                    1,
                    1
                );


                monsterAttackProgress =
                    -1;


                monsterAttackHit =
                    false;

            }

        }


        /* ===============================================
           DEAD
        =============================================== */

        if(
            monsterDead
        ){


            monster.rotation.z +=

                dt *
                1.7;


            monster.position.y -=

                dt *
                .9;


            monster.scale.multiplyScalar(

                Math.max(

                    .965,

                    1 -
                    dt *
                    .65

                )

            );


            monsterShadow
                .material
                .opacity =

                Math.max(

                    0,

                    monsterShadow
                        .material
                        .opacity -

                    dt *
                    .8

                );

        }


        /* ===============================================
           SHAKE
        =============================================== */

        if(
            cameraShake >
            0
        ){


            cameraShake -=
                dt;


            camera.rotation.z =

                (
                    Math.random() -
                    .5
                ) *
                .032;


            camera.rotation.x =

                (
                    Math.random() -
                    .5
                ) *
                .023;

        }

        else{


            camera.rotation.z *=
                .72;


            camera.rotation.x *=
                .72;

        }

    }


    renderer.render(

        scene,

        camera

    );

}


/* =====================================================
   RESIZE
===================================================== */

function onResize(){


    if(
        !camera ||
        !renderer
    ){

        return;

    }


    camera.aspect =

        window.innerWidth /

        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =====================================================
   INITIAL HP
===================================================== */

updateHP();

</script>
