<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#07111d">

<title>PIXEL ADVENTURE</title>

<style>

/* =====================================================
   ★ 조절용 설정

   칼 위치 / 크기
===================================================== */

:root{

    /* 더 음수 = 더 오른쪽 */
    --sword-right:-150%;

    /* 더 음수 = 더 아래 */
    --sword-bottom:-25%;

    /* 칼 크기 */
    --sword-size:135%;
}


*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}


html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080c;
    font-family:Arial,sans-serif;
}


body{
    display:flex;
    justify-content:center;
    align-items:center;
}


/* =====================================================
   GAME
===================================================== */

#game{
    position:relative;

    width:min(100vw,520px);
    height:100dvh;
    max-height:1000px;

    overflow:hidden;

    background:#101820;

    color:white;

    touch-action:manipulation;
}


/* =====================================================
   CAMERA
===================================================== */

#camera{
    position:absolute;
    inset:0;

    overflow:hidden;

    will-change:transform;
}


#world{
    position:absolute;
    inset:0;

    overflow:hidden;
}


/* =====================================================
   SKY
===================================================== */

#bg{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center top;

    z-index:1;

    transform:scale(1.01);

    transform-origin:center center;

    will-change:transform;
}


/* =====================================================
   BACK LAYER
===================================================== */

#backLayer{
    position:absolute;

    left:-6%;

    width:112%;
    height:61%;

    bottom:3%;

    object-fit:cover;
    object-position:center bottom;

    z-index:2;

    pointer-events:none;

    transform-origin:center bottom;

    will-change:transform;
}


/* =====================================================
   HAZE
===================================================== */

#farHaze{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0) 0%,
            rgba(255,255,255,0) 45%,
            rgba(255,255,255,.025) 56%,
            rgba(80,120,70,.04) 76%,
            rgba(25,40,20,.10) 100%
        );
}


/* =====================================================
   FRONT GROUP

   풀밭 + 몬스터
===================================================== */

#frontGroup{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:67%;

    z-index:5;

    transform-origin:50% 92%;

    will-change:transform;
}


/* =====================================================
   FRONT GRASS
===================================================== */

#frontLayer{
    position:absolute;

    left:-13%;

    width:126%;
    height:100%;

    bottom:-1%;

    object-fit:cover;
    object-position:center top;

    z-index:1;

    pointer-events:none;
}


/* =====================================================
   MONSTER SHADOW
===================================================== */

#monsterShadow{
    position:absolute;

    left:50%;
    bottom:14.3%;

    width:38%;
    height:5%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,.52) 0%,
            rgba(0,0,0,.31) 42%,
            rgba(0,0,0,0) 76%
        );

    filter:blur(3px);

    opacity:.42;

    z-index:2;

    pointer-events:none;
}


/* =====================================================
   MONSTER WRAP
===================================================== */

#monsterWrap{
    position:absolute;

    left:50%;
    bottom:10.5%;

    width:55%;

    aspect-ratio:1/1;

    transform:
        translateX(-50%)
        scale(1);

    transform-origin:50% 91%;

    opacity:1;

    z-index:3;

    will-change:
        transform,
        opacity;
}


/* =====================================================
   MONSTER BREATH
===================================================== */

#monsterBreath{
    position:absolute;
    inset:0;

    transform-origin:50% 93%;

    animation:
        monsterBreathing
        1.65s
        ease-in-out
        infinite;

    will-change:transform;
}


@keyframes monsterBreathing{

    0%,
    100%{
        transform:
            scaleX(1)
            scaleY(1);
    }

    50%{
        transform:
            scaleX(.985)
            scaleY(1.035);
    }
}


/* =====================================================
   MONSTER IMAGE
===================================================== */

#monster{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    image-rendering:pixelated;

    translate:0 10%;

    filter:
        drop-shadow(
            0 8px 7px
            rgba(0,0,0,.38)
        );

    will-change:
        transform,
        filter,
        opacity;
}


/* =====================================================
   MONSTER HIT
===================================================== */

#monster.hit{

    animation:
        monsterHit
        .88s
        steps(9,end);
}


@keyframes monsterHit{

    0%{

        transform:
            translate(0,0)
            rotate(0);

        filter:brightness(1);
    }

    9%{

        transform:
            translate(-20px,7px)
            rotate(-5deg)
            scale(1.03);

        filter:
            brightness(3.5)
            saturate(2.4)
            drop-shadow(
                0 0 28px
                rgba(255,0,0,.95)
            );
    }

    20%{

        transform:
            translate(22px,-9px)
            rotate(5deg)
            scale(1.05);

        filter:
            brightness(3.8)
            saturate(2.6)
            drop-shadow(
                0 0 35px red
            );
    }

    31%{

        transform:
            translate(-21px,9px)
            rotate(-5deg);

        filter:
            brightness(3.3)
            saturate(2.3);
    }

    42%{

        transform:
            translate(19px,-8px)
            rotate(5deg);

        filter:brightness(3);
    }

    53%{

        transform:
            translate(-16px,7px)
            rotate(-4deg);

        filter:brightness(2.6);
    }

    64%{

        transform:
            translate(13px,-6px)
            rotate(3deg);

        filter:brightness(2.1);
    }

    76%{

        transform:
            translate(-9px,4px)
            rotate(-2deg);

        filter:brightness(1.7);
    }

    88%{

        transform:
            translate(5px,-2px)
            rotate(1deg);

        filter:brightness(1.3);
    }

    100%{

        transform:
            translate(0,0)
            rotate(0);

        filter:brightness(1);
    }
}


/* =====================================================
   MONSTER DEAD

   죽은 뒤 사라짐.
   게임은 끝나지 않음.
===================================================== */

#monster.dead{

    animation:
        monsterDead
        1.15s
        ease-out
        forwards;
}


@keyframes monsterDead{

    0%{

        opacity:1;

        transform:
            translate(0,0)
            scale(1);
    }

    12%{

        transform:
            translate(-20px,6px)
            rotate(-5deg);

        filter:
            brightness(3.6)
            saturate(2.5);
    }

    25%{

        transform:
            translate(22px,-7px)
            rotate(5deg);

        filter:brightness(3);
    }

    45%{

        transform:
            translate(-16px,6px)
            rotate(-4deg);

        opacity:.9;
    }

    65%{

        transform:
            translate(10px,4px)
            rotate(3deg)
            scale(.95);

        opacity:.65;
    }

    82%{

        transform:
            translateY(15px)
            scale(.88);

        opacity:.3;
    }

    100%{

        transform:
            translateY(35px)
            scale(.70);

        opacity:0;
    }
}


/* =====================================================
   SWORD

   ★ right -150%
   ★ size 135%
===================================================== */

#sword{
    position:absolute;

    z-index:25;

    right:
        var(--sword-right);

    bottom:
        var(--sword-bottom);

    width:auto;

    height:
        var(--sword-size);

    max-width:none;

    object-fit:contain;

    transform-origin:
        82% 91%;

    filter:
        drop-shadow(
            0 7px 10px
            rgba(0,0,0,.7)
        );

    will-change:transform;

    pointer-events:none;
}


/* =====================================================
   SWORD IDLE
===================================================== */

#sword.idle{

    animation:
        swordIdle
        1.7s
        ease-in-out
        infinite;
}


@keyframes swordIdle{

    0%,
    100%{

        transform:
            translateY(0)
            rotate(-18deg);
    }

    50%{

        transform:
            translateY(-9px)
            rotate(-15.5deg);
    }
}


/* =====================================================
   SWORD WALK
===================================================== */

#sword.walking{

    animation:
        swordWalk
        .68s
        ease-in-out
        infinite
        alternate;
}


@keyframes swordWalk{

    from{

        transform:
            rotate(-19deg)
            translateY(5px);
    }

    to{

        transform:
            rotate(9deg)
            translateY(-5px);
    }
}


/* =====================================================
   SWORD ATTACK
===================================================== */

#sword.attack{

    animation:
        swordSlash
        .30s
        cubic-bezier(.12,.9,.2,1)
        forwards;
}


@keyframes swordSlash{

    0%{

        transform:
            rotate(-18deg)
            translate(0,0)
            scale(1);
    }

    14%{

        transform:
            rotate(-43deg)
            translate(-15px,8px)
            scale(1.03);
    }

    47%{

        transform:
            rotate(57deg)
            translate(-42px,-34px)
            scale(1.16);
    }

    68%{

        transform:
            rotate(34deg)
            translate(-17px,-15px)
            scale(1.08);
    }

    100%{

        transform:
            rotate(-18deg)
            translate(0,0)
            scale(1);
    }
}


/* =====================================================
   SLASH
===================================================== */

#slash{
    position:absolute;

    z-index:24;

    right:0;
    bottom:18%;

    width:85%;
    height:68%;

    opacity:0;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at 70% 55%,
            rgba(255,255,255,.95) 0 2%,
            rgba(255,225,110,.85) 3% 5%,
            transparent 7%
        ),

        conic-gradient(
            from 205deg at 70% 55%,
            transparent 0 19%,
            rgba(255,245,190,.95) 20% 23%,
            rgba(255,180,40,.8) 24% 28%,
            transparent 29% 100%
        );

    transform:
        rotate(-18deg);

    mix-blend-mode:screen;
}


#slash.on{

    animation:
        slashFx
        .30s
        ease-out
        forwards;
}


@keyframes slashFx{

    0%{

        opacity:0;

        transform:
            rotate(-25deg)
            scale(.55);
    }

    30%{

        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            rotate(20deg)
            scale(1.18);
    }
}


/* =====================================================
   HUD
===================================================== */

#hud{
    position:absolute;

    z-index:50;

    left:5%;
    right:5%;
    top:12px;

    display:flex;

    gap:8px;

    justify-content:space-between;

    text-shadow:
        0 2px 3px #000;
}


.unit{
    width:48%;
}


.lab{
    font-size:12px;
    font-weight:900;
    margin-bottom:3px;
}


.bar{
    height:14px;

    border:
        2px solid #fff;

    border-radius:5px;

    background:#220b0b;

    overflow:hidden;

    box-shadow:
        0 2px 6px #000;
}


.fill{
    height:100%;

    transition:
        width .18s;
}


#pf{

    background:
        linear-gradient(
            #ff6868,
            #c41414
        );

    width:100%;
}


#ef{

    background:
        linear-gradient(
            #bd76ff,
            #6320a5
        );

    width:100%;
}


#pb.blink,
#eb.blink{

    animation:
        hpBlink
        .32s
        steps(2,end);
}


@keyframes hpBlink{

    50%{

        filter:
            brightness(2.8);
    }
}


/* =====================================================
   NFC
===================================================== */

#nfc{
    position:absolute;

    z-index:55;

    top:48px;
    left:50%;

    transform:
        translateX(-50%);

    padding:
        7px 12px;

    border-radius:12px;

    background:
        rgba(0,0,0,.6);

    border:
        1px solid
        rgba(255,255,255,.35);

    font-size:12px;
    font-weight:700;

    white-space:nowrap;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.35);
}


#dot{
    display:inline-block;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffd84d;

    margin-right:5px;
}


/* =====================================================
   TOAST
===================================================== */

#toast{
    position:absolute;

    z-index:70;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(16px);

    opacity:0;

    padding:
        8px 13px;

    border-radius:10px;

    background:
        rgba(0,0,0,.78);

    border:
        1px solid
        rgba(255,255,255,.3);

    font-size:12px;

    white-space:nowrap;

    transition:.18s;
}


#toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =====================================================
   DAMAGE
===================================================== */

#dmg{
    position:absolute;

    z-index:65;

    left:65%;
    top:42%;

    font-size:38px;
    font-weight:1000;

    color:#fff;

    text-shadow:
        0 0 4px #900,
        3px 3px 0 #d00;

    opacity:0;

    pointer-events:none;
}


#dmg.show{

    animation:
        dmgPop
        .65s
        ease-out;
}


@keyframes dmgPop{

    0%{

        opacity:0;

        transform:
            scale(.5)
            translateY(15px);
    }

    20%{

        opacity:1;

        transform:
            scale(1.35)
            translateY(0);
    }

    100%{

        opacity:0;

        transform:
            scale(1)
            translateY(-50px);
    }
}


/* =====================================================
   RED FLASH
===================================================== */

#red{
    position:absolute;
    inset:0;

    z-index:60;

    background:
        rgba(255,0,0,.58);

    opacity:0;

    pointer-events:none;
}


#red.on{

    animation:
        redHit
        .62s
        ease-out;
}


@keyframes redHit{

    0%{opacity:.98;}
    18%{opacity:.85;}
    38%{opacity:.62;}
    58%{opacity:.34;}
    100%{opacity:0;}
}


/* =====================================================
   BATTLE
===================================================== */

#battle{
    position:absolute;

    z-index:70;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.7)
        skewX(-8deg);

    opacity:0;

    padding:
        10px 22px;

    background:
        linear-gradient(
            90deg,
            #9b0909,
            #ff4b13,
            #9b0909
        );

    border:
        3px solid #ffdf52;

    color:#fff;

    font-size:27px;
    font-weight:1000;

    white-space:nowrap;

    text-shadow:
        0 3px 4px #4b0000;

    box-shadow:
        0 0 20px
        rgba(255,80,0,.65);
}


#battle.show{

    animation:
        battleIn
        .8s
        ease-out;
}


@keyframes battleIn{

    0%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.8)
            skewX(-8deg);
    }

    30%{

        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1)
            skewX(-8deg);
    }
}


/* =====================================================
   START
===================================================== */

#start{
    position:absolute;
    inset:0;

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(0,0,0,.2),
            rgba(0,0,0,.58)
        );

    text-align:center;
}


#start.hidden{

    display:none;
}


.startBox{
    width:86%;
    max-width:380px;

    padding:
        20px 16px;

    border-radius:18px;

    background:
        rgba(5,12,20,.65);

    border:
        1px solid
        rgba(255,255,255,.3);

    backdrop-filter:
        blur(5px);
}


.startBox h1{
    margin:
        0 0 10px;

    font-size:31px;

    letter-spacing:2px;

    color:#ffe17a;

    text-shadow:
        0 3px 4px #6b3500;
}


.startBox p{
    font-size:13px;
    line-height:1.6;
    color:#eee;
}


#go{
    border:0;

    border-radius:11px;

    padding:
        14px 28px;

    font-size:18px;
    font-weight:1000;

    color:#fff;

    background:
        linear-gradient(
            #f7a62b,
            #b94d08
        );

    box-shadow:
        0 4px 0 #6d2904;
}


/* =====================================================
   CHROME GUIDE
===================================================== */

#chromeGuide{
    position:absolute;
    inset:0;

    z-index:300;

    display:none;

    align-items:center;
    justify-content:center;

    padding:22px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(5px);
}


#chromeGuide.show{

    display:flex;
}


.chromeBox{
    width:100%;
    max-width:360px;

    padding:
        25px 20px 22px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #182635,
            #09121c
        );

    border:
        1px solid
        rgba(255,255,255,.25);

    text-align:center;
}


#chromeBtn{
    width:100%;

    border:0;

    border-radius:11px;

    padding:
        14px 10px;

    background:
        linear-gradient(
            #4285f4,
            #1769d1
        );

    color:#fff;

    font-size:17px;
    font-weight:900;
}


/* =====================================================
   CAMERA SHAKE
===================================================== */

#camera.shake{

    animation:
        cameraShake
        .88s
        steps(9,end);
}


@keyframes cameraShake{

    0%{transform:translate(0);}
    10%{transform:translate(-13px,8px);}
    21%{transform:translate(15px,-8px);}
    32%{transform:translate(-14px,9px);}
    43%{transform:translate(13px,-8px);}
    54%{transform:translate(-11px,7px);}
    65%{transform:translate(9px,-5px);}
    76%{transform:translate(-7px,4px);}
    88%{transform:translate(4px,-2px);}
    100%{transform:translate(0);}
}

</style>
</head>


<body>

<div id="game">


    <div id="camera">


        <div id="world">


            <img
                id="bg"
                src="https://static.wixstatic.com/media/172435_d6012f4ec1594a17858298879561b509~mv2.png"
                alt=""
            >


            <img
                id="backLayer"
                src="https://static.wixstatic.com/media/172435_54aea94be0ae4c5eb4a1f5fa3f56e7ea~mv2.png"
                alt=""
            >


            <div id="farHaze"></div>


            <div id="frontGroup">


                <img
                    id="frontLayer"
                    src="https://static.wixstatic.com/media/172435_b05f44aab7384d4ead52127131d3fe8c~mv2.png"
                    alt=""
                >


                <div id="monsterShadow"></div>


                <div id="monsterWrap">


                    <div id="monsterBreath">


                        <img
                            id="monster"
                            src="https://static.wixstatic.com/media/172435_02b890fad23e48b29d15ad67934eda6d~mv2.png"
                            alt=""
                        >


                    </div>


                </div>


            </div>


        </div>


        <div id="slash"></div>


        <img
            id="sword"
            src="https://static.wixstatic.com/media/172435_1c16a5d4f8ca44d8a558923200659bb7~mv2.png"
            alt=""
        >


    </div>


    <!-- HUD -->

    <div id="hud">


        <div class="unit">

            <div class="lab">

                HP

                <span id="pt">
                    100 / 100
                </span>

            </div>


            <div
                class="bar"
                id="pb"
            >

                <div
                    class="fill"
                    id="pf"
                ></div>

            </div>


        </div>


        <div class="unit">

            <div class="lab">

                MONSTER HP

                <span id="et">
                    80 / 80
                </span>

            </div>


            <div
                class="bar"
                id="eb"
            >

                <div
                    class="fill"
                    id="ef"
                ></div>

            </div>


        </div>


    </div>


    <div id="nfc">

        <span id="dot"></span>

        <span id="nt">
            NFC 준비 중
        </span>

    </div>


    <div id="toast"></div>

    <div id="dmg">
        -16
    </div>

    <div id="red"></div>

    <div id="battle">
        BATTLE START!
    </div>


    <div id="start">

        <div class="startBox">

            <h1>
                PIXEL ADVENTURE
            </h1>

            <p>
                게임 시작과 동시에 앞으로 전진합니다.<br>
                NFC는 걷는 동안에도 사용할 수 있습니다.<br>
                몬스터를 쓰러뜨려도 계속 앞으로 진행합니다.
            </p>

            <button id="go">
                GAME START
            </button>

        </div>

    </div>


    <div id="chromeGuide">

        <div class="chromeBox">

            <h2>
                Chrome으로 연결합니다
            </h2>

            <p>
                NFC 게임은 Chrome에서 실행해야 합니다.<br>
                아래 버튼을 눌러 Chrome으로 이동해주세요.
            </p>

            <button id="chromeBtn">
                Chrome으로 연결하기
            </button>

        </div>

    </div>


</div>


<script>


/* =====================================================
   ★ 게임 조절값
===================================================== */

const CONFIG = {

    /* 몬스터 크기 */
    MONSTER_START_SCALE:1.00,
    MONSTER_END_SCALE:1.66,

    /* 몬스터 위치 */
    MONSTER_BOTTOM:10.5,

    /* 첫 접근 시간 */
    WALK_TIME:8000,

    /* 풀밭 최종 확대 */
    FRONT_END_SCALE:1.30,

    /* 뒤 배경 */
    BACK_END_SCALE:1.065,

    /* 하늘 */
    SKY_END_SCALE:1.022,

    /*
       ★ NFC 재인식 속도

       기존 650
       → 100ms
    */
    NFC_COOLDOWN:1
};


const $ =
    id => document.getElementById(id);


let started = false;

let battle = false;

/*
   ★ 게임 종료 상태 삭제.

   monsterDead는
   몬스터만 죽었다는 뜻.
*/

let monsterDead = false;


let nfcOn = false;
let lastTag = 0;


let walkStart = 0;
let raf = 0;


let continueStart = 0;
let continueRaf = 0;


let enemyTimer = null;


let pHP = 100;
let eHP = 80;


$('monsterWrap').style.bottom =
    CONFIG.MONSTER_BOTTOM + '%';


/* =====================================================
   BROWSER
===================================================== */

function isKakaoBrowser(){

    const ua =
        navigator.userAgent || '';

    return(
        /KAKAOTALK/i.test(ua) ||
        /KakaoTalk/i.test(ua)
    );

}


function isAndroid(){

    return(
        /Android/i.test(
            navigator.userAgent || ''
        )
    );

}


function openChrome(){

    const url =
        window.location.href;

    const clean =
        url.replace(
            /^https?:\/\//i,
            ''
        );


    window.location.href =

        'intent://' +
        clean +
        '#Intent;' +
        'scheme=https;' +
        'package=com.android.chrome;' +
        'end';

}


(function(){

    if(
        isKakaoBrowser() &&
        isAndroid()
    ){

        $('chromeGuide')
            .classList
            .add('show');

    }

})();


$('chromeBtn').onclick =
    function(){

        openChrome();

    };


/* =====================================================
   TOAST
===================================================== */

function toast(text){

    $('toast').textContent =
        text;


    $('toast')
        .classList
        .add('show');


    clearTimeout(
        toast.timer
    );


    toast.timer =
        setTimeout(
            ()=>{

                $('toast')
                    .classList
                    .remove('show');

            },
            900
        );

}


/* =====================================================
   HP
===================================================== */

function hp(){

    $('pf').style.width =
        pHP + '%';


    $('ef').style.width =
        (
            eHP /
            80 *
            100
        ) + '%';


    $('pt').textContent =
        pHP +
        ' / 100';


    $('et').textContent =
        eHP +
        ' / 80';

}


function blink(el){

    el.classList.remove(
        'blink'
    );


    void el.offsetWidth;


    el.classList.add(
        'blink'
    );

}


/* =====================================================
   SHAKE
===================================================== */

function shake(){

    $('camera')
        .classList
        .remove(
            'shake'
        );


    void $('camera').offsetWidth;


    $('camera')
        .classList
        .add(
            'shake'
        );

}


/* =====================================================
   MONSTER VIBRATION
===================================================== */

function strongEnemyVibe(){

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            90
        );

    }

}


/* =====================================================
   PLAYER HIT
===================================================== */

function playerHit(){

    if(
        !battle ||
        monsterDead ||
        pHP <= 0
    ){

        return;

    }


    pHP =
        Math.max(
            0,
            pHP - 5
        );


    hp();


    blink(
        $('pb')
    );


    /*
       플레이어 피격:

       진동 없음
    */

    shake();


    $('red')
        .classList
        .remove(
            'on'
        );


    void $('red').offsetWidth;


    $('red')
        .classList
        .add(
            'on'
        );


    if(
        pHP <= 0
    ){

        clearInterval(
            enemyTimer
        );


        /*
           일단 죽어도 화면을
           완전히 종료하지 않음.
        */

        toast(
            'HP 0'
        );

    }

}


/* =====================================================
   MONSTER DAMAGE
===================================================== */

function monsterDamage(){

    if(
        !battle ||
        monsterDead ||
        pHP <= 0
    ){

        return;

    }


    eHP =
        Math.max(
            0,
            eHP - 16
        );


    hp();


    blink(
        $('eb')
    );


    /*
       몬스터가 실제로 맞을 때만
       진동
    */

    strongEnemyVibe();


    shake();


    $('red')
        .classList
        .remove(
            'on'
        );


    void $('red').offsetWidth;


    $('red')
        .classList
        .add(
            'on'
        );


    $('monster')
        .classList
        .remove(
            'hit',
            'dead'
        );


    void $('monster').offsetWidth;


    $('monster')
        .classList
        .add(
            'hit'
        );


    $('dmg')
        .classList
        .remove(
            'show'
        );


    void $('dmg').offsetWidth;


    $('dmg')
        .classList
        .add(
            'show'
        );


    if(
        eHP <= 0
    ){

        defeatMonster();

    }

}


/* =====================================================
   ATTACK

   ★ 몬스터가 죽어도 계속 검 휘두르기 가능
===================================================== */

function attack(){

    if(
        !started
    ){

        return;

    }


    $('sword')
        .classList
        .remove(
            'attack',
            'idle',
            'walking'
        );


    $('slash')
        .classList
        .remove(
            'on'
        );


    void $('sword').offsetWidth;
    void $('slash').offsetWidth;


    $('sword')
        .classList
        .add(
            'attack'
        );


    $('slash')
        .classList
        .add(
            'on'
        );


    /*
       몬스터가 살아있고
       전투 중일 때만 데미지
    */

    if(
        battle &&
        !monsterDead
    ){

        monsterDamage();

    }


    /*
       죽은 뒤에는 그냥 휘두르기만 함
       진동 없음
    */

    setTimeout(
        ()=>{

            if(
                started
            ){

                $('sword')
                    .classList
                    .remove(
                        'attack',
                        'idle',
                        'walking'
                    );


                if(
                    battle &&
                    !monsterDead
                ){

                    $('sword')
                        .classList
                        .add(
                            'idle'
                        );

                }

                else{

                    $('sword')
                        .classList
                        .add(
                            'walking'
                        );

                }

            }

        },
        310
    );

}


/* =====================================================
   ★ MONSTER DEFEATED

   CLEAR 없음.
   게임 종료 없음.

   몬스터만 쓰러지고
   계속 앞으로 진행.
===================================================== */

function defeatMonster(){

    monsterDead =
        true;


    battle =
        false;


    clearInterval(
        enemyTimer
    );


    $('monster')
        .classList
        .remove(
            'hit'
        );


    $('monster')
        .classList
        .add(
            'dead'
        );


    /*
       그림자도 사라짐
    */

    $('monsterShadow')
        .style
        .opacity =
        '0';


    /*
       검을 다시 걷기 모션
    */

    $('sword')
        .classList
        .remove(
            'idle',
            'attack'
        );


    $('sword')
        .classList
        .add(
            'walking'
        );


    toast(
        '몬스터 격파!'
    );


    /*
       죽는 애니메이션 후
       계속 전진 시작
    */

    setTimeout(
        ()=>{

            continueStart =
                0;


            cancelAnimationFrame(
                continueRaf
            );


            continueRaf =
                requestAnimationFrame(
                    continueForward
                );

        },
        800
    );

}


/* =====================================================
   BATTLE START
===================================================== */

function battleStart(){

    if(
        battle ||
        monsterDead
    ){

        return;

    }


    battle =
        true;


    $('sword')
        .classList
        .remove(
            'walking'
        );


    $('sword')
        .classList
        .add(
            'idle'
        );


    $('battle')
        .classList
        .remove(
            'show'
        );


    void $('battle').offsetWidth;


    $('battle')
        .classList
        .add(
            'show'
        );


    toast(
        '몬스터 앞에 도착했습니다!'
    );


    enemyTimer =
        setInterval(
            playerHit,
            1700
        );

}


/* =====================================================
   FIRST WALK
===================================================== */

function walk(now){

    if(
        !started ||
        monsterDead
    ){

        return;

    }


    if(
        !walkStart
    ){

        walkStart =
            now;

    }


    const t =
        Math.min(
            (
                now -
                walkStart
            ) /
            CONFIG.WALK_TIME,
            1
        );


    /* SKY */

    const skyStart =
        1.01;


    const skyScale =
        skyStart +
        (
            CONFIG.SKY_END_SCALE -
            skyStart
        ) *
        t;


    const skyY =
        t * -.15;


    $('bg').style.transform =

        'translateY(' +
        skyY +
        '%) scale(' +
        skyScale +
        ')';



    /* BACK */

    const backScale =
        1 +
        (
            CONFIG.BACK_END_SCALE -
            1
        ) *
        t;


    const backY =
        t * 1.1;


    $('backLayer').style.transform =

        'translateY(' +
        backY +
        '%) scale(' +
        backScale +
        ')';



    /* FRONT */

    const frontScale =
        1 +
        (
            CONFIG.FRONT_END_SCALE -
            1
        ) *
        t;


    const frontX =
        -t * .8;


    const frontY =
        t * 3;


    $('frontGroup').style.transform =

        'translate(' +
        frontX +
        '%,' +
        frontY +
        '%) scale(' +
        frontScale +
        ')';



    /* MONSTER */

    const monsterScale =

        CONFIG.MONSTER_START_SCALE +

        (
            CONFIG.MONSTER_END_SCALE -
            CONFIG.MONSTER_START_SCALE
        ) *

        t;


    $('monsterWrap').style.transform =

        'translateX(-50%) scale(' +
        monsterScale +
        ')';



    if(
        t >= 1
    ){

        $('frontGroup').style.transform =

            'translate(-.8%,3%) scale(' +
            CONFIG.FRONT_END_SCALE +
            ')';


        $('monsterWrap').style.transform =

            'translateX(-50%) scale(' +
            CONFIG.MONSTER_END_SCALE +
            ')';


        battleStart();


        return;

    }


    raf =
        requestAnimationFrame(
            walk
        );

}


/* =====================================================
   ★ CONTINUE FORWARD

   몬스터 사망 후에도
   무한히 걷는 느낌 유지.

   너무 계속 확대해서 화면이 깨지는 걸 막기 위해
   작은 확대 / 이동을 반복함.
===================================================== */

function continueForward(now){

    if(
        !started
    ){

        return;

    }


    if(
        !continueStart
    ){

        continueStart =
            now;

    }


    const elapsed =
        now -
        continueStart;


    /*
       2.4초마다 걷기 사이클 반복
    */

    const cycle =
        (
            elapsed %
            2400
        ) /
        2400;


    /*
       0 → 1 → 0 느낌
    */

    const wave =
        Math.sin(
            cycle *
            Math.PI
        );


    /*
       앞 풀밭은 계속
       가까이 지나가는 느낌
    */

    const frontScale =
        1.30 +
        wave *
        .07;


    const frontY =
        3 +
        wave *
        2.5;


    const frontX =
        -.8 -
        wave *
        .7;


    $('frontGroup').style.transform =

        'translate(' +
        frontX +
        '%,' +
        frontY +
        '%) scale(' +
        frontScale +
        ')';



    /*
       뒤 풀밭도 아주 약하게 움직임
    */

    $('backLayer').style.transform =

        'translateY(' +
        (
            1.1 +
            wave *
            .8
        ) +
        '%) scale(' +
        (
            CONFIG.BACK_END_SCALE +
            wave *
            .015
        ) +
        ')';



    /*
       하늘은 거의 가만히
    */

    $('bg').style.transform =

        'translateY(-.15%) scale(' +
        (
            CONFIG.SKY_END_SCALE +
            wave *
            .002
        ) +
        ')';


    continueRaf =
        requestAnimationFrame(
            continueForward
        );

}


/* =====================================================
   NFC
===================================================== */

async function startNFC(){

    if(
        !window.isSecureContext ||
        location.protocol !==
        'https:'
    ){

        $('nt').textContent =
            'HTTPS 필요';


        toast(
            'HTTPS 주소에서 실행해주세요.'
        );


        return false;

    }


    if(
        !(
            'NDEFReader'
            in window
        )
    ){

        $('nt').textContent =
            'NFC 미지원';


        toast(
            'Android Chrome에서 Web NFC를 사용할 수 있습니다.'
        );


        return false;

    }


    if(
        nfcOn
    ){

        return true;

    }


    try{


        const reader =
            new NDEFReader();


        await reader.scan();


        nfcOn =
            true;


        $('nt').textContent =
            'NFC 대기 중';


        $('dot').style.background =
            '#49ef6a';


        reader.onreadingerror =
            ()=>{

                toast(
                    'NFC 읽기 오류'
                );

            };


        reader.onreading =
            ()=>{


                const now =
                    Date.now();


                /*
                   ★ 기존 650ms

                   → 100ms
                */

                if(
                    now -
                    lastTag <
                    CONFIG.NFC_COOLDOWN
                ){

                    return;

                }


                lastTag =
                    now;


                attack();

            };


        return true;

    }


    catch(e){


        $('nt').textContent =
            'NFC 권한 확인';


        toast(
            'Chrome에서 NFC 권한을 허용해주세요.'
        );


        return false;

    }

}


/* =====================================================
   GAME START
===================================================== */

$('go').onclick =
    async function(){


        if(
            isKakaoBrowser() &&
            isAndroid()
        ){

            $('chromeGuide')
                .classList
                .add(
                    'show'
                );


            return;

        }


        await startNFC();


        started =
            true;


        $('start')
            .classList
            .add(
                'hidden'
            );


        pHP =
            100;


        eHP =
            80;


        hp();


        $('sword')
            .classList
            .remove(
                'idle'
            );


        $('sword')
            .classList
            .add(
                'walking'
            );


        walkStart =
            0;


        cancelAnimationFrame(
            raf
        );


        raf =
            requestAnimationFrame(
                walk
            );

    };


hp();

</script>
